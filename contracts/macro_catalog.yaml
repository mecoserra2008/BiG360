# Macro coverage catalog (machine-readable). Owner: macro-coverage. Consumed by app.ingestion.macro_common
# (load_catalog / expand_entries), app.ingestion.fred (src: fred entries = additions + indicator metadata),
# app.ingestion.macro_audit (coverage matrix, staleness, cross-source checks) and tests/ingestion/macro.
#
# series entry keys
#   id      series_id ('{src}:{native}')           src     fetcher name (see `sources`)
#   region  ISO2 / aggregate (EA, G7, EM, WLD)     ind     indicator key(s) (see `indicators`; list allowed)
#   title, freq (D/W/M/Q/A), units (text), scale (percent|fraction|index|level; default from the indicator or
#   derived from units), mult (unit multiplier for level series), sa (SA/NSA/SCA/SAAR/TREND), tf (display/model
#   transform: level|diff|pct_change|yoy|log_diff), lag (release lag days -> estimated knowledge_date),
#   core (headline series shown in the market overview / regime inputs), rank (1 = primary, 2+ = fallbacks within
#   region x indicator), requires_key (Settings secret; missing -> skipped with a 'missing key' status)
#   every other key is a source request parameter (key/flow/dataset/filters/code/...).
#   each: {REGION: code | {code: .., <overrides>}} expands one entry per region; {code} {region} {name} are
#   substituted in every string value.
# Every endpoint was verified live on 2026-10-11; quirks are documented next to each fetcher (app.ingestion.macro_*).
version: 1

