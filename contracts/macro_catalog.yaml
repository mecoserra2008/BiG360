  # A9 2026-11-07: BoE IADB par yields (robots.txt disallows the IADB; reason code source_disallowed): history kept,
  # replaced by the zero-coupon series of the same tenor, which cover the full history (BoE yield-curve archive)
  "boe:IUDMNPY": "boe:IUDMNZC"   # 10Y par -> 10Y zero-coupon
  "boe:IUDSNPY": "boe:IUDSNZC"
  "boe:IUDLNPY": "boe:IUDLNZC"

# series whose source stopped (no replacement): not fetched, but still served with their stored history and the normal
# staleness ordering (app.macro.indicators keeps them as candidates; macro_audit / macro_freshness do not flag them).
# Unlike `retired`, nothing replaces them, so dropping them would delete valid recent values from the macro panel.
frozen:
