campaigns:
  - id: gdelt_e6
    label: "GDELT 2015-02 .. 2026-07 deep backfill (E6, extended to the start of GDELT 2.0 by N1)"
    kind: module
    module: app.events_v2.backfill
    args: [--label, e6, --start, "2015-02-19", --end, "2026-07-13", --batch-days, "7", --workers, "3", --dl-threads, "4", --retention]   # N1: start 2020-01-01 -> 2015-02-19 (GDELT 2.0 begins); done days are skipped, so it continues newest-first below the 2020 target
    stop_file: state/events_v2/STOP        # graceful stop at the next file / batch boundary (relative to data/)
    lock: events_v2_backfill               # data/.locks/<lock>.lock held by a running instance (adopted, not duplicated)
    progress: {probe: gdelt_range, label: e6, start: "2015-02-19", end: "2026-07-13"}
    source: gdelt_files
    priority: 70
    est_ram_gb: 4.5
    preemptible: true
  - id: gdelt_redo_partial
    label: "GDELT partial / missing days re-run"
    kind: gap_queue                        # drains data_gaps rows of dataset gdelt.days (fill gdelt_redo)
    dataset: gdelt.days
    lock: events_v2_backfill
    priority: 35
    est_ram_gb: 3.0
  - id: sec_13f_history
    label: "13F holdings history (2023-Q2 ->)"
    kind: job
    job: sec_13f_backfill
    params: {since: "2023-04-01"}
    progress: {probe: sec_13f_backfill}
    every_days: 30                         # resumable: re-run monthly to merge newly published SEC 13F datasets
    source: sec_edgar
    priority: 60
    est_ram_gb: 2.5
  - id: cftc_history
    label: "CFTC COT full history (1986 ->)"
    kind: job
    job: cftc_cot_history
    progress: {probe: cftc_history}
    every_days: 0                          # only when the detector finds missing report weeks
    source: cftc_socrata
    priority: 55
    est_ram_gb: 2.0
  - id: earnings_dates_history
    label: "Earnings dates for every security of `full` (Yahoo + official schedules; W1 2026-10-31)"
    kind: job                              # was the in-process script chain (mvp universes); now the budgeted job
    job: earnings_dates_fetch              # resumable: the job's due rules skip what was fetched (rows every 150)
    params: {universes: "mvp_us,mvp_global,eu_broad,full", max_minutes: 240, timeout_min: 260, rate: 1.3, nsm_since: "2018-01-01"}
    progress: {probe: earnings_dates}
    every_days: 7                          # re-run weekly until no security is due; the nightly keeps it current
    source: yfinance
    priority: 65
    est_ram_gb: 2.0
  - id: yahoo_price_history
    label: "Yahoo price history for unpriced securities"
    kind: prices_history
    progress: {probe: price_history}
    every_days: 7
    source: yfinance
    priority: 68
    est_ram_gb: 1.5
    params: {batch: 250, max_symbols: 2000}
  - id: ccnews_history
    label: "CC-NEWS 2016-08 -> now: derived news metadata into the story layer (N1, newest month first)"
    kind: module
    module: app.events_v2.ccnews
    args: [--start-month, "2016-08", --workers, "6", --yield-to, gdelt_e6]   # add [--file-step, "4"] for a 25% uniform sample (~4x faster)
    stop_file: state/ccnews/STOP           # graceful stop at the next WARC boundary (relative to data/)
    lock: ccnews_backfill                  # data/.locks/ccnews_backfill.lock (a hand-started run blocks the filler instance)
    progress: {probe: ccnews_months, start_month: "2016-08"}
    source: commoncrawl
    priority: 72                           # after E6 (70); --yield-to exits (code 3) while E6 waits for the filler
    est_ram_gb: 2.0                        # downloads ~0.8 GB (6 workers); merge + sentiment run afterwards in child processes
    preemptible: true
  - id: filing_news_history
    label: "SEC 8-K 2001 -> + TDnet / HKEX announcements -> story layer (one-time backfill, N1)"
    kind: job
    job: news_filings
    params: {backfill: true}
    progress: {probe: news_filings}
    every_days: 0                          # one-time (run 2026-10-23); the nightly job news_filings keeps it current
    source: sec_edgar
    priority: 62
    est_ram_gb: 2.0

  # W3 rates & debt (owner rates-w3): resumable history backfills under the filler's RAM admission
  - id: rates_curves_history
    label: "Official yield curves full history (US 1990 / H.15 1962, Bund 1972, BoE 1979, MoF 1974, ECB 2004, ...)"
    kind: job
    job: rates_curves_backfill
    progress: {probe: rates_backfill}
    every_days: 30                         # resumable per source (data/state/rates.json backfill.<source>.done); re-run monthly is a cheap no-op
    source: rates_official
    priority: 58
    est_ram_gb: 2.5
  - id: us_bonds_openfigi
    label: "US issuers' TRACE bonds from OpenFIGI (coupon / maturity from the FIGI description)"
    kind: job
    job: bonds_us_openfigi
    params: {max_requests: 120, universe: 1500}
    progress: {probe: openfigi_bonds}
    every_days: 1                          # 120 searches per run (free tier 5 / min); refresh each issuer every 90 days
    source: openfigi
    priority: 75
    est_ram_gb: 0.8

  # coverage v2 W2 (ingest-register): statements for every regulatory-register issuer, resumable (data/state/register_backfill.json)
  - id: register_statements_us
    label: "US register statements: companyfacts for every SEC listed periodic filer + FSDS for 20-F / 40-F filers"
    kind: job
    job: register_backfill
    params: {steps: [us_facts, us_fsds, normalize], max_minutes: 240}
    progress: {probe: register_backfill, steps: [us_facts, us_fsds, normalize]}
    every_days: 2                          # new CIKs of the register; a run stopped on its time budget is due again at once
    source: sec_edgar
    priority: 58
    est_ram_gb: 8.0
  - id: register_statements_eu_uk
    label: "EU / UK register statements: ESEF (filings.xbrl.org), FCA NSM, Companies House bulk accounts"
    kind: job
    job: register_fetch
    params: {steps: [esef, fca_nsm, ch], max_minutes: 240, ch_months: 24}
    progress: {probe: register_backfill, steps: [esef, fca_nsm, ch]}
    every_days: 2
    source: filings_eu
    priority: 60
    est_ram_gb: 3.0
  - id: register_oam
    label: "EU national OAMs (DILA, AFM, FSMA, eMarket, Nasdaq Nordic, Oslo, CNMV) for the register issuers"
    kind: job
    job: register_fetch
    params: {steps: [oam], max_minutes: 280}
    progress: {probe: register_backfill, steps: [oam]}
    every_days: 7
    source: filings_eu
    priority: 64
    est_ram_gb: 6.0
  - id: register_profiles
    label: "Yahoo profiles (sector, currency, market cap) of the EU / UK register issuers without a sector"
    kind: job
    job: register_fetch
    params: {steps: [profile], max_minutes: 120}
    progress: {probe: register_backfill, steps: [profile]}
    every_days: 7                          # ref_universe classifies them from the cached profiles on its next run
    source: yfinance
    priority: 63
    est_ram_gb: 2.0
  - id: register_yf_fallback
    label: "Yahoo statements fallback (annual + quarterly) for EU / UK register issuers without a current official filing"
    kind: job
    job: register_fetch
    params: {steps: [yf], max_minutes: 240}
    progress: {probe: register_backfill, steps: [yf]}
    every_days: 1                          # ~14 s per ticker (7 Yahoo calls at the shared 0.5 / s bucket): runs in budget slices
    source: yfinance
    priority: 67
    est_ram_gb: 6.0

