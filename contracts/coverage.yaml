# Coverage registry (docs/OPERATIONS_ROADMAP.md O1.1). Owner: platform (app.ops). Consumed by the gap detector
# (job data_gaps_detect -> ops/data_gaps), the gap filler (python -m app.ops.filler) and GET /system/data-health.
#
# datasets[]: what data the app should have.
#   check       detector routine (app.ops.gaps.CHECKS): sessions | currency_dates | macro_releases | gdelt_days | live_news |
#               daily_counts | latest_date | cftc_weekly | quarterly_13f | finra_settlements | sentinel_rows | null_share
#   calendar    expected dates: exchange MIC (exchange_calendars) | weekdays | cftc | 13f | finra
#   sla         freshness SLA in sessions/days on the DAILY profile; the effective SLA is max(sla, profile sla_days)
#   entities    expected entity set (per-session bar counts, currency list, ...) and partial thresholds
#   live_job    jobs.yaml job that keeps it current; fill = how the gap filler repairs a gap (same ingestion code)
#   priority    1 = most urgent ... 100 = whenever idle; cost = filler budget units per gap item
# sources{}: per-source filler rate budgets (on top of the shared token buckets in app.core.ratelimit, which the
#   live jobs and the filler share). The filler never spends more than `per_hour` units in a sliding hour.
# campaigns[]: long resumable backfills folded into the filler (state files keep their progress).
# known_gaps[]: seeded from docs/PHASE3_TODO.md and docs/AUDIT_2026-10-19.md (upserted by the detector).
version: 1

defaults: {priority: 50, sla: 1, max_attempts: 6, backoff_min: 30, backoff_max_h: 24, lookback_days: 45}

sources:
  polygon:       {limiter: polygon, budget: {unit: requests, per_hour: 120}, note: "free tier 5/min shared with the nightly; the filler takes <= 2/min"}
  yfinance:      {limiter: yfinance, budget: {unit: symbols, per_hour: 3000}, note: "unofficial; 250-symbol batches; shared cross-process bucket"}
  sec_edgar:     {limiter: sec_edgar, budget: {unit: requests, per_hour: 14400}, note: "SEC fair access 10 req/s per user; filler <= 4/s on average"}
  gdelt_files:   {budget: {unit: gb, per_hour: 15}, note: "GDELT 2.0 raw files (data.gdeltproject.org); E6 runs 4 download threads"}
  fred:          {limiter: fred, budget: {unit: requests, per_hour: 3000}, note: "documented 120 req/min"}
  ecb:           {limiter: ecb, budget: {unit: requests, per_hour: 2000}}
  eurostat:      {limiter: eurostat, budget: {unit: requests, per_hour: 1000}}
  oecd:          {limiter: oecd, budget: {unit: requests, per_hour: 20}, note: "60 downloads/h hard limit shared with the nightly"}
  cftc_socrata:  {budget: {unit: requests, per_hour: 200}, note: "publicreporting.cftc.gov Socrata"}
  finra:         {limiter: finra, budget: {unit: requests, per_hour: 2000}}
  baostock:      {limiter: baostock, budget: {unit: symbols, per_hour: 600}, note: "IP-ban sensitive: one worker"}
  local:         {budget: {unit: runs, per_hour: 30}, note: "CPU-only maintenance (no network)"}
  commoncrawl:   {budget: {unit: files, per_hour: 400}, note: "data.commoncrawl.org CC-NEWS WARCs (~1 GB each), <= 6 polite connections, back-off on 503 Slow Down (N1)"}
  rates_official: {budget: {unit: requests, per_hour: 600}, note: "W3 official curve / auction hosts (treasury.gov, ECB, Bundesbank, BoE, MoF, BdE, BPstat, SNB, BoC, RBA, Riksbank, Norges Bank, Fiscal Data, DMO); <= 1 request / s per host"}
  esma_firds:    {budget: {unit: files, per_hour: 10}, note: "ESMA FIRDS FULINS_D weekly full file (4 zip parts)"}
  openfigi:      {budget: {unit: requests, per_hour: 300}, note: "OpenFIGI /v3/search without key: 5 requests / minute"}
  filings_eu:    {budget: {unit: requests, per_hour: 3000}, note: "W2 ESEF filings.xbrl.org / FCA NSM / national OAM downloads (<= 1 request / s per host)"}
  companies_house_bulk: {budget: {unit: requests, per_hour: 3000}, note: "W2 download.companieshouse.gov.uk Accounts Data Product: HTTP Range reads (central directory + matched members), <= 2 requests / s"}

datasets:
  # ---------------------------------------------------------------- prices (exchange calendars)
  - {id: prices.US,    label: "Prices US",     group: prices, table: prices_daily, check: sessions, region: US,    calendar: XNYS, sla: 1, priority: 10, live_job: prices_us_polygon, fill: {kind: polygon_dates},  entities: {min_expected: 3000, partial_below: 0.8, missing_below: 0.05}, cost: {source: polygon, units: 1}}
  - {id: prices.CA,    label: "Prices Canada", group: prices, table: prices_daily, check: sessions, region: CA,    calendar: XTSE, sla: 1, priority: 14, live_job: prices_global_yf,  fill: {kind: yf_refetch},     entities: {min_expected: 3,    partial_below: 0.6, missing_below: 0.05}, cost: {source: yfinance, units: region_symbols}}
  - {id: prices.EU,    label: "Prices Europe", group: prices, table: prices_daily, check: sessions, region: EU,    calendar: XETR, sla: 1, priority: 11, live_job: prices_global_yf,  fill: {kind: yf_refetch},     entities: {min_expected: 500,  partial_below: 0.8, missing_below: 0.05}, cost: {source: yfinance, units: region_symbols}}
  - {id: prices.UK,    label: "Prices UK",     group: prices, table: prices_daily, check: sessions, region: UK,    calendar: XLON, sla: 1, priority: 11, live_job: prices_global_yf,  fill: {kind: yf_refetch},     entities: {min_expected: 150,  partial_below: 0.8, missing_below: 0.05}, cost: {source: yfinance, units: region_symbols}}
  - {id: prices.JP,    label: "Prices Japan",  group: prices, table: prices_daily, check: sessions, region: JP,    calendar: XTKS, sla: 1, priority: 11, live_job: prices_global_yf,  fill: {kind: yf_refetch},     entities: {min_expected: 1500, partial_below: 0.8, missing_below: 0.05}, cost: {source: yfinance, units: region_symbols}}
  - {id: prices.KR,    label: "Prices Korea",  group: prices, table: prices_daily, check: sessions, region: KR,    calendar: XKRX, sla: 1, priority: 12, live_job: prices_global_yf,  fill: {kind: yf_refetch},     entities: {min_expected: 1000, partial_below: 0.8, missing_below: 0.05}, cost: {source: yfinance, units: region_symbols}}
  - {id: prices.HK,    label: "Prices HK",     group: prices, table: prices_daily, check: sessions, region: HK,    calendar: XHKG, sla: 1, priority: 12, live_job: prices_global_yf,  fill: {kind: yf_refetch},     entities: {min_expected: 800,  partial_below: 0.8, missing_below: 0.05}, cost: {source: yfinance, units: region_symbols}}
  - {id: prices.CN,    label: "Prices China",  group: prices, table: prices_daily, check: sessions, region: CN,    calendar: XSHG, sla: 1, priority: 13, live_job: prices_cn_baostock, fill: {kind: yf_refetch},    entities: {min_expected: 1500, partial_below: 0.7, missing_below: 0.05}, cost: {source: yfinance, units: region_symbols}, note: "BaoStock IP ban: 424 SH names missing, 349 names Yahoo-only"}
  - {id: prices.LATAM, label: "Prices LATAM",  group: prices, table: prices_daily, check: sessions, region: LATAM, calendar: BVMF, sla: 2, priority: 15, live_job: prices_br_b3,      fill: {kind: yf_refetch},     entities: {min_expected: 100,  partial_below: 0.5, missing_below: 0.05}, cost: {source: yfinance, units: region_symbols}, note: "mixed markets (BR/MX/CL/PE/CO/AR): lenient thresholds"}
  - {id: prices.APAC,  label: "Prices APAC",   group: prices, table: prices_daily, check: sessions, region: APAC,  calendar: XTAI, sla: 2, priority: 15, live_job: prices_tw,         fill: {kind: yf_refetch},     entities: {min_expected: 100,  partial_below: 0.5, missing_below: 0.05}, cost: {source: yfinance, units: region_symbols}, note: "TW/IN/AU/SG mix: lenient thresholds"}
  - {id: prices.history, label: "Price history depth", group: prices, check: unpriced_securities, sla: 30, priority: 70, live_job: prices_global_yf, fill: {kind: campaign, campaign: yahoo_price_history}, note: "securities in the universe without any daily bar (serving sec.close is null)"}
  # ---------------------------------------------------------------- FX
  - {id: fx.rates, label: "FX rates", group: fx, table: fx_rates, check: currency_dates, calendar: weekdays, sla: 2, priority: 15, live_job: fx_rates, fill: {kind: job, jobs: [{job: fx_rates}]}, entities: {lookback_days: 60, slow_sources: {TWD: "weekly Fed H.10 (FRED DEXTAUS) only: needs the CBC Taiwan daily rate (PHASE3_TODO)"}, retired: {BGN: "2026-01-01 euro adoption: BG listings convert via EUR"}}, cost: {source: fred, units: 40}}
  # ---------------------------------------------------------------- macro (official release calendar)
  - {id: macro.releases, label: "Macro releases", group: macro, table: macro_release_events, check: macro_releases, calendar: macro_calendar, sla: 3, priority: 20, live_job: macro_global, fill: {kind: job, jobs: [{job: macro_fred}, {job: macro_global, params: {run_all: true}}, {job: macro_calendar}]}, cost: {source: fred, units: 200}, note: "releases dated in the last 30 days (macro_releases calendar) still pending after 2 days"}
  - {id: macro.ingest, label: "Macro ingestion", group: macro, table: macro_observations, check: latest_ingest, by: source_id, sla: 3, priority: 22, live_job: macro_global, fill: {kind: job, jobs: [{job: macro_global, params: {run_all: true}}]}, cost: {source: fred, units: 200}, entities: {ignore: [worldbank, imf_weo, oecd_eo], weekly: [bis, oecd, imf, cvm]}}
  # ---------------------------------------------------------------- events / news
  - {id: gdelt.days, label: "GDELT daily files", group: events, check: gdelt_days, calendar: daily, sla: 2, priority: 30, live_job: gdelt_stream, fill: {kind: gdelt_redo}, entities: {files_per_day: 576, stream_lookback_days: 14, history_start: "2015-02-19", outage_attempts: 3}, cost: {source: gdelt_files, units: 3}}
  - {id: news.live, label: "Live news (service + hourly fold)", group: events, check: live_news, calendar: daily, sla: 1, priority: 25, live_job: news_hourly, fill: {kind: job, jobs: [{job: news_hourly}, {job: news_finalise}]}, entities: {max_heartbeat_age_s: 120, max_fold_age_h: 3, finalise_after_h: 26}, cost: {source: local, units: 1}, note: "roadmap v3 N2-N3: realtime supervisor child up when switched on (tray), hourly fold (job news_hourly) < 3 h old, complete UTC days with hot data finalised (job news_finalise); heatmap = folded hours / 24 (1 = finalised)"}
  - {id: news.items, label: "News items", group: events, table: news_items, check: daily_counts, date_column: knowledge_date, calendar: weekdays, sla: 2, priority: 35, live_job: news_ingest, fill: {kind: job, jobs: [{job: news_ingest}]}, entities: {lookback_days: 21, missing_below: 0.05, partial_below: 0.2}, cost: {source: polygon, units: 10}}
  # ---------------------------------------------------------------- filings / insiders (US business days)
  - {id: filings.sec, label: "SEC filings index", group: filings, table: filings_index, check: latest_date, date_column: knowledge_date, parts: {source_id: [sec_edgar]}, calendar: XNYS, sla: 1, priority: 18, live_job: sec_filings_index, fill: {kind: job, jobs: [{job: sec_filings_index}]}, cost: {source: sec_edgar, units: 10}}
  - {id: insider.us, label: "Insider Form 4 (US)", group: filings, table: insider_transactions, check: latest_date, date_column: knowledge_date, parts: {region: [US]}, calendar: XNYS, sla: 2, priority: 25, live_job: sec_form4, fill: {kind: job, jobs: [{job: sec_filings_index}, {job: sec_form4}]}, cost: {source: sec_edgar, units: 2000}}
  - {id: corporate_actions, label: "Corporate actions", group: prices, table: corporate_actions, check: latest_ingest, sla: 3, priority: 30, live_job: corporate_actions, fill: null}
  # ---------------------------------------------------------------- positioning / smart money
  - {id: cftc.cot, label: "CFTC COT (weekly)", group: positioning, table: cftc_positions, check: cftc_weekly, calendar: cftc, sla: 7, priority: 30, live_job: cftc_cot, fill: {kind: job, jobs: [{job: cftc_cot_history}]}, entities: {report_type: legacy_fut, history_weeks: 104, min_markets: 150}, cost: {source: cftc_socrata, units: 25}}
  - {id: inst.13f, label: "13F holdings", group: positioning, table: institutional_holdings, check: quarterly_13f, calendar: 13f, sla: 14, priority: 40, live_job: sec_13f, fill: {kind: campaign, campaign: sec_13f_history}, entities: {quarters: 8, partial_below: 0.8, null_security_max: 0.3}, cost: {source: sec_edgar, units: 600}}
  - {id: short_interest, label: "FINRA short interest", group: positioning, table: short_interest, check: finra_settlements, date_column: settlement_date, calendar: finra, sla: 10, priority: 40, live_job: finra_short_interest, fill: {kind: job, jobs: [{job: finra_short_interest}]}, cost: {source: finra, units: 20}}
  # ---------------------------------------------------------------- earnings
  - {id: earnings.dates, label: "Earnings dates", group: earnings, table: earnings_announcements, check: sentinel_rows, date_column: event_date, sentinel: "1900-01-01", sla: 7, priority: 45, live_job: earnings_dates_fetch, fill: {kind: campaign, campaign: earnings_dates_history}, note: "F26 fixed (O2.2c): empty Yahoo answers go to data/state/earnings/yahoo_fetch_log.json; legacy 1900-01-01 marker rows are purged by the next earnings_dates_fetch run"}
  # ---------------------------------------------------------------- regulator registers + statements (coverage v2 W2, ingest-register)
  - {id: register.US, label: "Register US (SEC listed filers)", group: filings, table: regulatory_register, check: latest_ingest, ingest_column: updated_at, parts: {market: [US]}, calendar: weekdays, sla: 2, priority: 40, live_job: regulatory_register, fill: {kind: job, jobs: [{job: regulatory_register, params: {markets: [US], seeds: false}}]}, cost: {source: sec_edgar, units: 12}, note: "SEC company_tickers_exchange (daily) + EDGAR full-index master.gz (current quarter re-read daily, closed quarters cached)"}
  - {id: register.EU, label: "Register EU (ESMA FIRDS regulated markets)", group: filings, table: regulatory_register, check: latest_ingest, ingest_column: updated_at, parts: {market: [EU]}, calendar: daily, sla: 9, priority: 42, live_job: regulatory_register, fill: {kind: job, jobs: [{job: regulatory_register, params: {markets: [EU]}}]}, cost: {source: esma_firds, units: 2}, note: "ESMA publishes FULINS_E weekly (Saturday); the nightly job re-parses only a new file set"}
  - {id: register.UK, label: "Register UK (FCA FIRDS Official List + AIM)", group: filings, table: regulatory_register, check: latest_ingest, ingest_column: updated_at, parts: {market: [UK]}, calendar: daily, sla: 9, priority: 42, live_job: regulatory_register, fill: {kind: job, jobs: [{job: regulatory_register, params: {markets: [UK]}}]}, cost: {source: esma_firds, units: 1}, note: "FCA FIRDS FULINS_E weekly; FCA Official List web search is robots-disallowed (not used)"}
  - {id: filings.uk_ch, label: "Companies House bulk accounts (iXBRL)", group: filings, table: filings_index, check: latest_ingest, ingest_column: ingested_at, parts: {source_id: [companies_house]}, calendar: weekdays, sla: 3, priority: 46, live_job: ch_accounts, fill: {kind: job, jobs: [{job: ch_accounts}]}, cost: {source: companies_house_bulk, units: 3}, note: "daily Accounts Data Product files (Tue-Sat); only matched register / issuer company numbers are range-read"}
  - {id: filings.br_cvm, label: "CVM DFP / ITR filings (BR, every cvm_code)", group: filings, table: filings_index, check: latest_ingest, ingest_column: ingested_at, parts: {source_id: [cvm]}, calendar: daily, sla: 9, priority: 47, live_job: cvm_filings, fill: {kind: job, jobs: [{job: cvm_filings}]}, note: "COVERAGE_V3 B3: weekly yearly zips (dados.cvm.gov.br, no key) for every cvm_code of the universe + the B3 crosswalk (PN / unit lines -> the registrant of their ON line); history via the manual job cvm_backfill; the weekly run rewrites the last month of receipts, so a quiet week still refreshes ingested_at"}
  - {id: statements.register.US, label: "Statements of the US register", group: fundamentals, check: register_coverage, market: US, calendar: daily, sla: 2, priority: 58, live_job: regulatory_coverage, entities: {annual_target: 95, interim_target: 85}, fill: {kind: campaign, campaign: register_statements_us}, cost: {source: sec_edgar, units: 600}, note: "share of SEC listed periodic filers with a current annual / interim in fundamentals_canonical (job regulatory_coverage)"}
  - {id: statements.register.EU, label: "Statements of the EU register", group: fundamentals, check: register_coverage, market: EU, calendar: daily, sla: 2, priority: 60, live_job: regulatory_coverage, entities: {annual_target: 95, interim_target: 85}, fill: {kind: campaign, campaign: register_statements_eu_uk}, cost: {source: filings_eu, units: 300}, note: "ESEF (filings.xbrl.org) + national OAMs + Yahoo fallback; half-year reports are not ESEF-tagged"}
  - {id: statements.register.UK, label: "Statements of the UK register", group: fundamentals, check: register_coverage, market: UK, calendar: daily, sla: 2, priority: 60, live_job: regulatory_coverage, entities: {annual_target: 95, interim_target: 85}, fill: {kind: campaign, campaign: register_statements_eu_uk}, cost: {source: filings_eu, units: 300}, note: "UK ESEF / UKSEF (filings.xbrl.org, FCA NSM) + Companies House iXBRL + Yahoo fallback; AIM has no tagged filing source"}
  # ---------------------------------------------------------------- analytics outputs (filled by the DAG, not the filler)
  - {id: analytics.scores,     label: "Composite scores",  group: analytics, table: composite_scores, check: latest_date, date_column: as_of_date, calendar: XNYS, sla: 1, priority: 50, live_job: scoring,         fill: null}
  - {id: analytics.valuation,  label: "Valuation daily",   group: analytics, table: valuation_daily,  check: latest_date, date_column: date,       calendar: XNYS, sla: 1, priority: 50, live_job: valuation_daily, fill: null}
  - {id: analytics.technicals, label: "Technical levels",  group: analytics, table: tech_levels,      check: latest_date, date_column: as_of_date, calendar: XNYS, sla: 1, priority: 50, live_job: tech_levels,     fill: null}
  - {id: analytics.ml,         label: "ML predictions",    group: analytics, table: ml_predictions,   check: latest_date, date_column: date,       calendar: XNYS, sla: 1, priority: 50, live_job: ml_predict,      fill: null}
  - {id: analytics.sentiment,  label: "Sentiment daily",   group: analytics, table: sentiment_daily,  check: latest_date, date_column: date,       calendar: weekdays, sla: 2, priority: 55, live_job: sentiment_daily, fill: null}
  - {id: analytics.moat,       label: "Moat (weekly)",     group: analytics, table: moat,             check: latest_date, date_column: as_of_date, calendar: weekdays, sla: 8, priority: 60, live_job: moat,            fill: null}
  - {id: analytics.exposures,  label: "Macro exposures (weekly)", group: analytics, table: macro_exposures, check: latest_date, date_column: as_of_date, calendar: weekdays, sla: 35, priority: 60, live_job: macro_exposures, fill: null, note: "PIT month-end exposures"}
  # conformal sets (docs/CONFORMAL_TECHNICALS_PLAN.md P2; model-based, experimental until the P4 gate)
  - {id: analytics.conformal_envelopes, label: "Conformal envelopes (A)", group: analytics, table: conformal_envelopes, check: latest_date, date_column: as_of_date, calendar: XNYS, sla: 1, priority: 60, live_job: conformal_envelopes, fill: null}
  - {id: analytics.conformal_peers, label: "Conformal peer groups (B)", group: analytics, table: conformal_peer_scores, check: latest_date, date_column: as_of_date, calendar: XNYS, sla: 2, priority: 60, live_job: conformal_peer_groups, fill: null}
  - {id: analytics.conformal_coverage, label: "Conformal coverage audit", group: analytics, table: conformal_coverage, check: conformal_coverage, date_column: as_of_date, calendar: XNYS, sla: 2, priority: 60, live_job: conformal_coverage, fill: null, entities: {overall_tol_pp: 1.5, segment_tol_pp: 5.0, min_segment_n: 2000}, note: "realised joint coverage vs target (rolling audit): overall more than 1.5 pp under, or a region / sector / regime / VIX segment (n >= 2000 sets) more than 5 pp under, raises a manual 'suspicious' gap"}

  # ---------------------------------------------------------------- rates & debt (docs/COVERAGE_V2_PLAN.md W3; owner rates-w3)
  # check published_dates (app.rates.ops_checks): every entity has its own official publication rule (cal = exchange MIC /
  # weekdays / target, local publication time `at`, `lag` business days; freq M / batch: lag_days after the month end;
  # W: weekly on `weekday`). The startup sync fetches an entity right after its publication time (rates.curves: only the
  # sources of the due curves); entities with their own `job` plan that job instead of the dataset's fetch job.
  - id: rates.curves
    label: "Sovereign yield curves (official)"
    group: rates
    table: yield_curves
    check: published_dates
    key_column: curve_id
    lookback_days: 800
    sla: 1
    priority: 21
    live_job: rates_curves
    fill: {kind: job, jobs: [{job: rates_curves}]}
    cost: {source: rates_official, units: 30}
    note: "history depth via the filler campaign rates_curves_history; monthly {CC}_LT10 curves grouped per source"
    entities:
      curves:
        US_TSY: {cal: "XNYS", tz: "America/New_York", at: "18:00", lag: 0, source: "ust"}
        US_TSY_REAL: {cal: "XNYS", tz: "America/New_York", at: "18:00", lag: 0, source: "ust"}
        US_H15: {cal: "XNYS", tz: "America/New_York", at: "10:00", lag: 1, source: "fred"}
        US_H15_TIPS: {cal: "XNYS", tz: "America/New_York", at: "10:00", lag: 1, source: "fred"}
        EA_AAA: {cal: "target", tz: "Europe/Berlin", at: "12:30", lag: 1, source: "ecb"}
        EA_ALL: {cal: "target", tz: "Europe/Berlin", at: "12:30", lag: 1, source: "ecb"}
        DE_BUND: {cal: "XETR", tz: "Europe/Berlin", at: "13:00", lag: 1, source: "bundesbank"}
        GB_GILT: {cal: "XLON", tz: "Europe/London", at: "12:30", lag: 1, source: "boe"}
        GB_GILT_REAL: {cal: "XLON", tz: "Europe/London", at: "12:30", lag: 1, source: "boe"}
        GB_INFLATION: {cal: "XLON", tz: "Europe/London", at: "12:30", lag: 1, source: "boe"}
        GB_OIS: {cal: "XLON", tz: "Europe/London", at: "12:30", lag: 1, source: "boe"}
        JP_JGB: {cal: "XTKS", tz: "Asia/Tokyo", at: "19:00", lag: 0, source: "mof_jp"}
        ES_BONO: {cal: "XMAD", tz: "Europe/Madrid", at: "12:00", lag: 3, source: "bde"}
        PT_OT: {cal: "XLIS", tz: "Europe/Lisbon", at: "18:00", lag: 6, source: "bpstat"}
        CH_CONF: {cal: "XSWX", tz: "Europe/Zurich", at: "14:30", freq: "batch", lag_days: 5, source: "snb"}
        CA_GOC: {cal: "XTSE", tz: "America/Toronto", at: "12:00", lag: 1, source: "boc"}
        AU_ACGB: {cal: "XASX", tz: "Australia/Sydney", at: "17:00", lag: 2, source: "rba"}
        SE_SGB: {cal: "XSTO", tz: "Europe/Stockholm", at: "17:00", lag: 0, source: "riksbank"}
        NO_NGB: {cal: "XOSL", tz: "Europe/Oslo", at: "17:00", lag: 1, source: "norges"}
        EA_EURIBOR: {cal: "target", tz: "Europe/Madrid", at: "12:00", lag: 2, source: "bde"}
      LT10_ECB: {keys: [AT_LT10, BE_LT10, BG_LT10, CY_LT10, CZ_LT10, DE_LT10, DK_LT10, EE_LT10, ES_LT10, FI_LT10, FR_LT10, GR_LT10, HR_LT10, HU_LT10, IE_LT10, IT_LT10, LT_LT10, LU_LT10, LV_LT10, MT_LT10, NL_LT10, PL_LT10, PT_LT10, RO_LT10, SE_LT10, SI_LT10, SK_LT10], cal: "target", tz: "Europe/Berlin", at: "15:00", freq: "M", lag_days: 25, source: "ecb_irs"}
      LT10_OECD: {keys: [AU_LT10, BR_LT10, CA_LT10, CH_LT10, CL_LT10, CN_LT10, CO_LT10, GB_LT10, IN_LT10, JP_LT10, KR_LT10, MX_LT10, US_LT10, NZ_LT10, IL_LT10, IS_LT10, NO_LT10, ZA_LT10, CR_LT10, ID_LT10, RU_LT10, TR_LT10], cal: "weekdays", tz: "Europe/Paris", at: "12:00", freq: "M", lag_days: 45, source: "oecd"}
  - id: rates.money
    label: "Money-market fixings (SOFR / EFFR / OBFR / EUR STR / SONIA / TONA / CORRA)"
    group: rates
    table: macro_observations
    check: published_dates
    key_column: series_id
    lookback_days: 60
