# BiG Equity 360 unified sector taxonomy (own names; GICS-like structure, not GICS).
# Consumed by app.normalize.taxonomy.classify(issuer) -> (sector_id, subsector_id, classification_source).
version: 3   # v3 2026-10-31: SIC 3712-3713, 3750-3759, 7600-7699 mapped (were unclassified)

precedence: [override, yf_industry, sic, tse33, ksic, csrc, cvm, twse, unknown]
precedence_notes: >
  1) overrides (by CIK / ticker@MIC / ISIN) always win. 2) yfinance industry string is the most modern and global.
  3) SIC (US/SEC filers incl. 20-F) via ranges below. 4) national codes (coarse) fill the remainder.
  TSE33/KSIC/CSRC map to a default subsector; if yf_industry is available it refines inside the same sector.
  'Shell Companies' / SIC 6770 / blank-check -> excluded from scoring (sector_id null).
  Bank subsector split: banks_global if total_assets_usd > 500e9 or G-SIB list, else banks_regional (size_rule).

sectors:
  - {id: TECH, name: Technology}
  - {id: COMM, name: Communication & Media}
  - {id: CDIS, name: Consumer Discretionary}
  - {id: CSTA, name: Consumer Staples}
  - {id: HLTH, name: Healthcare}
  - {id: FINS, name: Financials}
  - {id: INDU, name: Industrials}
  - {id: MATR, name: Materials}
  - {id: ENRG, name: Energy}
  - {id: UTIL, name: Utilities}
  - {id: REAL, name: Real Estate}

# group tags used by canonical_line_items.applies_to, sector_kpis and scoring (business-model families)
subsectors:
  # ---- TECH
  - {id: semiconductors,          sector: TECH, name: Semiconductors,                       groups: [semis, rnd_heavy]}
  - {id: semi_equipment,          sector: TECH, name: Semiconductor Equipment & Materials,  groups: [semis, rnd_heavy]}
  - {id: software_application,    sector: TECH, name: Application Software,                 groups: [software, rnd_heavy]}
  - {id: software_infrastructure, sector: TECH, name: Infrastructure Software & Security,   groups: [software, rnd_heavy]}
  - {id: it_services,             sector: TECH, name: IT Services & Consulting,             groups: [services]}
  - {id: hardware_networking,     sector: TECH, name: "Hardware, Devices & Networking",       groups: [hardware, rnd_heavy]}
  - {id: electronic_components,   sector: TECH, name: Electronic Components & Instruments,  groups: [hardware]}
  # ---- COMM
  - {id: telecom_operators,       sector: COMM, name: Telecom Operators,                    groups: [telecom, capital_intensive]}
  - {id: internet_platforms,      sector: COMM, name: Internet Platforms & Search/Social,   groups: [software, rnd_heavy]}
  - {id: media_entertainment,     sector: COMM, name: "Media, Streaming & Entertainment",     groups: [media]}
  - {id: video_games,             sector: COMM, name: Video Games & Interactive,            groups: [software, rnd_heavy]}
  - {id: advertising_publishing,  sector: COMM, name: Advertising & Publishing,             groups: [media]}
  # ---- CDIS
  - {id: autos,                   sector: CDIS, name: Automobiles,                          groups: [autos, capital_intensive]}
