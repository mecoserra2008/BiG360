  - {name: qm_10_95, type: float64, storage: float32, nullable: true, description: "MARGINAL 95% radius for the 10-session return alone (pooled conformal quantile of y^2 / v_10; band = close x exp(+-sqrt(qm v_10))), radius_mode"}
  - {name: qm_20_80, type: float64, storage: float32, nullable: true, description: "MARGINAL 80% radius for the 20-session return alone (pooled conformal quantile of y^2 / v_20; band = close x exp(+-sqrt(qm v_20))), radius_mode"}
  - {name: qm_20_90, type: float64, storage: float32, nullable: true, description: "MARGINAL 90% radius for the 20-session return alone (pooled conformal quantile of y^2 / v_20; band = close x exp(+-sqrt(qm v_20))), radius_mode"}
