table: conformal_envelopes
version: 2
zone: features
owner: conformal (app.conformal.envelope_job)
description: >
  Application A of docs/CONFORMAL_TECHNICALS_PLAN.md: conformal price envelope per security and day, MODEL-BASED.
  Joint vector Y = forward log returns at 1/5/10/20 sessions (overlapping; nested covariance V(min(h_i, h_j)) from an
  EWMA / GARCH variance filter + an earnings jump term) and the next-bar (high, low, close) vector vs the previous close.
  Radius = pooled rolling split-conformal quantile of the squared Mahalanobis score (separate normal / earnings-event
  pools), optionally ACI-adjusted; bands b* are closed-form projections a'Y_hat +- sqrt(q a'Sigma a) of the JOINT set
  (simultaneous over the 4 horizons, hence wider than a single-horizon band); qm_* are the marginal per-horizon radii
  for a single-horizon band. Coverage is marginal
  over history ('calibrated to X% over history'), never a statement about a single day. Realised fields are filled
  as outcomes arrive (the nightly job rewrites the last 21 origin partitions). Retention: last 30 origin dates.
storage: {path: features/conformal_envelopes, format: parquet, partition_by: [as_of_date], write_mode: upsert, sort_by: [security_id], compression_level: 9}
primary_key: [as_of_date, security_id]
pit: {knowledge_column: as_of_date, rule: "shape, radius and bands use prices / earnings dates known at the close of as_of_date; y_*, score_*, nb_y_*, gap_flag, earn_realized are outcomes"}
columns:
  - {name: as_of_date, type: date, nullable: false, description: "Origin date (close of the session; partition)"}
  - {name: security_id, type: string, nullable: false, description: "FK securities_master"}
  - {name: region, type: string, nullable: false, description: "Listing region (prices_daily partition)"}
  - {name: pool_key, type: string, nullable: false, description: "Calibration pool '{region}|{sector_id}' ('{region}|*' when the sector pool has < 30 securities)"}
  - {name: sector_id, type: string, nullable: true, description: "Issuer sector (current-only classification)"}
  - {name: filter, type: enum, nullable: false, values: [ewma, garch, gru], description: "Shape filter"}
  - {name: radius_mode, type: enum, nullable: false, values: [plain, aci], description: "Radius used for the stored joint (b*) and marginal (qm*) bands: plain rolling split conformal or ACI-adjusted; next-bar bands always use the ACI radius (P4)"}
  - {name: model_based, type: bool, nullable: false, description: "Always true: model-based, calibrated to X% over history (marginal), not X% chance today"}
  - {name: last_close, type: float64, storage: float32, nullable: false, description: "Unadjusted close at as_of_date (bands are in this price basis)"}
  - {name: sigma_d, type: float64, storage: float32, nullable: true, description: "Filter daily volatility (log return) for the next session, earnings days excluded"}
  - {name: earn_jump_var, type: float64, storage: float32, nullable: true, description: "Earnings jump variance J (log-return^2) known at as_of_date"}
  - {name: earn_days_ahead, type: int16, nullable: true, description: "Sessions until the first expected earnings reaction day within 20 sessions (null = none)"}
  - {name: earn_in_window, type: bool, nullable: false, description: "An earnings reaction day is expected within the 20-session window (event calibration pool)"}
  - {name: mu_1, type: float64, storage: float32, nullable: true, description: "Predicted mean log return over 1 sessions (0 for the ewma / garch filters)"}
  - {name: mu_5, type: float64, storage: float32, nullable: true, description: "Predicted mean log return over 5 sessions (0 for the ewma / garch filters)"}
  - {name: mu_10, type: float64, storage: float32, nullable: true, description: "Predicted mean log return over 10 sessions (0 for the ewma / garch filters)"}
  - {name: mu_20, type: float64, storage: float32, nullable: true, description: "Predicted mean log return over 20 sessions (0 for the ewma / garch filters)"}
  - {name: v_1, type: float64, storage: float32, nullable: true, description: "Predicted variance of the 1-session log return incl. the earnings jump when covered (shape)"}
  - {name: v_5, type: float64, storage: float32, nullable: true, description: "Predicted variance of the 5-session log return incl. the earnings jump when covered (shape)"}
  - {name: v_10, type: float64, storage: float32, nullable: true, description: "Predicted variance of the 10-session log return incl. the earnings jump when covered (shape)"}
  - {name: v_20, type: float64, storage: float32, nullable: true, description: "Predicted variance of the 20-session log return incl. the earnings jump when covered (shape)"}
  - {name: q_80, type: float64, storage: float32, nullable: true, description: "Joint squared-Mahalanobis radius q_hat at 80% (pooled rolling split conformal)"}
  - {name: q_90, type: float64, storage: float32, nullable: true, description: "Joint squared-Mahalanobis radius q_hat at 90% (pooled rolling split conformal)"}
  - {name: q_95, type: float64, storage: float32, nullable: true, description: "Joint squared-Mahalanobis radius q_hat at 95% (pooled rolling split conformal)"}
  - {name: q_aci_80, type: float64, storage: float32, nullable: true, description: "ACI-adjusted joint radius at 80% target (unbounded stored as null)"}
  - {name: q_aci_90, type: float64, storage: float32, nullable: true, description: "ACI-adjusted joint radius at 90% target (unbounded stored as null)"}
  - {name: q_aci_95, type: float64, storage: float32, nullable: true, description: "ACI-adjusted joint radius at 95% target (unbounded stored as null)"}
