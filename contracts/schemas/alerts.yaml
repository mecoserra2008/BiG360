table: alerts
version: 8
zone: app_state
owner: api (app.api.routers.watchlists) ; evaluated by job alerts_eval
description: >
  Alert rules. rule_type + params JSON:
    price_cross {level: float, direction: above|below}
    zone_touch {zone_rank_max: int}
    score_change {factor_id|composite profile_id, delta: float, mode?: delta|level (default delta), level?: float, direction?: up|down|any}
    price_change_pct_1d {pct: float (fraction, e.g. 0.05), direction?: up|down|any (default any)}   (added v2)
    insider_buy {min_value_usd: float, cluster_only: bool}
    sentiment_shift {threshold_z: float}
    watchlist_news {tiers?: [1-4] (default [1, 2, 3]), min_abs_sentiment?: 0..1, languages?, sources?, max_per_day?: 10}
        a live news item (news desk, roadmap v3 N4) linked to a target security; one event per (alert, security,
        story) - payload.dedupe = story id; evaluated by the realtime alert consumer only  (added v8)
    story_velocity {min_articles?: 5, min_ratio?: 3.0, min_sources?: 2, themes?, countries?} a burst of articles on one
        story in 60 min vs its own baseline (floored 0.5 / h); with no security / watchlist target any matching story
        fires as security_id news:<story_id>; realtime alert consumer only  (added v8)
    new_filing {form_classes: [annual, quarterly, current_report]}
    model_decile {horizon, min_decile}
    macro_release {countries?: [ISO2|EA], series_ids?: [macro_series id], max_importance?: 1|2|3 (default 1)}
        a tracked release published in (previous business day, as_of]  (added macro-w2)
    macro_surprise {threshold_z?: float (default 2.0), countries?, themes?: [growth|inflation|labor], series_ids?,
        max_importance?: 1|2|3 (default 3)}   |surprise z| vs MODEL-BASED expectation (not consensus)  (added macro-w2)
    regime_change {kind?: cycle_quadrant|recession_probability|any (default any), countries?, level?: float in (0,1)
        (default 0.5), methods?: [nyfed_yield_curve_official|yield_curve_probit|hmm_regime|...]}  (added macro-w2)
    earnings_upcoming {days_ahead?: int (default 3), date_sources?: [company_announced|provider_estimate|model_projection]}
        earnings expected within days_ahead for the target security / watchlist members (earnings_calendar; the
        message carries the date-source label)  (added earnings, v4)
    earnings_surprise {threshold_z?: float (default 2.0), items?: [eps_diluted|revenue]} |surprise z| vs the MODEL-BASED
        expectation (not consensus) on a release whose actual became known in (previous business day, as_of]  (added earnings, v4)
    activist_13d {include_amendments?: bool (default false), include_switch?: bool (default true)} new 13D or 13G -> 13D
        switch on the security filed in (previous business day, as_of] (activist_events, SEC)  (added smart-money)
    short_interest_spike {min_chg_pct?: float (default 0.25), min_si_pct?: float (default 0)} FINRA short interest
        published in the window rose >= min_chg_pct vs the previous settlement (si_signals)  (added smart-money)
    eu_short_position {min_pct?: float percent (default 0.5), include_increases?: bool (default true),
        min_increase_pp?: float (default 0.1)} new or increased named EU / UK net short position published in the window
        (eu_short_positions)  (added smart-money)
    thesis_kpi / thesis_review / thesis_status / thesis_catalyst / thesis_positioning / thesis_event_shock {thesis_id,
        ...} rules generated by the thesis tracker (roadmap #8) and evaluated by the thesis_eval job (events appended
        there; no-op in alerts_eval): KPI threshold breach (formula engine over the serving snapshot), review due,
        automatic status turning at_risk / invalidated, a dated custom catalyst within days_ahead, a CFTC positioning
        extreme on the cross-asset subject (COT index <= lo or >= hi), a country event shock (events v2 attention / tone
        z beyond threshold_z). alert_events.security_id = the subject security or 'thesis:<thesis_id>'.  (added v6)
    price_outside_calibrated_range {level?: 80|90|95 (default 95), horizon?: 1|5|10|20 (default 1), side?: up|down|any}
        the h-session move (adj_close) ended outside the MARGINAL conformal band emitted h sessions earlier
        (conformal_envelopes qm_*; calibrated to level% over history, model-based)  (added v7, conformal P3)
    conformal_peer_anomaly {percentile?: fraction (default 0.95), scope?: group|member|any (default any)} the peer
        group's joint-anomaly percentile >= percentile (conformal_peer_scores), or the security's |z_cond| within the
        group at or above its own trailing-year percentile (conformal_peer_members); descriptive, model-based, not a
        trading signal  (added v7, conformal P3)
    Macro rule types have no security_id / watchlist_id: they fire per country and alert_events.security_id holds
    'macro:<CC>' (no ticker).
storage: {path: app_state.duckdb, format: duckdb_table, partition_by: [], write_mode: upsert}
primary_key: [alert_id]
columns:
  - {name: alert_id, type: string, nullable: false, description: "uuid4 hex"}
  - {name: security_id, type: string, nullable: true, description: "Target security (null = applies to watchlist_id)"}
  - {name: watchlist_id, type: string, nullable: true, description: "Target watchlist"}
  - {name: rule_type, type: enum, nullable: false, values: [price_cross, zone_touch, score_change, insider_buy, sentiment_shift, new_filing, model_decile, price_change_pct_1d, studio_drift, macro_release, macro_surprise, regime_change, earnings_upcoming, earnings_surprise, backtest_drift, activist_13d, short_interest_spike, eu_short_position, thesis_kpi, thesis_review, thesis_status, thesis_catalyst, thesis_positioning, thesis_event_shock, price_outside_calibrated_range, conformal_peer_anomaly, watchlist_news, story_velocity], description: "Rule (v8: watchlist_news, story_velocity - live news rules; v7: price_outside_calibrated_range, conformal_peer_anomaly - conformal P3; v6: thesis_* rules owned by the thesis tracker; v5: backtest_drift - paper-strategy drift / decay events appended by the backtest_scheduled job; params {strategy_id, strategy_name, schedule, drift_threshold})"}
  - {name: params, type: json, nullable: false, description: "Rule parameters"}
  - {name: enabled, type: bool, nullable: false, description: "Active"}
  - {name: cooldown_days, type: int16, nullable: false, description: "Min days between firings"}
  - {name: last_fired_at, type: datetime, nullable: true, description: "UTC"}
  - {name: created_at, type: datetime, nullable: false, description: "UTC"}
  - {name: thesis_id, type: string, nullable: true, description: "v6: thesis (theses.thesis_id) whose automation generated this rule; rules with a thesis_id are created / replaced / deleted together with the thesis"}
