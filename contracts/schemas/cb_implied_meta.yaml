table: cb_implied_meta
version: 1
zone: scores
owner: macro-w3 (app.macro.cb.implied, job cb_curves_implied)
description: >
  Per bank: implied-path availability (ok / stale / no data / failed / not_available), official curve source, method
  text and caveats (JSON list). Overwritten nightly.
storage: {path: scores/cb_implied_meta, format: parquet, partition_by: [], write_mode: overwrite}
primary_key: [bank]
columns:
  - {name: bank, type: string, nullable: false, description: "Bank code"}
  - {name: status, type: enum, nullable: false, values: [ok, stale, no data, failed, not_available], description: "Availability"}
  - {name: as_of, type: date, nullable: true, description: "Latest curve date"}
  - {name: source, type: string, nullable: true, description: "Official curve source"}
  - {name: method, type: string, nullable: true, description: "Method text"}
  - {name: caveats, type: json, nullable: true, description: "List of caveat strings"}
  - {name: meetings_resolved, type: bool, nullable: false, description: "Meeting-by-meeting path available"}
  - {name: tp_adjusted, type: bool, nullable: false, description: "Term-premium-adjusted path available"}
  - {name: n_dates, type: int32, nullable: false, description: "Curve dates in the window"}
  - {name: method_version, type: string, nullable: false, description: "implied_v1"}
  - {name: computed_at, type: datetime, nullable: false, description: "Write time UTC"}
