table: ml_labels
version: 1
zone: ml
owner: ml (app.ml.labels)
description: >
  Forward-looking labels, kept separate from ml_features to prevent leakage. Forward return measured from
  close(D+1) to close(D+1+h) on adj_close (one-day execution lag). Excess vs equal-weighted sector x region
  mean of the training universe. Delisting: last available price used, then 0 return (flag set).
storage: {path: ml/ml_labels, format: parquet, partition_by: [horizon], write_mode: upsert}
primary_key: [date, security_id, horizon]
columns:
  - {name: date, type: date, nullable: false, description: "Rebalance date (feature date)"}
  - {name: security_id, type: string, nullable: false, description: "FK securities_master"}
  - {name: horizon, type: enum, nullable: false, values: ["1M", "3M", "6M"], description: "21 / 63 / 126 trading days"}
  - {name: label_end_date, type: date, nullable: false, description: "Date of close(D+1+h) — purge boundary"}
  - {name: fwd_return, type: float64, nullable: true, description: "Raw forward total return"}
  - {name: fwd_excess_sector, type: float64, nullable: true, description: "Return minus sector x region mean"}
  - {name: rank_label, type: float64, nullable: true, description: "Cross-sectional percentile (0..1) of fwd_excess_sector within date"}
  - {name: decile, type: int8, nullable: true, description: "1..10"}
  - {name: delisted_in_window, type: bool, nullable: false, description: "Delisting occurred within horizon"}
  - {name: computed_at, type: datetime, nullable: false, description: "Write time UTC"}
