# Job registry + DAG. Consumed by app.scheduler (APScheduler in the worker process).
# Each job module exposes:  def run(ctx: app.scheduler.base.JobContext) -> app.scheduler.base.JobResult
# Runtimes: est_min_mvp (~700 securities) / est_min_full (~15k securities), 20-thread CPU, warm caches.
version: 47
# v46 (2026-11-05, docs/STUDIO_V2_PLAN.md S1, owner model-studio): studio_run / backtest_run are now the FALLBACK path:
# async Studio / backtest runs execute in the warm studio lane (supervisor child `studio`, app.modeling.lane: own Job
# Object + RAM cap, outside the file queue and the heavy slot) while it is up; the API enqueues these jobs only when the
# lane is down / disabled (BIG360_STUDIO_LANE=0) and their drain skips lane runs (status lane=lane). Notes only.
# v45 (2026-10-31, docs/COVERAGE_V2_PLAN.md W2 regulator-complete US / EU / UK, owner ingest-register): new jobs
# regulatory_register (nightly root fetch: SEC company_tickers_exchange + EDGAR full-index, ESMA / FCA FIRDS FULINS_E
# weekly files, GLEIF -> regulatory_register + seeds/regulatory_register.csv for the EU / UK issuers missing from the
# reference data), ch_accounts (nightly: Companies House Accounts Data Product daily files, HTTP range reads of the
# target members only) + ch_accounts_backfill (manual: monthly / historic archives), register_backfill (manual,
# resumable statements campaign: companyfacts for every register CIK, FSDS for FPIs, ESEF / FCA NSM / OAM / Companies
# House / Yahoo fallback, normalisation; filler campaigns register_statements_*), regulatory_coverage (nightly derive:
# register vs universe / prices / annual / interim / sector with reasons -> ops/regulatory_coverage + docs).
# v44 (2026-10-31, docs/COVERAGE_V2_PLAN.md W3 rates & debt, owner rates-w3): new jobs rates_curves (nightly + startup
# sync: official sovereign curves -> yield_curves / yield_curve_params, integer bp x 100), rates_curves_backfill (manual,
# resumable per source; filler campaign rates_curves_history), rates_auctions (nightly: Fiscal Data + UK DMO ->
# sovereign_auctions), bonds_reference (weekly: ESMA FIRDS FULINS_D -> bond_reference), bonds_us_openfigi (manual,
# resumable OpenFIGI campaign), company_debt (nightly derive: company_debt + debt_maturity_walls), credit_trace (manual,
# keyed FINRA API -> credit_market_stats; skipped without FINRA_API_CLIENT_ID / FINRA_API_CLIENT_SECRET).
# v43 (2026-10-31, docs/COVERAGE_V2_PLAN.md W1): earnings for the whole `full` universe - earnings_dates_fetch
# mem_gb 2 / max_minutes 30 / incremental due rules + HKEX BMN, CNINFO and FCA NSM sources; earnings_expectations
# mem_gb 3 -> 4 (budget-aware worker pool, seasonal_rw fallback for short histories).
# v42 (2026-10-31, docs/OPERATIONS_ROADMAP.md "Worker memory & ref_universe fixes 2026-10-31"): optional `mem_gb` =
# the job's RAM budget (admission against free RAM - reservations - 4 GB headroom; for executor: process also the
# Job Object committed-memory cap and the DuckDB / Polars / BLAS limits of the job process) and `oom_params` = params
# of the one retry after the job hit its cap (smaller chunks). Heavy / medium derive jobs moved to executor: process.
# Budgets come from the per-job peaks measured 2026-10-31 (data/state/ops/job_mem.jsonl keeps measuring every run).

timezone: America/New_York
dags:
  nightly: {cron: "30 1 * * 2-6", description: "Tue-Sat 01:30 ET: processes the previous US session; Asia/Europe sessions of that date are closed"}
  weekly:  {cron: "0 6 * * 6",    description: "Saturday 06:00 ET, after nightly completes (waits on nightly dag_run success)"}
  monthly: {cron: "0 8 1-7 * 0",  description: "First Sunday of month 08:00 ET"}
  cftc_weekly: {cron: "0 19 * * 5", description: "Friday 19:00 ET: CFTC Commitments of Traders (released Friday 15:30 ET; holiday weeks catch up next Friday via the 28-day revision window)"}
  hourly:  {cron: "10 * * * *",   description: "Every hour at :10 (roadmap v3 N3): live news hourly fold, daily finalise when a UTC day is complete, intraday serving DuckDB; scheduled by the profile entry hourly_news (all profiles), independent of the weekly / nightly refresh"}
  manual:  {cron: null,           description: "API/CLI triggered only (backfills, model training on demand)"}

defaults: {retries: 2, retry_backoff_s: 60, timeout_min: 60, on_upstream_failure: skip}   # 'partial' upstream status still runs dependents

jobs:
  # ---------------- reference / market (ingest-market, ref-identity)
  - {id: ref_universe,        dag: nightly, module: app.normalize.identity_universe, mem_gb: 6, executor: process, owner: ref-identity,  depends_on: [],                                writes: [issuers, securities_master, listings, identifier_map], est_min_mvp: 3,  est_min_full: 15}
  - {id: fx_rates,            dag: nightly, module: app.ingestion.fx,                owner: ingest-market, depends_on: [],                                writes: [fx_rates],                       est_min_mvp: 1,  est_min_full: 1}
  - {id: prices_us_polygon,   dag: nightly, module: app.ingestion.polygon_prices,    owner: ingest-market, depends_on: [ref_universe], soft_depends_on: [ref_universe],                    writes: [prices_staging],                   est_min_mvp: 1,  est_min_full: 1, note: "1 grouped-daily call per missing date (5 req/min budget)"}
  - {id: prices_global_yf,    dag: nightly, module: app.ingestion.yf_prices,         owner: ingest-market, depends_on: [ref_universe], soft_depends_on: [ref_universe], executor: process,                    writes: [prices_staging, corporate_actions_staging],                   est_min_mvp: 6,  est_min_full: 60, timeout_min: 150, params: {max_minutes: 120, batch_size: 250}, note: "nightly incremental per symbol (last stored bar - 3d; full history only for new symbols), chunked + checkpointed per as_of (resume continues), 120-min budget then partial; CN/TW/BR only curated seeds"}
  - {id: corporate_actions,   dag: nightly, module: app.ingestion.corporate_actions, owner: ingest-market, depends_on: [ref_universe, prices_global_yf], soft_depends_on: [ref_universe, prices_global_yf],  writes: [corporate_actions_staging, corporate_actions],              est_min_mvp: 3,  est_min_full: 30}
  - {id: prices_finalize,     dag: nightly, module: app.normalize.prices, oom_params: {chunk_securities: 150, parallel: 1}, mem_gb: 10, executor: process,            owner: ingest-market, depends_on: [prices_us_polygon, prices_global_yf, prices_kr_krx, prices_cn_baostock, prices_tw, prices_br_b3, corporate_actions, fx_rates], soft_depends_on: [prices_us_polygon, prices_global_yf, prices_kr_krx, prices_cn_baostock, prices_tw, prices_br_b3], writes: [prices_daily], est_min_mvp: 2, est_min_full: 15, timeout_min: 60, note: "adj factors, close_usd, source reconciliation, dq flags. Refresh-pipeline fixes 2026-10-26: params mode=auto (default; incremental per region since its watermark in data/state/prices_finalize.json: tail re-builds of the changed securities + full-history re-builds where an action / revision / guard needs it, parallel regions, only touched partitions re-written; weekly increment ~10-20 min) | full (O2.2a full rebuild for back-fills, ~2-3 h at 98 M rows: pass timeout_min=240), parallel (2)"}
  - {id: macro_fred,          dag: nightly, module: app.ingestion.fred,              owner: ingest-market, depends_on: [],                                writes: [macro_series, macro_observations], est_min_mvp: 3, est_min_full: 3}
  - {id: macro_eu,            dag: nightly, module: app.ingestion.macro_eu,          owner: macro-coverage, depends_on: [],                               writes: [macro_series, macro_observations], est_min_mvp: 3, est_min_full: 3, sources: [ecb, eurostat, bundesbank, snb, insee, bpstat, ine_es], note: "catalog-driven (contracts/macro_catalog.yaml): ECB, Eurostat (multi-geo JSON-stat), Bundesbank, SNB, INSEE, BPstat, INE"}
  - {id: macro_intl,          dag: nightly, module: app.ingestion.macro_intl,        owner: macro-coverage, depends_on: [],                               writes: [macro_series, macro_observations], est_min_mvp: 5, est_min_full: 5, sources: [oecd, bis, imf, worldbank], note: "OECD (<= 60 downloads/h: ~5 batched requests, 20 h cache), BIS, IMF, World Bank + Pink Sheet"}
  - {id: macro_national,      dag: nightly, module: app.ingestion.macro_national,    owner: macro-coverage, depends_on: [],                               writes: [macro_series, macro_observations], est_min_mvp: 8, est_min_full: 8, sources: [ust, statcan, boc, bcb, ibge, bcrp, bcra, datos_ar, banrep, ine_cl, boe, ons, boj, mof_jp, akshare, hkma, censtatd, rba, abs, cbc_tw, banxico, bok_ecos, nyfed], note: "non-EU national sources; keyed ones (BOK_ECOS_APIKEY, BANXICO_TOKEN, INEGI_TOKEN, ESTAT_APPID, BCCH_USER/PASS) skip with a missing-key status"}
  - {id: macro_global,        dag: nightly, module: app.ingestion.macro_global,      owner: ingest-market, depends_on: [macro_eu, macro_intl, macro_national], writes: [macro_series, macro_observations], est_min_mvp: 1, est_min_full: 1, note: "umbrella (kept id): no-op when the three group jobs reported < 20 h ago; run alone it runs all groups (params run_all, sources, start)"}
  - {id: macro_audit,         dag: nightly, module: app.ingestion.macro_audit,       owner: macro-coverage, depends_on: [macro_fred, macro_global],       writes: [],                               est_min_mvp: 1, est_min_full: 1, note: "units/scale, frequency, staleness vs cadence, cross-source consistency, coverage matrix -> data/logs/reports/macro_audit_<date>.json"}
  - {id: macro_cells,         dag: nightly, module: app.macro.indicators,          owner: macro-w1,      depends_on: [macro_fred, macro_global],       writes: [macro_cells, macro_cell_history, macro_revisions], est_min_mvp: 1, est_min_full: 1, note: "macro v2 W1: canonical (country, indicator) cells (PIT daily snapshot; first run backfills 36 month-ends ~1 min), canonical history, first-release vs latest revisions"}
  - {id: macro_cycle,         dag: nightly, module: app.macro.cycle,               owner: macro-w1,      depends_on: [macro_cells],                    writes: [macro_cycle],                    est_min_mvp: 1, est_min_full: 1, note: "macro v2 W1: cycle clock (growth x inflation momentum, quadrants), recomputed from macro_cell_history"}
  # macro v2 W2 (owner macro-w2): official release calendar, MODEL-BASED expectations (not consensus), surprises, nowcasts, recession panel
  - {id: macro_calendar,      dag: nightly, module: app.macro.calendar,            owner: macro-w2,      depends_on: [macro_fred, macro_global],       writes: [macro_releases, macro_release_events], est_min_mvp: 2, est_min_full: 2, note: "official calendars (FRED release dates + 19 publisher calendars, app.macro.calendar_sources; failures skipped), past 3y + 90d; release outcomes (actual / prior / revision) point-in-time"}
  - {id: macro_nowcast,       dag: nightly, module: app.macro.nowcast,             owner: macro-w2,      depends_on: [macro_fred, macro_global],       writes: [macro_nowcasts], est_min_mvp: 1, est_min_full: 1, note: "DynamicFactorMQ GDP nowcasts US/EA/GB/JP, re-estimated only when the input panel changed (fingerprint) + news decomposition; official GDPNow / NY Fed Staff Nowcast benchmarks; params history_weeks (backfill), force"}
  - {id: macro_expectations,  dag: nightly, module: app.macro.expectations,        owner: macro-w2,      depends_on: [macro_calendar, macro_nowcast],  writes: [macro_expectations], est_min_mvp: 1, est_min_full: 1, note: "model-based expectations (not consensus) for releases in the next 14 days, snapshotted before release; immutable rows"}
  - {id: macro_surprise,      dag: nightly, module: app.macro.surprise,            owner: macro-w2,      depends_on: [macro_calendar, macro_expectations], writes: [macro_surprises, macro_surprise_index], est_min_mvp: 1, est_min_full: 1, note: "surprise z vs model-based expectations; EW-decayed surprise index per country / theme, daily history"}
  - {id: macro_recession,     dag: nightly, module: app.macro.recession,           owner: macro-w2,      depends_on: [macro_fred, macro_global, macro_regime_nowcast], writes: [macro_recession], est_min_mvp: 1, est_min_full: 1, note: "NY Fed yield-curve probability (official), our 3m10y probit per country, Sahm real-time, HMM P(contraction), OECD CLI turning points"}
  - {id: macro_factors,       dag: nightly, module: app.macro.markets.factors,     owner: macro-w4,      depends_on: [macro_fred, macro_global, macro_cycle, macro_surprise, macro_regime_nowcast, prices_finalize], writes: [macro_factors], est_min_mvp: 1, est_min_full: 1, note: "macro v2 W4.1: official macro factor set (D/W/M changes of H.15 yields, TIPS, breakevens, Baa spread, Fed broad USD, WTI, IMF commodities; surprise-index changes; cycle / HMM / rate-cycle (macro-w3 cb_rate_cycle) / inflation states)"}
  - {id: regime_performance,  dag: nightly, module: app.macro.markets.regimes, mem_gb: 9, executor: process,     owner: macro-w4,      depends_on: [macro_factors],                  writes: [regime_performance],             est_min_mvp: 1, est_min_full: 1, note: "macro v2 W4.3: monthly sector / subsector / region / factor L-S / ETF returns (excess, relative) by cycle quadrant, HMM regime, rate-cycle phase, inflation regime (~20 s)"}
  - {id: macro_exposures,     dag: weekly,  module: app.macro.markets.exposures,   owner: macro-w4,      depends_on: [],                               writes: [macro_exposures, macro_exposure_fits, macro_episode_replay], est_min_mvp: 5, est_min_full: 10, executor: process, timeout_min: 90, note: "macro v2 W4.2/W4.4: rolling weekly macro betas (joint / univariate / surprise, HAC SEs, EB shrinkage) for universe full + aggregates, PIT month ends; episode replay. Resumable (chunk checkpoints data/tmp/macro_w4_exposures). params history_months (24), securities, sec_limit"}
  # macro v3 W3 (owner macro-w3): central-bank monitor - official sources only; implied paths = approximation from official curves; Taylor / tone = model-based
  - {id: cb_rates,            dag: nightly, module: app.macro.cb.rates,            owner: macro-w3,      depends_on: [macro_fred, macro_global],       writes: [cb_policy_rates, cb_decisions, cb_meetings, cb_rate_cycle], est_min_mvp: 1, est_min_full: 1, note: "W3.1: policy rates/corridors (FRED, ECB, BoE, BoC, RBA, Riksbank, Norges, BCB, BanRep, NIFC LPR; BIS WS_CBPOL cross-check), decisions from rate changes + official meeting dates, BoE MPC votes, rate-cycle phase (consumed by macro-w4) (~15 s warm, ~2 min cold)"}
  - {id: cb_curves_implied,   dag: nightly, module: app.macro.cb.implied,          owner: macro-w3,      depends_on: [cb_rates],                       writes: [cb_implied_paths, cb_curves, cb_implied_meta], est_min_mvp: 1, est_min_full: 2, note: "W3.2: implied policy paths from official curves (UST + NY Fed ACM, BoE OIS, ECB Svensson, MoF JGB, BoC, RBA, SNB, Riksbank, Norges Bank), ~2y daily history (~20 s warm)"}
  - {id: cb_projections,      dag: nightly, module: app.macro.cb.projections,      owner: macro-w3,      depends_on: [cb_rates],                       writes: [cb_projections], est_min_mvp: 1, est_min_full: 1, note: "W3.3: Fed SEP (FRED/ALFRED vintages), ECB staff projections (ECB MPD) (~15 s)"}
  - {id: cb_stance,           dag: nightly, module: app.macro.cb.stance,           owner: macro-w3,      depends_on: [cb_rates, macro_cells],          writes: [cb_stance], est_min_mvp: 1, est_min_full: 1, note: "W3.4: real policy rates, Taylor rules (model-based; CBO / OECD EO gaps), NY Fed LW/HLW r* (~10 s)"}
  - {id: cb_balance_sheets,   dag: nightly, module: app.macro.cb.balance_sheets,   owner: macro-w3,      depends_on: [],                               writes: [cb_balance_sheets], est_min_mvp: 1, est_min_full: 1, note: "W3.5: Fed H.4.1 (FRED), ECB ILM, BoE IADB weekly, BoJ accounts; QT pace (~15 s)"}
  - {id: cb_tone,             dag: nightly, module: app.macro.cb.tone, mem_gb: 4, executor: process,             owner: macro-w3,      depends_on: [cb_rates],                       writes: [cb_tone], est_min_mvp: 2, est_min_full: 2, timeout_min: 90, note: "W3.6: model-based hawkish/dovish tone of official statements (Fed, ECB, BoE, BoJ, BoC) with local CPU RoBERTa (mrince/CBRT-RoBERTa-HawkishDovish-Classifier, MIT) + lexicon; sentence cache -> only new documents are scored; params use_model"}
  - {id: macro_expectations_backfill, dag: manual, module: app.macro.expectations, function: run_backfill_job, owner: macro-w2, depends_on: [], writes: [macro_expectations], est_min_mvp: 15, est_min_full: 15, timeout_min: 600, retries: 0, note: "point-in-time expectations for past releases (ALFRED vintages / realtime knowledge dates); resumable (skips stored keys; state data/state/macro_expectations_backfill.json); params workers, series"}
  - {id: gdelt_events,        dag: nightly, module: app.ingestion.gdelt_events,     owner: ingest-market, depends_on: [gdelt_stream],                    writes: [gdelt_events],                   est_min_mvp: 1, est_min_full: 1, note: "alias (events-v2): no-op when gdelt_stream already wrote the legacy gdelt_events rows for the day; otherwise the old 15-min export ingest runs"}
  # ---------------- events v2 (events-v2 agent; docs/EVENTS_V2_PLAN.md) - one streaming pass over Events + Mentions + GKG (EN + translingual)
  - {id: gdelt_stream,        dag: nightly, module: app.events_v2.pipeline,          owner: events-v2,     depends_on: [ref_universe], soft_depends_on: [ref_universe], executor: process,                    writes: [gdelt_event_labels, gdelt_article_labels, event_daily_agg, news_stories, story_members, event_labels, gdelt_events, news_items], est_min_mvp: 4, est_min_full: 5, timeout_min: 180, params: {max_days: 3}, note: "previous UTC day, 576 files streamed in memory (never on disk), labelled T1/T2/T3 tables + legacy gdelt_events / org mentions / news_items from the same parse (replaces the heavy gdelt_events + gdelt_gkg jobs); params days=[YYYY-MM-DD..], legacy, workers"}
  - {id: gdelt_gkg,           dag: nightly, module: app.ingestion.gdelt_gkg,         owner: ingest-market, depends_on: [gdelt_stream],                    writes: [news_items],                     est_min_mvp: 1, est_min_full: 1, note: "alias (events-v2): no-op when gdelt_stream already wrote the legacy GKG org mentions + news_items for the day; otherwise streams the 96 GKG files as before"}
  - {id: story_cluster,       dag: nightly, module: app.events_v2.story_job, mem_gb: 5, executor: process,         owner: events-v2,     depends_on: [gdelt_stream, news_ingest],       writes: [news_stories, story_members],    est_min_mvp: 5, est_min_full: 20, timeout_min: 45, note: "non-GDELT news (Polygon, RSS, DOC) into the story layer + FinBERT / XLM-R sentiment once per story (cached); params days (3), max_stories, max_minutes, sentiment"}
  - {id: events_agg,          dag: nightly, module: app.events_v2.agg,               owner: events-v2,     depends_on: [gdelt_stream, story_cluster],     writes: [event_daily_agg],                est_min_mvp: 1, est_min_full: 1, note: "T1 attention / tone z-scores (last 7 days; params full=true after backfills) + monthly compaction of T1; refresh-pipeline fixes 2026-10-26: heals months whose day / month files overlap or hold duplicate keys first (app.events_v2.store.heal_overlaps)"}
  - {id: events_retention,    dag: nightly, module: app.events_v2.retention, mem_gb: 4, executor: process,         owner: events-v2,     depends_on: [events_agg],                      writes: [gdelt_event_labels, gdelt_article_labels, news_stories, story_members], est_min_mvp: 1, est_min_full: 5, note: "T2 full detail 180 d then salient-only (top-k per label/day + extremes), story_members dropped, singleton stories pruned; month files sorted + ZSTD 12; params t2_days, k_*"}
  # ---------------- N1 historical news (docs/ROADMAP_V3_PLAN.md N1): official corporate news + CC-NEWS story-layer maintenance
  - {id: news_filings,        dag: nightly, module: app.events_v2.filing_news,       owner: events-v2,     depends_on: [gdelt_stream, sec_filings_index, story_cluster], soft_depends_on: [sec_filings_index, story_cluster], writes: [filing_news, news_stories, story_members], est_min_mvp: 2, est_min_full: 5, timeout_min: 120, note: "N1: SEC 8-K items (last 10 days; recent filers' EDGAR submissions refreshed) + TDnet / HKEX announcements -> filing_news + one story per filing (sources sec_8k / exchange_ann; item-based polarity, no model); merges only GDELT-done days; repairs pending / lost filing + CC-NEWS days. One-time history: params backfill=true (2001 ->, gap-filler campaign filing_news_history); params since, max_requests, sources, repair"}
  - {id: news_recluster,      dag: monthly, module: app.events_v2.hist_merge,        owner: events-v2,     depends_on: [],                                writes: [news_stories, story_members, ccnews_articles], est_min_mvp: 10, est_min_full: 40, timeout_min: 180, note: "N1 monthly: cross-source re-cluster of the last 2 full months (CC-NEWS / GDELT / RSS-Polygon near-duplicate stories merged, ids remapped), CC-NEWS repair, 120-day retention (ccnews members dropped, ccnews_articles months -> salient-only); params months, start, end"}
  # ---------------- event models (event-models agent; docs/EVENTS_MODELS_REALTIME_PLAN.md B/C) - incremental, model-based
  - {id: event_hotspots,      dag: nightly, module: app.events_models.hotspots, mem_gb: 4.5,      owner: event-models,  depends_on: [events_agg],                      writes: [event_hotspots],                 est_min_mvp: 1, est_min_full: 25, executor: process, timeout_min: 40, note: "refresh-pipeline fixes 2026-10-26: time budget params.max_minutes (25; newest changed weeks first, the rest on the next runs), process executor (a timeout kills the pool). B1 Moran / LISA / Gi* / emerging hotspots by country x theme x week; weeks whose T1 fingerprint changed (newest-first backfill) or W source changed; params full, weeks, w_kind, perms; first full 2020-> run ~15 min (8 processes)"}
  - {id: event_changepoints,  dag: nightly, module: app.events_models.bocpd, mem_gb: 6, executor: process,         owner: event-models,  depends_on: [events_agg],                      writes: [event_changepoints],             est_min_mvp: 2, est_min_full: 3, timeout_min: 30, note: "refresh-pipeline fixes 2026-10-26: tolerant of duplicated T1 days (one row per day per stream). C2 BOCPD on attention / tone per label over the trailing 365 d (re-detected each run); params window_days, hazard, min_items, top_issuers"}
  - {id: event_escalation,    dag: nightly, module: app.events_models.hawkes, mem_gb: 6.0, executor: process,        owner: event-models,  depends_on: [events_agg],                      writes: [event_escalation],               est_min_mvp: 2, est_min_full: 3, note: "C1 bivariate discrete Hawkes (country, neighbours) per theme group, EM; 7 / 30-day escalation probabilities by simulation; params min_rate, paths, w_kind"}
  - {id: event_gpr,           dag: nightly, module: app.events_models.gpr, mem_gb: 4.5, executor: process,           owner: event-models,  depends_on: [events_agg],                      writes: [gpr_index],                      est_min_mvp: 1, est_min_full: 1, note: "C3 model-based GPR index per country + validation vs the published Caldara-Iacoviello GPR (cached download, weekly refresh) -> data/logs/reports/gpr_validation_<date>.json"}
  - {id: event_connectedness, dag: nightly, module: app.events_models.connectedness, owner: event-models,  depends_on: [prices_finalize],                 writes: [connectedness],                  est_min_mvp: 1, est_min_full: 1, note: "B3 rolling Diebold-Yilmaz (200 d, step 5) country indices / sector ETFs, ret + range vol; incremental; params start, window, step, horizon, lags, ridge, full"}
  - {id: event_exposure,      dag: nightly, module: app.events_models.exposure, mem_gb: 4.5, executor: process,      owner: event-models,  depends_on: [events_agg],                      writes: [company_event_exposure],         est_min_mvp: 1, est_min_full: 1, note: "C5 company event exposure (linkage geo revenue / customer W, home-country fallback) + expected impact from event_study_library; params universe, days"}
