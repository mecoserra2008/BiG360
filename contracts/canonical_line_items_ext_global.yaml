# Supplementary concept chains for global sources whose namespaces are not in canonical_line_items.yaml.
# Owner: ingest-global. Consumer: app.normalize.fundamentals (ref-identity) — merge each list AFTER the item's own chains
# (lowest precedence). Same semantics as canonical_line_items.yaml: first non-dimensional consolidated concept wins;
# 'A + B' = sum. Item ids must exist in canonical_line_items.yaml (checked by tests/ingestion/global/test_global_mapping.py).
#
# Namespaces
#   yfinance  : fundamentals_raw rows with source_id=yfinance_fund, taxonomy=yfinance (Yahoo statement row labels).
#               Signs follow Yahoo (capex / dividends / buybacks negative => normalizer applies the item 'sign' rule).
#   baostock  : source_id=baostock, taxonomy=other, concept 'baostock:<field>' (CAS, pubDate PIT; few absolute fields).
#   kr_label  : OpenDART rows without a standard account_id are stored as 'dart_label:<account_nm>' (taxonomy dart);
#               the most common Korean labels are listed here. Also K-IFRS account ids missing from the 'kr' chains
#               (found in the DART bulk 2026H1 data of the KR universe; coverage-A). (Standard labels are already re-keyed to account_ids by
#               the adapter, e.g. 매출액 -> ifrs-full_Revenue.)
#   tdnet     : TDnet kessan-tanshin summary facts (source_id tdnet, taxonomy other, concept 'tse-ed-t:<name>',
#               non-dimensional actuals only; forecasts carry dims + is_forecast). Added v2 by coverage-A.
#   tifrs     : Taiwan MOPS 'tifrs-*' extension concepts (source_id mops, taxonomy other), e.g. pre-2017 revenue
#               tifrs-bsci-ci:OperatingRevenue (industrial consolidated). Added v2 by coverage-A.
#   cnmv_ipp  : CNMV (Spain) semiannual IPP XBRL facts (source_id cnmv_es, taxonomy other): 'cnmv_ipp:I<code>' (general
#               scheme 2016/2019), 'cnmv_ipp_en:I<code>' (credit institutions), 'cnmv_ipp08:<prefix>.<Local>' (2008 taxonomy,
#               H2-2008..H2-2015). Consolidated statements only; H2 reports carry FY cumulative values. Added by coverage-B.
#   ifrs_uk   : FRC UK taxonomy concepts (taxonomy uk-core, concept 'uk-core:<Local>') found in UK ESEF/UKSEF packages and in the
#               Companies House Accounts Data Product iXBRL accounts (FRS 101 / 102 / 105; coverage v2 W2, 2026-10-31).
