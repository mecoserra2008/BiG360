    jp: ["jpcrp_cor:TotalNumberOfIssuedSharesSummaryOfBusinessResults - nz(jpcrp_cor:NumberOfSharesHeldInOwnNameTreasurySharesEtc)", jpcrp_cor:NumberOfIssuedSharesAsOfFilingDateIssuedSharesTotalNumberOfSharesEtc]
