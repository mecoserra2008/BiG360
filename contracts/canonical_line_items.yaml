  - id: noninterest_income
    label: Non-interest income (fees, trading, other)
    statement: IS
    period: duration
    sign: signed
    applies_to: [banks]
    us_gaap: [NoninterestIncome]
    ifrs: [FeeAndCommissionIncomeExpense]
    jp: ["jppfs_cor:FeesAndCommissionsOIBNK - nz(jppfs_cor:FeesAndCommissionsPaymentsOEBNK) + nz(jppfs_cor:TrustFeesBNK) + nz(jppfs_cor:TradingIncomeOIBNK) - nz(jppfs_cor:TradingExpensesOEBNK) + nz(jppfs_cor:OtherOrdinaryIncomeOIBNK) - nz(jppfs_cor:OtherOrdinaryExpensesOEBNK)"]
    kr: [ifrs-full_FeeAndCommissionIncomeExpense]
    cn: [手续费及佣金净收入]
    br_cvm: []
    notes: "IFRS fallback captures only net fees — dq penalty 0.2. JP (EDINET J-GAAP bank P&L, COVERAGE_V3 B1): 業務粗利益 minus 資金利益 = net fees and commissions (役務取引等収益 - 費用) + trust fees (信託報酬) + net trading (特定取引収益 - 費用) + net other business income (その他業務収益 - 費用); その他経常収益 (gains on equities, equity-method income, recoveries) is excluded, and fee expenses are netted here because the jp noninterest_expense chain (営業経費) does not hold them. So JP bank revenue (net_interest_income + noninterest_income, jp chain 資金運用収益 - 資金調達費用) = 業務粗利益, not 経常収益 (gross ordinary income). Element names verified 2026-11-07 on 4 bank filers (sum of the 経常収益 components = OrdinaryIncomeBNK within 0.03%)."

