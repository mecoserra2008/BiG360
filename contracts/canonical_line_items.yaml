# Canonical financial line items — the single vocabulary for fundamentals_canonical / fundamentals_wide.
# Consumed by app.normalize.fundamentals (raw facts -> canonical) and by analytics (formulas reference item ids).
version: 2

conventions:
  units: >
    Monetary values in full units of reporting currency (never thousands). Share counts in shares.
    Per-share items in reporting currency per share. 'pure' items are fractions (0.12 = 12%).
  sign: >
    sign: positive        -> magnitude stored as positive; normalizer applies abs() when the source reports it negative
                             (CVM/AKShare/DART often report expenses and cash outflows as negatives).
    sign: signed          -> natural sign kept (income can be negative). Losses negative.
    sign: outflow_positive-> cash outflow stored POSITIVE (capex 100 = spent 100). Proceeds stored positive in their own item.
    sign: negate_source   -> store -1 x source value (used where the tag's semantics are inverse, e.g. IncreaseDecreaseInOperatingCapital).
  period: >
    duration items: normalizer produces discrete Q (Q4 = FY - Q1 - Q2 - Q3 or FY - 9M YTD), H (H2 = FY - H1), FY and TTM.
    instant items: one INSTANT row per balance-sheet date; ttm_rule ignored.
    ttm_rule: sum (default for duration), average (weighted share counts), last (dps declared uses sum), none.
  tag_selection: >
    Per issuer and period, walk the item's tag list for the issuer's taxonomy in order; the first tag with a
    non-dimensional, consolidated value wins (derivation = reported for first tag, fallback_tag otherwise).
    'A + B' entries mean sum of both tags (all must exist). If no tag matches, apply 'derive' (derivation = derived_formula).
    SEC 20-F filers report ifrs-full facts inside companyfacts -> use the 'ifrs' list.
    If two candidate values for the same period differ by >1% across filings, the latest knowledge_date wins and is_restatement=true.
  taxonomies:
    us_gaap: "SEC companyfacts 'us-gaap' namespace (dei for cover facts)"
    ifrs: "ifrs-full namespace — ESEF (filings.xbrl.org), SEC 20-F, EDINET IFRS filers via jpigp, DART K-IFRS"
    jp: "EDINET: jppfs_cor (J-GAAP financial statements), jpigp_cor (Japanese-IFRS filers, 'IFRS' suffix), jpcrp_cor (summary of business results, cover). Verify names against the EDINET taxonomy year in use."
    kr: "OpenDART fnlttSinglAcntAll account_id values: 'ifrs-full_*' (older filings 'ifrs_*') and DART extensions 'dart_*'. Prefer fs_div=CFS (consolidated), fallback OFS."
    cn: "AKShare/Eastmoney/Sina statement field labels (CAS, Chinese). Matched on exact label after removing whitespace/full-width punctuation."
    br_cvm: "CVM DFP/ITR open data CD_CONTA codes for non-financial companies (financials use different plan). ESCALA_MOEDA MIL -> x1000."
  expression_language: >
    'derive' formulas are Python-expression syntax over item ids, evaluated by app.normalize.formula (AST whitelist):
    + - * / unary -, numeric literals, coalesce(a, b, ...), abs(x), max(a,b), min(a,b), nz(x) (= coalesce(x, 0)).
    Missing input -> result null unless wrapped by nz/coalesce. Division by 0 -> null.
  verify_flag: "verify: true marks tag names that were not confirmed against the latest taxonomy; ingestion agents must check them."
  verification: >
    2026-10-10 (ref-identity, contract v2): every us_gaap / us_gaap_negate / ifrs tag in every chain (343 tags, incl. the
    49 'verify: true' items) was checked against a census of ALL SEC companyfacts (companyfacts.zip, ~19k filers,
    us-gaap + ifrs-full + dei). 16 tags used by zero filers were replaced by the census-backed element or dropped
    (see docs/CONTRACT_CHANGES.md). Items carrying 'verified_sec: true' have us_gaap/ifrs chains confirmed; their
    'verify: true' flag now only concerns the jp / kr / cn / br_cvm chains (to be checked by ingest-global).

items:
  # ------------------------------------------------------------------ INCOME STATEMENT
  - id: revenue
    label: Revenue
    statement: IS
    period: duration
    sign: positive
    core: true
    us_gaap: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, RevenueFromContractWithCustomerIncludingAssessedTax, SalesRevenueNet, SalesRevenueGoodsNet, SalesRevenueServicesNet, RegulatedAndUnregulatedOperatingRevenue, OperatingLeasesIncomeStatementLeaseRevenue, RevenueMineralSales]
    ifrs: [Revenue, RevenueFromContractsWithCustomers]
    jp: [jppfs_cor:NetSales, jppfs_cor:OperatingRevenue1, jppfs_cor:OperatingRevenue2, jpigp_cor:RevenueIFRS, jpigp_cor:NetSalesIFRS, jpcrp_cor:NetSalesSummaryOfBusinessResults, jpcrp_cor:RevenueIFRSSummaryOfBusinessResults, jppfs_cor:Revenue, jpigp_cor:Revenue2IFRS, jppfs_cor:OperatingRevenueOILTelecommunications, jppfs_cor:NetSalesOfCompletedConstructionContractsCNS, jppfs_cor:OperatingIncomeINS, jppfs_cor:OperatingRevenueCMD, jppfs_cor:NetOperatingRevenueSEC, jpcrp_cor:OperatingRevenue1SummaryOfBusinessResults, jpcrp_cor:RevenuesUSGAAPSummaryOfBusinessResults]
    kr: [ifrs-full_Revenue, ifrs_Revenue]
    cn: [营业总收入, 营业收入]
    br_cvm: ["3.01"]
    derive: "net_interest_income + noninterest_income"
    notes: "Derive rule is the bank definition; for banks/insurers prefer derive over 'Revenues' tag when both exist (revenue_rule in sector_kpis)."

  - id: cost_of_revenue
    label: Cost of revenue
    statement: IS
    period: duration
    sign: positive
    core: true
    us_gaap: [CostOfRevenue, CostOfGoodsAndServicesSold, CostOfGoodsSold, CostOfServices, CostOfGoodsAndServiceExcludingDepreciationDepletionAndAmortization]
    ifrs: [CostOfSales]
    jp: [jppfs_cor:CostOfSales, jpigp_cor:CostOfSalesIFRS]
    kr: [ifrs-full_CostOfSales, ifrs_CostOfSales]
    cn: [营业成本, 营业总成本]
    br_cvm: ["3.02"]
    derive: "revenue - gross_profit"
    notes: "营业总成本 (total operating costs) is a last-resort CN fallback and overstates COGS — flag dq."

  - id: gross_profit
    label: Gross profit
    statement: IS
    period: duration
    sign: signed
    core: true
    us_gaap: [GrossProfit]
    ifrs: [GrossProfit]
    jp: [jppfs_cor:GrossProfit, jpigp_cor:GrossProfitIFRS]
    kr: [ifrs-full_GrossProfit, ifrs_GrossProfit]
    cn: []
    br_cvm: ["3.03"]
    derive: "revenue - cost_of_revenue"

  - id: selling_marketing
    label: Selling & marketing / distribution
    statement: IS
    period: duration
    sign: positive
    us_gaap: [SellingAndMarketingExpense, SellingExpense, MarketingAndAdvertisingExpense]
    ifrs: [DistributionCosts, SellingExpense]
    jp: []
    kr: [dart_SellingExpenses]
    cn: [销售费用]
    br_cvm: ["3.04.01"]
    verify: true
    verified_sec: true

  - id: general_admin
    label: General & administrative
    statement: IS
    period: duration
    sign: positive
    us_gaap: [GeneralAndAdministrativeExpense]
    ifrs: [AdministrativeExpense]
    jp: []
    kr: [dart_AdministrativeExpenses]
    cn: [管理费用]
    br_cvm: ["3.04.02"]
    verify: true
    verified_sec: true

  - id: sga
    label: SG&A
    statement: IS
    period: duration
    sign: positive
    core: true
    us_gaap: [SellingGeneralAndAdministrativeExpense]
    ifrs: [SellingGeneralAndAdministrativeExpense, "DistributionCosts + AdministrativeExpense"]
    jp: [jppfs_cor:SellingGeneralAndAdministrativeExpenses, jpigp_cor:SellingGeneralAndAdministrativeExpensesIFRS]
    kr: [dart_TotalSellingGeneralAdministrativeExpenses]
    cn: []
    br_cvm: []
    derive: "nz(selling_marketing) + nz(general_admin)"

  - id: rnd
    label: Research & development
    statement: IS
    period: duration
    sign: positive
    us_gaap: [ResearchAndDevelopmentExpense, ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost, ResearchAndDevelopmentExpenseSoftwareExcludingAcquiredInProcessCost]
    ifrs: [ResearchAndDevelopmentExpense]
    jp: [jppfs_cor:ResearchAndDevelopmentExpensesSGA, jpcrp_cor:ResearchAndDevelopmentExpensesResearchAndDevelopmentActivities, jpigp_cor:ResearchAndDevelopmentExpensesIFRS]
    kr: [dart_ResearchAndDevelopmentExpense]
    cn: [研发费用]
    br_cvm: []
    verify: true
    verified_sec: true
    notes: "Absent R&D is treated as 0 only for subsectors where rnd_expected=false (sector_kpis)."

  - id: sbc
    label: Stock-based compensation
    statement: CF
    period: duration
    sign: positive
    us_gaap: [ShareBasedCompensation, AllocatedShareBasedCompensationExpense]
    ifrs: [AdjustmentsForSharebasedPayments, ExpenseFromSharebasedPaymentTransactionsWithEmployees]
    jp: []
    kr: [ifrs-full_AdjustmentsForSharebasedPayments]
    cn: [股份支付]
    br_cvm: []

  - id: depreciation_amortization
    label: Depreciation & amortization
    statement: CF
    period: duration
    sign: positive
    core: true
    us_gaap: [DepreciationDepletionAndAmortization, DepreciationAmortizationAndAccretionNet, DepreciationAndAmortization, "Depreciation + AmortizationOfIntangibleAssets", Depreciation]
    ifrs: [AdjustmentsForDepreciationAndAmortisationExpense, DepreciationAndAmortisationExpense, "AdjustmentsForDepreciationExpense + AdjustmentsForAmortisationExpense"]
    jp: [jppfs_cor:DepreciationAndAmortizationOpeCF, jppfs_cor:DepreciationOpeCF, jpigp_cor:DepreciationAndAmortizationOpeCFIFRS]
    kr: [ifrs-full_AdjustmentsForDepreciationAndAmortisationExpense, "ifrs-full_AdjustmentsForDepreciationExpense + ifrs-full_AdjustmentsForAmortisationExpense"]
    cn: ["固定资产折旧、油气资产折耗、生产性生物资产折旧 + 无形资产摊销"]
    br_cvm: []
    verify: true
    verified_sec: true
    notes: "BR: DFC 6.01.01.xx 'Depreciação e Amortização' — match DS_CONTA text (no fixed code)."

  - id: amortization_intangibles
    label: Amortization of acquired intangibles
    statement: IS
    period: duration
    sign: positive
    us_gaap: [AmortizationOfIntangibleAssets]
    ifrs: [AdjustmentsForAmortisationExpense]
    jp: []
    kr: []
    cn: [无形资产摊销]
    br_cvm: []

  - id: impairment
    label: Goodwill & asset impairment
    statement: IS
    period: duration
    sign: positive
    us_gaap: ["GoodwillImpairmentLoss + ImpairmentOfLongLivedAssetsHeldForUse", AssetImpairmentCharges, GoodwillImpairmentLoss]
    ifrs: [ImpairmentLossRecognisedInProfitOrLoss, ImpairmentLossRecognisedInProfitOrLossGoodwill]
    jp: [jppfs_cor:ImpairmentLossEL]
    kr: []
    cn: [资产减值损失]
    br_cvm: []
    verify: true
    verified_sec: true

  - id: total_operating_expenses
    label: Total operating expenses (incl. COGS when reported as costs and expenses)
    statement: IS
    period: duration
    sign: positive
    us_gaap: [CostsAndExpenses, OperatingExpenses]
    ifrs: []
    jp: []
    kr: []
    cn: [营业总成本]
    br_cvm: []
    derive: "revenue - operating_income"
    notes: "OperatingExpenses in us-gaap usually EXCLUDES cost of revenue; CostsAndExpenses includes it. Item defined as all costs between revenue and operating income."

  - id: operating_income
    label: Operating income (reported EBIT)
    statement: IS
    period: duration
    sign: signed
    core: true
    us_gaap: [OperatingIncomeLoss]
    ifrs: [ProfitLossFromOperatingActivities]
    jp: [jppfs_cor:OperatingIncome, jpigp_cor:OperatingProfitLossIFRS, jpcrp_cor:OperatingIncomeLossUSGAAPSummaryOfBusinessResults]
    kr: [dart_OperatingIncomeLoss]
    cn: [营业利润]
    br_cvm: ["3.05"]
    derive: "gross_profit - sga - nz(rnd)"
    notes: "CN 营业利润 includes investment income/fair-value gains; dq penalty 0.1. Many IFRS filers omit an operating subtotal -> fallback ebit derivation."

  - id: interest_expense
    label: Interest expense / finance costs
    statement: IS
    period: duration
    sign: positive
    core: true
    us_gaap: [InterestExpense, InterestExpenseNonoperating, InterestExpenseDebt, InterestAndDebtExpense]
    ifrs: [FinanceCosts, InterestExpense]
    jp: [jppfs_cor:InterestExpensesNOE, jpigp_cor:FinanceCostsIFRS]
    kr: [ifrs-full_FinanceCosts]
    cn: [利息费用, 财务费用]
    br_cvm: ["3.06.02"]
    notes: "Banks: use interest_expense_bank. CN 财务费用 is net finance cost (fallback only). BR 3.06.02 = Despesas Financeiras (gross)."

  - id: interest_income
    label: Interest / finance income (non-bank)
    statement: IS
    period: duration
    sign: positive
    us_gaap: [InvestmentIncomeInterest, InvestmentIncomeInterestAndDividend, InterestIncomeOther]
    ifrs: [FinanceIncome, InterestRevenueCalculatedUsingEffectiveInterestMethod]
    jp: [jppfs_cor:InterestIncomeNOI, jpigp_cor:FinanceIncomeIFRS]
    kr: [ifrs-full_FinanceIncome]
    cn: [利息收入]
    br_cvm: ["3.06.01"]

  - id: equity_method_income
    label: Share of profit of associates
    statement: IS
    period: duration
    sign: signed
    us_gaap: [IncomeLossFromEquityMethodInvestments]
    ifrs: [ShareOfProfitLossOfAssociatesAndJointVenturesAccountedForUsingEquityMethod]
    jp: [jppfs_cor:EquityInEarningsOfAffiliatesNOI]
    kr: [ifrs-full_ShareOfProfitLossOfAssociatesAndJointVenturesAccountedForUsingEquityMethod]
    cn: [对联营企业和合营企业的投资收益]
    br_cvm: ["3.04.06"]
    verify: true
    verified_sec: true

  - id: other_nonoperating_income
    label: Other non-operating income (expense)
    statement: IS
    period: duration
    sign: signed
    us_gaap: [NonoperatingIncomeExpense, OtherNonoperatingIncomeExpense]
    ifrs: [OtherGainsLosses]
    jp: []
    kr: [dart_OtherGains, dart_OtherLosses]
    cn: [营业外收入]
    br_cvm: []
    verify: true
    verified_sec: true

  - id: ordinary_income
    label: Ordinary income (J-GAAP keijo rieki)
    statement: IS
    period: duration
    sign: signed
    applies_to: [jgaap]
    us_gaap: []
    ifrs: []
    jp: [jppfs_cor:OrdinaryIncome, jpcrp_cor:OrdinaryIncomeLossSummaryOfBusinessResults]
    kr: []
    cn: []
    br_cvm: []

  - id: pretax_income
    label: Income before tax
    statement: IS
    period: duration
    sign: signed
    core: true
    us_gaap: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]
    ifrs: [ProfitLossBeforeTax]
    jp: [jppfs_cor:IncomeBeforeIncomeTaxes, jppfs_cor:IncomeBeforeIncomeTaxesAndMinorityInterests, jpigp_cor:ProfitLossBeforeTaxIFRS, jpcrp_cor:ProfitLossBeforeTaxIFRSSummaryOfBusinessResults, jpcrp_cor:ProfitLossBeforeTaxUSGAAPSummaryOfBusinessResults]
    kr: [ifrs-full_ProfitLossBeforeTax]
    cn: [利润总额]
    br_cvm: ["3.07"]
    derive: "net_income + income_tax"

  - id: income_tax
    label: Income tax expense
    statement: IS
    period: duration
    sign: signed
    core: true
    us_gaap: [IncomeTaxExpenseBenefit]
    ifrs: [IncomeTaxExpenseContinuingOperations]
    jp: [jppfs_cor:IncomeTaxes, jpigp_cor:IncomeTaxExpenseIFRS]
    kr: [ifrs-full_IncomeTaxExpenseContinuingOperations]
    cn: [所得税费用]
    br_cvm: ["3.08"]
    notes: "Positive = expense. BR reports as negative expense -> negate (sign rule positive does abs only when value<0 and pretax>0; normalizer uses negate for BR)."

  - id: net_income_continuing
    label: Net income from continuing operations
    statement: IS
    period: duration
    sign: signed
    us_gaap: [IncomeLossFromContinuingOperations]
    ifrs: [ProfitLossFromContinuingOperations]
    jp: []
    kr: [ifrs-full_ProfitLossFromContinuingOperations]
    cn: [持续经营净利润]
    br_cvm: ["3.09"]
    derive: "pretax_income - income_tax"

  - id: net_income_discontinued
    label: Net income from discontinued operations
    statement: IS
    period: duration
    sign: signed
    us_gaap: [IncomeLossFromDiscontinuedOperationsNetOfTax]
    ifrs: [ProfitLossFromDiscontinuedOperations]
    jp: []
    kr: [ifrs-full_ProfitLossFromDiscontinuedOperations]
    cn: [终止经营净利润]
    br_cvm: ["3.10"]

  - id: net_income
    label: Net income (consolidated, incl. minority)
    statement: IS
    period: duration
    sign: signed
    core: true
    us_gaap: [ProfitLoss, "NetIncomeLoss + NetIncomeLossAttributableToNoncontrollingInterest"]
    ifrs: [ProfitLoss]
    jp: [jppfs_cor:ProfitLoss, jpigp_cor:ProfitLossIFRS, jpcrp_cor:ProfitLossIFRSSummaryOfBusinessResults]
    kr: [ifrs-full_ProfitLoss]
    cn: [净利润]
    br_cvm: ["3.11"]
    derive: "net_income_parent + nz(minority_interest_income)"

  - id: minority_interest_income
    label: Net income attributable to non-controlling interests
    statement: IS
    period: duration
    sign: signed
    us_gaap: [NetIncomeLossAttributableToNoncontrollingInterest]
    ifrs: [ProfitLossAttributableToNoncontrollingInterests]
    jp: [jppfs_cor:ProfitLossAttributableToNonControllingInterests]
    kr: [ifrs-full_ProfitLossAttributableToNoncontrollingInterests]
    cn: [少数股东损益]
    br_cvm: ["3.11.02"]

  - id: net_income_parent
    label: Net income attributable to parent
    statement: IS
    period: duration
    sign: signed
    core: true
    us_gaap: [NetIncomeLoss]
    ifrs: [ProfitLossAttributableToOwnersOfParent]
    jp: [jppfs_cor:ProfitLossAttributableToOwnersOfParent, jpigp_cor:ProfitLossAttributableToOwnersOfParentIFRS, jpcrp_cor:NetIncomeLossSummaryOfBusinessResults, jpcrp_cor:ProfitLossAttributableToOwnersOfParentSummaryOfBusinessResults, jpcrp_cor:ProfitLossAttributableToOwnersOfParentIFRSSummaryOfBusinessResults, jpcrp_cor:NetIncomeLossAttributableToOwnersOfParentUSGAAPSummaryOfBusinessResults]
    kr: [ifrs-full_ProfitLossAttributableToOwnersOfParent]
    cn: [归属于母公司所有者的净利润, 归属于母公司股东的净利润]
    br_cvm: ["3.11.01"]
    derive: "net_income - nz(minority_interest_income)"

  - id: preferred_dividends
    label: Preferred dividends
    statement: IS
    period: duration
    sign: positive
    us_gaap: [PreferredStockDividendsIncomeStatementImpact, DividendsPreferredStock]
    ifrs: []
    jp: []
    kr: []
    cn: []
    br_cvm: []

  - id: net_income_common
    label: Net income to common shareholders
    statement: IS
    period: duration
    sign: signed
    core: true
    us_gaap: [NetIncomeLossAvailableToCommonStockholdersBasic]
    ifrs: []
    jp: []
    kr: []
    cn: []
    br_cvm: []
    derive: "net_income_parent - nz(preferred_dividends)"

  - id: eps_basic
    label: EPS basic
    statement: IS
    period: duration
    unit: per_share
    sign: signed
    ttm_rule: sum
    us_gaap: [EarningsPerShareBasic, EarningsPerShareBasicAndDiluted]
    ifrs: [BasicEarningsLossPerShare]
    jp: [jppfs_cor:BasicEarningsLossPerShare, jpcrp_cor:BasicEarningsLossPerShareSummaryOfBusinessResults, jpigp_cor:BasicEarningsLossPerShareIFRS, jpcrp_cor:BasicEarningsLossPerShareIFRSSummaryOfBusinessResults, jpcrp_cor:BasicEarningsLossPerShareUSGAAPSummaryOfBusinessResults]
    kr: [ifrs-full_BasicEarningsLossPerShare]
    cn: [基本每股收益]
    br_cvm: ["3.99.01.01"]
    derive: "net_income_common / shares_basic_weighted"

  - id: eps_diluted
    label: EPS diluted
    statement: IS
    period: duration
    unit: per_share
    sign: signed
    core: true
    ttm_rule: sum
    us_gaap: [EarningsPerShareDiluted, EarningsPerShareBasicAndDiluted]
    ifrs: [DilutedEarningsLossPerShare]
    jp: [jppfs_cor:DilutedEarningsPerShare, jpcrp_cor:DilutedEarningsPerShareSummaryOfBusinessResults, jpigp_cor:DilutedEarningsLossPerShareIFRS, jpcrp_cor:DilutedEarningsLossPerShareIFRSSummaryOfBusinessResults, jpcrp_cor:DilutedEarningsLossPerShareUSGAAPSummaryOfBusinessResults]
    kr: [ifrs-full_DilutedEarningsLossPerShare]
    cn: [稀释每股收益]
    br_cvm: ["3.99.02.01"]
    derive: "coalesce(net_income_common / shares_diluted_weighted, eps_basic)"
    verify: true
    verified_sec: true

  - id: shares_basic_weighted
    label: Weighted avg shares basic
    statement: IS
    period: duration
    unit: shares
    sign: positive
    ttm_rule: average
    us_gaap: [WeightedAverageNumberOfSharesOutstandingBasic]
    ifrs: [WeightedAverageShares]
    jp: [jpcrp_cor:AverageNumberOfSharesDuringPeriod]
    kr: []
    cn: []
    br_cvm: []
    verify: true
    verified_sec: true

  - id: shares_diluted_weighted
    label: Weighted avg shares diluted
    statement: IS
    period: duration
    unit: shares
    sign: positive
    core: true
    ttm_rule: average
    us_gaap: [WeightedAverageNumberOfDilutedSharesOutstanding]
    ifrs: [AdjustedWeightedAverageShares]
    jp: []
    kr: []
    cn: []
    br_cvm: []
    derive: "shares_basic_weighted"

  - id: ebit
    label: EBIT (analytic)
    statement: IS
    period: duration
    sign: signed
    core: true
    us_gaap: []
    ifrs: []
    derive: "coalesce(operating_income, pretax_income + nz(interest_expense) - nz(interest_income))"
    notes: "Always derived — the single EBIT used by ratios. For banks/insurers EBIT is not used."

  - id: ebitda
    label: EBITDA (analytic)
    statement: IS
    period: duration
    sign: signed
    core: true
    derive: "ebit + depreciation_amortization"

  # ------------------------------------------------------------------ BALANCE SHEET
  - id: cash_and_equivalents
    label: Cash & equivalents
    statement: BS
    period: instant
    sign: positive
    core: true
    us_gaap: [CashAndCashEquivalentsAtCarryingValue, CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents, Cash, CashAndDueFromBanks]
    ifrs: [CashAndCashEquivalents]
    jp: [jppfs_cor:CashAndDeposits, jpigp_cor:CashAndCashEquivalentsIFRS, jppfs_cor:CashAndCashEquivalents, jpcrp_cor:CashAndCashEquivalentsIFRSSummaryOfBusinessResults, jpcrp_cor:CashAndCashEquivalentsUSGAAPSummaryOfBusinessResults]
    kr: [ifrs-full_CashAndCashEquivalents]
    cn: [货币资金]
    br_cvm: ["1.01.01"]

  - id: short_term_investments
    label: Short-term investments
    statement: BS
    period: instant
    sign: positive
    us_gaap: [ShortTermInvestments, MarketableSecuritiesCurrent, AvailableForSaleSecuritiesDebtSecuritiesCurrent]
    ifrs: [CurrentFinancialAssetsAtFairValueThroughProfitOrLoss, OtherCurrentFinancialAssets, ShorttermDepositsNotClassifiedAsCashEquivalents]
    jp: [jppfs_cor:ShortTermInvestmentSecurities, jppfs_cor:SecuritiesCA]
    kr: [ifrs-full_ShorttermDepositsNotClassifiedAsCashEquivalents, ifrs-full_CurrentFinancialAssetsAtFairValueThroughProfitOrLoss]
    cn: [交易性金融资产]
    br_cvm: ["1.01.02"]
    verify: true
    verified_sec: true

  - id: cash_and_st_investments
    label: Cash + short-term investments
    statement: BS
    period: instant
    sign: positive
    core: true
    derive: "cash_and_equivalents + nz(short_term_investments)"

  - id: accounts_receivable
    label: Trade receivables
    statement: BS
    period: instant
    sign: positive
    core: true
