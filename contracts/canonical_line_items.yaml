    derive: "total_equity_parent - nz(preferred_equity) - nz(goodwill) - nz(intangible_assets)"

  - id: invested_capital
    label: Invested capital (operating approach)
    statement: BS
    period: instant
    sign: signed
    core: true
    derive: "total_debt + nz(operating_lease_liabilities) + total_equity - cash_and_st_investments"

