        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/theses/{thesis_id}/journal/{entry_id}:
    patch:
      tags: [theses]
      operationId: updateThesisJournalEntry
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}, {name: entry_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisJournalUpdate"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisJournalEntry"}}}}
