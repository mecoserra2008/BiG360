        exp_ci_low: {type: [number, "null"]}
        exp_ci_high: {type: [number, "null"]}
        marginal_effect: {type: [number, "null"], description: "GLM average marginal effect"}
        std_estimate: {type: [number, "null"], description: "v1.7 regularized: coefficient on standardized features"}
        selected: {type: [boolean, "null"], description: "v1.7 regularized: non-zero coefficient"}
    StudioTest:
      type: object
      required: [name, group]
      properties:
        name: {type: string}
        group: {type: string, description: "diagnostics | lag_blocks | stationarity | specification | instruments | granger | cointegration | inference | lambda_series | distribution"}
        statistic: {type: [number, "null"]}
        p_value: {type: [number, "null"]}
        df: {type: [number, array, "null"], items: {type: [number, "null"]}, description: "number, or [df1, df2] for F tests"}
        passed: {type: [boolean, "null"], description: "v1.6: true = the model passes this check (diagnostics: H0 not rejected at 5%; Durbin-Watson within 1.5-2.5; first-stage F >= 10; dispersion 0.67-1.5). null = informational test with no pass/fail reading (Granger, Hausman, cointegration, inference)"}
        null_hypothesis: {type: [string, "null"]}
        conclusion: {type: [string, "null"]}
        note: {type: [string, "null"]}
    StudioTable:
      type: object
      required: [id, title, columns, rows]
      properties:
        id: {type: string}
        title: {type: string}
        columns: {type: array, items: {type: string}}
        rows: {type: array, items: {type: array}}
        note: {type: [string, "null"]}
    StudioWarning:
      type: object
      required: [code, severity, message]
      properties:
        code: {type: string}
        severity: {type: string, enum: [info, warning, error]}
        message: {type: string}
    StudioSeries:
      type: object
      required: [name, x, y]
      properties:
        name: {type: string}
        x: {type: array, description: "numbers, ISO dates or category labels"}
        y: {type: array, items: {type: [number, "null"]}}
        ci_low: {type: array, items: {type: [number, "null"]}}
        ci_high: {type: array, items: {type: [number, "null"]}}
        labels: {type: [array, "null"], description: "point labels (scatter)"}
    StudioPlot:
      type: object
      required: [kind, title]
      additionalProperties: true
      description: >
        Plot data (arrays, no images). line/scatter/bar/errorbar use `series` (+ confidence_band [lo, hi] for ACF bars);
        scatter_points uses `points` [{label, cluster, x, y, sector_id}]; heatmap uses x (columns), y (rows), z (rows x
        columns); dendrogram uses scipy dendrogram output (icoord, dcoord, leaf_labels, leaves, color_list, cut_height);
        arrows uses `arrows` [{feature, x, y}] (PCA loadings biplot).
        v1.6 kinds: ts_band = shared date axis `x`, center lines in `series` [{name, x, y}], shaded `bands`
        [{name, lower, upper}] (same length as x), reference `hlines` [{y, label}] and `vlines` [{x, label}];
        event_path = relative periods in `x` (integers), point estimates `y`, confidence interval `lower` / `upper`,
        `reference` (normalized period, e.g. -1, or null) and `event_x` (0 = event / treatment start);
        irf = `horizons` [0..H], `variables`, `orthogonalized`, `cells` [{impulse, response, mean, lower, upper}]
        (one cell per impulse x response, a k x k grid of small multiples);
        fevd = `horizons` [1..H], `variables`, `shares` [{response, impulse, share[]}] (for each response the shares
        over impulses sum to 1 at every horizon: one stacked-area chart per response);
        regime_prob = dates in `x`, `regimes` [{regime, label, prob[]}] (smoothed probabilities summing to 1) and an
        optional `overlay` {name, y} (the modelled series, for a secondary axis).
        v1.7 kinds: coef_path = `x` log10(alpha) grid (decreasing penalty), `paths` [{term, y[]}] standardized coefficients,
        vertical markers `selected_x` (chosen), `min_x` (min CV MSE), `one_se_x` (1-SE rule);
        shap_beeswarm = `features` [{feature, mean_abs, shap[], value[]}] sorted by mean |SHAP| (top 30); shap and
        value are aligned point arrays (<= 500 points), value = feature value scaled 0..1 (2nd-98th percentile) for colour.
      properties:
        kind: {type: string, enum: [line, scatter, bar, errorbar, heatmap, dendrogram, scatter_points, arrows, ts_band, event_path, irf, fevd, regime_prob, coef_path, shap_beeswarm]}
        title: {type: string}
        x_label: {type: [string, "null"]}
        y_label: {type: [string, "null"]}
        series: {type: array, items: {$ref: "#/components/schemas/StudioSeries"}}
        confidence_band: {type: array, items: {type: number}}
        points: {type: array, items: {type: object, additionalProperties: true}}
        x: {type: array}
        y: {type: array}
        z: {type: array, items: {type: array, items: {type: [number, "null"]}}}
        icoord: {type: array, items: {type: array, items: {type: number}}}
        dcoord: {type: array, items: {type: array, items: {type: number}}}
        leaf_labels: {type: array, items: {type: string}}
        leaves: {type: array, items: {type: integer}}
        color_list: {type: array, items: {type: string}}
        truncated: {type: boolean}
        cut_height: {type: [number, "null"]}
        arrows: {type: array, items: {type: object, required: [feature, x, y], properties: {feature: {type: string}, x: {type: number}, y: {type: number}}}}
        bands: {type: array, items: {type: object, required: [name, lower, upper], properties: {name: {type: string}, lower: {type: array, items: {type: [number, "null"]}}, upper: {type: array, items: {type: [number, "null"]}}}}}
        hlines: {type: array, items: {type: object, properties: {y: {type: [number, "null"]}, label: {type: string}}}}
        vlines: {type: array, items: {type: object, properties: {x: {}, label: {type: string}}}}
        lower: {type: array, items: {type: [number, "null"]}}
        upper: {type: array, items: {type: [number, "null"]}}
        reference: {type: [integer, "null"]}
        event_x: {type: [integer, "null"]}
        horizons: {type: array, items: {type: integer}}
        variables: {type: array, items: {type: string}}
        orthogonalized: {type: boolean}
        cells: {type: array, items: {type: object, required: [impulse, response, mean, lower, upper], properties: {impulse: {type: string}, response: {type: string}, mean: {type: array, items: {type: [number, "null"]}}, lower: {type: array, items: {type: [number, "null"]}}, upper: {type: array, items: {type: [number, "null"]}}}}}
        shares: {type: array, items: {type: object, required: [response, impulse, share], properties: {response: {type: string}, impulse: {type: string}, share: {type: array, items: {type: [number, "null"]}}}}}
        regimes: {type: array, items: {type: object, required: [regime, label, prob], properties: {regime: {type: integer}, label: {type: string}, prob: {type: array, items: {type: [number, "null"]}}}}}
        overlay: {type: [object, "null"], properties: {name: {type: string}, y: {type: array, items: {type: [number, "null"]}}}}
        paths: {type: array, items: {type: object, required: [term, y], properties: {term: {type: string}, y: {type: array, items: {type: [number, "null"]}}}}}
        selected_x: {type: [number, "null"]}
        min_x: {type: [number, "null"]}
        one_se_x: {type: [number, "null"]}
        features: {type: array, items: {type: object, required: [feature, mean_abs, shap, value], properties: {feature: {type: string}, mean_abs: {type: [number, "null"]}, shap: {type: array, items: {type: [number, "null"]}}, value: {type: array, items: {type: [number, "null"]}}}}}
    StudioForecast:
      type: object
      required: [dates, mean, lower, upper, alpha, steps]
      properties:
        dates: {type: array, items: {type: string, format: date}}
        mean: {type: array, items: {type: [number, "null"]}}
        lower: {type: array, items: {type: [number, "null"]}, description: "1 - alpha interval"}
        upper: {type: array, items: {type: [number, "null"]}}
        lower_80: {type: array, items: {type: [number, "null"]}}
        upper_80: {type: array, items: {type: [number, "null"]}}
        alpha: {type: number}
        steps: {type: integer}
        exog_future: {type: [string, "null"], enum: [last, dataset, values, null]}
        variable: {type: [string, "null"], description: "v1.6: forecasted variable (VAR / VECM: the first; GARCH: sigma)"}
        by_variable: {type: array, description: "v1.6 VAR: [{variable, mean, lower, upper}] for every variable", items: {type: object, additionalProperties: true}}
        var_1: {type: [number, "null"], description: "v1.6 GARCH: next-period VaR (positive = loss) at the smallest VaR level"}
        interval: {type: [string, "null"], description: "v1.7: how lower/upper were obtained when not a model forecast interval (GARCH: simulated band of sigma)"}
        history: {type: object, properties: {dates: {type: array, items: {type: string, format: date}}, values: {type: array, items: {type: [number, "null"]}}}}
    StudioClusters:
      type: object
      required: [n_clusters, sizes, profiles, members, features]
      properties:
        n_clusters: {type: integer}
        noise_count: {type: [integer, "null"], description: "v1.7 density clustering: members with cluster -1"}
        soft: {type: [boolean, "null"], description: "v1.7 GMM: members carry a membership probability"}
        mean_max_probability: {type: [number, "null"]}
        sizes: {type: array, items: {type: integer}}
        features: {type: array, items: {type: string}}
        overall_mean: {type: object, additionalProperties: {type: [number, "null"]}}
        profiles:
          type: array
          items:
            type: object
            required: [cluster, size, mean, median, z_mean]
            properties:
              cluster: {type: integer}
              size: {type: integer}
              mean: {type: object, additionalProperties: {type: [number, "null"]}}
              median: {type: object, additionalProperties: {type: [number, "null"]}}
              z_mean: {type: object, additionalProperties: {type: [number, "null"]}}
              top_sectors: {type: array, items: {type: object, properties: {sector_id: {type: string}, count: {type: integer}}}}
        members:
          type: array
          items:
            type: object
            required: [cluster, label]
            properties:
              cluster: {type: integer}
              label: {type: string}
              entity_id: {type: [string, "null"]}
              sector_id: {type: [string, "null"]}
              distance_to_center: {type: [number, "null"]}
              probability: {type: [number, "null"], description: "v1.7 GMM: probability of the assigned cluster (cluster -1 = noise in density clustering)"}
    StudioEvaluation:
      type: object
      description: "Rolling-origin out-of-sample evaluation (expanding window). `error` instead of metrics when the sample is too short."
      properties:
        scheme: {type: string}
        initial_train: {type: integer}
        horizon: {type: integer}
        n_folds: {type: integer}
        metrics:
          type: object
          description: >
            Keyed by model: model | naive | random_walk_drift | historical_mean | seasonal_naive (time-series methods),
            model | ols (regularized), model (tree_ensemble), or one key per candidate name (leaderboard). Each value is a
            flat map of numbers; keys used: mae, rmse, mape, n (forecast methods); rmse, mae, r2_oos, corr, n, rank_ic,
            rank_ic_t, ic_dates (ML regression); auc, logloss, brier, accuracy, n (ML classification). v1.7.1 widened.
          additionalProperties: {type: object, additionalProperties: {type: [number, "null"]}}
        relative_rmse_vs_naive: {type: [number, "null"]}
        oos_r2_vs_mean: {type: [number, "null"]}
        columns: {type: array, items: {type: string}}
        points: {type: array, items: {type: array}}
        note: {type: [string, "null"]}
        error: {type: [string, "null"]}
        purge: {type: [integer, "null"], description: "v1.7: periods purged between train and test"}
        model: {type: [string, "null"]}
    StudioResult:
      type: object
      required: [method, family, title, summary, coefficients, fit_stats, tests, tables, plots, warnings, metrics]
      properties:
        method: {type: string}
        family: {type: string}
        title: {type: string}
        summary: {type: object, additionalProperties: true}
        coefficients: {type: array, items: {$ref: "#/components/schemas/StudioCoefficient"}}
        fit_stats: {type: object, additionalProperties: true}
        tests: {type: array, items: {$ref: "#/components/schemas/StudioTest"}}
        tables: {type: array, items: {$ref: "#/components/schemas/StudioTable"}}
        forecast: {oneOf: [{$ref: "#/components/schemas/StudioForecast"}, {type: "null"}]}
        clusters: {oneOf: [{$ref: "#/components/schemas/StudioClusters"}, {type: "null"}]}
        evaluation: {oneOf: [{$ref: "#/components/schemas/StudioEvaluation"}, {type: "null"}]}
        plots: {type: object, additionalProperties: {$ref: "#/components/schemas/StudioPlot"}, description: "keys: fit, residuals_vs_fitted, residuals_time, qq, residual_hist, residual_acf, coef_ci, lag_profile_<x>, process_<x>, roc, calibration, acf_<col>, elbow, silhouette, profile_heatmap, pca_scatter, dendrogram, correlation_heatmap, scree, loadings_heatmap, biplot, scores_time, series_<col>"}
        warnings: {type: array, items: {$ref: "#/components/schemas/StudioWarning"}}
        metrics: {type: object, additionalProperties: true}
    StudioDatasetInfo:
      type: object
      required: [key, snapshot_id, kind, frequency, start, end, n_rows, coverage, warnings]
      properties:
        key: {type: string}
        snapshot_id: {type: string}
        cached: {type: boolean}
        kind: {type: string}
        frequency: {type: string}
        macro_alignment: {type: [string, "null"]}
        start: {type: string, format: date}
        end: {type: string, format: date}
        n_rows: {type: integer}
        n_entities: {type: integer}
        n_periods: {type: integer}
        coverage: {type: array, items: {$ref: "#/components/schemas/StudioCoverage"}}
        warnings: {type: array, items: {type: string}}
        build_seconds: {type: [number, "null"]}
    StudioRunEnvelope:
      type: object
      required: [run_id, status, method, study, reproducibility]
      properties:
        run_id: {type: string}
        study_id: {type: [string, "null"]}
        status: {type: string, enum: [completed, failed, cancelled]}
        method: {type: string}
        name: {type: [string, "null"]}
        error: {type: [string, "null"]}
        error_code: {type: [string, "null"]}
        study: {$ref: "#/components/schemas/StudioStudySpec"}
        dataset: {oneOf: [{$ref: "#/components/schemas/StudioDatasetInfo"}, {type: "null"}]}
        result: {oneOf: [{$ref: "#/components/schemas/StudioResult"}, {type: "null"}]}
        reproducibility:
          type: object
          required: [spec_hash, seed, versions]
          properties:
            spec_hash: {type: string}
            dataset_key: {type: [string, "null"]}
            snapshot_id: {type: [string, "null"]}
            seed: {type: integer}
            versions: {type: object, additionalProperties: {type: string}}
            started_at: {type: [string, "null"], format: date-time}
            finished_at: {type: [string, "null"], format: date-time}
            duration_s: {type: [number, "null"]}
            timings: {type: object, additionalProperties: {type: number}}
    StudioRunEstimate:
      type: object
      description: "v1.48.0 (docs/STUDIO_V2_PLAN.md S1.2): learned end-to-end estimate = queue_s + overhead_s + build_s + fit_s + post_s. Studio: per-method ridge regression of log(fit time) on log(prior cost), log(rows), n_x and extras, fitted from run history (static formula = prior); backtests: prior scaled by the history"
      required: [total_s, run_s, queue_s, overhead_s, build_s, fit_s, path, model, extras]
      properties:
        total_s: {type: number}
        run_s: {type: number, description: "execution only (build + fit + post)"}
        queue_s: {type: number, description: "wait for the lane's slots (runs ahead)"}
        overhead_s: {type: number, description: "path overhead from history (sync ~0, lane ~0.3 s, worker spawn + imports + queue ~5 s)"}
        build_s: {type: number, description: "dataset / panel build (cached: ~0.05 s)"}
        fit_s: {type: number, description: "fit / simulations including the enabled extras"}
        post_s: {type: number}
        prior_s: {type: [number, "null"], description: "static prior (build + fit + enabled extras)"}
        rows: {type: [integer, "null"], description: "estimated rows (studio) / entities (backtest), real universe sizes from the snapshot"}
        cached: {type: [boolean, "null"]}
        path: {type: string, enum: [sync, lane, worker]}
        model: {type: string, enum: [learned, global, prior], description: "learned = the method has history; global = pooled history only; prior = static formula"}
        n_history: {type: integer}
        sync_budget_s: {type: number}
        will_run: {type: string, enum: [sync, async]}
        extras:
          type: array
          description: "heavy optional outputs (SHAP, placebo, bootstrap, permutations, sweep) with their cost; opt-in since S1.4"
          items:
            type: object
            required: [name, enabled, cost_s]
            properties:
              name: {type: string}
              label: {type: string}
              enabled: {type: boolean}
              cost_s: {type: number}
    StudioRunPreviewInfo:
      type: object
      description: "v1.48.0 (S1.3): the fast preview of a run (10-20 % sample of entities / dates for Studio; no permutation test / sweep / stale check for backtests)"
      required: [status]
      properties:
        status: {type: string, enum: [completed, failed]}
        fraction: {type: [number, "null"]}
        by: {type: [string, "null"], enum: [entities, dates, robustness, null]}
        n_rows: {type: [integer, "null"]}
        n_rows_full: {type: [integer, "null"]}
        duration_s: {type: [number, "null"]}
        at: {type: [string, "null"]}
        error: {type: [string, "null"]}
        skipped: {type: array, items: {type: string}}
    StudioRunQueue:
      type: object
      properties:
        position: {type: [integer, "null"], description: "1 = next"}
        ahead: {type: integer}
        blocked_by: {type: [string, "null"], description: "what the run waits behind (running lane runs, RAM admission, the exclusive heavy slot / busy worker on the fallback path)"}
        queue_s: {type: [number, "null"]}
    StudioRunPreview:
      type: object
      description: "v1.48.0: preview.json of a run (result of the sample fit / reduced backtest)"
      required: [run_id, status, preview, result]
      properties:
        run_id: {type: string}
        status: {type: string}
        method: {type: string}
        preview: {$ref: "#/components/schemas/StudioRunPreviewInfo"}
        result: {type: object, additionalProperties: true, description: "StudioResult (studio) / BacktestResult (backtest) shape"}
    StudioEstimateRequest:
      type: object
      required: [study]
      properties:
        study: {$ref: "#/components/schemas/StudioStudySpec"}
        mode: {type: string, enum: [auto, sync, async], default: auto}
    StudioLaneStatus:
      type: object
      description: "v1.48.0 (S1.1): warm interactive lane for Studio / backtest runs (supervisor child `studio`; kill switch BIG360_STUDIO_LANE=0 -> worker jobs)"
      required: [enabled, alive, running, queue, accuracy]
      properties:
        enabled: {type: boolean}
        alive: {type: boolean}
        pid: {type: [integer, "null"]}
        started_at: {type: [string, "null"]}
        heartbeat_age_s: {type: [number, "null"]}
        pool: {type: [integer, "null"]}
        cores: {type: [integer, "null"]}
        priority: {type: [string, "null"], description: "normal | below_normal (while a heavy worker job runs)"}
        heavy_jobs: {type: array, items: {type: string}}
        running: {type: array, items: {type: object, additionalProperties: true}}
        queue: {type: array, items: {type: object, additionalProperties: true}}
        blocked_by: {type: [string, "null"]}
        memory_mb: {type: [number, "null"]}
        ram_cap_mb: {type: [number, "null"]}
        done: {type: [integer, "null"]}
        failed: {type: [integer, "null"]}
        last_runs: {type: array, items: {type: object, additionalProperties: true}}
        fallback: {type: [string, "null"]}
        accuracy:
          type: object
          description: "observed / estimated end-to-end ratio of recent runs (estimate as shown at submit)"
          additionalProperties:
            type: object
            properties:
              n: {type: integer}
              median_ratio: {type: [number, "null"]}
              within_30pct: {type: [number, "null"]}
              median_abs_err: {type: [number, "null"]}
    StudioRun:
      type: object
      required: [run, result]
      properties:
        run: {$ref: "#/components/schemas/StudioRunStatus"}
        result: {oneOf: [{$ref: "#/components/schemas/StudioRunEnvelope"}, {type: "null"}], description: "null while queued/running"}
        preview: {oneOf: [{$ref: "#/components/schemas/StudioRunPreview"}, {type: "null"}], description: "v1.48.0 (S1.3): sample result while the full run is still running"}
    StudioCompareRequest:
      type: object
      required: [run_ids]
      properties:
        run_ids: {type: array, minItems: 1, maxItems: 20, items: {type: string}}
        benchmark_run_id: {type: [string, "null"], description: "v1.50: benchmark for DM / Clark-West (default: the first run)"}
    StudioCompare:
      type: object
      required: [run_ids, runs, metrics, coefficients]
      properties:
        run_ids: {type: array, items: {type: string}}
        runs: {type: array, items: {$ref: "#/components/schemas/StudioRunStatus"}}
        metrics: {type: array, items: {type: object, required: [metric, values], properties: {metric: {type: string}, values: {type: object, additionalProperties: {type: [number, "null"]}}}}}
        coefficients: {type: array, items: {type: object, required: [term, values], properties: {term: {type: string}, values: {type: object, additionalProperties: {oneOf: [{type: object, properties: {estimate: {type: [number, "null"]}, std_error: {type: [number, "null"]}, p_value: {type: [number, "null"]}}}, {type: "null"}]}}}}}
        oos: {$ref: "#/components/schemas/StudioCompareOos"}
    StudioCompareOos:
      type: object
      description: "v1.50: out-of-fold comparison on the (date, entity) rows each run shares with the benchmark (oos_eval.parquet)"
      required: [benchmark_run_id, tests, equity, skipped]
      properties:
        benchmark_run_id: {type: [string, "null"]}
        tests:
          type: array
          items:
            type: object
            required: [run_id, benchmark_run_id, n_rows]
            properties:
              run_id: {type: string}
              benchmark_run_id: {type: string}
              n_rows: {type: integer}
              n_dates: {type: integer}
              mse_model: {type: [number, "null"]}
              mse_benchmark: {type: [number, "null"]}
              dm_stat: {type: [number, "null"], description: "> 0: the run is more accurate (per-date loss, HAC)"}
              dm_p: {type: [number, "null"]}
              nested: {type: boolean, description: "benchmark regressors are a strict subset of the run's (same target / dataset)"}
              cw_stat: {type: [number, "null"], description: "Clark-West MSPE-adjusted t (nested runs only)"}
              cw_p: {type: [number, "null"], description: "one-sided"}
              verdict: {type: [string, "null"]}
              note: {type: [string, "null"]}
        equity:
          type: array
          items:
            type: object
            required: [run_id, kind, dates, cum_return]
            properties:
              run_id: {type: string}
              kind: {type: string, enum: [top_minus_bottom_quintile, sign_of_prediction]}
              dates: {type: array, items: {type: [string, "null"]}}
              cum_return: {type: array, items: {type: [number, "null"]}}
              sharpe: {type: [number, "null"]}
              mean_ic: {type: [number, "null"]}
              n_periods: {type: integer}
        skipped: {type: array, items: {type: object, properties: {run_id: {type: string}, reason: {type: string}}}}
    StudioGuideQuestion:
      type: object
      description: "v1.50 guided builder: 'does <driver> move <outcome> over <horizon> controlling for <controls> in <universe>?'"
      required: [outcome]
      properties:
        goal: {type: string, enum: [effect, predict, rank, uncertainty, heterogeneity, regime], default: effect}
        outcome: {$ref: "#/components/schemas/StudioGuideVar"}
        outcome_kind: {type: string, enum: [return, level, change, binary], default: return}
        driver: {oneOf: [{$ref: "#/components/schemas/StudioGuideVar"}, {type: "null"}]}
        controls: {type: array, items: {$ref: "#/components/schemas/StudioGuideVar"}}
        suggest_controls: {type: boolean, default: true}
        horizon: {type: integer, minimum: 0, maximum: 60, default: 1}
