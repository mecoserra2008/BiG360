  # ======================================================================= MODEL STUDIO (v1.5, owner model-studio)
  /api/v1/studio/catalog/datasets:
    get:
      tags: [studio]
      operationId: studioCatalogDatasets
      description: "Lake sources usable as dataset variables (table, entity type, native frequency, PIT column, coverage), transform docs and universe ids. Cached per serving snapshot."
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioSourceCatalog"}}}}
  /api/v1/studio/catalog/variables:
    get:
      tags: [studio]
      operationId: studioCatalogVariables
      description: "Every usable variable (source + field) with table, frequency, units and coverage. `q` matches field/title/country (all terms)."
      parameters:
        - {name: source, in: query, schema: {type: string}, description: "StudioSource.source"}
        - {name: q, in: query, schema: {type: string}}
        - {name: entity_type, in: query, schema: {type: string, enum: [security, issuer, macro]}}
        - {name: frequency, in: query, schema: {type: string, enum: [D, W, M, Q, A]}}
        - {name: limit, in: query, schema: {type: integer, default: 200, minimum: 1, maximum: 2000}}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioVariablePage"}}}}
  /api/v1/studio/catalog/methods:
    get:
      tags: [studio]
      operationId: studioCatalogMethods
      description: "Registered methods with their parameter JSON schema (render the params form from params_schema), accepted data shapes, outputs and diagnostics."
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/StudioMethod"}}}}}
  /api/v1/studio/presets:
    get:
      tags: [studio]
      operationId: studioPresets
      description: "Ready-made example studies (full StudySpec each): submit `study` to POST /studio/runs or save it as a study."
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/StudioPreset"}}}}}
  /api/v1/studio/datasets/preview:
    post:
      tags: [studio]
      operationId: studioPreviewDataset
      description: "Builds (or loads from cache) the dataset and returns the first n rows, summary statistics and per-column coverage."
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioPreviewRequest"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioDatasetPreview"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/studio/runs:
    get:
      tags: [studio]
      operationId: studioListRuns
      parameters:
        - {name: study_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 100, minimum: 1, maximum: 500}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/StudioRunStatus"}}}}}
    post:
      tags: [studio]
      operationId: studioSubmitRun
      description: >
        Submit a study. mode=auto runs inline when the estimated cost is < 2 s (200 with the finished run and result),
        otherwise the run is queued on the worker (202 with status queued; poll GET /studio/runs/{run_id}). mode=sync
        forces inline, mode=async forces the worker. Guardrail violations (look-ahead regressor, too few observations,
        singular design, unknown column, bad dataset spec) answer 422 with Problem.type = "urn:studio:<code>".
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioRunRequest"}}}}
      responses:
        "200": {description: Finished inline (sync), content: {application/json: {schema: {$ref: "#/components/schemas/StudioRun"}}}}
        "202": {description: Queued on the worker (async), content: {application/json: {schema: {$ref: "#/components/schemas/StudioRun"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/studio/runs/{run_id}:
    get:
      tags: [studio]
      operationId: studioGetRun
      description: "Status and, once terminal (completed / failed / cancelled), the result envelope."
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioRun"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [studio]
      operationId: studioCancelRun
      description: "Cancel a queued or running run (cooperative: a running fit stops at its next checkpoint). Terminal runs are returned unchanged."
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioRunStatus"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/studio/runs/{run_id}/export.py:
    get:
      tags: [studio]
      operationId: studioExportRun
      description: "Standalone Python script (text/x-python) that rebuilds the dataset from the Parquet lake with the embedded dataset engine and refits the model with statsmodels / scikit-learn."
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Python source, content: {text/x-python: {schema: {type: string}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Run not completed, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
  /api/v1/studio/compare:
    post:
      tags: [studio]
      operationId: studioCompareRuns
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioCompareRequest"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioCompare"}}}}
  /api/v1/studio/guide/suggest:
    post:
      tags: [studio]
      operationId: studioGuideSuggest
      description: "v1.50 guided builder: structured question -> suggested StudySpec (method, controls, purged CV) by explicit rules (no LLM) + the pre-run lint"
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioGuideQuestion"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioGuideSuggestion"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/studio/lint:
    post:
      tags: [studio]
      operationId: studioLintStudy
      description: "v1.50: look-ahead, leakage, survivorship and tiny-sample checks of a StudySpec before it runs"
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioLintRequest"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioLintResult"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/studio/runs/{run_id}/promote:
    post:
      tags: [studio]
      operationId: studioPromoteRun
      description: "v1.50 Model Registry: register a completed run as the next version of a named model (spec hash, snapshot, owner, monitoring baseline); 409 when the run is not completed"
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioPromoteRequest"}}}}
      responses:
        "201": {description: Promoted, content: {application/json: {schema: {$ref: "#/components/schemas/StudioModel"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Run not completed, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
  /api/v1/studio/registry:
    get:
      tags: [studio]
      operationId: studioListModels
      parameters: [{name: name, in: query, required: false, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/StudioModel"}}}}}
  /api/v1/studio/registry/{model_id}:
    get:
      tags: [studio]
      operationId: studioGetModel
      parameters: [{name: model_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioModel"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [studio]
      operationId: studioUpdateModel
      parameters: [{name: model_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioModelUpdate"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioModel"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [studio]
      operationId: studioDeleteModel
      parameters: [{name: model_id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/studio/registry/{model_id}/monitor:
    post:
      tags: [studio]
      operationId: studioMonitorModel
      description: "v1.50: expanding out-of-sample metric + PSI drift of features and predictions vs the promotion baseline; a breach appends a studio_drift alert event when the model has monitoring on"
      parameters: [{name: model_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioMonitorRequest"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioModelMonitor"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/studio/studies:
    get:
      tags: [studio]
      operationId: studioListStudies
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/StudioStudy"}}}}}
    post:
      tags: [studio]
      operationId: studioCreateStudy
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioStudyCreate"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/StudioStudy"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/studio/studies/{study_id}:
    get:
      tags: [studio]
      operationId: studioGetStudy
      parameters: [{name: study_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioStudyDetail"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [studio]
      operationId: studioUpdateStudy
      parameters: [{name: study_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioStudyUpdate"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioStudy"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      tags: [studio]
      operationId: studioDeleteStudy
      parameters: [{name: study_id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/studio/estimate:
    post:
      tags: [studio]
      operationId: studioEstimateRun
      description: "v1.48.0 (S1.2): learned estimate of a run before submitting it: path (sync | lane | worker), queue, overhead, dataset build, fit and the heavy extras with their cost"
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioEstimateRequest"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioRunEstimate"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/studio/lane:
    get:
      tags: [studio]
      operationId: studioLaneStatus
      description: "v1.48.0 (S1.1): studio lane status + estimate accuracy (observed / estimated ratio) diagnostics"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/StudioLaneStatus"}}}}
  /api/v1/studio/leaderboard:
    post:
      tags: [studio]
      operationId: studioLeaderboard
      description: "v1.7: run several candidate models on the same dataset / target with identical CV folds (a run with method=leaderboard). Same responses as POST /studio/runs."
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioLeaderboardRequest"}}}}
      responses:
        "200": {description: Finished inline, content: {application/json: {schema: {$ref: "#/components/schemas/StudioRun"}}}}
        "202": {description: Queued on the worker, content: {application/json: {schema: {$ref: "#/components/schemas/StudioRun"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/studio/runs/{run_id}/peer-set:
    post:
      tags: [studio]
