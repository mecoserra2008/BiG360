openapi: 3.1.0
info:
  title: BiG Equity 360 API
  version: 1.50.0
  description: >
    Local FastAPI backend for the BiG Equity 360 React dashboard. All data endpoints read the read-only serving
    snapshot (data/db/serving_<run>.duckdb). Dates are ISO yyyy-mm-dd, timestamps ISO-8601 UTC. Percent-like values are
    fractions (0.12 = 12%) unless the field name ends in _score/_pct where scale is 0..100 (scores) or 0..1 (rank_pct).
    Null means "not available". Errors use application/problem+json (Problem schema).
    v1.1 (additive): most object responses carry `data_status` (ok | partial | pending). `pending` means the upstream
    tables are not populated yet: arrays are empty, nullable fields are null and required scalar fields hold neutral
    placeholders (0, "", or the first enum value) that clients must not display. Region-filtered endpoints also
    accept `regions` (several regions). Snapshot-backed GET responses carry ETag / Last-Modified (serving run id).
    v1.5 (additive): Model Studio endpoints under /api/v1/studio (tag studio; schemas Studio*).
    v1.6 (additive): Studio Phase B (panel, causal, multivariate, volatility methods; plot kinds irf, fevd,
    event_path, regime_prob, ts_band), StudioTest.passed, run title/n_obs/estimated_seconds in every run status,
    ISO dates (YYYY-MM-DD) in all result arrays.
    v1.7 (additive): Studio Phase C (regularized, tree_ensemble, gmm, density_clustering, factor_model, leaderboard;
    plot kinds coef_path, shap_beeswarm; dataset source factor_ls), POST /studio/leaderboard, scheduled studies
    (schedule / drift_threshold; drift alerts with rule_type studio_drift), peer sets saved from clustering runs
    (/studio/peer-sets, GET /companies/{security_id}/peers?peer_set_id=).
    v1.12.0 (additive, macro-w4): tag macro-v4 - /macro/v4/{factors, exposures, regime-performance, scenarios
    (CRUD + run), episodes}; CompanyMacro.macro_v4 (schema CompanyMacroV4) on /companies/{security_id}/macro; schemas MacroV4*; screener group
    macro + 6 ScreenerColumnId values (macro_beta_*, macro_impact_rates_down_100bp). All model-based.
    v1.13.0 (additive, macro-w3): tag macro-v3 - /macro/v3/central-banks, /macro/v3/central-banks/{bank},
    /macro/v3/implied-paths; schemas MacroV3*. Official inputs only; implied paths are approximations from official
    curves (method + caveats returned); Taylor rules, expected inflation (ex-US) and tone are model-based (labelled).
    v1.14.0 (additive, macro-w3): MacroV3CentralBankSummary.tone_trend (last 12 tone scores); cb curve snapshots
    3m / 6m / 1y in MacroV3CentralBank.implied_path.curves.
    v1.15.0 (additive, macro-w4): GET /macro/v4/regime-scopes; MacroV4ScenarioRunRequest.sectors / subsectors;
    MacroV4Exposures.frequency / frequencies_available (weekly only); CompanyMacroV4.episodes[].sector; ScreenerField.unit
    documented (pct = fraction).
    v1.16.0 (additive, events-v2): tag events-v2 - /events/v2/{taxonomy, map, timeline, stories, stories/{story_id},
    labels/{label_type}/{label_id}, shocks, event-dates}; schemas EventsV2*. Labelled GDELT 2.0 events / GKG articles
    (issuers / sector / country or GLOBAL / market-theme bitmask), daily aggregates and news stories (near-duplicate
    clusters of all news sources). The v1 /events/* endpoints are unchanged.
    v1.17.0 (additive, realtime): tag live - GET /live/{filings, news, events, macro, alerts} (latest N from the
    real-time hot store merged over the nightly snapshot by natural key; origin live | snapshot | app_state),
    GET /live/stream (Server-Sent Events: id = global bus id, event = topic, Last-Event-ID resume, heartbeats),
    GET /live/status (per-stream lag / freshness / throughput / errors, bus topics, consumer-group lag); schemas Live*.
    Macro surprises are vs MODEL-BASED expectations (not consensus). Real-time prices are not part of this layer.
    Frontend generates TS types from this file (openapi-typescript). Performance budget: p95 < 300 ms per call.
    v1.18.0 (additive, event-models): tag events-models - GET /events/models/{hotspots, spillovers, connectedness, irf,
    escalation, changepoints, gpr, event-studies, company/{security_id}}; schemas EventsModels*. Spatial econometrics
    (Moran / LISA / Gi* hotspots, SAR / SEM / SDM / SLX spillovers, Diebold-Yilmaz connectedness, local projections,
    spatial VAR) and event dynamics (Hawkes escalation, BOCPD change points, GPR-style index, event-study library,
    company exposure); every output is model-based (model_based = true).
    v1.19.0 (additive, price-history): PriceSeries.first_date / daily_from - /companies/{security_id}/prices serves the
    full history (daily bars for the last 15 years, weekly bars before; the daily auto-resample cap is now 10 years);
    tag instruments - GET /instruments (browser: FX / futures / indices / ETFs by group with last, 1D / 1W / 1M / YTD / 1Y
    changes and a 1-year weekly sparkline), GET /instruments/{security_id} (stats, rolling 1y vol, correlations, source),
    GET /instruments/{security_id}/prices; schemas Instrument*. Yahoo market series: official FX for conversions remains
    ECB / Fed / central banks.
    v1.20.0 (additive, events-v2 history): window limits raised to 2,600 days (2020+ backfill) on /events/v2/{map, timeline,
    stories, labels, shocks}; map slider_freq + timeline_freq, label panel freq + freq field (weekly buckets by default
    beyond 400 days); coverage {first_date, last_date, n_days} on EventsV2Taxonomy and EventsV2Map.
    v1.21.0 (additive, cftc): tag positioning - GET /positioning/markets (latest headline positioning per CFTC market;
    filters asset_class / report / combined / active / major / security_id / q), GET /positioning/heatmap (COT index
    or z by market x trader category for one report family), GET /positioning/crowded (crowded longs / shorts /
    divergences), GET /positioning/markets/{market_code} (aligned weekly series per category + OI, traders,
    concentration, price of the mapped instrument, extremes, event study); schemas Positioning*. Source CFTC Commitments
    of Traders (official). Extremes / crowding / divergence / event study are model-based (labelled).
    v1.22.0 (additive, earnings): tag earnings - GET /earnings/calendar (earnings upcoming + released and corporate
    events in a date range; filters universe / watchlist / security_ids / region / sector / types / date_source), GET
    /companies/{security_id}/earnings (next date with source label, release history with CAR / BHAR reactions and
    model expectation vs actual, reaction stats, expectation rows per model, corporate events, PEAD signal), GET
    /earnings/season (earnings-season dashboard by region / sector); schemas Earnings*. AlertRuleType +=
    earnings_upcoming {days_ahead?: int (default 3), date_sources?: [company_announced|provider_estimate|model_projection]}
    and earnings_surprise {threshold_z?: number (default 2.0), items?: [eps_diluted|revenue]}. Upcoming dates are labelled
    company-announced / provider estimate (Yahoo) / model-based projection; expectations and surprises are MODEL-BASED
    (not consensus).
    v1.23.0 (additive, cross-asset): tag cross-asset - GET /cross-asset/cockpit (assets x signals heatmap: trend,
    momentum, carry, value, curve slope, realised vol, IV/RV, CFTC positioning with z-scores; filters asset_class /
    security_id), GET /cross-asset/assets/{asset_id} (daily signal history, carry / value method, positioning), GET
    /cross-asset/curves and /cross-asset/curves/{root} (Yahoo futures term structures with APPROXIMATE expiry: latest vs
    ~1m / ~1y ago, contango / backwardation history, contract coverage served / missing / unchecked / expired), GET
    /cross-asset/correlation (eigen-concentration history + basket matrices now / 1m / 1y), GET /cross-asset/risk
    (MODEL-BASED risk-on / risk-off composite with components); schemas CrossAsset*. Model Studio dataset source
    cross_asset (field = asset_id:metric). Positioning is CFTC (official) joined point-in-time on the release date.
    v1.24.0 (additive, backtest): tag backtest - GET /backtest/catalog, POST /backtest/validate, POST /backtest/from-screen
    (Screener query -> point-in-time screen spec), /backtest/runs (submit sync / async on the worker, list, get, cancel,
    holdings, trades, export.py), POST /backtest/compare, /backtest/strategies (CRUD, run, schedule weekly = paper
    strategy with drift / decay alerts); schemas Backtest*. AlertRuleType += backtest_drift. Signals, universes and
    screens are evaluated point-in-time per rebalance (execution at the close of t+1); metrics carry a mandatory
    out-of-sample holdout, deflated Sharpe with a per-strategy multiple-testing counter, PBO (CSCV) for sweeps and a
    label-permutation test. Survivorship caveat: universe membership history starts 2026-10-10.
    v1.25.0 (additive, smart-money): tag smart-money - GET /smart-money/overview (13F accumulation / distribution,
    smart-cohort buying, crowding, most shorted, squeeze watch, SI risers, FTD spikes, combined score top / bottom,
    activist feed, EU / UK short register summary, CFTC equity-index positioning), GET /smart-money/eu-shorts (official
    EU / UK net short-position register: FCA, AMF, CNMV, AFM, CBI, FSMA, FI, Finanstilsynet; skipped registers listed),
    GET /smart-money/activism (13D / 13G event feed), GET /smart-money/sectors, GET /companies/{security_id}/ownership
    (13F holders with changes, ownership trend, short-interest trend, insider timeline, EU shorts, activism, score
    history); schemas SmartMoney*, CompanyOwnership*. 13F responses carry the lag (positions as of quarter end, filed by
    the cutoff). AlertRuleType += activist_13d {include_amendments?: bool (false), include_switch?: bool (true)},
    short_interest_spike {min_chg_pct?: number (0.25), min_si_pct?: number (0.0)}, eu_short_position {min_pct?: number
    (0.5), include_increases?: bool (true), min_increase_pp?: number (0.1)}. Hedge-fund-like, smart cohort, crowding,
    squeeze, FTD spike and the combined score are MODEL-BASED (labelled); sources are official.
    v1.26.0 (additive, theses): tag theses - thesis tracker (roadmap #8): /theses (board listing with filters, create),
    /theses/stats (hit rates across closed theses), /theses/subject-defaults, /theses/{thesis_id} (get / patch incl. board
    moves and close with post-mortem template / delete), journal CRUD, reviews (schedule + complete), snapshots,
    status (live automatic status on track / at risk / invalidated with reasons + KPI values via the formula engine;
    model-based rules), evaluate (run the nightly thesis_eval for one thesis), performance (since inception vs
    benchmark and sector, shared price reader + official FX), timeline (price + bands + markers), evidence (filings,
    stories, event shocks, earnings, macro surprises), export.md; schemas Thesis*. Alert.thesis_id (rules generated by
    a thesis); AlertRuleType += thesis_kpi, thesis_review, thesis_status, thesis_catalyst, thesis_positioning,
    thesis_event_shock (managed by the thesis tracker, not creatable via POST /alerts; events written by thesis_eval).
    v1.27.0 (additive, supply-chain, roadmap v2 #9): tag supply-chain - GET /companies/{security_id}/network
    (disclosed customer / supplier edges depth 1-2 with provenance + labelled statistical neighbours),
    GET /companies/{security_id}/geography (direct / second-order / look-through exposure + country overlays),
    GET /supply-chain/country-risk, POST /supply-chain/shock (model-based damped propagation + optional W4 macro
    channel), POST /supply-chain/portfolio-exposure (watchlist / portfolio aggregation); schemas SupplyChain*,
    CompanyNetwork, CompanyGeography*, CountryRiskOverlay, PortfolioExposure*.
    v1.28.0 (additive, data ops O0/O1): GET /system/schedule + PUT /system/schedule (schedule profiles weekly / daily /
    intraday placeholder, hot-reloaded by the worker), GET /system/data-health (coverage registry datasets, freshness
    heatmap, gap queue, backfill campaigns with ETA, filler governor, source status + rate budgets, failures, SLA
    breaches, ops alerts); SystemStatus += scheduler, data_as_of (per region), data_as_of_overall, serving_sections,
    ops_alerts; FreshnessItem += optional; schemas Schedule*, SchedulerStatus, ServingSection, OpsAlert, DataHealth*.
    v1.30.0 (additive, O2.2c / O2.3): GET /system/qa (regression guard: API contract sweep, golden data checks, UI
    smoke suite; schemas QaReport, QaSuite, QaIssue) and DataHealth.qa; getMarketOverview += liquid / min_adv_usd /
    min_mcap_usd / min_price_usd / unknown_mcap_adv_multiple / movers_limit (liquid movers server-side, default on;
    unknown ADV no longer passes), MarketOverview.movers_filter (MoversFilter), MoverRow.adv_usd_20d;
    getEarningsCalendar += offset / compact, EarningsCalendar += offset / next_offset; backtestGetRun += series
    (full | weekly | none); BeneishDetail.corroboration (was served, now documented); FreshnessItem semantics for
    forward-looking tables and failed writers (F14).
    v1.31.0 (additive, O4 enterprise readiness): GET /ready (readiness probe: 200 when a serving snapshot is published
    and the worker heartbeat is fresh, else 503; schema Readiness), GET /metrics (Prometheus text exposition 0.0.4:
    HTTP request counts / latency histograms per route template, SSE connections, snapshot age, data age per table /
    region, dataset status, job outcomes, worker / filler state, gap queue). GET /health is the liveness probe
    (unchanged). Every response carries an `X-Request-ID` header (the caller's value when it is a safe token of <= 128
    chars, otherwise generated) that is also written to the JSON logs. components.securitySchemes.bearerAuth documents
    the optional OIDC / JWT bearer authentication (Entra ID); it is enforced only when the server runs with
    BIG360_AUTH=oidc (default none: no authentication, local use) and then applies to /api/** (401 problem+json with a
    WWW-Authenticate header when the token is missing or invalid, 403 when the role is insufficient: viewer = reads and
    read-only computations, analyst = user-state writes, admin = job trigger / schedule / model train and promote).
    v1.32.0 (additive, conformal P3; docs/CONFORMAL_TECHNICALS_PLAN.md, gate docs/CONFORMAL_VALIDATION.md): tag
    conformal - GET /conformal/envelope/{security_id} (calibrated range: marginal per-horizon conformal bands at
    80 / 90 / 95% x 1 / 5 / 10 / 20 sessions as prices, next-bar bands flagged experimental, pool coverage; the joint
    simultaneous envelope failed the gate and is not served), GET /conformal/touch (calibrated chance of touching
    given levels or, automatically, the confluence zones / technical levels within h sessions), GET
    /conformal/peer-groups (peer-group joint-anomaly percentile, history, member contributions, break-away member,
    definition; descriptive, not a trading signal), GET /conformal/pair-band (calibrated next-session band for any
    linear combination of group members), GET /conformal/coverage (rolling + walk-forward coverage audit, gate
    verdicts); schemas Conformal*. All model-based: calibrated to X% over history, never 'X% chance today'.
    v1.33.0 (additive, Technicals v2 T1 / T5; docs/TECHNICALS_V2_PLAN.md): ConformalEnvelope.fan (the marginal calibrated
    band at every horizon 1..20 sessions at 80 / 90 / 95%, dated by the exchange's sessions, earnings session flagged;
    schema ConformalFanPoint) and ConformalEnvelope.fan_info (source calibrated | interpolated | none, calendar,
    earnings date in the window; ConformalFanInfo); new GET /technicals/{security_id}/context (getTechnicalsContext,
    schema TechnicalsContext: calibrated 20d range-width percentile vs the stock's last 2 years with squeeze /
    expansion, realised vol 20d + percentile, implied vol n/a, ATR(14) percentile, ADX(14), daily / weekly trend
    alignment, next earnings + typical move median |CAR[-1,+1]|).
    v1.34.0 (additive, Technicals v2 T2 / T3 / T4; gate docs/TECHNICALS_V2_VALIDATION.md): GET
    /technicals/{security_id}/setup-probabilities (getTechnicalsSetupProbabilities: two-barrier P(win) / P(loss) /
    P(neither) per horizon 5 / 10 / 20 / 40 / 60 sessions + the setup's own horizon, expected R after costs, break-even
    P(win), naive R:R and Brownian baselines; optional target + stop for a thesis), GET /technicals/{security_id}/zones
    (getTechnicalsZones: confluence zones + P(hold | touch), random-control probability, edge vs random with its
    significance flag, conformal P(touch) and the product) and GET /technicals/{security_id}/score-calibration
    (getTechnicalsScoreCalibration: percentile sub-scores within region x sector, historical score-bucket outcomes 5 /
    20 / 60 sessions, edge flag). Every output carries its gate verdict; experimental = failed / not validated.
    v1.35.0 (additive, Technicals v3 #2 meta-labelled setups; gate docs/TECHNICALS_V3_VALIDATION.md "Meta-labelling"):
    GET /technicals/{security_id}/meta-setup (getTechnicalsMetaSetup: context-adjusted P(T1 before the invalidation
    within H) / P(loss) / P(neither) for H = 10 / 20 / 40, meta expected R after costs, take / skip at the in-sample
    threshold, capped quarter-Kelly risk fraction, relative size, top drivers vs the T2 base; schemas TechnicalsMetaSetup,
    TechnicalsMetaHorizon, TechnicalsMetaDriver, TechnicalsMetaView); TechnicalsSetupProbabilities.meta (optional; the
    stored meta view in mode setup, query-time for custom thesis barriers); BacktestEventSpec.trigger += meta_setups
    (walk-forward OOS meta-labelled setups, modes all / take / sized, labelled with the gate verdict). Model-based.
    v1.36.0 (additive, Technicals v3 #1 evidence-based technical factors / #5 volume-confirmed breakouts; gate
    docs/TECHNICALS_V3_VALIDATION.md): GET /technicals/{security_id}/factors (getTechnicalsFactors: 52-week-high
    proximity, 12-1 / residual / industry momentum, 1-month reversal, MAX, idiosyncratic volatility - raw value,
    percentile within region x sector, each factor's out-of-sample rank IC 5 / 20 / 60 sessions with Newey-West t and
    BH-adjusted p, gate verdict; the composite only when it passed) and GET /technicals/{security_id}/breakout
    (getTechnicalsBreakout: latest 20 / 55-session breakout state, volume confirmation + score, calibrated
    P(follow-through) vs the geometry baseline and base rate, validation evidence, recent events); schemas
    TechnicalsFactors, TechnicalsFactor, TechnicalsFactorIc, TechnicalsFactorBadge, TechnicalsFactorComposite,
    TechnicalsFactorsValidation, TechnicalsBreakout, TechnicalsBreakoutEvidence, TechnicalsBreakoutEvent. Model Studio /
    Backtest Lab source tech_factors.
    v1.37.0 (additive, roadmap v3 B1 BQL-lite; tag bql): POST /bql (runBql: get(...) for(...) with(dates, freq,
    currency, fill, as_of) where(...) group(...).agg(...) sort(...) limit(n) compiled to parameterised point-in-time
    DuckDB SQL over the serving snapshot; columns with units, rows, as_of, warnings), POST /bql/explain (AST + SQL
    shape, parameter names / types only), GET /bql/fields (searchable field dictionary, contracts/bql_fields.yaml),
    POST /bql/export (CSV / XLSX / JSON), GET /bql/resolve (Bloomberg-style references: 'AAPL US Equity', 'SPX Index',
    'EURUSD Curncy', 'CL1 Comdty'), saved queries GET / POST /bql/saved, GET / PUT / DELETE /bql/saved/{query_id}
    (app_state bql_saved; kind screen = usable as members('screen:NAME')). Model Studio source bql (field = a BQL
    expression) and Backtest Lab signal source bql (cross-sectional expression evaluated point-in-time per rebalance).
    v1.38.0 (additive, roadmap v3 N2-N4 live news; tag news): GET /news/terminal (live items from the R1 bus merged over
    the 7-day intraday store: RSS / Atom headlines, Polygon news, issuer-linked / salient GDELT articles; filters ticker /
    security / watchlist / country / sector / theme / source tier / language / kind / text / story), GET /news/stories
    (top stories with live velocity), GET /news/stories/{story_id} (timeline, articles, linked securities with the price
    move since first publication, related filings and GDELT events, model-based impact estimate from the event-study
    library), GET /news/hourly (sentiment_hourly + event_hourly_agg per label), GET /news/feeds (curated feeds with
    verification), GET /news/live/health (publish -> bus latency p50 / p95 per source, items / hour, GDELT release lag,
    failing feeds, hourly fold / intraday state); schemas News*. LiveStreamEvent.topic += news.item, news.story (SSE).
    AlertRuleType += watchlist_news, story_velocity (live news rules; story_velocity may be created without a target).
    v1.39.0 (additive, user-guide fixes): NewsImpact.unit (percent; mean_car / ci are percent, never x100);
    Alert.ticker / security_name / watchlist_name (resolved names for the rule table); ModelRun.leakage_gate /
    gate_note (label-permutation gate: FT-Transformer / ensemble failed = demoted); KpiDistribution.target (band
    metrics); SmartMoneyOverview.activist_count_60d (true count, the feed is capped). POST /alerts also normalises the
    payload older watchlist editors sent (price_change_pct_1d pct_change_1d -> pct, direction above / below ->
    up / down; score_change {level} without a mode -> mode level).
    v1.40.0 (additive, docs/STARTUP_SYNC_PLAN.md workstream B, live fetchers): GET /live/quotes (last DELAYED quotes
    from the quotes service - Yahoo batched / Polygon snapshot when the plan allows - for security ids, tickers or
    index / FX / futures symbols, with market state and next open; set=header = the LIVE strip ticker; requested ids
    are polled for 30 min), GET /live/feeds (per-feed health: last poll, latency, items / hour, errors, reason for
    delayed quotes, EDGAR filings, official macro releases, news and exchange disclosures; market sessions; next
    macro releases); LiveStatus.quotes (quotes service summary); LiveStreamEvent.topic += quotes.tick (changed delayed
    quotes per poll), quotes.session (market open / close transitions). AlertRuleType activist_13d is now also
    evaluated live (Schedule 13D on the EDGAR real-time feed). Delayed quotes are never written into the daily bars.
    v1.41.0 (additive, docs/STARTUP_SYNC_PLAN.md workstream A, startup sync): GET /system/sync (the running / last
    startup sync: per dataset the reason code fresh | due | not_yet_published | source_unavailable | no_source |
    needs_key | failed with last / expected / next expected dates, retry time, missing key names and the jobs run with
    their durations; jobs; section-incremental publishes; peak RAM; the header chip text; the supervisor trigger;
    recent runs; schemas SyncStatus, SyncDataset, SyncEntity, SyncJob, SyncChip), POST /system/sync (sync now: 202
    SyncRequestAccepted; the supervisor starts it within a few seconds, never two at once).
    v1.42.0 (additive, docs/STARTUP_SYNC_PLAN.md workstream C, data completeness): GET /meta/field-availability
    (getFieldAvailability: the documented reason of every field gap per region from contracts/field_availability.yaml,
    generated by the completeness audit) and GET /companies/{security_id}/availability (getCompanyAvailability: per
    security, why each requested field is missing - region rule + the context of the security: stale prices,
    fundamentals scope, plausibility flags). Reason codes = the startup-sync codes plus mapping_gap | pipeline_bug |
    stale | not_applicable | out_of_scope | suppressed, each with its sync_code (AvailabilityReason). Behaviour: BQL no
    longer repeats ticker / name / id as value columns (they are key columns) and grouped queries accept sort(n);
    si.pct_float = short interest / shares outstanding (float proxy); SmartMoneyRow lists carry the 13F,
    short-interest and score fields of every row.
    v1.43.0 (additive, alert hygiene 2026-10-30, docs/OPERATIONS_ROADMAP.md): one freshness verdict per dataset -
    DataHealthDataset += reason (the startup sync's reason code, or `stale` from the gap detector when no sync scanned
    within 6 h), reason_source, reason_detail, next_expected, retry_at, attempts, keys, alerting, detector_status;
    `status` / sla_breaches / the sla_* ops alerts follow it (alert only for failed, due or source_unavailable past the
    SLA, or stale; never for fresh, not_yet_published, needs_key, no_source). DataHealth += freshness, last_refresh,
    refresh_failures; SchedulerStatus += last_refresh (the most recent of the sync and scheduled refreshes; the
    refresh_overdue alert uses it). Ops alert `refresh_failed` (jobs whose latest attempt failed across nightly,
    weekly, monthly, sync and manual runs, named) replaces `nightly_failed`. OpsAlert += stale, age_h, superseded_by;
    QaReport += age_h, stale, trigger, run_status, skipped, runs; QaSuite += run_id, finished_at, age_h, stale,
    superseded_by, last_skip (the regression-guard state is merged per suite and old failures age out).
    v1.44.0 (additive, full-universe scores & ML 2026-10-30, docs/DATA_COMPLETENESS.md "Full-universe scores & ML"):
    factor scores / composites / grades / ranks for every security with enough inputs (securities outside the MVP
    universe are scored against the MVP reference cross-section: scope extended; MVP results unchanged) and ML
    predictions of the MVP-trained production model for out-of-universe securities in validated segments only
    (scope extrapolated). CompositeSummary += scope, rank_global_full, n_global_full, rank_sector_full,
    n_sector_full, reason; FactorScore += rank_in_sector_full, sector_count_full, reason; PredictionSummary += scope,
    scope_note; ModelPrediction += scope; ModelExplanation += scope, scope_note, reason; ScreenerRow += score_scope,
    ml_extrapolated_3m, score_reason; AvailabilityCode += insufficient_data. Screener rank outside the MVP universes =
    rank among all scored securities. Composite fallback no longer fills a composite whose row says insufficient_data.
    v1.45.0 (additive, worker memory & ref_universe fixes 2026-10-31, docs/OPERATIONS_ROADMAP.md): new ops alert id
    `sector_loss` (error) in SystemStatus.ops_alerts / DataHealth.alerts when the latest ref_universe run left more
    than 1 % of the previously classified issuers without a sector; dq_results gains check issuers/sector_loss.
    v1.47.0 (additive, docs/COVERAGE_V2_PLAN.md W3 rates & debt, owner rates-w3): tags rates / credit - GET
    /rates/curves (official curve catalogue: history depth, publication rule, licence, rejected sources),
    /rates/curves/{curve_id} (snapshots vs 1d..5y, per-tenor history, month-end / week-end animation frames, Svensson
    parameters), /rates/monitor (benchmark yields per country, 2s10s / 5s30s, spreads vs Bund / UST, changes, real vs
    nominal, money-market fixings, delayed live yields), /rates/series (curve points CURVE:TENOR:TYPE and spreads A-B),
    /rates/sovereign (US Treasury / UK DMO auctions, debt / GDP, deficits, TARGET balances), /credit/overview (ICE BofA
    OAS by rating / maturity / EM sector, effective yields, Moody's Aaa / Baa - FRED personal use, labelled; FIRDS and
    US Treasury issuance; TRACE aggregates when keyed), /credit/maturity-walls (sector walls, refinancing metrics,
    refinancing cost MODEL-BASED) and /companies/{security_id}/debt (Company 360 Debt panel). Schemas Rates*, Credit*,
    CompanyDebt*. Curves are stored as integer bp x 100 and served in percent.
    v1.49.0 (additive, docs/STUDIO_V2_PLAN.md S2 new models, owner model-studio): StudioMethod.id gains dml, propensity, rdd, coef_stability (family causal), lightgbm, optuna_tune, stacking, ltr (family ml), mlp, rnn,
    autoencoder (new family neural: added to the StudioMethod.family enum). Results use the existing StudioResult shape (coefficients / tables / plots / tests /
    evaluation); new plot keys only, no new plot kinds. Every neural / ML model reports a Diebold-Mariano test
    against a linear baseline and summary.verdict. No new operation.
    v1.50.0 (additive, docs/STUDIO_V2_PLAN.md S3 probabilistic + UX, owner model-studio): StudioMethod.id gains bayes_ridge,
    gp_regression, quantile_gbm, ngboost, hier_pool (new family probabilistic); every CV regressor accepts
    params.cv.conformal_alpha (split-conformal intervals) and writes the out-of-fold artifact oos_eval.parquet. New ops
    POST /studio/guide/suggest (structured question -> suggested StudySpec by rules + lint), POST /studio/lint
    (look-ahead / leakage / survivorship / tiny-sample checks), Model Registry POST /studio/runs/{run_id}/promote,
    GET /studio/registry, GET | PATCH | DELETE /studio/registry/{model_id}, POST /studio/registry/{model_id}/monitor
    (expanding OOS metric + feature / prediction PSI; breaches append studio_drift alert events). StudioCompareRequest
    gains benchmark_run_id and StudioCompare gains oos (Diebold-Mariano, Clark-West for nested runs, equity curves).
    StudioPreset gains question, method_note, expected_outputs, runtime_s, validated (recipes). Schemas StudioGuide*,
    StudioLint*, StudioModel*, StudioCompareOos, StudioPromoteRequest, StudioMonitorRequest.
