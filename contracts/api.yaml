          properties:
            iso2: {type: string}
    SupplyChainCountryRisk:
      type: object
      required: [countries, label, data_status]
      properties:
        as_of: {type: [string, "null"], format: date}
        countries: {type: array, items: {$ref: "#/components/schemas/SupplyChainCountryRiskRow"}}
        label: {type: string}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    SupplyChainMacroOverlay:
      type: object
      properties:
        scenario_id: {type: [string, "null"], description: "W4 scenario (preset or saved) - GET /macro/v4/scenarios"}
        shocks: {type: [object, "null"], additionalProperties: {type: number}, description: "W4 shock fields (rates_10y_bp, oil_pct, usd_pct ...)"}
        options: {type: [object, "null"]}
    SupplyChainShockRequest:
      type: object
      required: [target_type]
      properties:
        target_type: {type: string, enum: [company, country]}
        security_id: {type: [string, "null"]}
        iso2: {type: [string, "null"], minLength: 2, maxLength: 2}
        magnitude: {type: number, minimum: -1, maximum: 1, default: -0.1, description: "Revenue shock as a fraction (-0.10 = -10%)"}
        damping: {type: number, minimum: 0, maximum: 1, default: 0.5}
        hops: {type: integer, minimum: 1, maximum: 4, default: 3}
        demand_channel: {type: boolean, default: true}
        supply_channel: {type: boolean, default: true}
        supply_factor: {type: number, minimum: 0, maximum: 1, default: 0.5}
        default_share: {type: number, minimum: 0, maximum: 0.5, default: 0.05}
        include_statistical: {type: boolean, default: false}
        include_home_country: {type: boolean, default: false, description: "Country shock: also seed companies without a geographic revenue disclosure (100% home country assumed)"}
        macro: {oneOf: [{$ref: "#/components/schemas/SupplyChainMacroOverlay"}, {type: "null"}]}
        top_n: {type: integer, minimum: 1, maximum: 200, default: 30}
    SupplyChainShockNode:
      type: object
      required: [key, name]
      properties:
        key: {type: string}
        issuer_id: {type: [string, "null"]}
        security_id: {type: [string, "null"]}
        ticker: {type: [string, "null"]}
        name: {type: string}
        country: {type: [string, "null"]}
        sector_id: {type: [string, "null"]}
        macro_impact: {type: [number, "null"], description: "W4 macro channel: estimated equity return (model-based)"}
        macro_impact_lo: {type: [number, "null"]}
        macro_impact_hi: {type: [number, "null"]}
    SupplyChainShockImpact:
      allOf:
        - {$ref: "#/components/schemas/SupplyChainShockNode"}
        - type: object
          required: [revenue_impact, by_hop, first_hop, channel, path, path_keys]
          properties:
            revenue_impact: {type: number, description: "Estimated revenue change (fraction), all hops"}
            by_hop: {type: array, items: {type: number}}
            first_hop: {type: integer}
            channel: {type: string, enum: [seed, demand, supply]}
            path: {type: array, items: {type: string}}
            path_keys: {type: array, items: {type: string}}
    SupplyChainShockStatistical:
      allOf:
        - {$ref: "#/components/schemas/SupplyChainShockNode"}
        - type: object
          required: [rho_impact]
          properties:
            rho_impact: {type: number, description: "rho x damping x seed (co-movement proxy, not causal)"}
    SupplyChainShockResult:
      type: object
      required: [model_label, model_based, as_of, seed, params, impacts, statistical, n_affected, notes, method, data_status]
      properties:
        model_label: {type: string}
        model_based: {type: boolean}
        as_of: {type: string, format: date}
        seed:
          type: object
          required: [type, key, name, n_seeds]
          properties:
            type: {type: string, enum: [company, country]}
            key: {type: string}
            security_id: {type: [string, "null"]}
            name: {type: string}
            iso2: {type: [string, "null"]}
            n_seeds: {type: integer}
        params: {type: object, additionalProperties: true}
        seed_macro: {oneOf: [{$ref: "#/components/schemas/SupplyChainShockNode"}, {type: "null"}]}
        impacts: {type: array, items: {$ref: "#/components/schemas/SupplyChainShockImpact"}}
        statistical: {type: array, items: {$ref: "#/components/schemas/SupplyChainShockStatistical"}}
        n_affected: {type: integer}
        macro:
          oneOf:
            - {type: "null"}
            - type: object
              properties:
                name: {type: string}
                shocks: {type: object, additionalProperties: {type: number}}
                as_of: {type: [string, "null"]}
                label: {type: string}
                n_matched: {type: integer}
                note: {type: string}
        notes: {type: array, items: {type: string}}
        method: {type: array, items: {type: string}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    PortfolioExposureRequest:
      type: object
      properties:
        watchlist_id: {type: [string, "null"]}
        security_ids: {type: [array, "null"], items: {type: string}, maxItems: 500}
        weights: {type: [object, "null"], additionalProperties: {type: number, minimum: 0}, description: "security_id -> weight (default equal)"}
        basis: {type: string, enum: [direct, look_through], default: direct}
    PortfolioExposureCountry:
      type: object
      required: [iso2, contributors]
      properties:
        iso2: {type: string}
        direct: {type: [number, "null"]}
        look_through: {type: [number, "null"]}
        contributors:
          type: array
          items:
            type: object
            required: [security_id, weight]
            properties:
              security_id: {type: string}
              ticker: {type: [string, "null"]}
              name: {type: [string, "null"]}
              weight: {type: number}
        overlay: {oneOf: [{$ref: "#/components/schemas/CountryRiskOverlay"}, {type: "null"}]}
    PortfolioExposure:
      type: object
      required: [as_of, basis, countries, sectors, shared_counterparties, items, coverage, labels, data_status]
      properties:
        as_of: {type: string, format: date}
        watchlist_id: {type: [string, "null"]}
        name: {type: [string, "null"]}
        basis: {type: string, enum: [direct, look_through]}
        countries: {type: array, items: {$ref: "#/components/schemas/PortfolioExposureCountry"}}
        sectors:
          type: array
          items:
            type: object
            required: [sector_id]
            properties:
              sector_id: {type: string}
              look_through: {type: [number, "null"]}
        portfolio_country_risk: {type: [number, "null"]}
        shared_counterparties:
          type: array
          items:
            type: object
            required: [key, relation, holders, n_holders]
            properties:
              key: {type: string}
              name: {type: [string, "null"]}
              relation: {type: string, enum: [customer, supplier, both]}
              holders: {type: array, items: {type: string}}
              n_holders: {type: integer}
              weighted_share: {type: [number, "null"]}
        items:
          type: array
          items:
            type: object
            required: [security_id]
            properties:
              security_id: {type: string}
              ticker: {type: [string, "null"]}
              name: {type: [string, "null"]}
              issuer_id: {type: [string, "null"]}
              country: {type: [string, "null"]}
              weight: {type: [number, "null"]}
              country_risk: {type: [number, "null"]}
              top_country: {type: [string, "null"]}
              coverage_level: {type: [string, "null"]}
              geo_source: {type: [string, "null"]}
        coverage:
          type: object
          required: [n_items, n_resolved, n_geo_revenue, n_with_links, n_home_country_only]
          properties:
            n_items: {type: integer}
            n_resolved: {type: integer}
            n_geo_revenue: {type: integer}
            n_with_links: {type: integer}
            n_home_country_only: {type: integer}
        labels: {$ref: "#/components/schemas/SupplyChainLabels"}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    # ------------------------------------------------------------------ conformal (v1.32.0)
    ConformalBand:
      type: object
      required: [horizon, level, lo, hi, half_width_log]
      properties:
        horizon: {type: integer, description: "Sessions ahead (1, 5, 10, 20)"}
        level: {type: integer, enum: [80, 90, 95], description: "Calibration level (% over history)"}
        lo: {type: number, description: "Lower price (trading currency, the envelope's last close basis)"}
        hi: {type: number}
        half_width_log: {type: number, description: "sqrt(qm x V(h)) in log-return units"}
        lo_pct: {type: [number, "null"]}
        hi_pct: {type: [number, "null"]}
        target_date: {type: [string, "null"], description: "Approximate date h sessions ahead (weekdays)"}
    ConformalNextbarBand:
      type: object
      required: [field, level, lo, hi]
      properties:
        field: {type: string, enum: [high, low, close]}
        level: {type: integer, enum: [80, 90, 95]}
        lo: {type: [number, "null"]}
        hi: {type: [number, "null"]}
    ConformalCoverageStat:
      type: object
      required: [source, horizon, level, coverage, n, status]
      properties:
        source: {type: string, enum: [rolling, walk_forward]}
        segment: {type: [string, "null"]}
        horizon: {type: integer}
        level: {type: integer}
        coverage: {type: [number, "null"]}
        n: {type: integer}
        gap_pp: {type: [number, "null"]}
        status: {type: string, enum: [ok, under, over, thin]}
        window_start: {type: [string, "null"]}
        window_end: {type: [string, "null"]}
    ConformalEnvelope:
      type: object
      required: [security, as_of, last_close, model_based, horizons, levels, bands, nextbar, coverage, labels, validation_doc, data_status]
      properties:
        security: {$ref: "#/components/schemas/SecurityRef"}
        as_of: {type: [string, "null"], description: "Origin date (close) of the bands"}
        price_as_of: {type: [string, "null"], description: "Latest price date in the snapshot"}
        stale: {type: boolean, description: "The snapshot has a newer close than the envelope origin"}
        last_close: {type: [number, "null"]}
        currency: {type: [string, "null"]}
        model_based: {type: boolean}
        filter: {type: [string, "null"]}
        radius_mode: {type: [string, "null"]}
        pool_key: {type: [string, "null"], description: "Calibration pool region|sector"}
        region: {type: [string, "null"]}
        sigma_d: {type: [number, "null"], description: "Filter daily volatility (log return)"}
        earn_in_window: {type: boolean, description: "Expected earnings within 20 sessions: event calibration pool, jump in the shape"}
        earn_days_ahead: {type: [integer, "null"]}
        q_pool_kind: {type: [string, "null"]}
        n_cal: {type: [integer, "null"]}
        horizons: {type: array, items: {type: integer}}
        levels: {type: array, items: {type: integer}}
        bands: {type: array, items: {$ref: "#/components/schemas/ConformalBand"}}
        nextbar:
          type: object
          required: [experimental, note, bands]
          properties:
            experimental: {type: boolean}
            note: {type: string}
            bands: {type: array, items: {$ref: "#/components/schemas/ConformalNextbarBand"}}
        coverage: {type: array, items: {$ref: "#/components/schemas/ConformalCoverageStat"}}
        labels: {type: object, additionalProperties: {type: string}}
        validation_doc: {type: string}
        fan: {type: array, items: {$ref: "#/components/schemas/ConformalFanPoint"}, description: "v1.33.0: the marginal calibrated band at every horizon h = 1..20 sessions (each horizon calibrated alone; not a joint path band); empty when unavailable"}
        fan_info: {$ref: "#/components/schemas/ConformalFanInfo"}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    ConformalFanPoint:
      type: object
      description: "Calibrated marginal band h sessions after the origin close: close x exp(+- sqrt(q(h) V(h))); no drift (centre = last close). Added v1.33.0."
      required: [h, date, lo_80, hi_80, lo_90, hi_90, lo_95, hi_95, event_pool, earnings]
      properties:
        h: {type: integer, minimum: 1, maximum: 20, description: "Sessions ahead"}
        date: {type: string, description: "The h-th exchange session after the origin (fan_info.calendar)"}
        lo_80: {type: number}
        hi_80: {type: number}
        lo_90: {type: number}
        hi_90: {type: number}
        lo_95: {type: number}
        hi_95: {type: number}
        event_pool: {type: boolean, description: "An expected earnings day falls within the first h sessions: earnings-event calibration pool and jump variance"}
        earnings: {type: boolean, description: "This session is the expected earnings date (fan_info.earnings)"}
    ConformalFanEarnings:
      type: object
      required: [date, h, source]
      properties:
        date: {type: string, description: "Expected earnings date (or the envelope's expected event session)"}
        h: {type: integer, description: "Fan horizon of that session"}
        session: {type: [string, "null"], description: "pre_market | intraday | post_market | unknown"}
        date_source: {type: [string, "null"], description: "company_announced | provider_estimate | model_projection"}
        source: {type: string, enum: [earnings_calendar, envelope]}
    ConformalFanInfo:
      type: object
      required: [source, horizons, monotone, note]
      properties:
        source: {type: string, enum: [calibrated, interpolated, none], description: "calibrated = radius calibrated per horizon by the envelope job; interpolated = rows written before the per-h fan: radius linear in h between the calibrated 1/5/10/20 radii (walk-forward check docs/CONFORMAL_VALIDATION.md A.5)"}
        calendar: {type: [string, "null"], description: "Exchange calendar of the dates (MIC from the O1 calendar cache) or weekdays"}
        horizons: {type: integer}
        earnings: {oneOf: [{$ref: "#/components/schemas/ConformalFanEarnings"}, {type: "null"}]}
        monotone: {type: boolean, description: "The 90% width never narrows with h (the chart still draws a non-narrowing envelope)"}
        note: {type: string}
    TechnicalsContextRangeWidth:
      type: object
      required: [level, horizon, percentile, state, n]
      properties:
        level: {type: integer}
        horizon: {type: integer}
        width_log: {type: [number, "null"], description: "Band width 2 sqrt(q V(20)) in log-return units"}
        width_pct: {type: [number, "null"], description: "Band width as a fraction of the price (hi - lo) / close"}
        median_width_log: {type: [number, "null"], description: "Median width over the lookback"}
        radius: {type: [number, "null"], description: "Today's calibrated radius q (qm_20_90)"}
        percentile: {type: [number, "null"], description: "Share of the lookback sessions with a width <= today's (0..1)"}
        state: {type: string, enum: [squeeze, normal, expansion, n/a]}
        n: {type: integer}
    TechnicalsContextPercentile:
      type: object
      required: [window, percentile, state, n]
      properties:
        window: {type: integer}
        vol: {type: [number, "null"], description: "realised_vol: annualised stdev of the last 20 daily log returns"}
        atr: {type: [number, "null"], description: "atr: Wilder ATR(14) in price units (adjusted)"}
        atr_pct: {type: [number, "null"], description: "atr: ATR / close"}
        percentile: {type: [number, "null"]}
        state: {type: string, enum: [squeeze, normal, expansion, n/a], description: "<= 10th percentile low, >= 90th high"}
        n: {type: integer}
    TechnicalsContext:
      type: object
      description: "Volatility / regime / earnings context (v1.33.0). Descriptive; range_width is model-based."
      required: [security, as_of, model_based, lookback_sessions, range_width, realised_vol, implied_vol, atr, adx, trend, earnings, notes, data_status]
      properties:
        security: {$ref: "#/components/schemas/SecurityRef"}
        as_of: {type: [string, "null"]}
        last_close: {type: [number, "null"]}
        currency: {type: [string, "null"]}
        model_based: {type: boolean}
        lookback_sessions: {type: integer}
        range_width: {$ref: "#/components/schemas/TechnicalsContextRangeWidth"}
        realised_vol: {$ref: "#/components/schemas/TechnicalsContextPercentile"}
        implied_vol:
          type: object
          required: [available, value, note]
          properties:
            available: {type: boolean}
            value: {type: [number, "null"]}
            source: {type: [string, "null"]}
            note: {type: string}
        atr: {$ref: "#/components/schemas/TechnicalsContextPercentile"}
        adx:
          type: object
          required: [window, adx, state]
          properties:
            window: {type: integer}
            adx: {type: [number, "null"]}
            plus_di: {type: [number, "null"]}
            minus_di: {type: [number, "null"]}
            state: {type: string, enum: [weak, emerging, trending, strong, n/a]}
            direction: {type: [string, "null"], enum: [up, down, null]}
        trend:
          type: object
          required: [daily, weekly, alignment]
          properties:
            daily: {type: string, enum: [up, down, flat, n/a]}
            weekly: {type: string, enum: [up, down, flat, n/a]}
            alignment: {type: string, enum: [aligned_up, aligned_down, mixed, partial, flat, n/a], description: "partial = one timeframe flat"}
            daily_close_vs_sma50: {type: [number, "null"]}
            weekly_close_vs_sma30w: {type: [number, "null"]}
        earnings:
          type: object
          required: [next_date, sessions_ahead, in_window, event_pool, typical_abs_move, n_events]
          properties:
            next_date: {type: [string, "null"]}
            session: {type: [string, "null"]}
            date_source: {type: [string, "null"]}
            sessions_ahead: {type: [integer, "null"], description: "Exchange sessions until the expected date"}
            in_window: {type: boolean, description: "Within the calibrated range's 20 sessions"}
            event_pool: {type: boolean, description: "The calibrated range uses the earnings-event calibration pool"}
            typical_abs_move: {type: [number, "null"], description: "Median |CAR[-1,+1]| of the last <= 12 releases"}
            mean_abs_move: {type: [number, "null"]}
            n_events: {type: integer}
            last_release: {type: [string, "null"]}
        notes: {type: object, additionalProperties: {type: string}, description: "Tooltip text per chip"}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    TechnicalsFactorIc:
      type: object
      description: "Out-of-sample rank IC of a factor at one horizon (v1.36.0): pooled over US / EU / UK / JP (n-weighted per weekly origin) and in the security's region"
      required: [horizon]
      properties:
        horizon: {type: integer, description: "Forward sessions (5 / 20 / 60)"}
        mean_ic: {type: [number, "null"], description: "Mean rank IC (raw sign)"}
        aligned_ic: {type: [number, "null"], description: "Mean IC x the literature sign (> 0 = works as documented)"}
        t_stat: {type: [number, "null"], description: "Newey-West t"}
        p_bh: {type: [number, "null"], description: "Benjamini-Hochberg adjusted p over every factor x horizon x region cell"}
        region_ic: {type: [number, "null"], description: "Mean IC in the security's region (null outside US / EU / UK / JP)"}
        region_t: {type: [number, "null"]}
    TechnicalsFactorBadge:
      type: object
      required: [label, tone]
      properties:
        label: {type: string}
        tone: {type: string, enum: [up, down, neutral, warn, info]}
    TechnicalsFactor:
      type: object
      description: "One evidence-based technical factor (v1.36.0)"
      required: [id, label, reference, sign, direction_note, ic, verdict, experimental, badge]
      properties:
        id: {type: string, enum: [hi52, mom, rmom, strev, maxret, ivol, indmom]}
        label: {type: string}
        reference: {type: string, description: "Literature reference (tooltip)"}
        sign: {type: integer, enum: [1, -1], description: "+1 = a higher value historically means higher returns; -1 the opposite"}
        direction_note: {type: string}
        value: {type: [number, "null"], description: "Raw factor value (see the tech_factors column descriptions)"}
        percentile: {type: [number, "null"], description: "0..100 within region x sector among liquid names (raw direction)"}
        aligned_percentile: {type: [number, "null"], description: "0..100 in the favourable direction"}
        cross_section: {type: [string, "null"], description: "sector | region"}
        ic: {type: array, items: {$ref: "#/components/schemas/TechnicalsFactorIc"}}
        verdict: {type: string, enum: [pass, fail, not_validated]}
        experimental: {type: boolean, description: "true = failed / not validated: hidden unless the experimental toggle is on"}
        badge: {$ref: "#/components/schemas/TechnicalsFactorBadge"}
        tradable: {type: [boolean, "null"], description: "Economic check (reported, not part of the factor gate): US quintile long-short Sharpe after costs > 0 and the long-only top quintile beats the equal-weight universe (t >= 2)"}
        note: {type: [string, "null"], description: "Economic reading of a passing factor (rank edge vs mean-return spread, after-cost Sharpe)"}
    TechnicalsFactorComposite:
      type: object
      description: "Composite technical factor score (v1.36.0): value / percentile null unless it passed the gate"
      required: [verdict, experimental, members, note]
      properties:
        verdict: {type: string, enum: [pass, fail, not_validated]}
        experimental: {type: boolean}
        members: {type: array, items: {type: string}, description: "Factors in the composite (fixed ex ante: the walk-forward selection rule applied at the latest year)"}
        variant: {type: [string, "null"]}
        value: {type: [number, "null"], description: "0..100 equal-weight mean of the members' sign-aligned percentiles"}
        percentile: {type: [number, "null"], description: "0..100 within region x sector"}
        ic_20: {type: [number, "null"], description: "Walk-forward composite 20-session aligned rank IC"}
        t_20: {type: [number, "null"]}
        v2_ic_20: {type: [number, "null"], description: "v2 heuristic technical score IC on the same rows"}
        beats_v2: {type: [boolean, "null"]}
        note: {type: string}
    TechnicalsFactorsValidation:
      type: object
      properties:
        generated_at: {type: [string, "null"]}
        n_cells_tested: {type: [integer, "null"], description: "Factor x horizon x region cells tested (multiple testing)"}
        multiple_testing: {type: string}
        passing: {type: array, items: {type: string}}
        period: {type: [string, "null"]}
        universe: {type: [string, "null"]}
    TechnicalsFactors:
      type: object
      description: "Evidence-based technical factors of a security (v1.36.0)"
      required: [security, factors, composite, validation, labels, validation_doc, data_status]
      properties:
        security: {$ref: "#/components/schemas/SecurityRef"}
        as_of: {type: [string, "null"], format: date}
        region: {type: [string, "null"]}
        sector_id: {type: [string, "null"]}
        cross_section: {type: string}
        n_peers: {type: [integer, "null"]}
        liquid: {type: [boolean, "null"], description: "In the validated (liquid) universe: 20-day ADV >= $1M, close >= $1"}
        size_bucket: {type: [string, "null"], enum: [large, mid, small, micro, null]}
        adv20_usd: {type: [number, "null"]}
        region_validated: {type: boolean, description: "Region part of the validation (US / EU / UK / JP)"}
        factors: {type: array, items: {$ref: "#/components/schemas/TechnicalsFactor"}}
        composite: {$ref: "#/components/schemas/TechnicalsFactorComposite"}
        validation: {$ref: "#/components/schemas/TechnicalsFactorsValidation"}
        labels: {type: object, additionalProperties: {type: string}}
        validation_doc: {type: string}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    TechnicalsBreakoutEvidence:
      type: object
      description: "Validation evidence of volume confirmation (v1.36.0; H = 20 sessions)"
      properties:
        confirmed_rate: {type: [number, "null"]}
