    SupplyChainLabels:
      type: object
      required: [disclosed, statistical, model_based, country_risk, look_through, shock]
      properties:
        disclosed: {type: string}
        statistical: {type: string}
        model_based: {type: string}
        country_risk: {type: string}
        look_through: {type: string}
        shock: {type: string}
    SupplyChainCoverage:
      type: object
      required: [level, has_disclosed_links, has_geo_revenue, n_neighbours_stat, note]
      properties:
        level: {type: string, enum: [full, partial, sparse], description: "full = geographic revenue + disclosed links; partial = one of them; sparse = home country / statistical only"}
        has_disclosed_links: {type: boolean}
        has_geo_revenue: {type: boolean}
        n_neighbours_stat: {type: integer}
        geo_method: {type: [string, "null"], description: "xbrl_dimensional | ixbrl_textblock_table (parsed ESEF note table)"}
        note: {type: string}
    SupplyChainMetrics:
      type: object
      required: [n_customers, n_customers_resolved, n_suppliers, n_suppliers_resolved, n_unweighted, n_neighbours_stat, n_countries]
      properties:
        n_customers: {type: integer}
        n_customers_resolved: {type: integer}
        n_suppliers: {type: integer}
        n_suppliers_resolved: {type: integer}
        n_unweighted: {type: integer, description: "Customer edges without a disclosed revenue share"}
        n_neighbours_stat: {type: integer}
