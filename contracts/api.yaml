      summary: Latest filings - real-time hot store merged over the nightly snapshot (live wins by filing_id)
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 500}}
        - {name: source_id, in: query, schema: {type: string}, description: "sec_edgar | fca_nsm | tdnet | hkex | opendart"}
        - {name: issuer_id, in: query, schema: {type: string}}
        - {name: security_id, in: query, schema: {type: string}}
        - {name: form_class, in: query, schema: {type: string}, description: "annual | quarterly | current_report | insider | holdings | ..."}
        - {name: include_snapshot, in: query, schema: {type: boolean, default: true}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LiveFilingPage"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/live/news:
    get:
      tags: [live]
      operationId: getLiveNews
      summary: Latest news (official press RSS + Polygon) merged over the snapshot news (live wins by item_id)
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 500}}
        - {name: source_id, in: query, schema: {type: string}, description: "rss_fed | rss_ecb | rss_boe | rss_boj | rss_bls_* | rss_bea | rss_eurostat | rss_ons | polygon_news"}
        - {name: issuer_id, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string, enum: [central_bank, statistics, news]}, description: "Live items only (the snapshot has no category)"}
        - {name: include_snapshot, in: query, schema: {type: boolean, default: true}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LiveNewsPage"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/live/events:
    get:
      tags: [live]
      operationId: getLiveEvents
      summary: Latest GDELT 15-minute items (labelled articles, salient events, slot summaries) from the hot store
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 500}}
        - {name: kind, in: query, schema: {type: string, enum: [article, event, slot]}, description: "Default article + event"}
        - {name: issuer_id, in: query, schema: {type: string}}
        - {name: theme, in: query, schema: {type: string}, description: "events_v2 theme id"}
        - {name: country, in: query, schema: {type: string}, description: "ISO2 or GLOBAL"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LiveEventPage"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/live/macro:
    get:
      tags: [live]
      operationId: getLiveMacro
      summary: Macro releases captured live (actual + surprise vs the model-based expectation) merged over the snapshot release outcomes
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 500}}
        - {name: country, in: query, schema: {type: string}}
        - {name: series_id, in: query, schema: {type: string}}
        - {name: include_snapshot, in: query, schema: {type: boolean, default: true}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LiveMacroPage"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/live/alerts:
    get:
      tags: [live]
      operationId: getLiveAlerts
      summary: Latest alert events - live-fired (hot store) merged with app_state alert_events (dedupe by event_id)
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 500}}
        - {name: unread_only, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LiveAlertPage"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/live/status:
    get:
      tags: [live]
      operationId: getLiveStatus
      summary: Real-time layer health - per stream / consumer status, lag, freshness, throughput, errors; bus topics and consumer-group lag
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LiveStatus"}}}}
  /api/v1/live/quotes:
    get:
      tags: [live]
      operationId: getLiveQuotes
      summary: Last DELAYED quotes (quotes service; Yahoo / Polygon, personal use) with market state - never the official close
      description: >
        Added v1.40.0. Reads data/realtime/quotes.sqlite (written by the supervisor child `quotes`). ids accepts
        security ids (S..., IDX:^GSPC, ETF:SPY), tickers (MSFT, 7203.T) and bare index / FX / futures symbols (^GSPC,
        EURUSD=X, ES=F). Requested ids (record=true) are polled by the service for the next 30 minutes even when they
        are in no watchlist. data_status pending + reason when the service has not stored anything yet.
      parameters:
        - {name: ids, in: query, schema: {type: string}, description: "Comma list (max 300)"}
        - {name: set, in: query, schema: {type: string, enum: [header]}, description: "header = the LIVE strip ticker set (main indices, VIX, 10y, FX majors, gold, oil, bitcoin)"}
        - {name: record, in: query, schema: {type: boolean, default: true}, description: "Register the ids for on-demand polling"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LiveQuotesPage"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/live/feeds:
    get:
      tags: [live]
      operationId: getLiveFeeds
      summary: Live fetchers health (Data Health > Live feeds) - per feed last poll, latency, items / hour, errors and the reason when idle / down
      description: Added v1.40.0.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LiveFeeds"}}}}
  /api/v1/live/stream:
    get:
      tags: [live]
      operationId: streamLive
      summary: Server-Sent Events push of the public real-time topics
      description: >
        text/event-stream. Frames: `id: <bus id>` (global, strictly increasing), `event: <topic>` (filings | news |
        events | macro | alerts | signals | news.item | news.story | quotes.tick | quotes.session) and `data: <LiveStreamEvent JSON>`. Control frames: `event: hello`
        (LiveStreamHello, first frame), `event: heartbeat` (LiveStreamHeartbeat, every heartbeat_s when idle;
        frames carry no id) and a `retry: 3000` hint. Resume: the browser's EventSource sends the Last-Event-ID
        header automatically on reconnect; the first connection may pass `last_event_id` (query) or `replay` (send the
        newest N retained messages first). Without either, the stream starts at the current head. Messages older than
        the hot-store retention (filings 14 d, news 7 d, events 72 h, macro 60 d, alerts 30 d) cannot be replayed.
      parameters:
        - {name: topics, in: query, schema: {type: string, default: "filings,news,macro,alerts"}, description: "Comma list of filings, news, events, macro, alerts, signals, news.item, news.story, quotes.tick, quotes.session"}
        - {name: last_event_id, in: query, schema: {type: integer, minimum: 0}, description: "Resume after this id (the Last-Event-ID header wins when present)"}
        - {name: replay, in: query, schema: {type: integer, default: 0, minimum: 0, maximum: 500}, description: "Without a resume id: first send the newest N messages of the topics"}
        - {name: types, in: query, schema: {type: string}, description: "Comma list of message types to keep (filing, release, article, event, slot, central_bank, statistics, news, insider, changepoint, new_filing, insider_buy, macro_release, macro_surprise)"}
        - {name: heartbeat_s, in: query, schema: {type: number, default: 15, minimum: 1, maximum: 120}}
        - {name: max_events, in: query, schema: {type: integer, minimum: 1, maximum: 100000}, description: "Close after N data events (tests / tools)"}
        - {name: timeout_s, in: query, schema: {type: number, minimum: 0, maximum: 86400}, description: "Close after N seconds (tests / tools)"}
      responses:
        "200":
          description: Event stream (see description); data frames are LiveStreamEvent JSON
          content:
            text/event-stream:
              schema: {type: string}
          x-sse-data-schemas:
            data: "#/components/schemas/LiveStreamEvent"
            hello: "#/components/schemas/LiveStreamHello"
            heartbeat: "#/components/schemas/LiveStreamHeartbeat"
        "422": {$ref: "#/components/responses/Invalid"}

