        kind: {type: string, enum: [metric, expr, xa, macro], description: "metric = screener field id (ref); expr = formula-engine expression over screener field ids; xa = '<asset_id>:<signal>' of xa_latest; macro = '<CC>:<indicator>' heatmap cell. Sector / country subjects use the median of members."}
        ref: {type: [string, "null"]}
        expr: {type: [string, "null"]}
        op: {type: string, enum: [gt, gte, lt, lte, between], description: "The threshold describes the HEALTHY condition; a breach is the condition failing"}
        threshold: {type: number}
        threshold_hi: {type: [number, "null"]}
