  # ======================================================================= EVENT MODELS (event-models, v1.18)
  /api/v1/events/models/hotspots:
    get:
      tags: [events-models]
      operationId: getEventsModelsHotspots
      summary: Spatial hotspots by week x theme x measure - global Moran's I, LISA clusters, Getis-Ord Gi* bins, emerging-hotspot classes (model-based)
      parameters:
        - {name: week, in: query, schema: {type: string, format: date}, description: "Any date of the ISO week (default latest)"}
        - {name: theme, in: query, schema: {type: string, default: all}, description: "Theme id (/events/v2/taxonomy) or all"}
        - {name: measure, in: query, schema: {type: string, enum: [attention, tone, intensity], default: attention}}
        - {name: only_significant, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsModelsHotspots"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/models/spillovers:
    get:
      tags: [events-models]
      operationId: getEventsModelsSpillovers
      summary: Spatial spillover models (OLS-FE, SLX, SAR, SEM, SDM) of event shocks on index returns / volatility / macro surprises, effects and per-country transmitters / receivers (model-based)
      parameters:
        - {name: response, in: query, schema: {type: string, enum: [ret, vol, macro_surprise], default: ret}}
        - {name: shock, in: query, schema: {type: string, default: attention_all}, description: "attention_all | tone_all | attention_geo"}
        - {name: w_kind, in: query, schema: {type: string, default: contiguity}}
        - {name: as_of, in: query, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, default: 10, minimum: 1, maximum: 100}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsModelsSpillovers"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/models/connectedness:
    get:
      tags: [events-models]
      operationId: getEventsModelsConnectedness
      summary: Rolling Diebold-Yilmaz connectedness (generalized FEVD) of country indices / US sector ETFs - total, directional, pairwise (model-based)
      parameters:
        - {name: universe, in: query, schema: {type: string, enum: [country_ret, country_vol, sector_ret, sector_vol], default: country_ret}}
        - {name: date, in: query, schema: {type: string, format: date}, description: "Window end (default latest; latest window <= date)"}
        - {name: history_days, in: query, schema: {type: integer, default: 1095, minimum: 30, maximum: 6000}}
        - {name: pairs, in: query, schema: {type: integer, default: 40, minimum: 0, maximum: 500}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsModelsConnectedness"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/models/irf:
    get:
      tags: [events-models]
      operationId: getEventsModelsIrf
      summary: Impulse responses of country returns / volatility to event shocks - panel local projections (own + spatially lagged shock) and spatial VAR (model-based)
      parameters:
        - {name: response, in: query, schema: {type: string, enum: [ret, vol], default: ret}}
        - {name: shock, in: query, schema: {type: string, default: attention_all}}
        - {name: model, in: query, schema: {type: string, enum: [lp, svar], default: lp}}
        - {name: scope, in: query, schema: {type: string, default: "*"}, description: "'*' = panel / all units; svar: shocked ISO2"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsModelsIrf"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/models/escalation:
    get:
      tags: [events-models]
      operationId: getEventsModelsEscalation
      summary: Hawkes escalation risk per country x theme group - branching ratio, cross-excitation with neighbours, 7 / 30-day escalation probabilities (model-based)
      parameters:
        - {name: theme_group, in: query, schema: {type: string}, description: "Taxonomy theme group (geo, social, politics, macro, ...) or all"}
        - {name: iso2, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: sort, in: query, schema: {type: string, enum: [p_escalation_7d, p_escalation_30d, branching_ratio, expected_7d], default: p_escalation_7d}}
        - {name: min_events, in: query, schema: {type: integer, default: 100, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 1000}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsModelsEscalation"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/models/changepoints:
    get:
      tags: [events-models]
      operationId: getEventsModelsChangepoints
      summary: Bayesian online change points of attention / tone per label (model-based)
      parameters:
        - {name: label_type, in: query, schema: {type: string, enum: [country, sector, issuer]}}
        - {name: label, in: query, schema: {type: string}, description: "ISO2 / sector id / issuer_id"}
        - {name: stream, in: query, schema: {type: string, enum: [attention, tone]}}
        - {name: theme, in: query, schema: {type: string}, description: "Theme id or all"}
        - {name: direction, in: query, schema: {type: string, enum: [up, down, flat]}}
        - {name: days, in: query, schema: {type: integer, default: 30, minimum: 1, maximum: 730}}
        - {name: min_shift, in: query, schema: {type: number, default: 0, minimum: 0, maximum: 100}, description: "Minimum |shift_sd|"}
        - {name: limit, in: query, schema: {type: integer, default: 100, minimum: 1, maximum: 2000}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsModelsChangepoints"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/models/gpr:
    get:
      tags: [events-models]
      operationId: getEventsModelsGpr
      summary: Model-based geopolitical-risk index per country / GLOBAL, with the published Caldara-Iacoviello GPRD as reference and the validation report
      parameters:
        - {name: iso2, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "Default GLOBAL"}
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {name: days, in: query, schema: {type: integer, default: 365, minimum: 7, maximum: 6000}}
        - {name: top, in: query, schema: {type: integer, default: 30, minimum: 0, maximum: 300}, description: "Countries in `latest` (highest 7-day mean)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsModelsGpr"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/models/event-studies:
    get:
      tags: [events-models]
      operationId: getEventsModelsEventStudies
      summary: Event-study library (CAR / BHAR after labelled shocks by theme x country x sector) and the expected-reaction lookup (model-based)
      parameters:
        - {name: theme, in: query, schema: {type: string}, description: "Theme id or all; enables `expected`"}
        - {name: iso2, in: query, schema: {type: string}, description: "Country ISO2 or ALL"}
        - {name: sector, in: query, schema: {type: string}, description: "Sector id or ALL"}
        - {name: level, in: query, schema: {type: string, enum: [country_index, sector_etf, issuer]}}
        - {name: shock_kind, in: query, schema: {type: string, enum: [attention, neg_tone], default: attention}}
        - {name: window, in: query, schema: {type: string, default: "0,5"}, description: "Event window in trading days ('0,1', '0,5', '-1,5', '0,10')"}
        - {name: min_n, in: query, schema: {type: integer, default: 3, minimum: 2, maximum: 1000}}
        - {name: max_p, in: query, schema: {type: number, default: 1, exclusiveMinimum: 0, maximum: 1}}
        - {name: sort, in: query, schema: {type: string, enum: [p_value, mean_car, n_events], default: p_value}}
        - {name: limit, in: query, schema: {type: integer, default: 100, minimum: 1, maximum: 2000}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsModelsEventStudies"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/models/company/{security_id}:
    get:
      tags: [events-models]
