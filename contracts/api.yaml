  # ======================================================================= BACKTEST (roadmap v2 #4, v1.24.0)
  /api/v1/backtest/catalog:
    get:
      tags: [backtest]
      operationId: backtestCatalog
      description: "Signal sources and fields with point-in-time coverage, screen fields evaluated point-in-time, event triggers, macro regimes (W4 states), assets, benchmarks, presets, default costs and the survivorship caveat. Cached per serving snapshot."
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestCatalog"}}}}
  /api/v1/backtest/validate:
    post:
      tags: [backtest]
      operationId: backtestValidate
      description: "Parse a spec, build its point-in-time panel plan (no data read) and estimate the run time (sync below sync_budget_s)."
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestValidateRequest"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestValidation"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/backtest/from-screen:
    post:
      tags: [backtest]
      operationId: backtestFromScreen
      description: "Translate a Screener query (POST /screener/query body) into a draft backtest spec whose screen rules are evaluated point-in-time at each rebalance; fields without point-in-time history are listed in `dropped`."
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestFromScreenRequest"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestFromScreen"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/backtest/runs:
    get:
      tags: [backtest]
      operationId: backtestListRuns
      parameters:
        - {name: strategy_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 100, minimum: 1, maximum: 500}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/BacktestRunStatus"}}}}}
    post:
      tags: [backtest]
      operationId: backtestSubmitRun
      description: >
        Submit a backtest. mode=auto runs inline when the estimate is below sync_budget_s (200 with the finished run and
        result), otherwise the run is queued on the worker (job backtest_run; 202, poll GET /backtest/runs/{run_id}).
        With strategy_id the run counts toward the strategy multiple-testing counter (deflated Sharpe).
        Invalid specs answer 422 with Problem.type = "urn:backtest:<code>" (invalid_spec, spec, dataset).
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestRunRequest"}}}}
      responses:
        "200": {description: Finished inline (sync), content: {application/json: {schema: {$ref: "#/components/schemas/BacktestRun"}}}}
        "202": {description: Queued on the worker (async), content: {application/json: {schema: {$ref: "#/components/schemas/BacktestRun"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/backtest/runs/{run_id}:
    get:
      tags: [backtest]
      operationId: backtestGetRun
      description: "Status and, once terminal, the result (metrics full / in-sample / out-of-sample holdout, curves, deciles, attribution, regimes, robustness incl. deflated Sharpe and PBO) and the reproducibility block."
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
        - {name: series, in: query, schema: {type: string, enum: [full, weekly, none], default: full}, description: "result.series resolution: full daily curves, weekly (last day of each week + the final day) or none (arrays empty; metrics only) - F30 payload size. Added v1.30."}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestRun"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [backtest]
      operationId: backtestCancelRun
      description: "Cancel a queued or running run (cooperative). Terminal runs are returned unchanged."
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestRunStatus"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/backtest/runs/{run_id}/holdings:
    get:
      tags: [backtest]
      operationId: backtestRunHoldings
      description: "Target book at one rebalance date (default the latest) with signal, rank percentile and group."
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, default: 500, minimum: 1, maximum: 5000}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestHoldings"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/backtest/runs/{run_id}/trades:
    get:
      tags: [backtest]
      operationId: backtestRunTrades
      description: "Rank mode: one row per name traded at each rebalance (delta weight, cost bps). Event mode: round trips (entry / exit, return, holding days, exit reason)."
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
        - {name: entity_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 500, minimum: 1, maximum: 5000}}
        - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BacktestTrades"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/backtest/runs/{run_id}/export.py:
    get:
      tags: [backtest]
      operationId: backtestExportRun
      description: "Standalone Python script (text/x-python) embedding the Studio dataset engine, the formula engine and the backtest engine + panel builder: rebuilds the point-in-time panel from the Parquet lake and re-simulates the strategy (prints RESULT_JSON)."
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Python source, content: {text/x-python: {schema: {type: string}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Run not completed, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
  /api/v1/backtest/compare:
