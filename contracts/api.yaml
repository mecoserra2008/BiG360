      type: object
      required: [name, kind, status, events_total, events_1h, errors, restarts]
      properties:
        name: {type: string, description: "edgar, fca_nsm, tdnet, hkex, dart, rss_official, macro_capture, gdelt, polygon_news | enrich, insider, changepoint, alerts"}
        kind: {type: string, description: "stream | consumer"}
        status: {type: string, description: "starting | ok | idle | backoff | disabled | failed | stopped"}
        detail: {type: [string, "null"]}
        events_total: {type: integer, description: "New (non-duplicate) messages published since start"}
        events_1h: {type: integer}
        throughput_per_min: {type: [number, "null"]}
        last_event_at: {type: [string, "null"], format: date-time}
        last_event_source_ts: {type: [string, "null"], format: date-time}
        freshness_s: {type: [number, "null"], description: "Seconds since the last published event"}
        lag_s_p50: {type: [number, "null"], description: "Source publish -> bus ingest, fresh items only"}
        lag_s_p95: {type: [number, "null"]}
        lag_s_last: {type: [number, "null"]}
        consumer_lag: {type: [integer, "null"], description: "Consumers: unprocessed messages"}
        errors: {type: integer}
        consecutive_errors: {type: [integer, "null"]}
        last_error: {type: [string, "null"]}
        last_error_at: {type: [string, "null"], format: date-time}
        restarts: {type: integer}
        last_poll_at: {type: [string, "null"], format: date-time}
        next_poll_at: {type: [string, "null"], format: date-time}
    # ------------------------------------------------------------------ News Terminal (roadmap v3 N4, v1.38.0)
    NewsTerminalItem:
      type: object
      description: "One live news item (RSS / Atom headline, Polygon news, or GDELT article). origin live = R1 bus (news.item), intraday = 7-day intraday store. latency_s = first seen by the live path - source publication time (null for undated entries). sentiment model-based (FinBERT for English live, XLM-R for other languages in the hourly job)."
      required: [origin, item_key, kind, tier, title, tickers, security_ids, issuer_ids, countries, sectors, themes, story_size, story_sources]
      properties:
        live_id: {type: [integer, "null"], description: "Bus id (= SSE id) for live items"}
        origin: {type: string, enum: [live, intraday]}
        item_key: {type: string, description: "Idempotency key (news_items item_id for RSS / Polygon; gdelt:a:<url_hash> for GDELT)"}
        kind: {type: string, enum: [news, gdelt]}
        source_id: {type: [string, "null"], description: "Feed id (rss_*), polygon_news or gdelt_gkg"}
        tier: {type: integer, minimum: 1, maximum: 4, description: "1 official, 2 major financial press, 3 other publisher, 4 GDELT web"}
        category: {type: [string, "null"], description: "central_bank | statistics | regulator | exchange | publisher | news | web"}
        publisher: {type: [string, "null"]}
        title: {type: string}
        snippet: {type: [string, "null"], description: "Feed summary, HTML stripped, <= 300 chars"}
        url: {type: [string, "null"]}
        language: {type: [string, "null"]}
        published_at: {type: [string, "null"], format: date-time}
        first_seen_at: {type: [string, "null"], format: date-time}
        latency_s: {type: [number, "null"]}
        tickers: {type: array, items: {type: string}}
        security_ids: {type: array, items: {type: string}}
        issuer_ids: {type: array, items: {type: string}}
        countries: {type: array, items: {type: string}}
        sectors: {type: array, items: {type: string}}
        themes: {type: array, items: {type: string}}
        sentiment: {type: [number, "null"], description: "P(pos) - P(neg), model-based"}
        sentiment_model: {type: [string, "null"]}
        tone: {type: [number, "null"], description: "GDELT tone (GDELT items)"}
        salience: {type: [number, "null"]}
        story_id: {type: [string, "null"], description: "Decimal int64 story id"}
        story_size: {type: integer}
        story_sources: {type: integer}
        story_first_seen: {type: [string, "null"], format: date-time}
    NewsTerminalPage:
      type: object
      required: [data_status, items]
      properties:
        data_status: {$ref: "#/components/schemas/DataStatus"}
        generated_at: {type: [string, "null"], format: date-time}
        head_id: {type: [integer, "null"], description: "Bus head id (resume the SSE stream after it)"}
        n_live: {type: integer}
        n_intraday: {type: integer}
        intraday_built_at: {type: [string, "null"]}
        next_before: {type: [string, "null"], description: "Cursor for the next (older) page"}
        query_ms: {type: [number, "null"]}
        items: {type: array, items: {$ref: "#/components/schemas/NewsTerminalItem"}}
    NewsStorySecurity:
      type: object
      properties:
        security_id: {type: [string, "null"]}
        issuer_id: {type: [string, "null"]}
        ticker: {type: [string, "null"]}
        name: {type: [string, "null"]}
        relevance: {type: [number, "null"]}
    NewsStory:
      type: object
      required: [story_id, origin, title, n_articles, n_sources, themes, sectors, countries, securities]
      properties:
        story_id: {type: string}
        origin: {type: string, enum: [live, intraday, snapshot]}
        title: {type: string}
        first_ts: {type: [string, "null"], format: date-time}
