      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisStatus"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/theses/{thesis_id}/performance:
    get:
      tags: [theses]
      operationId: getThesisPerformance
      description: "Performance since inception (to close or as_of) of price_id vs benchmark and sector benchmark: adjusted closes from the shared price reader; local currency when all legs share one, else USD via close_usd / close (official FX). thesis_return and excess are direction-signed. Series rebased to 100."
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisPerformance"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/theses/{thesis_id}/timeline:
    get:
      tags: [theses]
      operationId: getThesisTimeline
      description: "Price bars of price_id (unadjusted close, the unit of the bands; weekly beyond 3 years) around the thesis life, the entry / target / stop bands and markers (journal entries, triggered alerts, catalysts, reviews)."
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisTimeline"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/theses/{thesis_id}/evidence:
    get:
      tags: [theses]
      operationId: getThesisEvidence
      description: "Linked evidence for the subject: filings, news stories (events v2), event shocks (GDELT attention / tone z, model-based), earnings history + upcoming dates, macro surprises (model-based expectations, not consensus)."
      parameters:
        - {name: thesis_id, in: path, required: true, schema: {type: string}}
        - {name: days, in: query, schema: {type: integer, default: 365, minimum: 30, maximum: 2600}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisEvidence"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
