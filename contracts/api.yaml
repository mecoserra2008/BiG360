        - {$ref: "#/components/parameters/SecurityId"}
        - {name: days, in: query, schema: {type: integer, default: 180}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CompanySentiment"}}}}
  /api/v1/companies/{security_id}/events:
