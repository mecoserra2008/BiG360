    LiveStreamEvent:
      type: object
      description: "SSE data frame. item has the shape of the topic's REST item (LiveFiling | LiveNewsItem | LiveEventItem | LiveMacroItem | LiveAlertItem | LiveSignalItem)."
      required: [id, topic, type, key, ts_ingest, sent_at, item]
      properties:
        id: {type: integer, description: "Global bus id (= SSE id)"}
        topic: {type: string, enum: [filings, news, events, macro, alerts, signals, news.item, news.story, quotes.tick, quotes.session], description: "news.item / news.story (v1.38.0): News Terminal item (NewsTerminalItem) / live story update (NewsStory). quotes.tick (v1.40.0): item = LiveQuotesTick (the delayed quotes that changed in one poll); quotes.session (v1.40.0): item = LiveMarketSession (a market opened / closed)"}
        type: {type: string, description: "filing | central_bank | statistics | news | article | event | slot | release | insider | changepoint | <alert rule_type>"}
        key: {type: string, description: "Natural / idempotency key"}
        ts_source: {type: [string, "null"], format: date-time, description: "Source publication time"}
        ts_ingest: {type: string, format: date-time, description: "Bus write time of this public message"}
        sent_at: {type: string, format: date-time, description: "Server send time (end-to-end latency = client receive - ts_source)"}
        item: {type: object, additionalProperties: true}
    LiveStreamHello:
      type: object
      required: [topics, last_event_id, server_time]
      properties:
        topics: {type: array, items: {type: string}}
