      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PortfolioExposureRequest"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PortfolioExposure"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}

  # ======================================================================= CONFORMAL (v1.32.0)
  /api/v1/conformal/envelope/{security_id}:
    get:
      tags: [conformal, companies]
      operationId: getConformalEnvelope
      summary: Calibrated range - marginal per-horizon conformal bands (80 / 90 / 95% at 1 / 5 / 10 / 20 sessions) as prices; next-bar bands flagged experimental; pool coverage
      description: "MODEL-BASED (docs/CONFORMAL_VALIDATION.md). Each band is calibrated alone (marginal split-conformal radius qm on y^2 / V(h), pooled by region x sector, separate earnings-event pool): calibrated to X% over history (2010-2026 walk-forward 89.6-90.0% at 90%), never 'X% chance today'; not sharper than a calibrated ATR band. The joint simultaneous 1/5/10/20 envelope failed the validation gate and is not served. nextbar (high / low / close) bands pass coverage but fail sharpness: experimental. coverage = rolling audit of the security's region (source rolling) + the P4 walk-forward (source walk_forward). Added v1.32.0."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ConformalEnvelope"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/technicals/{security_id}/context:
    get:
      tags: [company]
      operationId: getTechnicalsContext
      summary: Volatility, regime and earnings context for the Technicals tab (range-width squeeze / expansion, realised / implied vol, ATR and ADX, trend alignment, earnings)
      description: "Computed at query time from the security's adjusted daily bars (~3.5 years), the calibrated range (cf_envelopes) and the earnings tables. range_width: today's calibrated 20-session 90% band width (MODEL-BASED) vs the same band on each of the last 504 sessions (EWMA volatility term with today's radius, earnings jump included when an event is inside the window); squeeze <= 10th percentile, expansion >= 90th. Percentiles = share of the lookback <= today's value. implied_vol is n/a: no per-stock option-implied source. Descriptive context, not a signal. Added v1.33.0."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TechnicalsContext"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/technicals/{security_id}/setup-probabilities:
    get:
      tags: [company]
      operationId: getTechnicalsSetupProbabilities
      summary: Probabilistic trade setup - P(T1 before invalidation within H), P(loss), P(neither), expected R after costs, break-even P(win)
      description: "MODEL-BASED, calibrated on history (docs/TECHNICALS_V2_VALIDATION.md). Two-barrier path probabilities from the last close: empirical first-passage frequencies at the same distances in volatility units (sigma_H = sqrt(V(H)) of the conformal EWMA filter incl. the earnings jump), pooled by region x vol regime x earnings window, shrunk and monotone-smoothed (tech_prob_surfaces). Not Gaussian. A same-bar touch of both barriers counts as a loss. expected_r = P(win) x R:R - P(loss) - round-trip costs (Backtest Lab cost model), R:R from the close; expected_r_mtm adds P(neither) x the mean R of paths that hit neither by H. break_even_p = risk / (reward + risk). Baselines: p_win_naive (R:R only, 1 / (1 + R:R)) and p_win_bm (driftless Brownian two-barrier). With target + stop (both) the probabilities are computed at query time for those barriers (thesis target / stop), mode = custom. Each horizon carries its gate verdict; experimental = failed the T6 gate. Added v1.34.0."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
        - {name: target, in: query, required: false, schema: {type: number, exclusiveMinimum: 0}, description: "Custom target price (requires stop)"}
        - {name: stop, in: query, required: false, schema: {type: number, exclusiveMinimum: 0}, description: "Custom stop / invalidation price (requires target)"}
        - {name: direction, in: query, required: false, schema: {type: string, enum: [long, short]}, description: "Custom direction (default: long when target > close)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TechnicalsSetupProbabilities"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/technicals/{security_id}/meta-setup:
    get:
      tags: [company]
      operationId: getTechnicalsMetaSetup
      summary: Meta-labelled trade setup - context-adjusted P(T1 before invalidation within H), expected R, take / skip, suggested size and top drivers
      description: "MODEL-BASED, calibrated on history (docs/TECHNICALS_V3_VALIDATION.md, section Meta-labelling). A secondary (meta) model re-estimates the chance that the primary trade setup wins (T1 before the invalidation within H sessions; triple barrier with a vertical barrier at H) starting from the v2 T2 two-barrier probability as an offset and adjusting it for context known at the setup close: market regime (W4 states, lagged), cross-asset risk gauge, VIX, peer-group break-away, insider / short-interest / smart-money flow, earnings proximity, squeeze percentile, ADX, trend alignment, sector / region. Regularised logistic regression or XGBoost (chosen in-sample), Platt / isotonic / no recalibration, purged walk-forward with an embargo >= H and average-uniqueness weights. expected_r = p_win x R:R - p_loss - costs + p_neither x E[R | neither]; take = expected_r > threshold (chosen on the training history only); kelly_fraction = 0.25 x E[R] / E[R^2] capped at 2% of equity at risk; drivers = largest contributions beyond the T2 offset (logit units). Every horizon carries two gates: gate (meta_h*: calibration) and decision_gate (decision_h*: economic check of take / skip and size in the Backtest Lab engine); experimental = failed / not validated or outside the validated universe (US / EU / UK / JP). Added v1.35.0."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
        - {name: horizon, in: query, required: false, schema: {type: integer, enum: [10, 20, 40], default: 20}, description: "Preferred horizon (all three are returned)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TechnicalsMetaSetup"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/technicals/{security_id}/zones:
    get:
      tags: [company]
      operationId: getTechnicalsZones
      summary: Confluence zones with P(hold | touch), the random-control probability, edge vs random (significance flag) and P(touch) x P(hold | touch)
      description: "MODEL-BASED. p_hold = calibrated P(hold | touch) (hold = a reversal >= 1.5 sigma before a close beyond the far edge by >= 0.5 sigma within 10 sessions of the touch; calibrated classifier, purged walk-forward, isotonic). p_hold_ctrl = the same pipeline trained on random control bands (level_type_backtest control) for the zone's band features; edge = p_hold - p_hold_ctrl; edge_significant = the walk-forward bucket CI of the realised edge excludes 0 (else edge_label 'no reliable edge'). p_touch = conformal touch probability of the near edge within `horizon` sessions (1 when the close is inside). p_touch_hold = p_touch x p_hold. experimental = failed the T6 gate. Added v1.34.0."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
        - {name: horizon, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 20, default: 20}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TechnicalsZones"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/technicals/{security_id}/score-calibration:
    get:
      tags: [company]
      operationId: getTechnicalsScoreCalibration
      summary: Calibrated technical score - percentile sub-scores within region x sector and the score bucket's historical forward outcomes (5 / 20 / 60 sessions)
      description: "Historical frequencies (docs/TECHNICALS_V2_VALIDATION.md). sub_scores: the original 0..100 sub-score (raw) and its percentile rank within region x sector (additive; the raw scores saturate at 0 / 100). buckets: the technical_score decile's next 5 / 20 / 60-session excess log return vs the region's equal-weight universe (median, IQR, hit rate, n, month-block bootstrap CIs) over the 2003-2026 history of the gate universe; edge_significant = walk-forward rank IC t >= 2, monotone deciles and a top-bottom spread CI excluding 0. tables = the full decile table per horizon. experimental = failed the T6 gate. Added v1.34.0."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TechnicalsScoreCalibration"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/technicals/{security_id}/factors:
    get:
      tags: [company]
      operationId: getTechnicalsFactors
      summary: Evidence-based technical factors - raw value, percentile within region x sector and each factor's own out-of-sample edge (rank IC) and gate verdict
      description: "Technicals v3 #1 (docs/TECHNICALS_V3_VALIDATION.md). Seven literature factors computed point-in-time from daily bars (tech_factors): hi52 (George & Hwang 2004), mom 12-1 (Jegadeesh & Titman 1993), rmom residual momentum (Blitz, Huij & Martens 2011), strev 1-month reversal, maxret MAX (Bali, Cakici & Whitelaw 2011), ivol idiosyncratic volatility (Ang et al. 2006), indmom industry momentum (Moskowitz & Grinblatt 1999). percentile = rank 0..100 of the raw value among the LIQUID names of the same region x sector and session (region for indmom / thin sectors); aligned_percentile = the percentile in the direction the literature reports as better (100 - percentile for the negative-sign factors). ic = the factor's walk-forward rank IC on this app's data (weekly origins 2005-2026, US / EU / UK / JP liquid universe, sector-neutral forward log returns from the next close) pooled over regions, with Newey-West t, BH-adjusted p, and the security's region; verdict / experimental = the pre-registered gate (experimental = failed: hidden by default in the UI). composite = equal-weight mean of the sign-aligned percentiles of the gate-passing members, value null unless the composite passed the gate. Factors are deterministic price transforms; the edge statistics are historical, not a forecast. Added v1.36.0."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TechnicalsFactors"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/technicals/{security_id}/breakout:
    get:
      tags: [company]
      operationId: getTechnicalsBreakout
      summary: Latest breakout (20 / 55-session high / low) with its state, volume confirmation and calibrated P(follow-through)
      description: "Technicals v3 #5 (docs/TECHNICALS_V3_VALIDATION.md). The latest breakout of the last 20 sessions (tech_breakout_state): state active (still beyond the level, target not reached) / followed_through (the high reached close x exp(sigma sqrt 20) before a close back inside the level) / failed (closed back inside first) / none. confirmed = the pre-registered volume confirmation (volume >= 1.5 x its 50-session average and the close in the upper quarter of the range; lower quarter for a down breakout); confirm_score = fixed 0..100 score (relative volume, close location, Chaikin money flow, OBV slope). p_follow = calibrated P(follow-through within 20 sessions) at the event (MODEL-BASED, logistic + isotonic, purged walk-forward); p_geo = the geometry-only baseline (distance beyond the level, volatility regime, lookback, direction, region); base_rate = the historical rate of all breakouts of that lookback. evidence = the validation result (confirmed vs unconfirmed follow-through, geometry-adjusted, vs random controls) with its verdict. experimental = the P(follow-through) gate failed. Added v1.36.0."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TechnicalsBreakout"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/conformal/touch:
    get:
      tags: [conformal, companies]
      operationId: getConformalTouch
      summary: Calibrated chance of touching price levels within h sessions (given levels, or automatically the security's confluence zones and technical levels)
      description: "Historical frequency of touching the level within h sessions for similar setups: the share of the pool's calibration origins whose standardised running high / low (max_k log(H_t+k / C_t) / sqrt(V(h))) reached the level's standardised distance (calibrated within 0.2 pp over 2011-2026). Validated horizons 1 / 5 / 10 / 20 (calibrated = true); 21-252 sessions reuse the 20-session curve with the variance scaled by h (extrapolated = true, NOT validated). Without `levels`: confluence zones (near edge; inside = 1) + the nearest still-valid technical levels. p_touch <= 0.005 means < 1% (beyond the calibrated tail). Added v1.32.0."
      parameters:
        - {name: security_id, in: query, required: true, schema: {type: string}}
        - {name: levels, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "Price levels in the trading currency (repeat or comma-separate, <= 50); omitted = automatic mode"}
        - {name: horizon, in: query, schema: {type: integer, minimum: 1, maximum: 252, default: 20}, description: "Sessions"}
        - {name: max_levels, in: query, schema: {type: integer, minimum: 1, maximum: 40, default: 12}, description: "Automatic mode: technical levels nearest to the close"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ConformalTouch"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/conformal/peer-groups:
    get:
      tags: [conformal, sectors]
      operationId: getConformalPeerGroups
      summary: Peer-group joint anomaly (GCN-GRU + ACI ellipsoid) - latest calibrated percentile per group, and for one group (group_id, or the security's group) history, member contributions, break-away member and definition
      description: "Descriptive and model-based; NOT a trading signal (fading the break-away name had no economic value in validation). score = squared Mahalanobis distance of the members' one-day log returns from the law emitted at the previous close; score_pct = calibrated percentile among the rolling calibration window; anomaly_90 / anomaly_95 = score above the conformal radius (ACI). contrib = exact additive share r_i (Sigma^-1 r)_i; z_cond = move given the other members (break-away measure). groups are sorted by score_pct (descending). With security_id: the groups containing the security, detail = its industry group first. Added v1.32.0."
      parameters:
        - {name: security_id, in: query, schema: {type: string}}
        - {name: group_id, in: query, schema: {type: string}}
        - {name: region, in: query, schema: {type: string}}
        - {name: sector_id, in: query, schema: {type: string}, description: "Modal member sector"}
        - {name: subsector_id, in: query, schema: {type: string}, description: "Modal member subsector"}
        - {name: kind, in: query, schema: {type: string, enum: [industry, supply_chain]}}
        - {name: anomalies_only, in: query, schema: {type: boolean, default: false}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 400, default: 60}}
        - {name: history_days, in: query, schema: {type: integer, minimum: 5, maximum: 366, default: 365}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ConformalPeerGroups"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/conformal/pair-band:
    get:
      tags: [conformal]
      operationId: getConformalPairBand
      summary: Calibrated next-session band for any linear combination of a peer group's members (pair spread i - beta x j, or a weighted basket)
      description: "a'mu +- sqrt(q a'Sigma a) with the group's next-session law (diag + rank 4) and the 90% / 95% conformal radius: the projection of the joint ellipsoid, hence conservative (simultaneous over all combinations). marginal = the combination's own split-conformal band (quantile of its past standardised moves over ~125 sessions). Log-return units. beta defaults to the minimum-variance hedge ratio under the predicted covariance. realised = today's combination vs the band emitted at the previous session. Model-based; descriptive. Added v1.32.0."
      parameters:
        - {name: group_id, in: query, required: true, schema: {type: string}}
        - {name: weights, in: query, schema: {type: string}, description: "SECURITY_ID:weight,... (members of the group)"}
        - {name: i, in: query, schema: {type: string}, description: "Pair leg 1 (weight +1)"}
        - {name: j, in: query, schema: {type: string}, description: "Pair leg 2 (weight -beta)"}
        - {name: beta, in: query, schema: {type: number}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ConformalPairBand"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/conformal/coverage:
    get:
      tags: [conformal, system]
      operationId: getConformalCoverage
      summary: Conformal coverage audit (nightly rolling audit + P4 walk-forward rows), flagged segments, validation-gate verdicts and the production configuration
      parameters:
        - {name: application, in: query, schema: {type: string, enum: [envelope, nextbar, peer, envelope_wf, nextbar_wf, peer_wf]}}
        - {name: include_doc, in: query, schema: {type: boolean, default: false}, description: "Include the validation report (Markdown)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ConformalCoverage"}}}}
        "422": {$ref: "#/components/responses/Invalid"}

  # ======================================================================= BQL-lite (v1.37.0)
  /api/v1/bql:
    post:
      tags: [bql]
      operationId: runBql
      summary: Run a BQL-lite query (get / for / with / where / group / sort / limit) over the serving snapshot
      description: "Roadmap v3 B1. Grammar: get(field, ...) for(universe) [with(dates=range(-2Y, 0D) | DATE, freq=D|W|M|Q, currency=USD|EUR|...|local, fill=prev|none, as_of=DATE|-1M, max_rows=n)] [where(expr)] [group(field).agg(median|mean|sum|min|max|count|std)] [sort(expr asc|desc)] [limit(n)]. Universes: members('S&P 500' (= mvp_us approximation) | mvp_us | mvp_global | eu_broad | full | watch | 'watchlist:NAME' | 'screen:NAME' | 'peers:GROUP'), region(), sector(), subsector(), country(), type(), exchange(), currency(), ticker lists ['AAPL US', 'SAP GY'] combined with & | -. Functions: chg, chg_pct, lag, avg, std, min, max, sum, median, zscore, pct_rank, rolling, resample, ytd, corr, beta (time series), rank, cs_rank, cs_zscore, cs_demean, cs_mean, cs_median (cross-sectional, by=), scalar abs ln log10 exp sqrt sign round least greatest coalesce nz if clip isnull; arithmetic, comparisons, and / or / not, in [...]; percent literals 15%, durations 1D 2W 3M 1Q 5Y, dates 2026-01-01. Point in time: a date D only sees bars <= D and rows known (knowledge / as-of date) <= D; snapshot-only fields are allowed only at the snapshot date. Every literal is a bound parameter; identifiers come only from the field dictionary. Limits: universe <= 25,000, universe x dates <= 2 M, ~40 M daily bars incl. look-back, max_rows (default 5,000, <= 100,000), timeout (BIG360_BQL_TIMEOUT_S, default 30 s, 408). Results are cached per (snapshot, normalised AST hash, resolved universe). rows are arrays in `columns` order. Added v1.37.0."
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/BqlRequest"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BqlResult"}}}}
        "408": {description: Query timed out, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/bql/explain:
    post:
      tags: [bql]
      operationId: explainBql
      summary: Parse and compile a BQL query without running it - AST, compiled SQL shape and parameter names / types (never values)
      description: "Same validation as POST /bql (the universe is resolved to report its size). Added v1.37.0."
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/BqlRequest"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BqlExplain"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/bql/export:
    post:
      tags: [bql]
      operationId: exportBql
      summary: Run a BQL query and download the result as CSV, XLSX (openpyxl) or JSON
      description: "Excel / C# client friendly. JSON = {query, as_of, columns, rows: [{column: value}], warnings}. Added v1.37.0."
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/BqlExportRequest"}}}
      responses:
        "200":
          description: File
          content:
            text/csv: {schema: {type: string}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
            application/json: {schema: {type: object, additionalProperties: true}}
        "408": {description: Query timed out, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/bql/fields:
    get:
      tags: [bql]
      operationId: listBqlFields
      summary: The BQL field dictionary (searchable) - mnemonic, aliases, unit, source table, point-in-time rule, frequency, history source - plus the function reference
      description: "Generated from the contracts and the serving builder (contracts/bql_fields.yaml; python -m app.bql.fields --write). Ranking: exact mnemonic / alias > prefix > substring > description match; curated names first. Added v1.37.0."
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: group, in: query, schema: {type: string, maxLength: 40}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BqlFieldPage"}}}}
  /api/v1/bql/resolve:
    get:
      tags: [bql]
      operationId: resolveBqlSecurity
      summary: Resolve a Bloomberg-style security reference ('AAPL US Equity', 'SAP GY', '7203 JT', 'SPX Index', 'EURUSD Curncy', 'CL1 Comdty', ISIN, id) to a security
      description: "Market codes map to MICs (US = NYSE / Nasdaq / Arca / American / Cboe, GY = Xetra, LN = London, JT = Tokyo, ...); Index / Curncy / Comdty map to the instrument ids of price_history. security = null when nothing matches. Used by the command bar (B2). Added v1.37.0."
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BqlResolve"}}}}
  /api/v1/bql/saved:
    get:
      tags: [bql]
      operationId: listBqlSaved
      summary: Saved BQL queries (app_state bql_saved)
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [query, screen]}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/BqlSaved"}}}}}
    post:
      tags: [bql]
      operationId: createBqlSaved
      summary: Save a BQL query (kind screen = usable as a universe, members('screen:NAME'))
      description: "The query is syntax-checked; fields and universes are validated when it runs. Names are unique (case-insensitive; 409). Added v1.37.0."
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/BqlSavedCreate"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/BqlSaved"}}}}
        "409": {description: Name taken, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/bql/saved/{query_id}:
    get:
      tags: [bql]
      operationId: getBqlSaved
      parameters:
        - {name: query_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BqlSaved"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [bql]
      operationId: updateBqlSaved
      parameters:
        - {name: query_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/BqlSavedUpdate"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BqlSaved"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Name taken, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      tags: [bql]
      operationId: deleteBqlSaved
      parameters:
        - {name: query_id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  # ======================================================================= NEWS TERMINAL (roadmap v3 N2-N4, v1.38.0)
  /api/v1/news/terminal:
    get:
      tags: [news]
      operationId: getNewsTerminal
      summary: News Terminal list - live items (bus, seconds old) merged over the 7-day intraday store, newest first
      description: "Roadmap v3 N4. Items = curated RSS / Atom headlines (official, regulators, exchanges, publishers), Polygon news and issuer-linked / salient GDELT articles, deduped by URL and grouped into live stories (MinHash). Headline + <= 300-char snippet only (never article text). Sentiment is model-based (FinBERT / XLM-R). Page older items with `before` = next_before. Added v1.38.0."
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 1000, minimum: 1, maximum: 6000}}
        - {name: before, in: query, schema: {type: string, format: date-time}, description: "Only items first seen before this time (pagination cursor)"}
        - {name: tickers, in: query, schema: {type: string}, description: "Comma list of tickers"}
        - {name: security_id, in: query, schema: {type: string}}
        - {name: watchlist_id, in: query, schema: {type: string}, description: "Items linked to any member of the watchlist"}
        - {name: country, in: query, schema: {type: string}, description: "Comma list of ISO2 / EA / GLOBAL"}
        - {name: sector, in: query, schema: {type: string}, description: "Comma list of events_v2 sector codes (TECH, FINS, ...)"}
        - {name: theme, in: query, schema: {type: string}, description: "Comma list of events_v2 theme ids"}
        - {name: tier, in: query, schema: {type: string}, description: "Comma list of source tiers 1 official, 2 major press, 3 publisher, 4 GDELT web"}
        - {name: lang, in: query, schema: {type: string}, description: "Comma list of ISO 639-1 codes"}
        - {name: kind, in: query, schema: {type: string, enum: [news, gdelt, all]}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}, description: "Substring of the headline / publisher"}
        - {name: story_id, in: query, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/NewsTerminalPage"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/news/stories:
    get:
      tags: [news]
      operationId: getNewsStories
      summary: Top stories of the last N hours (intraday store + live velocity; snapshot stories when no intraday file exists)
      parameters:
        - {name: hours, in: query, schema: {type: integer, default: 24, minimum: 1, maximum: 168}}
        - {name: sort, in: query, schema: {type: string, enum: [salience, velocity, recent, size], default: salience}}
        - {name: limit, in: query, schema: {type: integer, default: 100, minimum: 1, maximum: 500}}
        - {name: country, in: query, schema: {type: string}}
        - {name: sector, in: query, schema: {type: string}}
        - {name: theme, in: query, schema: {type: string}}
        - {name: security_id, in: query, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/NewsStoryPage"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/news/stories/{story_id}:
    get:
      tags: [news]
      operationId: getNewsStory
      summary: Story detail - timeline, articles, linked securities with the price move since first publication, related filings / GDELT events, model-based impact estimate (event-study library)
      parameters:
        - {name: story_id, in: path, required: true, schema: {type: string}, description: "Decimal int64 story id (live, intraday or snapshot)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/NewsStoryDetail"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/news/hourly:
    get:
      tags: [news]
      operationId: getNewsHourly
      summary: Hourly sentiment (sentiment_hourly, model-based) and GDELT attention (event_hourly_agg) of one label, last N hours
      parameters:
        - {name: label_type, in: query, schema: {type: string, enum: [all, country, sector, issuer, theme], default: all}}
        - {name: label_id, in: query, schema: {type: string, default: "*"}, description: "ISO2 | sector code | issuer_id / security_id | theme id | * (all)"}
        - {name: hours, in: query, schema: {type: integer, default: 72, minimum: 1, maximum: 168}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/NewsHourly"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/news/feeds:
    get:
      tags: [news]
      operationId: getNewsFeeds
      summary: Curated live feeds (config/news_feeds.yaml) with their verification (HTTP, entries, robots, terms) and live poll state
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/NewsFeeds"}}}}
  /api/v1/news/live/health:
    get:
      tags: [news]
      operationId: getNewsLiveHealth
      summary: Live news service health - publish -> bus latency p50 / p95 per source, items / hour, GDELT release lag, last poll, failing feeds, hourly fold / intraday state
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/NewsLiveHealth"}}}}
  # ======================================================================= RATES & DEBT (W3, v1.47.0, owner rates-w3)
  /api/v1/rates/curves:
    get:
      tags: [rates]
      operationId: listRatesCurves
      summary: Official yield-curve catalogue (sovereign, money-market, monthly 10y) with history depth, publication rule, licence and the rejected sources
      parameters:
        - {name: group, in: query, schema: {type: string, enum: [sovereign, money_market, lt10]}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/RatesCurveList"}}}}
  /api/v1/rates/curves/{curve_id}:
    get:
      tags: [rates]
      operationId: getRatesCurve
      summary: One curve - snapshots (latest vs comparisons), per-tenor history, month-end / week-end frames for the animation, Svensson parameters
      parameters:
        - {name: curve_id, in: path, required: true, schema: {type: string}, description: "Curve id (US_TSY, EA_AAA, DE_BUND, GB_GILT, JP_JGB, ...)"}
        - {name: type, in: query, schema: {type: string, enum: [par, spot, forward, yield]}}
        - {name: date, in: query, schema: {type: string, format: date}, description: "Anchor date (default latest)"}
        - {name: compare, in: query, schema: {type: string, default: "1w,1m,1y"}, description: "1d,1w,1m,3m,6m,1y,3y,5y or ISO dates"}
        - {name: history_tenors, in: query, schema: {type: string}, description: "Tenors in months, comma-separated"}
        - {$ref: "#/components/parameters/From"}
        - {$ref: "#/components/parameters/To"}
        - {name: frames, in: query, schema: {type: string, enum: [M, W, none], default: M}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/RatesCurve"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/rates/monitor:
    get:
      tags: [rates]
      operationId: getRatesMonitor
      summary: Curve monitor - benchmark yields per country, 2s10s / 5s30s, spreads vs Bund / UST, changes, real vs nominal, money markets, delayed live yields
      parameters:
        - {name: tenor, in: query, schema: {type: integer, minimum: 1, maximum: 480, default: 120}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/RatesMonitor"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/rates/series:
    get:
      tags: [rates]
      operationId: getRatesSeries
      summary: Curve-point histories (CURVE:TENOR:TYPE) and spreads A-B in bp (weekly beyond 3 years)
      parameters:
        - {name: ids, in: query, schema: {type: string}, description: "e.g. US_TSY:120:par,DE_BUND:120:par"}
        - {name: spreads, in: query, schema: {type: string}, description: "e.g. US_TSY:120:par-DE_BUND:120:par"}
        - {$ref: "#/components/parameters/From"}
        - {$ref: "#/components/parameters/To"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/RatesSeries"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/rates/sovereign:
    get:
      tags: [rates]
      operationId: getRatesSovereign
      summary: Sovereign debt - auction calendar and results (US Treasury, UK DMO), US 10y auction history, debt / GDP and deficits, TARGET balances
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/RatesSovereign"}}}}
  /api/v1/credit/overview:
    get:
      tags: [credit]
      operationId: getCreditOverview
      summary: Credit page - ICE BofA OAS by rating / maturity / EM sector and region, effective yields, Moody's Aaa / Baa, issuance (FIRDS, US Treasury), TRACE aggregates, maturity wall
      parameters:
        - {name: years, in: query, schema: {type: integer, minimum: 1, maximum: 40, default: 5}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CreditOverview"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/credit/maturity-walls:
    get:
      tags: [credit]
      operationId: getCreditMaturityWalls
      summary: Sector maturity walls and refinancing-risk metrics (from filings; refinancing cost model-based)
      parameters:
        - {name: region, in: query, schema: {type: string, default: ALL}}
        - {name: sector_id, in: query, schema: {type: string, default: ALL}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CreditMaturityWalls"}}}}
  /api/v1/companies/{security_id}/debt:
    get:
      tags: [company]
      operationId: getCompanyDebt
      summary: Company 360 Debt panel - maturity wall, cost of debt, coverage, net debt / EBITDA history, fixed vs floating, listed bonds (FIRDS / OpenFIGI), sector peers
      description: "The path also accepts a ticker, ISIN or ticker alias (AAPL, 7203.T, 7203, BRK.B): resolved like the UI's /search lookup (exact ticker or ISIN, ties -> active, primary listing, market cap; then the ticker without its exchange suffix, only when every match belongs to one issuer: a root shared by several issuers, e.g. 2317 = 2317.TW / 2317.T / 2317.HK, is a 404 naming the candidates). security_id in the response is always the resolved internal id. Added coverage v3 A7."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CompanyDebt"}}}}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Optional (v1.31). Enforced only when the server runs with BIG360_AUTH=oidc: an OIDC access token (Entra ID)
        whose iss / aud match the server configuration and whose roles claim maps to viewer, analyst or admin. Not
        applied to /health, /ready, /metrics, /docs, /openapi.json. With the default BIG360_AUTH=none no token is needed.
  parameters:
    SecurityId: {name: security_id, in: path, required: true, schema: {type: string}, description: "Internal security id (S...). Tickers resolve via /api/v1/search."}
    WatchlistId: {name: watchlist_id, in: path, required: true, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 500}}
    Offset: {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}}
    From: {name: from, in: query, schema: {type: string, format: date}}
    To: {name: to, in: query, schema: {type: string, format: date}}
    RegionQuery: {name: region, in: query, schema: {$ref: "#/components/schemas/Region"}, description: "Omit for all regions"}
    RegionsQuery: {name: regions, in: query, style: form, explode: true, schema: {type: array, items: {$ref: "#/components/schemas/Region"}}, description: "Several regions (repeat the parameter or comma-separate values); combined with region (union). Added v1.1."}
    SizeQuery: {name: size_bucket, in: query, schema: {$ref: "#/components/schemas/SizeBucket"}}
    ProfileQuery: {name: profile_id, in: query, schema: {type: string, default: balanced}}
    HorizonQuery: {name: horizon, in: query, schema: {$ref: "#/components/schemas/Horizon"}}

  responses:
    NotFound: {description: Not found, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
    Invalid: {description: Validation error, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}

  schemas:
    # ------------------------------------------------------------ primitives / enums
    Problem:
      type: object
      required: [title, status]
      properties:
        type: {type: string, default: about:blank}
        title: {type: string}
        status: {type: integer}
        detail: {type: [string, "null"]}
        errors: {type: [array, "null"], items: {type: object, properties: {loc: {type: array, items: {type: string}}, msg: {type: string}}}}
    Region: {type: string, enum: [US, CA, LATAM, UK, EU, JP, KR, CN, HK, APAC, OTHER]}
    SizeBucket: {type: string, enum: [large, mid, small]}
    FactorId: {type: string, enum: [quality, profitability, growth, value, balance_sheet, momentum, insider, sentiment, macro, moat]}
    Horizon: {type: string, enum: ["1M", "3M", "6M"], default: "3M"}
    Grade: {type: string, enum: [A, B, C, D, E]}
    MoatClass: {type: string, enum: [wide, narrow, none, insufficient_data]}
    PeerGroupLevel: {type: string, enum: [subsector_region_size, subsector_region, subsector_global, sector_region, sector_global, region_all, global_all, peer_set], description: "region_all / global_all (market, sentiment, macro metrics) added v1.2"}
    FormClass: {type: string, enum: [annual, semiannual, quarterly, current_report, insider, holdings, proxy, prospectus, other]}
    InsiderTxnType: {type: string, enum: [buy, sell, grant, option_exercise, tax_withholding, gift, conversion, other]}
    EventCategory: {type: string, enum: [conflict, protest, sanctions_trade, diplomacy, economy, disaster, legal_regulatory, health, other]}
    MacroCategory: {type: string, enum: [growth, inflation, rates, credit, fx, commodities, labor, housing, sentiment, liquidity, trade, fiscal, other]}
    RegimeLabel: {type: string, enum: [expansion, slowdown, contraction, recovery, stagflation, not_modelled], description: "not_modelled (v1.29): placeholder of a scope without its own regime model; never display it as a regime"}
    ModelType: {type: string, enum: [xgboost_rank, ft_transformer, cs_attention, ensemble, insider_xgb, insider_iforest, macro_hmm]}
    JobStatus: {type: string, enum: [running, success, partial, failed, skipped]}
    DataStatus: {type: string, enum: [ok, partial, pending], description: "ok = inputs populated; partial = some upstream tables still empty; pending = required upstream tables not populated yet (placeholders, see info.description). Added v1.1."}
    ScreenerColumnId:
      type: string
      description: "Pinned screener field ids (GET /screener/fields also lists dynamic kpi_<kpi_id> fields). Usable in ScreenerQuery.columns / filters[].field / sort_by. Added v1.1."
      enum: [ticker, name, isin, country, region, sector_id, subsector_id, currency, exchange_name, mic, size_bucket, security_type, composite, grade, rank, dq_score, moat_class, moat_score, quality, profitability, growth, value, balance_sheet, momentum, insider, sentiment, macro, moat, market_cap_usd, enterprise_value_usd, pe_ntm, fv_upside, ev_ebit, ps_ttm, fair_value, earnings_yield, fcf_yield, ev_ebitda, ev_sales, pe_ttm, pb, p_tbv, p_ffo, dividend_yield, shareholder_yield, price, chg_1d, chg_1w, chg_1m, chg_3m, chg_6m, ret_12m, chg_ytd, mom_12_1, mom_6_1, high_52w_proximity, trend_200d, vol_1y, adv_usd_20d, volume_z, beta_1y, short_pct_float, days_to_cover, above_200d, new_high_52w, gross_margin, operating_margin, ebitda_margin, net_margin, fcf_margin, tax_rate_norm, nopat, roe, roa, roic, croic, gross_profitability, cfo_to_net_income, fcf_conversion, gm_stdev_5y, op_margin_stdev_5y, roic_mean_5y, sbc_to_revenue, asset_turnover, rnd_to_revenue, revenue_growth_yoy, revenue_cagr_3y, revenue_cagr_5y, gross_profit_growth_yoy, ebit_growth_yoy, eps_growth_yoy, eps_cagr_3y, fcf_per_share_cagr_3y, bvps_cagr_3y, dps_cagr_3y, revenue_growth_accel, debt_to_equity, net_debt_to_ebitda, net_debt_incl_leases_to_ebitda, interest_coverage, current_ratio, quick_ratio, liabilities_to_assets, cash_to_assets, capex_to_revenue, capex_to_da, payout_ratio, share_count_change_yoy, dso, dio, dpo, cash_conversion_cycle, inventory_turns, piotroski_f, altman_z2, altman_z, beneish_m, sloan_accruals, revenue_growth, net_debt_ebitda, insider_signal, insider_cluster_buy, insider_net_buy_90d_usd, sentiment_score, news_count_30d, attention_z, zone_distance_atr, zone_side, zone_reward_risk, atr14, ml_rank_pct_1m, ml_decile_1m, ml_expected_excess_1m, ml_rank_pct_3m, ml_decile_3m, ml_expected_excess_3m, ml_rank_pct_6m, ml_decile_6m, ml_expected_excess_6m, macro_beta_rates, macro_beta_usd, macro_beta_oil, macro_beta_credit, macro_beta_growth_surprise, macro_impact_rates_down_100bp]
    NullableNumber: {type: [number, "null"]}
    NumberMap:
      type: object
      additionalProperties: {type: [number, "null"]}
    TimePoint:
      type: object
      required: [date, value]
      properties:
        date: {type: string, format: date}
        value: {type: [number, "null"]}
    NamedSeries:
      type: object
      required: [id, label, points]
      properties:
        id: {type: string}
        label: {type: string}
        unit: {type: [string, "null"], description: "Unit of `points` (regime drivers v1.29: the TRUE unit of the raw model input - level / percent / fraction / index; it used to say z)"}
        points: {type: array, items: {$ref: "#/components/schemas/TimePoint"}}
        transform: {type: [string, "null"], description: "Regime drivers: transform applied to the source series (yoy, level, log_diff). Added v1.29."}
        series_id: {type: [string, "null"], description: "Regime drivers: source macro series. Added v1.29."}
        z_points: {type: array, items: {$ref: "#/components/schemas/TimePoint"}, description: "Regime drivers: z-score of each point with the model fit's standardization ((x - mu) / sd). Added v1.29."}
        latest_value: {type: [number, "null"], description: "Added v1.29"}
        latest_z: {type: [number, "null"], description: "Added v1.29"}
        z_basis: {type: [string, "null"], enum: [model_fit, returned_history, null], description: "Where mu / sd come from. Added v1.29."}

    # ------------------------------------------------------------ system
    Readiness:
      type: object
      description: Readiness probe body (GET /ready). Added v1.31.
      required: [status, time, checks]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        time: {type: string, format: date-time}
        serving_run_id: {type: [string, "null"]}
        serving_as_of: {type: [string, "null"], format: date}
        worker_heartbeat_age_s: {type: [number, "null"]}
        checks:
          type: array
          items:
            type: object
            required: [name, required, ok]
            properties:
              name: {type: string, description: "serving_snapshot | worker_heartbeat | gap_filler"}
              required: {type: boolean, description: "false = informational, does not affect status"}
              ok: {type: boolean}
              detail: {type: [string, "null"]}
    Health:
      type: object
      required: [status, version, time]
      properties:
        status: {type: string, enum: [ok, degraded]}
        version: {type: string}
        time: {type: string, format: date-time}
        serving_run_id: {type: [string, "null"]}
        serving_built_at: {type: [string, "null"], format: date-time}
    FreshnessItem:
      type: object
      required: [table, status]
      properties:
        expected_cadence: {type: [string, "null"], enum: [daily, weekly, monthly, manual, null], description: "Cadence of the writer job (jobs.yaml dag). Added v1.1."}
        region: {type: [string, "null"], description: "Region slice for region-partitioned tables (prices_daily, insider_transactions); null = whole table. Added v1.1."}
        job_id: {type: [string, "null"], description: "Writer job. Added v1.1."}
        last_status: {oneOf: [{$ref: "#/components/schemas/JobStatus"}, {type: "null"}], description: "Status of the writer job's latest run (partial = some entities failed). Added v1.1."}
        dq_status: {type: [string, "null"], enum: [ok, warn, error, no_data, info, null], description: "Worst result of the latest dq run for this table. Added v1.1."}
        table: {type: string}
        last_date: {type: [string, "null"], format: date}
        last_ingested_at: {type: [string, "null"], format: date-time}
        lag_days: {type: [integer, "null"], description: "Days since last_date; for forward-looking tables (last_date in the future: calendars, expectations) days since the last ingest (v1.30, never negative)"}
        row_count: {type: [integer, "null"]}
        status: {type: string, enum: [fresh, stale, missing], description: "v1.30: stale also when the writer job's latest run failed after its last success"}
        optional: {type: boolean, description: "Optional / realtime table (live_*): never degrades the header freshness badge. Added v1.28.0."}
    DagRunSummary:
      type: object
      required: [dag, dag_run_id, status]
      properties:
        dag: {type: string, enum: [nightly, weekly, monthly, manual]}
        dag_run_id: {type: string}
        status: {$ref: "#/components/schemas/JobStatus"}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        jobs_total: {type: integer}
        jobs_failed: {type: integer}
    SystemStatus:
      type: object
      required: [version, data_freshness, last_dag_runs, keys_present]
      properties:
        serving_as_of: {type: [string, "null"], format: date, description: "Data as-of date of the live snapshot. Added v1.1."}
        worker: {type: [object, "null"], description: "Worker heartbeat (alive, heartbeat_at, pid, active jobs, next_runs). Added v1.1.", additionalProperties: true}
        dq: {type: [object, "null"], description: "Latest dq run summary {run_id, checked_at, counts, blocking}. Added v1.1.", additionalProperties: true}
        version: {type: string}
        serving_run_id: {type: [string, "null"]}
        serving_built_at: {type: [string, "null"], format: date-time}
        data_freshness: {type: array, items: {$ref: "#/components/schemas/FreshnessItem"}}
        last_dag_runs: {type: array, items: {$ref: "#/components/schemas/DagRunSummary"}}
        keys_present: {type: object, additionalProperties: {type: boolean}, description: "e.g. {fred: true, polygon: true}. Never values."}
        universe_counts: {type: object, additionalProperties: {type: integer}}
        disk_usage_gb: {type: [number, "null"]}
        scheduler: {oneOf: [{$ref: "#/components/schemas/SchedulerStatus"}, {type: "null"}], description: "Scheduler on/off, active schedule profile, next run per DAG, last completed run per DAG. Added v1.28.0."}
        data_as_of: {type: object, additionalProperties: {type: string, format: date}, description: "Per-region data as-of date of the published snapshot (latest date at least half the region's priced securities reached). Added v1.28.0."}
        data_as_of_overall: {type: [string, "null"], format: date, description: "Header date: most recent core-region (US/EU/UK/JP) data as-of. Added v1.28.0."}
        serving_sections: {type: array, items: {$ref: "#/components/schemas/ServingSection"}, description: "Per-section staleness of the snapshot (market data publishes even when analytics failed). Added v1.28.0."}
        ops_alerts: {type: array, items: {$ref: "#/components/schemas/OpsAlert"}, description: "Operational alerts (scheduler off, refresh overdue, SLA breaches, disk, filler; supervisor restart loops and leaked processes since incident 2026-10-24). Added v1.28.0."}
        supervisor: {type: [object, "null"], additionalProperties: true, description: "Supervisor summary (incident 2026-10-24): alive, pid, restarts_total, children {state, restarts, restarts_30m, ready, health_fail, restart_reasons [{at, reason, backoff_s}], alert}, reaper {leaked_processes, killed_total, freed_mb_total, last_killed, stray_apis}, alerts. null without a supervisor."}
        as_of: {type: [string, "null"], format: date-time, description: "When this payload was computed (UTC). The status is computed in the background and served from a cache (short TTL, single flight): requests never wait on the heavy reads. null while the cache is still warming. Added coverage v3 A7."}
        cache: {$ref: "#/components/schemas/StatusCacheMeta"}
        pauses: {type: array, items: {$ref: "#/components/schemas/PauseFlag"}, description: "Operator pause flags present on disk (data/state/ops/filler.PAUSE) with reason, owner, since, expiry and whether they still apply. Coverage v3 A4 (app.ops.pause): a flag carries until=<ISO> (24 h by default for new pauses); a legacy file without it expires 7 days after it was written; an expired flag is ignored (and reported here) until it is removed."}
        heavy_slot: {type: [object, "null"], additionalProperties: true, description: "Coverage v3 A2 heavy slot (app.ops.heavy_slot): {enabled, slot_gb (7), peer_gb (3), holder {job_id, pid, started_at, mem_gb, state} | null, exclusive (build_serving_db / serving_sections_publish marker) | null, waiting [big jobs queued for the slot, FIFO], peers [running jobs >= peer_gb]}. A job with a RAM budget >= slot_gb runs with no other job >= peer_gb beside it."}
        admission_waits: {type: array, items: {$ref: "#/components/schemas/AdmissionWait"}, description: "Coverage v3 A2: jobs of every runner (worker DAGs, startup sync, CLI, filler tasks) currently held back by RAM admission (headroom), the 3 GB RAM floor or the heavy slot, with the reason."}
    PauseFlag:
      type: object
      required: [name, path, present, active, expired]
      description: "A pause flag file (coverage v3 A4, app.ops.pause.PauseState)."
      properties:
        name: {type: string, description: "filler"}
        path: {type: string}
        present: {type: boolean}
        active: {type: boolean, description: "present and not expired: the component is paused"}
        expired: {type: boolean}
        legacy: {type: boolean, description: "no until= in the file: expires LEGACY_MAX_DAYS (7) after its modification time"}
        reason: {type: [string, "null"]}
        by: {type: [string, "null"]}
        since: {type: [string, "null"], format: date-time}
        until: {type: [string, "null"], format: date-time}
        expired_at: {type: [string, "null"], format: date-time}
        age_h: {type: [number, "null"]}
        remaining_h: {type: [number, "null"]}
        detail: {type: [string, "null"]}
    AdmissionWait:
      type: object
      required: [job_id]
      description: "A job waiting for admission (coverage v3 A2, app.ops.ram_budget.waits)."
      properties:
        job_id: {type: string}
        pid: {type: [integer, "null"], description: "runner process"}
        kind: {type: [string, "null"], description: "ram (headroom) | floor (3 GB RAM floor) | starve (another job waited longer) | slot (heavy slot)"}
        reason: {type: [string, "null"]}
        since: {type: [string, "null"], format: date-time}
        updated_at: {type: [string, "null"], format: date-time}
        detail: {type: [object, "null"], additionalProperties: true}
    StatusCacheMeta:
      type: object
      description: "Background status cache (coverage v3 A7, app.api.status_cache). The snapshot identity fields (serving_run_id, serving_built_at, serving_as_of) are always the live snapshot's; the rest of the payload was computed on snapshot_run_id."
      required: [state, ttl_s]
      properties:
        state: {type: string, enum: [fresh, stale, partial, warming, error], description: "fresh = younger than ttl_s on the live snapshot; stale = older copy served while one background refresh runs; partial = some sections failed (section_errors): each serves its last good value for at most BIG360_STATUS_SECTION_MAX_REUSE_S (default 600 s, see section_as_of), then an empty value - not current data; warming = first computation still running (light payload); error = no payload yet and the last computation failed (light payload)"}
        computed_at: {type: [string, "null"], format: date-time}
        age_s: {type: [number, "null"]}
        ttl_s: {type: number, description: "BIG360_STATUS_TTL_S (default 10; <= 0 = computed on every request)"}
        refreshing: {type: boolean}
        compute_ms: {type: [number, "null"]}
        snapshot_run_id: {type: [string, "null"], description: "Serving snapshot the cached payload was computed on"}
        last_error: {type: [string, "null"], description: "Last failed refresh (the previous payload is kept)"}
        last_error_at: {type: [string, "null"], format: date-time}
        section_errors: {type: array, items: {type: string}, description: "Sections that failed in the served payload's computation ('<section>: <error>'; sections data_freshness, last_dag_runs, universe_counts, ops_status = scheduler / data_as_of / serving_sections / ops_alerts, runtime); each keeps its last good value for at most BIG360_STATUS_SECTION_MAX_REUSE_S, then is served empty"}
        section_as_of: {type: object, additionalProperties: {type: string, format: date-time}, description: "When each section's served value was computed (a reused value keeps its original time; a section served empty is absent)"}
    SchedulerStatus:
      type: object
      required: [enabled, worker_alive, profile, next_runs, last_success]
      properties:
        enabled: {type: boolean, description: "Worker alive AND its scheduler running (false with --no-schedule)"}
        worker_alive: {type: boolean}
        reason: {type: [string, "null"], description: "Why the scheduler is off"}
        profile: {type: string, description: "Active schedule profile (weekly | daily | intraday)"}
        profile_source: {type: string, enum: [env, state, default]}
        profile_label: {type: [string, "null"]}
        worker_profile: {type: [string, "null"], description: "Profile the running worker applied"}
        timezone: {type: [string, "null"]}
        period_days: {type: [number, "null"]}
        sla_days: {type: [number, "null"]}
        next_runs: {type: object, additionalProperties: {type: [string, "null"], format: date-time}, description: "Next scheduled start per DAG"}
        next_runs_computed: {type: boolean, description: "true = computed from the profile (no scheduler running)"}
        last_success: {type: object, additionalProperties: {type: [string, "null"], format: date-time}, description: "Finish time of the latest completed run per DAG (any trigger)"}
        last_success_trigger: {type: object, additionalProperties: {type: [string, "null"]}}
        last_scheduled_run: {type: object, additionalProperties: {type: string, format: date-time}, description: "Start of the latest run with trigger schedule per DAG"}
        off_since: {type: [string, "null"], format: date-time}
        off_hours: {type: [number, "null"]}
        catchup_due: {type: array, items: {type: string}, description: "Profile entries whose last scheduled time was missed"}
        entries: {type: array, items: {$ref: "#/components/schemas/ScheduleEntry"}}
        last_refresh: {oneOf: [{$ref: "#/components/schemas/LastRefresh"}, {type: "null"}], description: "Most recent of the sync and the scheduled refreshes. Added v1.43.0."}
    ScheduleEntry:
      type: object
      required: [id, kind, cron, timezone]
      properties:
        id: {type: string}
        kind: {type: string, enum: [dag, chain]}
        dags: {type: array, items: {type: string}}
        steps: {type: array, items: {type: string}}
        cron: {type: string}
        timezone: {type: string}
        catch_up: {type: boolean}
        description: {type: [string, "null"]}
        next_run: {type: [string, "null"], format: date-time}
        last_success_at: {type: [string, "null"], format: date-time}
        last_status: {type: [string, "null"]}
        catchup_due: {type: boolean}
    ScheduleProfile:
      type: object
      required: [id, label, entries]
      properties:
        id: {type: string}
        label: {type: string}
        description: {type: [string, "null"]}
        placeholder: {type: boolean}
        period_days: {type: [number, "null"]}
        sla_days: {type: [number, "null"]}
        entries: {type: array, items: {$ref: "#/components/schemas/ScheduleEntry"}}
    Schedule:
      type: object
      required: [active, source, profiles, entries, next_runs]
      properties:
        active: {type: string}
        source: {type: string, enum: [env, state, default]}
        default: {type: [string, "null"]}
        updated_at: {type: [string, "null"], format: date-time}
        updated_by: {type: [string, "null"]}
        worker_profile: {type: [string, "null"]}
        worker_alive: {type: boolean}
        scheduler_enabled: {type: boolean}
        pending_apply: {type: boolean, description: "The running worker has not applied the active profile yet"}
        timezone: {type: [string, "null"]}
        profiles: {type: array, items: {$ref: "#/components/schemas/ScheduleProfile"}}
        next_runs: {type: object, additionalProperties: {type: [string, "null"], format: date-time}}
        entries: {type: array, items: {$ref: "#/components/schemas/ScheduleEntry"}}
        sla_days: {type: [number, "null"]}
        period_days: {type: [number, "null"]}
    ScheduleUpdate:
      type: object
      required: [profile]
      properties:
        profile: {type: string, description: "weekly | daily | intraday"}
    ServingSection:
      type: object
      required: [section, status]
      properties:
        section: {type: string, description: "e.g. prices:US, fx, macro, fundamentals, scores, technicals, ml, events"}
        group: {type: [string, "null"], enum: [market, analytics, reference, null]}
        data_as_of: {type: [string, "null"], format: date}
        status: {type: string, enum: [fresh, stale, failed, missing]}
        source_job: {type: [string, "null"]}
        last_job_status: {type: [string, "null"]}
        detail: {type: [string, "null"]}
    OpsAlert:
      type: object
      required: [id, severity, title]
      properties:
        id: {type: string}
        severity: {type: string, enum: [error, warn, info]}
        title: {type: string}
        detail: {type: [string, "null"]}
        since: {type: [string, "null"]}
        link: {type: [string, "null"]}
        stale: {type: [boolean, "null"], description: "The alert comes from an older result that a newer run superseded or that aged out (qa_regression). Added v1.43.0."}
        age_h: {type: [number, "null"], description: "Age of the result behind the alert in hours. Added v1.43.0."}
        superseded_by: {type: [string, "null"], description: "Newer run id that did not re-check the failing item. Added v1.43.0."}
    LastRefresh:
      type: object
      required: [at, dag]
      description: "The most recent completed refresh of any kind: a scheduled DAG run (nightly / weekly / monthly) or a startup / interval sync run. Added v1.43.0."
      properties:
        at: {type: string, format: date-time}
        dag: {type: string, description: "nightly | weekly | monthly | sync"}
        dag_run_id: {type: [string, "null"]}
        trigger: {type: [string, "null"]}
        status: {type: [string, "null"], description: "success | partial"}
        jobs: {type: [integer, "null"]}
        jobs_failed: {type: [integer, "null"]}
    RefreshFailure:
      type: object
      required: [job_id]
      description: "A job whose latest attempt (across nightly, weekly, monthly, sync and manual runs) failed, among the jobs that failed in a refresh run within 30 days. Added v1.43.0."
      properties:
        job_id: {type: string}
        failed_at: {type: [string, "null"], format: date-time}
        since: {type: [string, "null"], format: date-time, description: "First failure of the current streak"}
        dag_run_id: {type: [string, "null"]}
        dag: {type: [string, "null"]}
        trigger: {type: [string, "null"]}
        error: {type: [string, "null"]}
    DataHealthDataset:
      type: object
      required: [dataset, label, group, status]
      properties:
        dataset: {type: string}
        label: {type: string}
        group: {type: string}
        status: {type: string, enum: [fresh, stale, partial, missing, unknown, error]}
        data_as_of: {type: [string, "null"], format: date}
        expected_as_of: {type: [string, "null"], format: date}
        lag: {type: [number, "null"], description: "Sessions / days behind the expected date (unpriced count for prices.history)"}
        sla: {type: [number, "null"], description: "Effective SLA (profile-adjusted)"}
        detail: {type: [string, "null"]}
        priority: {type: [integer, "null"]}
        live_job: {type: [string, "null"]}
        last_job_status: {type: [string, "null"]}
        open_gaps: {type: integer}
        reason: {type: [string, "null"], enum: [fresh, due, not_yet_published, source_unavailable, no_source, needs_key, failed, stale, null], description: "One verdict (app.ops.freshness): the startup sync's reason code when it scanned within 6 h, else stale / failed / fresh from the gap detector. Added v1.43.0."}
        reason_source: {type: [string, "null"], enum: [sync, detector, null]}
        reason_detail: {type: [string, "null"]}
        next_expected: {type: [string, "null"], description: "not_yet_published: next expected release / session (sync)"}
        retry_at: {type: [string, "null"], description: "not_yet_published / source_unavailable: next retry (sync ledger)"}
        attempts: {type: [integer, "null"]}
        keys: {type: [array, "null"], items: {type: string}, description: "needs_key: missing key names (never values)"}
        alerting: {type: [boolean, "null"], description: "true = failed, due / source_unavailable past the SLA, or stale; drives status stale / missing, sla_breaches and the sla_* alerts. Added v1.43.0."}
        detector_status: {type: [string, "null"], description: "The gap detector's own status (diagnostics only)"}
    DataGap:
      type: object
      required: [gap_id, dataset, entity, gap_class, status]
      properties:
        gap_id: {type: string}
        dataset: {type: string}
        entity: {type: string}
        gap_class: {type: string, enum: [missing, stale, partial, suspicious, unfillable]}
        status: {type: string, enum: [open, queued, filling, filled, failed, unfillable, manual, ignored]}
        period_start: {type: [string, "null"], format: date}
        period_end: {type: [string, "null"], format: date}
        expected: {type: [integer, "null"]}
        actual: {type: [integer, "null"]}
        priority: {type: [integer, "null"]}
        fill_kind: {type: [string, "null"]}
        note: {type: [string, "null"]}
        attempts: {type: [integer, "null"]}
        last_error: {type: [string, "null"]}
        next_attempt_at: {type: [string, "null"], format: date-time}
        first_seen: {type: [string, "null"], format: date-time}
        last_seen: {type: [string, "null"], format: date-time}
    DataHealthCampaign:
      type: object
      required: [id, label, status]
      properties:
        id: {type: string}
        label: {type: string}
        kind: {type: [string, "null"]}
        status: {type: string, enum: [running, done, backoff, waiting]}
        progress_pct: {type: [number, "null"]}
        done_units: {type: [number, "null"]}
        total_units: {type: [number, "null"]}
        unit: {type: [string, "null"]}
        rate_per_h: {type: [number, "null"]}
        eta_h: {type: [number, "null"]}
        eta_at: {type: [string, "null"]}
        detail: {type: [string, "null"]}
        last_error: {type: [string, "null"]}
        last_success_at: {type: [string, "null"]}
        priority: {type: [integer, "null"]}
        source: {type: [string, "null"]}
    DataHealthSource:
      type: object
      required: [source, status]
      properties:
        source: {type: string}
        unit: {type: [string, "null"]}
        per_hour: {type: [number, "null"], description: "Filler budget per sliding hour"}
        used_1h: {type: [number, "null"]}
        pct: {type: [number, "null"]}
        status: {type: string, enum: [ok, degraded, failing, idle]}
        runs_14d: {type: integer}
        failures_14d: {type: integer}
        fail_streak: {type: integer}
        last_ok_at: {type: [string, "null"]}
        last_fail_at: {type: [string, "null"]}
        last_error: {type: [string, "null"]}
        jobs: {type: array, items: {type: string}}
        note: {type: [string, "null"]}
    DataHealth:
      type: object
      required: [generated_at, profile, datasets, heatmap, gaps, campaigns, filler, sources, failures, sla_breaches, alerts]
      properties:
        generated_at: {type: string, format: date-time}
        profile: {type: object, additionalProperties: true, description: "{active, sla_days, period_days}"}
        detector: {type: object, additionalProperties: true, description: "{generated_at, seconds, errors} of the last gap detection"}
        datasets: {type: array, items: {$ref: "#/components/schemas/DataHealthDataset"}}
        heatmap:
          type: object
          required: [days, rows]
          properties:
            days: {type: array, items: {type: string, format: date}}
            rows:
              type: array
              items:
                type: object
                required: [dataset, label, cells]
                properties:
                  dataset: {type: string}
                  label: {type: string}
                  group: {type: [string, "null"]}
                  cells: {type: array, items: {type: [number, "null"]}, description: "Coverage ratio actual / expected per day (null = no session)"}
        gaps:
          type: object
          required: [by_status, by_class, by_dataset, items, total]
          properties:
            by_status: {type: object, additionalProperties: {type: integer}}
            by_class: {type: object, additionalProperties: {type: integer}}
            by_dataset: {type: array, items: {type: object, additionalProperties: true}}
            items: {type: array, items: {$ref: "#/components/schemas/DataGap"}}
            total: {type: integer}
        campaigns: {type: array, items: {$ref: "#/components/schemas/DataHealthCampaign"}}
        filler: {type: object, additionalProperties: true, description: "{alive, pid, heartbeat_at, state, reasons, sample, config, running, waiting, recent, keep_awake, pause}. pause (coverage v3 A4): the filler.PAUSE flag read live, a PauseFlag object or null without a file."}
        sources: {type: array, items: {$ref: "#/components/schemas/DataHealthSource"}}
        failures: {type: array, items: {type: object, additionalProperties: true}}
        sla_breaches: {type: array, items: {type: object, additionalProperties: true}}
        alerts: {type: array, items: {$ref: "#/components/schemas/OpsAlert"}}
        disk_free_gb: {type: [number, "null"]}
        supervisor: {type: [object, "null"], additionalProperties: true, description: "Supervisor summary (incident 2026-10-24): restarts per child with reasons, restart-loop alerts, orphan reaper metrics (leaked_processes, killed_total). Same shape as SystemStatus.supervisor."}
        qa: {oneOf: [{$ref: "#/components/schemas/QaReport"}, {type: "null"}], description: "Latest regression-guard summary. Added v1.30."}
        freshness: {type: [object, "null"], additionalProperties: true, description: "{source: sync | detector, sync_scanned_at, sync_run_id, authoritative_h}: where the dataset verdicts come from. Added v1.43.0."}
        last_refresh: {oneOf: [{$ref: "#/components/schemas/LastRefresh"}, {type: "null"}], description: "Added v1.43.0."}
        refresh_failures: {type: array, items: {$ref: "#/components/schemas/RefreshFailure"}, description: "Added v1.43.0."}
    QaSuite:
      type: object
      required: [status]
      description: "One regression-guard suite. Added v1.30."
      properties:
        status: {type: string, enum: [passed, warn, failed, skipped]}
        failed: {type: [integer, "null"]}
        counts: {type: object, additionalProperties: {type: integer}}
        message: {type: [string, "null"]}
        operations: {type: [integer, "null"], description: "api: GET operations swept"}
        checks: {type: [integer, "null"], description: "golden: checks"}
        routes: {type: [integer, "null"], description: "smoke: routes"}
        loads_total: {type: [integer, "null"], description: "smoke: route + tab loads"}
        served_version: {type: [string, "null"]}
        contract_version: {type: [string, "null"]}
        client: {type: [string, "null"], description: "live | in_process"}
        ui_url: {type: [string, "null"]}
        report_dir: {type: [string, "null"]}
        latency_ms: {type: [object, "null"], additionalProperties: {type: [number, "null"]}}
        load_ms: {type: [object, "null"], additionalProperties: {type: [number, "null"]}}
        run_id: {type: [string, "null"], description: "QA run that produced this suite result (the state is merged per suite). Added v1.43.0."}
        finished_at: {type: [string, "null"], format: date-time}
        age_h: {type: [number, "null"]}
        stale: {type: [boolean, "null"], description: "Superseded (a newer QA run did not re-run it) or older than its horizon (api / golden 26 h, smoke 50 h)"}
        superseded_by: {type: [string, "null"]}
        last_skip: {type: [object, "null"], additionalProperties: true, description: "{run_id, at, message} of the latest run that skipped this suite"}
    QaIssue:
      type: object
      required: [suite, item]
      description: "Added v1.30."
      properties:
        suite: {type: string, enum: [api, golden, smoke]}
        item: {type: string}
        status: {type: [string, "null"]}
        url: {type: [string, "null"]}
        detail: {type: [string, "null"]}
    QaReport:
      type: object
      required: [status, suites, issues]
      description: "Regression guard summary (status pending = never run). Added v1.30."
      properties:
        run_id: {type: [string, "null"]}
        status: {type: string, enum: [passed, warn, failed, skipped, pending]}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        api_base_url: {type: [string, "null"]}
        client: {type: [string, "null"]}
        message: {type: [string, "null"]}
        report: {type: [string, "null"], description: "Local path of the HTML report"}
        suites: {type: object, additionalProperties: {$ref: "#/components/schemas/QaSuite"}}
        issues: {type: array, items: {$ref: "#/components/schemas/QaIssue"}, description: "Failed items (top 25)"}
        details: {type: array, items: {$ref: "#/components/schemas/QaIssue"}, description: "detail=true: every non-passing item of the latest report"}
        alert: {oneOf: [{$ref: "#/components/schemas/OpsAlert"}, {type: "null"}]}
        age_h: {type: [number, "null"], description: "Age of the latest QA run in hours. Added v1.43.0."}
        stale: {type: [boolean, "null"], description: "No current suite result (every suite stale). Added v1.43.0."}
        trigger: {type: [string, "null"], description: "refresh | sync | manual (latest run)"}
        run_status: {type: [string, "null"], description: "Status of the latest run alone (status = merged suites)"}
        skipped: {type: [object, "null"], additionalProperties: {type: string}, description: "suite -> why the latest run left it out (e.g. UI smoke at most once a day)"}
        runs: {type: array, items: {type: object, additionalProperties: true}, description: "Recent runs: run_id, finished_at, status, trigger, suites"}
    SyncReason:
      type: string
      enum: [fresh, due, not_yet_published, source_unavailable, no_source, needs_key, failed]
      description: >-
        fresh = up to date; due = exists at the source, missing here (fetched by the sync); not_yet_published = the
        session / release / deadline has not happened yet or the source has not published it (next_expected,
        retry_at); source_unavailable = source down or rate-limited (retry_at); no_source = no free / official source
        (documented); needs_key = an API key is missing (keys); failed = the job errored (attempts; parked after 3).
        Added v1.41.
    AvailabilityCode:
      type: string
      enum: [fresh, due, not_yet_published, source_unavailable, no_source, needs_key, failed, mapping_gap, pipeline_bug,
             stale, not_applicable, out_of_scope, suppressed, insufficient_data]
      description: >-
        SyncReason codes plus the field-level codes of the completeness audit: mapping_gap = identifier or join not
        resolving (sync failed); pipeline_bug = the source has the data, the pipeline drops it, fix pending (failed);
        stale = stored copy not refreshed yet (due); not_applicable = the field does not apply to this entity (fresh);
        out_of_scope = computed for a universe subset only (no_source); suppressed = withheld by a plausibility bound
        or a failed validation gate (fresh). Added v1.42.0.
    AvailabilityReason:
      type: object
      required: [code, sync_code, label, message]
      properties:
        code: {$ref: "#/components/schemas/AvailabilityCode"}
        sync_code: {$ref: "#/components/schemas/SyncReason"}
        label: {type: string, description: "Short label (e.g. Not published yet)"}
        message: {type: string, description: "Tooltip text (e.g. Needs OPENDART_APIKEY (Korea DART financial statements))"}
        next_expected: {type: [string, "null"], description: "Next expected date / time when known"}
        detail: {type: [string, "null"], description: "Fix / owner"}
        field: {type: [string, "null"], description: "BQL mnemonic (CompanyAvailability)"}
        has_value: {type: [boolean, "null"], description: "CompanyAvailability with all_fields=true: the field has a value"}
    FieldAvailabilityEntry:
      type: object
      properties:
        group: {type: [string, "null"]}
        reason: {oneOf: [{$ref: "#/components/schemas/AvailabilityReason"}, {type: "null"}], description: "Main gap reason (or the region reason with ?region=)"}
        regions: {type: object, additionalProperties: {oneOf: [{$ref: "#/components/schemas/AvailabilityReason"}, {type: "null"}]}}
        coverage_pct: {type: [number, "null"]}
        coverage: {type: [object, "null"], additionalProperties: true}
    FieldAvailability:
      type: object
      required: [version, codes, fields]
      properties:
        version: {type: integer}
        generated_at: {type: [string, "null"]}
        serving_run_id: {type: [string, "null"]}
        region: {type: [string, "null"]}
        codes:
          type: array
          items:
            type: object
            required: [code, sync_code, label, message]
            properties:
              code: {$ref: "#/components/schemas/AvailabilityCode"}
              sync_code: {$ref: "#/components/schemas/SyncReason"}
              label: {type: string}
              message: {type: string}
        areas: {type: object, additionalProperties: {$ref: "#/components/schemas/AvailabilityReason"}, description: "Page elements outside BQL (earnings upcoming actuals, macro tiles, CFTC positioning ...)"}
        aliases: {type: object, additionalProperties: {type: string}, description: "Alias / screener key -> BQL mnemonic of fields (pe_ntm -> pe_fwd)"}
        fields: {type: object, additionalProperties: {$ref: "#/components/schemas/FieldAvailabilityEntry"}}
      description: Added v1.42.0.
    CompanyAvailability:
      type: object
      required: [security_id, reasons]
      properties:
        security_id: {type: string}
        region: {type: [string, "null"]}
        as_of: {type: [string, "null"]}
        px_date: {type: [string, "null"]}
        has_fundamentals: {type: boolean}
        reasons: {type: object, additionalProperties: {$ref: "#/components/schemas/AvailabilityReason"}, description: "field -> reason (fields with a value are omitted unless all_fields=true)"}
      description: Added v1.42.0.
    SyncEntity:
      type: object
      required: [entity, reason]
      properties:
        entity: {type: string, description: "Region, currency, source, country, job or *"}
        reason: {$ref: "#/components/schemas/SyncReason"}
        data_as_of: {type: [string, "null"]}
        expected_as_of: {type: [string, "null"]}
        next_expected: {type: [string, "null"], format: date-time}
        detail: {type: [string, "null"]}
        missing: {type: [array, "null"], items: {type: string}, description: "Periods to fetch (sessions, days)"}
        keys: {type: [array, "null"], items: {type: string}, description: "Missing API key names (never values)"}
        retry_at: {type: [string, "null"], format: date-time}
        attempts: {type: [integer, "null"]}
        secondary: {type: [boolean, "null"], description: "Alternative source / informational: never decides the dataset reason"}
    SyncDatasetRun:
      type: object
      required: [job, status]
      properties:
        job: {type: string}
        status: {type: string}
        reason: {type: [string, "null"]}
        duration_s: {type: [number, "null"]}
        pass_no: {type: [integer, "null"]}
    SyncDataset:
      type: object
      required: [dataset, reason]
      properties:
        dataset: {type: string, description: "contracts/coverage.yaml dataset id, or job:<id> for a source job no dataset covers"}
        label: {type: [string, "null"]}
        group: {type: [string, "null"]}
        kind: {type: [string, "null"], enum: [coverage, job, null]}
        reason: {$ref: "#/components/schemas/SyncReason"}
        data_as_of: {type: [string, "null"]}
        expected_as_of: {type: [string, "null"]}
        next_expected: {type: [string, "null"], format: date-time}
        detail: {type: [string, "null"]}
        keys: {type: [array, "null"], items: {type: string}}
        retry_at: {type: [string, "null"], format: date-time}
        attempts: {type: [integer, "null"]}
        jobs: {type: [array, "null"], items: {type: string}, description: "Fetch jobs planned for this dataset"}
        entities: {type: array, items: {$ref: "#/components/schemas/SyncEntity"}}
        runs: {type: array, items: {$ref: "#/components/schemas/SyncDatasetRun"}, description: "Jobs run for it in this sync"}
    SyncJob:
      type: object
      required: [job, status]
      properties:
        job: {type: string}
        pass_no: {type: [integer, "null"], description: "1 = core (fetch + headline analytics), 2 = extended"}
        lane: {type: [string, "null"], description: "network (parallel) | heavy (one at a time) | light"}
        tier: {type: [string, "null"]}
        trigger: {type: [string, "null"], description: "dataset | cadence | upstream | fingerprint | derive | publish | post | carry (coverage v3 A3: deferred by the previous sync)"}
        status: {type: string, description: "pending | running | success | partial | failed | skipped"}
        reason: {type: [string, "null"]}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        duration_s: {type: [number, "null"]}
        rows: {type: [integer, "null"]}
        message: {type: [string, "null"]}
        error_type: {type: [string, "null"]}
        datasets: {type: [array, "null"], items: {type: string}}
        params: {type: [object, "null"]}
        why: {type: [array, "null"], items: {type: string}}
        carried: {type: [integer, "null"], description: "Coverage v3 A3: times previous syncs deferred this job (it goes first); null = not carried"}
    SyncChip:
      type: object
      properties:
        text: {type: [string, "null"], description: "Syncing data... 12/48 | Data up to date as of 2026-10-27 | 3 skipped (null = never ran)"}
        tone: {type: [string, "null"], enum: [info, ok, warn, down, null]}
        link: {type: [string, "null"]}
        running: {type: [boolean, "null"]}
        title: {type: [string, "null"]}
    SyncStatus:
      type: object
      required: [state, datasets, jobs, chip]
      description: "Startup sync status (state never = no sync ran yet). Added v1.41."
      properties:
        state: {type: string, enum: [never, idle, running, scanning, publishing, interrupted]}
        run_id: {type: [string, "null"]}
        trigger: {type: [string, "null"], description: "startup | interval | manual | api | tray"}
        phase: {type: [string, "null"]}
        result: {type: [string, "null"], description: "success | partial | failed | yielded | skipped"}
        started_at: {type: [string, "null"], format: date-time}
        heartbeat_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        seconds: {type: [number, "null"]}
        as_of: {type: [string, "null"], description: "Target session of the run (latest published US session)"}
        data_as_of: {type: object, description: "overall + regions (region -> date) of the price data after the run"}
        progress: {type: object, description: "datasets_checked, datasets_total, due, fetched, skipped, failed, jobs_done, jobs_total"}
        counts: {type: object, additionalProperties: {type: integer}, description: "datasets per reason"}
        datasets: {type: array, items: {$ref: "#/components/schemas/SyncDataset"}}
        jobs: {type: array, items: {$ref: "#/components/schemas/SyncJob"}}
        publish: {type: array, items: {type: object}, description: "Publishes: mode none | incremental | full, dirty sections with the reason, seconds, snapshot"}
        ram: {type: object, description: "peak_tree_mb (sync process + job processes), min_machine_free_gb"}
        notes: {type: array, items: {type: string}}
        detail: {type: [string, "null"]}
        failed_jobs: {type: array, items: {type: string}}
        scheduler: {type: [object, "null"], description: "Supervisor trigger: enabled, state, next_in_s, interval_min, last_finished_at, supervisor_alive"}
        request: {type: [object, "null"], description: "Pending sync-now request"}
        history: {type: array, items: {type: object}}
        chip: {$ref: "#/components/schemas/SyncChip"}
        deferred: {type: array, items: {$ref: "#/components/schemas/SyncDeferred"}, description: "Coverage v3 A3: jobs this sync deferred to the next one (budget used up, job does not fit the rest of the budget, RAM floor, heavy slot, upstream deferred) with the reason; carried with priority (data/state/ops/sync_carry.json)."}
        caps: {type: object, additionalProperties: true, description: "Coverage v3 A3 budget of the run (app.ops.sync.caps): enabled, max_wall_min, pass_max_jobs, timeout_p95_factor, timeout_floor_min, timeout_ceiling_min, started_at, deadline, remaining_min, jobs_started {pass: n}, hit {at, reason} | null. BIG360_SYNC_CAPS=0 disables the caps."}
        carried_in: {type: array, items: {type: string}, description: "Coverage v3 A3: jobs carried from the previous sync"}
        admission_waits: {type: array, items: {$ref: "#/components/schemas/AdmissionWait"}, description: "Coverage v3 A2: jobs of the sync process waiting for RAM, the floor or the heavy slot"}
        suspended_s: {type: [number, "null"], description: "Coverage v3 A3: seconds the machine was suspended while this sync ran (the wall-clock budget counts them)"}
    SyncDeferred:
      type: object
      required: [job, reason]
      properties:
        job: {type: string}
        pass_no: {type: [integer, "null"]}
        lane: {type: [string, "null"]}
        trigger: {type: [string, "null"]}
        reason: {type: string}
        datasets: {type: array, items: {type: string}}
        deferred_at: {type: [string, "null"], format: date-time}
    SyncRequest:
      type: object
      properties:
        datasets: {type: [array, "null"], items: {type: string}, maxItems: 100}
    SyncRequestAccepted:
      type: object
      required: [requested, running, supervisor, message]
      properties:
        requested: {type: boolean}
        request: {type: object}
        running: {type: boolean}
        supervisor: {type: boolean}
        message: {type: string}
    JobDefinition:
      type: object
      required: [job_id, dag, owner, depends_on]
      properties:
        job_id: {type: string}
        dag: {type: string}
        module: {type: string}
        owner: {type: string}
        depends_on: {type: array, items: {type: string}}
        writes: {type: array, items: {type: string}}
        est_min: {type: [number, "null"]}
        last_run: {oneOf: [{$ref: "#/components/schemas/JobRun"}, {type: "null"}]}
        next_run_at: {type: [string, "null"], format: date-time}
    JobRun:
      type: object
      required: [run_id, job_id, status, started_at, trigger]
      properties:
        run_id: {type: string}
        job_id: {type: string}
        dag_run_id: {type: [string, "null"]}
        trigger: {type: string, enum: [schedule, manual, backfill, dependency, api]}
        status: {$ref: "#/components/schemas/JobStatus"}
        attempt: {type: integer}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        duration_s: {type: [number, "null"]}
        rows_written: {type: [integer, "null"]}
        entities_ok: {type: [integer, "null"]}
        entities_failed: {type: [integer, "null"]}
        error_message: {type: [string, "null"]}
    JobRunPage:
      type: object
      required: [total, limit, offset, items]
      properties:
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        items: {type: array, items: {$ref: "#/components/schemas/JobRun"}}
    JobTriggerRequest:
      type: object
      properties:
        params: {type: object, additionalProperties: true}
        include_downstream: {type: boolean, default: false}
    JobTriggerResponse:
      type: object
      required: [run_id, job_id]
      properties:
        run_id: {type: string}
        job_id: {type: string}
    DqResult:
      type: object
      required: [run_id, table_name, check_id, severity, passed]
      properties:
        run_id: {type: string}
        table_name: {type: string}
        partition_key: {type: string}
        check_id: {type: string}
        severity: {type: string, enum: [info, warn, error]}
        passed: {type: boolean}
        metric_value: {type: [number, "null"]}
        threshold: {type: [number, "null"]}
        checked_at: {type: string, format: date-time}

    # ------------------------------------------------------------ meta
    SecurityRef:
      type: object
      required: [security_id, issuer_id, ticker, name, region, country, currency]
      properties:
        isin: {type: [string, "null"], description: "Added v1.1"}
        exchange_name: {type: [string, "null"], description: "Human-readable exchange name of the primary listing (from MIC). Added v1.1."}
        lei: {type: [string, "null"], description: "Issuer LEI (issuers.lei: GLEIF ISIN match or verified seed). Added v1.4."}
        security_id: {type: string}
        issuer_id: {type: string}
        ticker: {type: string, description: "display_ticker, e.g. AAPL, 7203.T"}
        name: {type: string}
        name_local: {type: [string, "null"]}
        mic: {type: [string, "null"]}
        region: {$ref: "#/components/schemas/Region"}
        country: {type: string}
        sector_id: {type: [string, "null"]}
        subsector_id: {type: [string, "null"]}
        currency: {type: string}
        market_cap_usd: {type: [number, "null"]}
        logo_url: {type: [string, "null"]}
    Taxonomy:
      type: object
      required: [sectors]
      properties:
        sectors:
          type: array
          items:
            type: object
            required: [id, name, subsectors]
            properties:
              id: {type: string}
              name: {type: string}
              subsectors:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: {type: string}
                    name: {type: string}
                    kpi_set_id: {type: string}
                    groups: {type: array, items: {type: string}}
    FactorMeta:
      type: object
      required: [factors, profiles, default_profile]
      properties:
        factors:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {$ref: "#/components/schemas/FactorId"}
              name: {type: string}
              description: {type: [string, "null"]}
              members: {type: object, additionalProperties: {type: number}}
        profiles: {type: object, additionalProperties: {type: object, additionalProperties: {type: number}}}
        default_profile: {type: string}
        composite_validation: {$ref: "#/components/schemas/CompositeValidation"}
    CompositeValidation:
      type: object
      description: "Coverage v3 A8: composite scores are DESCRIPTIVE (rules-based peer ranking, not a forecast). signal_wording (UI may say 'signal' / 'predictive' / buy-sell) is true only for a profile whose recorded out-of-sample gate passed (job composite_validation -> data/reports/composite/gate.json; contracts/scoring.yaml composite.validation)."
      required: [label, signal_wording, note, profiles]
      properties:
        label: {type: string, enum: [descriptive, validated], description: "Label of the default profile"}
        default_profile: {type: string}
        signal_wording: {type: boolean}
        note: {type: string}
        custom_weights_label: {type: string, enum: [descriptive], description: "Screener re-weighted composites are never validated"}
        evaluated_at: {type: [string, "null"], format: date-time, description: "When the gate was last recorded (null = never)"}
        gate_recorded: {type: boolean}
        criteria: {type: object, additionalProperties: true, description: "Gate thresholds (horizon, min_dates, min_names_per_date, min_rank_ic_t, min_auc_t, rule)"}
        profiles:
          type: object
          additionalProperties:
            type: object
            required: [label, verdict, signal_wording]
            properties:
              label: {type: string, enum: [descriptive, validated]}
              verdict: {type: string, enum: [pass, fail, not_validated]}
              signal_wording: {type: boolean}
              horizon: {type: [string, "null"]}
              rank_ic_mean: {type: [number, "null"]}
              rank_ic_t: {type: [number, "null"], description: "Newey-West t of the per-date mean rank IC"}
              auc_mean: {type: [number, "null"]}
              auc_t: {type: [number, "null"], description: "Newey-West t of the per-date mean AUC - 0.5"}
              auc_p: {type: [number, "null"], description: "One-sided p of auc_t"}
              n_dates: {type: [integer, "null"]}
              n_months: {type: [integer, "null"], description: "Distinct scoring months (the panel keeps one scoring date per month; min_dates counts these)"}
              n_obs: {type: [integer, "null"]}
              start: {type: [string, "null"], format: date}
              end: {type: [string, "null"], format: date}
              universe: {oneOf: [{$ref: "#/components/schemas/CompositeGateUniverse"}, {type: "null"}]}
              survivorship: {oneOf: [{$ref: "#/components/schemas/CompositeGateSurvivorship"}, {type: "null"}], description: "Whether the recorded metrics come from a survivorship-free panel. Added coverage v3 A8 review."}
        universe: {oneOf: [{$ref: "#/components/schemas/CompositeGateUniverse"}, {type: "null"}], description: "Universe the default profile's gate tested"}
        evidence: {type: array, items: {type: object, additionalProperties: true}, description: "Out-of-sample results on record (scoring.yaml composite.validation.evidence), e.g. Model Studio AUC 0.490"}
    CompositeGateSurvivorship:
      type: object
      description: "Survivorship record of a composite gate (coverage v3 A8 review). The stored history scores today's MVP universe backwards, so the panel is masked by point-in-time universe_membership and only scoring months on or after the membership history start can decide a pass; with fewer than min_dates such months the full-history metrics are recorded with survivorship_biased = true and the verdict is never pass."
      properties:
        universes: {type: array, items: {type: string}, description: "universe_membership universes of the mask (empty = membership unavailable)"}
        membership_history_start: {type: [string, "null"], format: date, description: "First date with recorded membership history (latest over the universes); null = unavailable"}
        survivorship_biased: {type: [boolean, "null"], description: "The recorded metrics include months before membership_history_start (survivors only)"}
        n_months_survivorship_free: {type: [integer, "null"], description: "Scoring months on or after membership_history_start"}
        decided_on: {type: [string, "null"], enum: [survivorship_free, full_history, null], description: "Which panel the recorded metrics and verdict come from"}
    CompositeGateUniverse:
      type: object
      description: "Population a composite gate was computed on (coverage v3 A8). A passed profile labels a composite 'validated' only when its score scope is one of `scopes` and its security was in the gate panel (the security id list stays in data/reports/composite/gate.json); every other composite stays descriptive. Only a canonical run (every stored profile, contract horizon, full history, no sample cap) is trusted."
      properties:
        table: {type: string, description: "composite_scores (MVP scope)"}
        scopes: {type: array, items: {type: string, enum: [mvp, extended]}}
        regions: {type: array, items: {type: string}, description: "issuers.region of the tested issuers (informational: US-listed ADRs carry their issuer's region)"}
        n_securities: {type: integer}
    MetricMeta:
      type: object
      required: [id, label, unit, source]
      properties:
        id: {type: string}
        label: {type: string}
        unit: {type: string}
        higher_is_better: {type: [boolean, "null"]}
        target: {type: [number, "null"]}
        source: {type: string, enum: [ratios, sector_kpis, valuation, market, insider, sentiment, macro, moat, forecast]}
        kpi_set_ids: {type: array, items: {type: string}}
        formula: {type: [string, "null"]}

    # ------------------------------------------------------------ market & macro
    IndexPerf:
      type: object
      required: [id, name]
      properties:
        region: {type: [string, "null"], description: "Added v1.1"}
        currency: {type: [string, "null"], description: "Added v1.1"}
        spark_points: {type: array, items: {$ref: "#/components/schemas/TimePoint"}, description: "Dated version of spark (last 60 closes). Added v1.1."}
        id: {type: string}
        name: {type: string}
        last: {type: [number, "null"]}
        chg_1d: {type: [number, "null"]}
        chg_1m: {type: [number, "null"]}
        chg_ytd: {type: [number, "null"]}
        spark: {type: array, items: {type: number}, description: "last 60 closes"}
        as_of: {type: [string, "null"], format: date, description: "Date of `last` (the index's latest bar). Added v1.29."}
    SectorPerf:
      type: object
      required: [sector_id, name]
      properties:
        market_cap_usd: {type: [number, "null"], description: "Sum of constituents' market cap (treemap size). Added v1.1."}
        n_securities: {type: [integer, "null"], description: "Added v1.1"}
        sector_id: {type: string}
        name: {type: string}
        ret_1d: {type: [number, "null"]}
        ret_1m: {type: [number, "null"]}
        ret_3m: {type: [number, "null"]}
        ret_ytd: {type: [number, "null"]}
        median_composite: {type: [number, "null"]}
        n_ret_1d: {type: [integer, "null"], description: "Constituents in ret_1d: v1.29 ret_1d only uses names whose last bar is on their region's data_as_of (no stale 1D mixed in)"}
        as_of: {type: [string, "null"], format: date, description: "Session of ret_1d when all regions of the row share one date, else null (see as_of_by_region). Added v1.29."}
        as_of_by_region: {type: object, additionalProperties: {type: string, format: date}, description: "region -> data_as_of. Added v1.29."}
    MoverRow:
      type: object
      required: [security, chg_1d]
      properties:
        security: {$ref: "#/components/schemas/SecurityRef"}
        close: {type: [number, "null"]}
        chg_1d: {type: number}
        volume_z: {type: [number, "null"]}
        px_date: {type: [string, "null"], format: date, description: "Date of the bar behind chg_1d. Added v1.29."}
        adv_usd_20d: {type: [number, "null"], description: "20-day average traded value in USD. Added v1.30."}
    Breadth:
      type: object
      properties:
        pct_above_200d: {type: [number, "null"]}
        pct_above_50d: {type: [number, "null"]}
        advancers: {type: integer}
        decliners: {type: integer}
        new_highs_52w: {type: integer}
        new_lows_52w: {type: integer}
        as_of_by_region: {type: object, additionalProperties: {type: string, format: date}, description: "region -> data_as_of. Added v1.29."}
    RegimeSnapshot:
      type: object
      required: [date, label, probabilities]
      properties:
        date: {type: string, format: date}
        label: {$ref: "#/components/schemas/RegimeLabel"}
        probabilities: {type: object, additionalProperties: {type: number}, description: "regime label -> probability"}
        scope: {type: [string, "null"], description: "Scope of the model that produced this snapshot (GLOBAL when a region falls back). Added v1.29."}
        requested_scope: {type: [string, "null"], description: "Added v1.29"}
        modelled: {type: [boolean, "null"], description: "True when requested_scope has its own model. Added v1.29."}
        fallback: {type: [boolean, "null"], description: "True when the GLOBAL model answers for a region without its own model (show it labelled). Added v1.29."}
        model_id: {type: [string, "null"], description: "Added v1.29"}
    MarketOverview:
      type: object
      required: [as_of, indices, sector_performance, breadth, gainers, losers]
      properties:
        yield_curves: {type: array, items: {$ref: "#/components/schemas/YieldCurve"}, description: "Sovereign curves for the requested regions (only curves with >= 2 tenors with data). Added v1.1."}
        data_status: {$ref: "#/components/schemas/DataStatus"}
        as_of: {type: string, format: date}
        region: {type: [string, "null"]}
        indices: {type: array, items: {$ref: "#/components/schemas/IndexPerf"}}
        sector_performance: {type: array, items: {$ref: "#/components/schemas/SectorPerf"}}
        breadth: {$ref: "#/components/schemas/Breadth"}
        gainers: {type: array, items: {$ref: "#/components/schemas/MoverRow"}}
        losers: {type: array, items: {$ref: "#/components/schemas/MoverRow"}}
        regime: {oneOf: [{$ref: "#/components/schemas/RegimeSnapshot"}, {type: "null"}]}
        key_macro: {type: array, items: {$ref: "#/components/schemas/MacroSeriesSummary"}}
        data_as_of: {type: array, items: {$ref: "#/components/schemas/RegionDataAsOf"}, description: "Explicit data-as-of per region (F06). Added v1.29."}
        dates_aligned: {type: boolean, description: "All regions on the same session. Added v1.29."}
        common_date: {type: [string, "null"], format: date, description: "Earliest region data_as_of. Added v1.29."}
        latest_date: {type: [string, "null"], format: date, description: "Latest region data_as_of. Added v1.29."}
        regime_scope: {$ref: "#/components/schemas/RegimeScopeInfo"}
        credit_spreads: {type: array, items: {$ref: "#/components/schemas/CreditSpread"}, description: "Curated credit spreads with correct windows (F09). Added v1.29."}
        movers_filter: {$ref: "#/components/schemas/MoversFilter"}
    MoversFilter:
      type: object
      description: "Liquidity screen applied to gainers / losers (F21). Added v1.30."
      properties:
        liquid: {type: boolean}
        min_adv_usd: {type: [number, "null"]}
        min_mcap_usd: {type: [number, "null"]}
        min_price_usd: {type: [number, "null"]}
        unknown_mcap_min_adv_usd: {type: [number, "null"], description: "ADV floor for names without a known market cap"}
        unknown_adv_passes: {type: boolean, description: "True only for the legacy screen (liquid=false)"}
        limit: {type: integer}
    RegionDataAsOf:
      type: object
      required: [region, as_of]
      description: Added v1.29.
      properties:
        region: {type: string}
        as_of: {type: string, format: date, description: "Modal last-bar date of the region's equities"}
        latest: {type: [string, "null"], format: date, description: "Most recent date carried by >= 1% of the region's equities"}
        n_securities: {type: integer}
        n_at_as_of: {type: integer}
        share_at_as_of: {type: [number, "null"]}
        n_at_latest: {type: [integer, "null"]}
        stale_share: {type: [number, "null"], description: "Share of names whose last bar is older than as_of"}
    RegimeScopeInfo:
      type: object
      description: "Which regime model answers a requested scope. Added v1.29."
      properties:
        requested_scope: {type: string}
        scope: {type: [string, "null"]}
        model_id: {type: [string, "null"]}
        modelled: {type: boolean}
        fallback: {type: boolean}
        available_scopes: {type: array, items: {type: string}}
    CreditSpread:
      type: object
      required: [series_id, label, spread_type]
      description: "Added v1.29 (F09). Values in percent (1.25 = 125 bp)."
      properties:
        series_id: {type: string}
        label: {type: string}
        region: {type: [string, "null"], description: "US, EU or EM"}
        spread_type: {type: string, enum: [oas, yield_spread], description: "yield_spread = Moody's Baa minus 10Y (not option-adjusted)"}
        segment: {type: [string, "null"], description: "ig, bbb, hy, ccc, em, em_hy, em_ig, baa"}
        unit: {type: string}
        as_of: {type: [string, "null"], format: date}
        last: {type: [number, "null"]}
        change_1d: {type: [number, "null"], description: "vs previous observation"}
        change_1m: {type: [number, "null"], description: "vs the observation on or before as_of - 30 calendar days"}
        change_1m_base_date: {type: [string, "null"], format: date}
        change_1y: {type: [number, "null"]}
        percentile: {type: [number, "null"], description: "Empirical percentile of last within the window (0..1)"}
        percentile_window_years: {type: [number, "null"], description: "Actual window length (FRED carries ~3 years of ICE BofA data)"}
        percentile_method: {type: string, enum: [empirical]}
        spark_window_days: {type: integer}
        spark_points: {type: array, items: {$ref: "#/components/schemas/TimePoint"}}
    YieldCurvePoint:
      type: object
      required: [tenor, tenor_months]
      properties:
        tenor: {type: string, description: "O/N, 1M, 3M, 6M, 1Y, 2Y, 5Y, 7Y, 10Y, 20Y, 30Y"}
        tenor_months: {type: integer}
        yield: {type: [number, "null"], description: "Percent (scale = percent), latest observation"}
        yield_1m_ago: {type: [number, "null"]}
        yield_1y_ago: {type: [number, "null"]}
        series_id: {type: [string, "null"]}
        as_of: {type: [string, "null"], format: date}
        is_policy_rate: {type: [boolean, "null"], description: "O/N point = policy / overnight rate, not a market yield. Added v1.29."}
    YieldCurve:
      type: object
      required: [curve_id, country, label, points]
      description: Added v1.1.
      properties:
        curve_id: {type: string}
        country: {type: string, description: "ISO2 or EA"}
        region: {type: [string, "null"]}
        label: {type: string}
        as_of: {type: [string, "null"], format: date}
        scale: {type: string, enum: [percent, fraction, level], default: percent}
        points: {type: array, items: {$ref: "#/components/schemas/YieldCurvePoint"}}
        as_of_min: {type: [string, "null"], format: date, description: "Oldest point date (as_of is the newest). Added v1.29."}
        n_market_tenors: {type: [integer, "null"], description: "Points that are market tenors (O/N is a policy / overnight rate). Added v1.29."}
    MacroRegime:
      type: object
      required: [model_id, scope, current, history]
      properties:
        data_status: {$ref: "#/components/schemas/DataStatus"}
        model_id: {type: string}
        scope: {type: string}
        modelled: {type: boolean, description: "False = no regime model for this scope (current.label = not_modelled). Added v1.29."}
        status: {type: string, enum: [modelled, not_modelled], description: "Added v1.29"}
        message: {type: [string, "null"], description: "Added v1.29"}
        available_scopes: {type: array, items: {type: string}, description: "Scopes with their own model. Added v1.29."}
        current: {$ref: "#/components/schemas/RegimeSnapshot"}
        history: {type: array, items: {$ref: "#/components/schemas/RegimeSnapshot"}}
        inputs: {type: array, items: {$ref: "#/components/schemas/NamedSeries"}}
        regime_sector_returns:
          type: array
          description: "Mean monthly excess return of each sector per regime (historical)"
          items:
            type: object
            required: [sector_id, regime_label, mean_excess_return]
            properties:
              sector_id: {type: string}
              regime_label: {$ref: "#/components/schemas/RegimeLabel"}
              mean_excess_return: {type: number}
    MacroSeriesMeta:
      type: object
      required: [series_id, title, source_id, category, frequency]
      properties:
        scale: {type: string, enum: [percent, fraction, level], description: "How to read values: percent = 4.25 means 4.25%; fraction = 0.0425; level = index/units. Added v1.1."}
        series_id: {type: string}
        source_id: {type: string}
        title: {type: string}
        country: {type: [string, "null"]}
        category: {$ref: "#/components/schemas/MacroCategory"}
        frequency: {type: string, enum: [D, W, M, Q, A]}
        units: {type: [string, "null"]}
        last_observation_date: {type: [string, "null"], format: date}
    MacroSeriesSummary:
      allOf:
        - {$ref: "#/components/schemas/MacroSeriesMeta"}
        - type: object
          properties:
            last_value: {type: [number, "null"]}
            change_1p: {type: [number, "null"], description: "change vs previous observation"}
            change_1y: {type: [number, "null"]}
            zscore_5y: {type: [number, "null"]}
            spark: {type: array, items: {type: number}}
            spark_points: {type: array, items: {$ref: "#/components/schemas/TimePoint"}, description: "Dated version of spark. Added v1.1."}
            display_transform: {type: string, enum: [level, yoy, qoq_saar, mom_diff], description: "How a tile should show the series (F10): CPI / INDPRO y/y, real GDP q/q SAAR, payrolls m/m change, rates as levels. Added v1.29."}
            display_label: {type: [string, "null"], description: "e.g. y/y, q/q SAAR, m/m change"}
            display_unit: {type: string, enum: [percent, fraction, level], description: "percent = 4.25 means 4.25%; fraction = 0.0425"}
            display_value: {type: [number, "null"]}
            display_change_1p: {type: [number, "null"], description: "display_value minus the previous transformed observation"}
            observation_date: {type: [string, "null"], format: date, description: "Reference date of display_value"}
            change_1m: {type: [number, "null"], description: "Transformed value change over 1 calendar month"}
            percentile_10y: {type: [number, "null"], description: "Empirical percentile of display_value over 10 years (or percentile_window_years)"}
            percentile_window_years: {type: [number, "null"]}
            spark_window_days: {type: integer, description: "Fixed calendar window of display_spark_points (365 daily/weekly, 5y monthly, 10y quarterly)"}
            display_spark_points: {type: array, items: {$ref: "#/components/schemas/TimePoint"}}
    MacroDashboard:
      type: object
      required: [country, groups]
      properties:
        data_status: {$ref: "#/components/schemas/DataStatus"}
        country: {type: string}
        groups:
          type: array
          items:
            type: object
            required: [category, series]
            properties:
              category: {$ref: "#/components/schemas/MacroCategory"}
              series: {type: array, items: {$ref: "#/components/schemas/MacroSeriesSummary"}}
    MacroSeriesData:
      type: object
      required: [meta, transform, points]
      properties:
        meta: {$ref: "#/components/schemas/MacroSeriesMeta"}
        transform: {type: string}
        points: {type: array, items: {$ref: "#/components/schemas/TimePoint"}}

    # ------------------------------------------------------------ sectors
    SectorSummary:
      type: object
      required: [sector_id, name, n_securities]
      properties:
        median_composite: {type: [number, "null"], description: "Median balanced composite. Added v1.1."}
        sector_id: {type: string}
        subsector_id: {type: [string, "null"]}
        name: {type: string}
        n_securities: {type: integer}
        market_cap_usd: {type: [number, "null"]}
        ret_1m: {type: [number, "null"]}
        ret_ytd: {type: [number, "null"]}
        median_factor_scores: {$ref: "#/components/schemas/NumberMap"}
        median_valuation: {$ref: "#/components/schemas/NumberMap"}
        subsectors: {type: array, items: {$ref: "#/components/schemas/SectorSummary"}}
    KpiDistribution:
      type: object
      required: [metric_id, label, unit, n]
      properties:
        values: {type: array, maxItems: 500, items: {type: object, required: [security_id, ticker, value], properties: {security_id: {type: string}, ticker: {type: string}, value: {type: number}}}, description: "Per-company values (largest 500 by market cap), sorted desc. Added v1.1."}
        metric_id: {type: string}
        label: {type: string}
        unit: {type: string}
        higher_is_better: {type: [boolean, "null"], description: "null = band metric (scored on the distance from target) or neutral"}
        target: {type: [number, "null"], description: "v1.39.0: band metrics: the value scored best (-|x - target|), same unit as the values"}
        n: {type: integer}
        p10: {type: [number, "null"]}
        p25: {type: [number, "null"]}
        p50: {type: [number, "null"]}
        p75: {type: [number, "null"]}
        p90: {type: [number, "null"]}
    SectorDetail:
      type: object
      required: [summary, kpi_distributions, leaders, laggards, factor_heatmap]
      properties:
        data_status: {$ref: "#/components/schemas/DataStatus"}
        summary: {$ref: "#/components/schemas/SectorSummary"}
        kpi_set_ids: {type: array, items: {type: string}}
        kpi_distributions: {type: array, items: {$ref: "#/components/schemas/KpiDistribution"}}
        leaders: {type: array, items: {$ref: "#/components/schemas/ScreenerRow"}}
        laggards: {type: array, items: {$ref: "#/components/schemas/ScreenerRow"}}
        factor_heatmap:
          type: array
          items:
            type: object
            required: [subsector_id, factor_id, median_score]
            properties:
              subsector_id: {type: string}
              factor_id: {$ref: "#/components/schemas/FactorId"}
              median_score: {type: [number, "null"]}
        revenue_share: {type: array, items: {type: object, required: [security_id, ticker, share], properties: {security_id: {type: string}, ticker: {type: string}, share: {type: number}}}}
    ScatterPoint:
      type: object
      required: [security_id, ticker, name]
      properties:
        security_id: {type: string}
        ticker: {type: string}
        name: {type: string}
        subsector_id: {type: [string, "null"]}
        x: {type: [number, "null"]}
        y: {type: [number, "null"]}
        market_cap_usd: {type: [number, "null"]}

    # ------------------------------------------------------------ screener
    ScreenerField:
      type: object
      required: [id, label, group, type]
      properties:
        id: {type: string}
        label: {type: string}
        group: {type: string, enum: [identity, score, factor, fundamental, sector_kpi, valuation, market, insider, sentiment, technical, model, macro]}
        type: {type: string, enum: [number, enum, string, boolean]}
        unit: {type: [string, "null"], description: "Display unit. pct = a FRACTION rendered as percent (0.12 = 12%; chg_1m, fv_upside, macro_impact_rates_down_100bp ...); x = multiple / beta; score = 0..100; currency / currency_usd; z; days; count"}
        enum_values: {type: [array, "null"], items: {type: string}}
        higher_is_better: {type: [boolean, "null"]}
    ScreenerFilter:
      type: object
      required: [field, op]
      properties:
        field: {type: string}
        op: {type: string, enum: [eq, neq, gt, gte, lt, lte, between, in, not_in, is_null, not_null]}
        value: {description: "number | string | boolean | array (for in/not_in)"}
        value2: {type: [number, "null"], description: "upper bound for between"}
    ScreenerQuery:
      type: object
      properties:
        universe_id: {type: string, enum: [mvp_us, mvp_global, full, watch], default: full}
        regions: {type: array, items: {$ref: "#/components/schemas/Region"}}
        countries: {type: array, items: {type: string}}
        sector_ids: {type: array, items: {type: string}}
        subsector_ids: {type: array, items: {type: string}}
        size_buckets: {type: array, items: {$ref: "#/components/schemas/SizeBucket"}}
        min_market_cap_usd: {type: [number, "null"]}
        filters: {type: array, items: {$ref: "#/components/schemas/ScreenerFilter"}}
        profile_id: {type: [string, "null"], description: "Stored weight profile; ignored if factor_weights given"}
        factor_weights: {type: [object, "null"], additionalProperties: {type: number, minimum: 0}, description: "Custom weights by FactorId; normalized server-side"}
        columns: {type: array, items: {type: string}, description: "Extra screener field ids returned in row.values (ScreenerColumnId values or dynamic kpi_<id>; unknown ids come back as null)"}
        sort_by: {type: string, default: composite}
        sort_dir: {type: string, enum: [asc, desc], default: desc}
        limit: {type: integer, default: 100, maximum: 1000}
        offset: {type: integer, default: 0}
    ScreenerRow:
      type: object
      required: [security, factor_scores, values]
      properties:
        ml_expected_excess_3m: {type: [number, "null"], description: "Production 3M model: mean OOS excess return of the predicted decile (fraction). Added v1.1."}
        security: {$ref: "#/components/schemas/SecurityRef"}
        price: {type: [number, "null"]}
        chg_1d: {type: [number, "null"]}
        chg_1m: {type: [number, "null"]}
        composite: {type: [number, "null"]}
        grade: {oneOf: [{$ref: "#/components/schemas/Grade"}, {type: "null"}]}
        rank: {type: [integer, "null"]}
        factor_scores: {$ref: "#/components/schemas/NumberMap"}
        moat_class: {oneOf: [{$ref: "#/components/schemas/MoatClass"}, {type: "null"}]}
        ml_rank_pct_3m: {type: [number, "null"]}
        insider_signal: {type: [number, "null"]}
        dq_score: {type: [number, "null"]}
        values: {type: object, additionalProperties: true, description: "field id -> number|string|null for requested columns"}
        score_scope: {type: [string, "null"], enum: [mvp, extended, null], description: "mvp = scored in the MVP model universe; extended = anchored to the MVP reference cross-section (full-universe extension). Added v1.44."}
        ml_extrapolated_3m: {type: [boolean, "null"], description: "The 3M prediction is an out-of-universe extrapolation of the MVP-trained production model. Added v1.44."}
        score_reason: {oneOf: [{$ref: "#/components/schemas/AvailabilityReason"}, {type: "null"}], description: "Why the composite is empty (insufficient_data with the missing inputs). Added v1.44."}
    ScreenerResult:
      type: object
      required: [as_of, total, limit, offset, weights_used, rows]
      properties:
        data_status: {$ref: "#/components/schemas/DataStatus"}
        as_of: {type: string, format: date}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        weights_used: {type: object, additionalProperties: {type: number}}
        rows: {type: array, items: {$ref: "#/components/schemas/ScreenerRow"}}
        composite_label: {type: string, enum: [descriptive, validated], description: "descriptive unless the stored profile ranked on passed its out-of-sample gate AND every composite on the page lies inside the tested population (CompositeGateUniverse: MVP scope, a security of the gate panel); custom factor_weights are always descriptive. Added coverage v3 A8."}

    # ------------------------------------------------------------ company 360
    IssuerInfo:
      type: object
      required: [issuer_id, name, country]
      properties:
        issuer_id: {type: string}
        name: {type: string}
        name_local: {type: [string, "null"]}
        description: {type: [string, "null"]}
        website: {type: [string, "null"]}
        employees: {type: [integer, "null"]}
        country: {type: string}
        fiscal_year_end_mmdd: {type: [string, "null"]}
        reporting_gaap: {type: [string, "null"]}
        reporting_currency: {type: [string, "null"]}
        identifiers: {type: object, additionalProperties: {type: string}, description: "id_type -> value (cik, lei, isin, figi, edinet_code ...)"}
    Quote:
      type: object
      required: [date, close, currency]
      properties:
        date: {type: string, format: date}
        close: {type: number}
        currency: {type: string}
        chg_1d: {type: [number, "null"]}
        chg_1m: {type: [number, "null"]}
        chg_ytd: {type: [number, "null"]}
        high_52w: {type: [number, "null"]}
        low_52w: {type: [number, "null"]}
        volume: {type: [number, "null"]}
        avg_dollar_volume_20d_usd: {type: [number, "null"]}
        market_cap_usd: {type: [number, "null"]}
        enterprise_value_usd: {type: [number, "null"]}
    FactorScore:
      type: object
      required: [factor_id, score, coverage]
      properties:
        peer_median: {type: [number, "null"], description: "Median score of sector peers (same region; global sector if < 8). Added v1.1."}
        factor_id: {$ref: "#/components/schemas/FactorId"}
        score: {type: [number, "null"]}
        coverage: {type: number}
        rank_in_sector: {type: [integer, "null"]}
        sector_count: {type: [integer, "null"]}
        delta_1m: {type: [number, "null"]}
        rank_in_sector_full: {type: [integer, "null"], description: "Rank among all scored securities (MVP + extended) of the region x sector. Added v1.44."}
        sector_count_full: {type: [integer, "null"], description: "Scored securities in the region x sector. Added v1.44."}
        reason: {oneOf: [{$ref: "#/components/schemas/AvailabilityReason"}, {type: "null"}], description: "Why the score is empty (insufficient_data). Added v1.44."}
    MetricScore:
      type: object
      required: [metric_id, label, factor_id]
      properties:
        metric_id: {type: string}
        label: {type: string}
        factor_id: {$ref: "#/components/schemas/FactorId"}
        unit: {type: [string, "null"]}
        higher_is_better: {type: [boolean, "null"]}
        raw_value: {type: [number, "null"]}
        peer_percentile: {type: [number, "null"]}
        peer_median: {type: [number, "null"]}
        peer_group_key: {type: [string, "null"]}
        peer_group_level: {oneOf: [{$ref: "#/components/schemas/PeerGroupLevel"}, {type: "null"}]}
        peer_count: {type: [integer, "null"]}
        self_z: {type: [number, "null"]}
        self_score: {type: [number, "null"]}
        mcap_adj_score: {type: [number, "null"]}
        metric_score: {type: [number, "null"]}
    CompositeSummary:
      type: object
      required: [profile_id, score]
      properties:
        profile_id: {type: string}
        score: {type: [number, "null"]}
        grade: {oneOf: [{$ref: "#/components/schemas/Grade"}, {type: "null"}]}
        rank_global: {type: [integer, "null"]}
        rank_sector: {type: [integer, "null"]}
        coverage: {type: [number, "null"]}
        dq_score: {type: [number, "null"]}
        scope: {type: [string, "null"], enum: [mvp, extended, null], description: "mvp: scored within the MVP universe (rank_global / rank_sector within it); extended: anchored to the MVP reference (grade = MVP quintile, ranks among all scored securities). Added v1.44."}
        rank_global_full: {type: [integer, "null"], description: "Rank among all scored securities (MVP + extended). Added v1.44."}
        n_global_full: {type: [integer, "null"], description: "Added v1.44."}
        rank_sector_full: {type: [integer, "null"], description: "Rank within region x sector among all scored securities. Added v1.44."}
        n_sector_full: {type: [integer, "null"], description: "Added v1.44."}
        reason: {oneOf: [{$ref: "#/components/schemas/AvailabilityReason"}, {type: "null"}], description: "Why the score is empty (insufficient_data with the missing inputs). Added v1.44."}
        label: {type: string, enum: [descriptive, validated], description: "descriptive unless this profile passed its recorded out-of-sample gate (CompositeValidation) AND this composite lies inside the tested population (CompositeGateUniverse: its score scope, a security of the gate panel). Added coverage v3 A8."}
        validated: {type: boolean, description: "label == validated. Added coverage v3 A8."}
    MoatSummary:
      type: object
      required: [moat_class, confidence]
      properties:
        moat_class: {$ref: "#/components/schemas/MoatClass"}
        confidence: {type: number}
        moat_score: {type: [number, "null"]}
        as_of: {type: [string, "null"], format: date}
    CompanyOverview:
      type: object
      required: [security, issuer, as_of, composite, factors, key_metrics, badges]
      properties:
        cost_of_capital: {oneOf: [{$ref: "#/components/schemas/CostOfCapital"}, {type: "null"}], description: "Added v1.2."}
        beta_1y: {type: [number, "null"], description: "1y daily beta vs the region benchmark index. Added v1.1."}
        shares_outstanding: {type: [number, "null"], description: "Added v1.1"}
        last_filing_date: {type: [string, "null"], format: date, description: "Latest periodic/current report knowledge date. Added v1.1."}
        fx_to_usd: {type: [number, "null"], description: "USD per 1 unit of the trading currency (latest). Added v1.1."}
        data_status: {$ref: "#/components/schemas/DataStatus"}
        security: {$ref: "#/components/schemas/SecurityRef"}
        issuer: {$ref: "#/components/schemas/IssuerInfo"}
        as_of: {type: string, format: date}
        quote: {oneOf: [{$ref: "#/components/schemas/Quote"}, {type: "null"}]}
        valuation: {$ref: "#/components/schemas/NumberMap"}
        composite: {$ref: "#/components/schemas/CompositeSummary"}
        factors: {type: array, items: {$ref: "#/components/schemas/FactorScore"}}
        moat: {oneOf: [{$ref: "#/components/schemas/MoatSummary"}, {type: "null"}]}
        ml: {oneOf: [{$ref: "#/components/schemas/PredictionSummary"}, {type: "null"}]}
        fair_value: {oneOf: [{$ref: "#/components/schemas/FairValueSummary"}, {type: "null"}]}
        key_metrics: {type: array, items: {$ref: "#/components/schemas/MetricScore"}, description: "kpi_set peer_metrics with scores"}
        top_zone: {oneOf: [{$ref: "#/components/schemas/ConfluenceZone"}, {type: "null"}]}
        badges: {type: array, items: {type: string}, description: "e.g. cluster_buy, distress_zone, beneish_flag, beneish_watch, wide_moat, stale_fundamentals. v1.29: beneish_flag = recalibrated model-based screen only; textbook-only M > -1.78 -> beneish_watch (info)"}
    PredictionSummary:
      type: object
      required: [horizon, rank_pct, decile, model_run_id]
      properties:
        horizon: {$ref: "#/components/schemas/Horizon"}
        rank_pct: {type: number}
        decile: {type: integer}
        model_run_id: {type: string}
        date: {type: string, format: date}
        scope: {type: [string, "null"], enum: [mvp, extrapolated, null], description: "extrapolated = security outside the MVP model universe, MVP-trained model, rank among the MVP predictions. Added v1.44."}
        scope_note: {type: [string, "null"], description: "Validation evidence of the extrapolation segment. Added v1.44."}
    FairValueSummary:
      type: object
      properties:
        model: {type: [string, "null"], enum: [dcf, excess_return, null], description: "Valuation model of the base scenario (excess_return for banks/insurers). Added v1.2."}
        fair_value_dcf: {type: [number, "null"], description: "Pure intrinsic (DCF / excess-return) value per share, before blending. Added v1.2."}
        fair_value_multiples: {type: [number, "null"], description: "Peer-multiples value per share. Added v1.2."}
        fair_value_low: {type: [number, "null"], description: "Low end of the fair value range. Added v1.2."}
        fair_value_high: {type: [number, "null"], description: "High end of the fair value range. Added v1.2."}
        valuation_confidence: {type: [number, "null"], description: "0..100. Added v1.2."}
        target_price_12m: {type: [number, "null"], description: "Added v1.2."}
        weighted_fair_value: {type: [number, "null"], description: "Blended (DCF + multiples), market-anchored, probability-weighted fair value (headline)"}
        upside_pct: {type: [number, "null"], description: "weighted_fair_value / price - 1 (headline upside)"}
        implied_revenue_cagr_5y: {type: [number, "null"]}
        currency: {type: string}
    PriceBar:
      type: object
      required: [t, c]
      properties:
        t: {type: string, format: date}
        o: {type: [number, "null"]}
        h: {type: [number, "null"]}
        l: {type: [number, "null"]}
        c: {type: number}
        v: {type: [number, "null"]}
    PriceSeries:
      type: object
      required: [security_id, currency, adjusted, interval, bars]
      properties:
        data_status: {$ref: "#/components/schemas/DataStatus"}
        security_id: {type: string}
        currency: {type: string}
        adjusted: {type: boolean}
        interval: {type: string, enum: [D, W, M]}
        bars: {type: array, items: {$ref: "#/components/schemas/PriceBar"}}
        first_date: {type: [string, "null"], format: date, description: "First available bar (weekly history included). Added v1.19.0."}
        daily_from: {type: [string, "null"], format: date, description: "First daily bar; interval D returns weekly bars before it. Added v1.19.0."}
        events: {type: array, items: {type: object, required: [date, type], properties: {date: {type: string, format: date}, type: {type: string, enum: [split, dividend, earnings, filing, insider_buy, insider_sell]}, label: {type: string}}}}
    InstrumentItem:
      type: object
      required: [security_id, ticker, name, type, group, group_label, spark]
      properties:
        security_id: {type: string}
        ticker: {type: string}
        name: {type: string}
        type: {type: string, enum: [fx, future, index, etf]}
        group: {type: string}
        group_label: {type: string}
        currency: {type: [string, "null"]}
        last: {type: [number, "null"]}
        last_date: {type: [string, "null"], format: date}
        chg_1d: {type: [number, "null"]}
        chg_1w: {type: [number, "null"]}
        chg_1m: {type: [number, "null"]}
        chg_ytd: {type: [number, "null"]}
        chg_1y: {type: [number, "null"]}
