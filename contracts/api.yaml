      properties:
        running: {type: boolean, description: "Lock held and heartbeat < 90 s"}
        enabled: {type: boolean, description: "Tray toggle Live quotes on/off"}
        state: {type: string}
        reason: {type: [string, "null"]}
        heartbeat_at: {type: [string, "null"], format: date-time}
