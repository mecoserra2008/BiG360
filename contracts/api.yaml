        n_events: {type: [integer, "null"]}
        sources: {type: array, items: {type: string}}
        domains: {type: array, items: {type: string}}
        urls: {type: array, items: {type: string}}
        tone: {type: [number, "null"]}
        sentiment: {type: [number, "null"], description: "Model-based"}
        sentiment_model: {type: [string, "null"]}
        lang: {type: [string, "null"]}
        themes: {type: array, items: {type: string}}
        sectors: {type: array, items: {type: string}}
        countries: {type: array, items: {type: string}}
        securities: {type: array, items: {$ref: "#/components/schemas/NewsStorySecurity"}}
        issuer_ids: {type: array, items: {type: string}}
        salience: {type: [number, "null"]}
        velocity_1h: {type: [integer, "null"], description: "Articles in the last 60 min (live)"}
        velocity_ratio: {type: [number, "null"], description: "velocity_1h / the story's own baseline rate (floored at 0.5 / h)"}
    NewsStoryPage:
      type: object
      required: [data_status, items]
      properties:
        data_status: {$ref: "#/components/schemas/DataStatus"}
        generated_at: {type: [string, "null"]}
