        items: {type: array, items: {$ref: "#/components/schemas/NewsTerminalItem"}}
        securities: {type: array, items: {$ref: "#/components/schemas/NewsPriceMove"}}
        filings: {type: array, items: {$ref: "#/components/schemas/NewsRelatedFiling"}}
        events: {type: array, items: {$ref: "#/components/schemas/NewsRelatedEvent"}}
        impact: {oneOf: [{$ref: "#/components/schemas/NewsImpact"}, {type: "null"}]}
