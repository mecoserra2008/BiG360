        betweenness: {type: [number, "null"]}
        degree_centrality: {type: [number, "null"]}
        geo_hhi: {type: [number, "null"]}
        top_country: {type: [string, "null"]}
        top_country_share: {type: [number, "null"]}
        domestic_share: {type: [number, "null"]}
        country_risk: {type: [number, "null"], description: "Exposure-weighted model-based country risk 0-100 (direct weights)"}
        country_risk_look_through: {type: [number, "null"]}
        event_pressure: {type: [number, "null"]}
        recession_prob: {type: [number, "null"]}
        geo_source: {type: [string, "null"], description: "geo_revenue | home_country | none"}
        geo_source_id: {type: [string, "null"]}
        geo_method: {type: [string, "null"]}
        geo_confidence: {type: [number, "null"]}
        geo_period_end: {type: [string, "null"], format: date}
        geo_knowledge_date: {type: [string, "null"], format: date}
        coverage_level: {type: [string, "null"]}
