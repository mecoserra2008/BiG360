paths:
  # ======================================================================= SYSTEM
  /health:
    get:
      tags: [system]
      operationId: getHealth
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /ready:
    get:
      tags: [system]
      operationId: getReady
      summary: Readiness probe (load balancers / orchestrators); /health is the liveness probe
      description: >
        200 when the API can serve data: a serving snapshot is published and (unless the server runs with
        BIG360_READY_REQUIRE_WORKER=0) the worker heartbeat is younger than BIG360_READY_WORKER_MAX_AGE_S (300 s).
        503 otherwise, with the same body. The gap-filler check is informational (required = false). Added v1.31.
      responses:
        "200": {description: Ready, content: {application/json: {schema: {$ref: "#/components/schemas/Readiness"}}}}
        "503": {description: Not ready, content: {application/json: {schema: {$ref: "#/components/schemas/Readiness"}}}}
  /metrics:
    get:
      tags: [system]
      operationId: getMetrics
      summary: Prometheus metrics (text exposition format 0.0.4)
      description: >
        Metric families (prefix big360_): build_info, http_requests_total {method, route, status},
        http_request_duration_seconds histogram {method, route} (route = template, SSE excluded),
        http_requests_in_flight, sse_connections, sse_connections_total, process_start_time_seconds,
        process_resident_memory_bytes, process_cpu_seconds_total, serving_snapshot_present / _info {run_id, as_of} /
        _age_seconds, serving_as_of_timestamp_seconds, data_age_days and data_rows {table, region}, dataset_status
        {dataset, status}, dataset_lag_periods {dataset}, worker_up, worker_heartbeat_age_seconds, worker_active_dags,
        filler_up, filler_heartbeat_age_seconds, filler_governor_state {state}, filler_running_tasks,
        campaign_progress_ratio {campaign}, data_gaps {status, class}, job_runs_7d {job_id, status},
        job_last_success_timestamp_seconds / job_last_success_duration_seconds {job_id}, job_last_status {job_id,
        status}. State gauges are cached 15 s. 404 when the server runs with BIG360_METRICS=0. Added v1.31.
      responses:
        "200": {description: Prometheus text format, content: {text/plain: {schema: {type: string}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SystemStatus"}}}}
  /api/v1/system/jobs:
    get:
      tags: [system]
      operationId: listJobs
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/JobDefinition"}}}}}
  /api/v1/system/jobs/runs:
    get:
      tags: [system]
      operationId: listJobRuns
      parameters:
        - {name: job_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/JobStatus"}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/JobRunPage"}}}}
  /api/v1/system/jobs/{job_id}/trigger:
    post:
      tags: [system]
      operationId: triggerJob
      parameters:
        - {name: job_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content: {application/json: {schema: {$ref: "#/components/schemas/JobTriggerRequest"}}}
      responses:
        "202": {description: Accepted, content: {application/json: {schema: {$ref: "#/components/schemas/JobTriggerResponse"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Job already running, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
  /api/v1/system/dq:
    get:
      tags: [system]
      operationId: listDqResults
      parameters:
        - {name: table_name, in: query, schema: {type: string}}
        - {name: failed_only, in: query, schema: {type: boolean, default: true}}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/DqResult"}}}}}
  /api/v1/system/schedule:
    get:
      tags: [system]
      operationId: getSchedule
      summary: Active schedule profile, all profiles with their entries / next runs, catch-up state. Added v1.28.0.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Schedule"}}}}
    put:
      tags: [system]
      operationId: setSchedule
      summary: Switch the schedule profile (weekly | daily | intraday). Persisted; the running worker hot-reloads it. Added v1.28.0.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleUpdate"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Schedule"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/system/data-health:
    get:
      tags: [system]
      operationId: getDataHealth
      summary: >-
        Data Health page (O1.5): coverage-registry datasets with freshness vs SLA, heatmap, gap queue, backfill campaigns
        with progress / ETA, filler governor state, source status and rate-budget use, recent failures, SLA breaches and
        ops alerts. Added v1.28.0.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/DataHealth"}}}}
  /api/v1/system/qa:
    get:
      tags: [system]
      operationId: getQaReport
      summary: >-
        Regression guard (O2.3): latest run of the API contract sweep, the golden data checks and the UI smoke suite
        (job qa_regression after the refresh, or `python -m app.qa`). Read live from data/state/ops; detail=true adds
        the non-passing items of the latest report. Added v1.30.0.
      parameters:
        - {name: detail, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/QaReport"}}}}
  /api/v1/system/sync:
    get:
      tags: [system]
      operationId: getSyncStatus
      summary: >-
        Startup sync (docs/STARTUP_SYNC_PLAN.md A): what the running / last sync found missing from the latest data,
        the reason for every dataset that is not up to date (not_yet_published with the next expected time,
        source_unavailable with the retry time, needs_key with the key name, no_source, failed with attempts), the
        jobs it ran (fetchers in parallel, heavy steps in sequence) with durations, the section-incremental publishes,
        peak RAM, the header chip and the supervisor trigger (after start, every 30 min, on request). Read live from
        data/state/ops. Added v1.41.0.
      parameters:
        - {name: history, in: query, schema: {type: integer, minimum: 0, maximum: 100, default: 10}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SyncStatus"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
    post:
      tags: [system]
      operationId: requestSync
      summary: >-
        Sync now: writes a request the supervisor picks up within a few seconds (the tray item Sync now does the
        same). A running sync is never doubled: the request starts the next one when it ends. Optional dataset ids
        limit the scan. Added v1.41.0.
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/SyncRequest"}}}
      responses:
        "202": {description: Accepted, content: {application/json: {schema: {$ref: "#/components/schemas/SyncRequestAccepted"}}}}
        "422": {$ref: "#/components/responses/Invalid"}

  # ======================================================================= META
  /api/v1/meta/taxonomy:
    get:
      tags: [meta]
      operationId: getTaxonomy
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Taxonomy"}}}}
  /api/v1/meta/factors:
    get:
      tags: [meta]
      operationId: getFactorMeta
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/FactorMeta"}}}}
  /api/v1/meta/metrics:
    get:
      tags: [meta]
      operationId: listMetricMeta
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/MetricMeta"}}}}}
  /api/v1/meta/field-availability:
    get:
      tags: [meta]
      operationId: getFieldAvailability
      summary: Documented reason of every field gap per region (completeness audit; contracts/field_availability.yaml)
      description: >-
        Every BQL field with a gap (coverage below 95 % in a region of universe full) and the reason of that gap
        (AvailabilityReason). With `region`, only the fields with a gap there, each with that region reason. The UI
        uses it for the tooltip of an empty table cell when no per-entity reason is at hand. Added v1.42.0.
      parameters:
        - {name: region, in: query, schema: {type: string}, description: "US, CA, LATAM, UK, EU, JP, KR, CN, HK, APAC"}
        - {name: fields, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true, description: "BQL mnemonics (default: all)"}
        - {name: include_coverage, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/FieldAvailability"}}}}
  /api/v1/companies/{security_id}/availability:
    get:
      tags: [meta, companies]
      operationId: getCompanyAvailability
      summary: Why each requested field is missing for one security
      description: >-
        For each requested field (BQL mnemonic; default = the Company 360 key fields) that has no value for this
        security (all_fields=true: for every requested field), the reason: a plausibility flag (suppressed), stale
        prices (stale), no loaded statements / outside the analysis universe (out_of_scope, or the region
        no_source / needs_key / source_unavailable), else the documented region reason, else not_applicable.
        Added v1.42.0.
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
        - {name: fields, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: all_fields, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CompanyAvailability"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/search:
    get:
      tags: [meta]
      operationId: searchSecurities
      description: Prefix/fuzzy search over ticker, name, local name, ISIN. Ranked by match quality then market cap.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: limit, in: query, schema: {type: integer, default: 10, maximum: 50}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SecurityRef"}}}}}

  # ======================================================================= MARKET & MACRO
  /api/v1/market/overview:
    get:
      tags: [market]
      operationId: getMarketOverview
      parameters:
        - {$ref: "#/components/parameters/RegionQuery"}
        - {$ref: "#/components/parameters/RegionsQuery"}
        - {name: liquid, in: query, schema: {type: boolean, default: true}, description: "Movers liquidity screen (F21): known 20d ADV >= min_adv_usd, USD price >= min_price_usd and market cap >= min_mcap_usd (names without a known cap need ADV >= unknown_mcap_adv_multiple x min_adv_usd). false = legacy screen (ADV >= $1m, unknown ADV passes). Added v1.30."}
        - {name: min_adv_usd, in: query, schema: {type: number, default: 5000000, minimum: 0}, description: "Added v1.30"}
        - {name: min_mcap_usd, in: query, schema: {type: number, default: 1000000000, minimum: 0}, description: "Added v1.30"}
        - {name: min_price_usd, in: query, schema: {type: number, default: 2, minimum: 0}, description: "Added v1.30"}
        - {name: unknown_mcap_adv_multiple, in: query, schema: {type: number, default: 4, minimum: 1}, description: "Added v1.30"}
        - {name: movers_limit, in: query, schema: {type: integer, default: 25, minimum: 1, maximum: 100}, description: "Gainers / losers per side (was a fixed 10). Added v1.30."}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MarketOverview"}}}}
  /api/v1/macro/regime:
    get:
      tags: [macro]
      operationId: getMacroRegime
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [US, GLOBAL, EU, JP, CN, UK, KR, HK, CA, LATAM, APAC], default: US}, description: "v1.29: UK/KR/HK/CA/LATAM/APAC accepted; scopes without their own model answer status=not_modelled (never a fabricated label)"}
        - {name: years, in: query, schema: {type: integer, default: 20}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroRegime"}}}}
  /api/v1/macro/dashboard:
    get:
      tags: [macro]
      operationId: getMacroDashboard
      parameters:
        - {name: country, in: query, schema: {type: string, default: US}, description: "ISO2, EA, or WLD"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroDashboard"}}}}
  /api/v1/macro/series:
    get:
      tags: [macro]
      operationId: listMacroSeries
      parameters:
        - {name: category, in: query, schema: {$ref: "#/components/schemas/MacroCategory"}}
        - {name: country, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/MacroSeriesMeta"}}}}}
  /api/v1/macro/series/{series_id}:
    get:
      tags: [macro]
      operationId: getMacroSeries
      parameters:
        - {name: series_id, in: path, required: true, schema: {type: string}, description: "URL-encoded, e.g. fred%3ADGS10"}
        - {$ref: "#/components/parameters/From"}
        - {$ref: "#/components/parameters/To"}
        - {name: transform, in: query, schema: {type: string, enum: [level, diff, pct_change, yoy, log_diff], default: level}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroSeriesData"}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  # ======================================================================= MACRO V2 (wave 1, macro-w1; added v1.8.0)
  /api/v1/macro/v2/heatmap:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Heatmap
      summary: Country x indicator heatmap (point-in-time cells)
      description: >
        Canonical (country, indicator) cells from the latest macro_cells snapshot <= as_of (default: serving as_of).
        Each cell is one official series on its canonical measure (yoy / qoq / level) with 10-year z-score and
        percentile, 3/6/12-month changes and direction, release date, first-release value and revision for vintage
        series, staleness status. Snapshots are point-in-time (only data known at the snapshot date).
      parameters:
        - {name: countries, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "ISO2 / EA; comma-separated or repeated. Default: the 24 coverage countries"}
        - {name: indicators, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "Cell indicator keys (see MacroV2IndicatorMeta); default all"}
        - {name: as_of, in: query, schema: {type: string, format: date}, description: "Snapshot date (latest snapshot <= as_of; month-end snapshots go back 36 months)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2Heatmap"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/macro/v2/cycle:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Cycle
      summary: Cycle clock (growth momentum x inflation momentum) with a trail
      description: >
        Method (cycle_v1): growth momentum = mean of z-scored 6-month changes of the GDP y/y (q/q when no y/y),
        industrial production, retail sales and PMI-proxy cells; inflation momentum = same for CPI, core CPI and PPI.
        z = 6-month change / std of that change over the trailing 120 months (>= 36), clipped to +-3; composites are
        smoothed with a 3-month moving average. Quadrants: recovery (growth > 0, inflation <= 0), expansion (> 0, > 0),
        slowdown (<= 0, > 0), contraction (<= 0, <= 0). History uses latest revised data. When a cell's primary series
        is shorter than 42 months the longest current candidate series of that cell is used.
      parameters:
        - {name: countries, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: trail, in: query, schema: {type: integer, default: 12, minimum: 1, maximum: 120}, description: "Months of trail (incl. the latest)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2Cycle"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/macro/v2/countries:
    get:
      tags: [macro-v2]
      operationId: listMacroV2Countries
      summary: The 24 coverage countries with headline cells and cycle quadrant
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2Countries"}}}}
  /api/v1/macro/v2/countries/{cc}:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Country
      summary: Country page data (sections with sparkline-ready series, cycle, equity index vs macro composite)
      parameters:
        - {name: cc, in: path, required: true, schema: {type: string}, description: "ISO2 or EA (US, EA, DE, FR, IT, ES, PT, NL, GB, CH, JP, KR, CN, HK, TW, IN, AU, CA, BR, MX, CL, CO, PE, AR)"}
        - {name: years, in: query, schema: {type: integer, default: 10, minimum: 1, maximum: 40}, description: "History for equity_vs_macro; sparklines cover 5 years"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2CountryPage"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/macro/v2/themes/{theme}:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Theme
      summary: Thematic dashboard (inflation, labor, rates, credit_conditions, liquidity, commodities_fx, growth)
      description: >
        Panels of kind series (explicit official series with a display transform; daily series thinned to weekly
        beyond 3 years), compare (one cell indicator across countries), curve (month-end sovereign curve snapshots
        for animation) and derived (US net liquidity = WALCL - WTREGEN - 1000 x RRPONTSYD, USD millions).
      parameters:
        - {name: theme, in: path, required: true, schema: {type: string, enum: [inflation, labor, rates, credit_conditions, liquidity, commodities_fx, growth]}}
        - {name: years, in: query, schema: {type: integer, default: 10, minimum: 1, maximum: 40}}
        - {name: countries, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "Overrides the countries of compare panels"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2Theme"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/macro/v2/series/{series_id}:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Series
      summary: Series explorer - history, transforms, canonical measure, vintages, provenance
      description: >
        transform: level | yoy (% vs 12 months earlier) | mom (% vs the previous period) | z (vs the trailing 10-year
        window, >= 24 points) | canonical (the series' macro v2 canonical measure from macro_cell_history). vintages
        (when the series has them): first release vs latest per period plus revision-size statistics (5y, 10y, all),
        native units and canonical measure.
      parameters:
        - {name: series_id, in: path, required: true, schema: {type: string}, description: "URL-encoded, e.g. fred%3ACPIAUCSL"}
        - {name: transform, in: query, schema: {type: string, enum: [level, yoy, mom, z, canonical], default: level}}
        - {$ref: "#/components/parameters/From"}
        - {$ref: "#/components/parameters/To"}
        - {name: vintages, in: query, schema: {type: boolean, default: true}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2SeriesData"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/macro/v2/compare:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Compare
      summary: One indicator across many countries (canonical primary series + latest cell)
      parameters:
        - {name: indicator, in: query, required: true, schema: {type: string}, description: "Cell indicator key"}
        - {name: countries, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: years, in: query, schema: {type: integer, default: 10, minimum: 1, maximum: 40}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2Compare"}}}}
        "422": {$ref: "#/components/responses/Invalid"}

  # ---- macro v2 wave 2 (macro-w2): official release calendar, MODEL-BASED expectations (not consensus), surprises,
  #      nowcasts, recession panel. Added v1.9.0.
  /api/v1/macro/v2/calendar:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Calendar
      summary: Official release calendar with model-based expectations (not consensus)
      description: >
        Scheduled releases and central-bank policy decisions from official publishers only (FRED release dates for
        US BLS/BEA/Census/Fed releases, BLS, BEA, FOMC, Eurostat, ECB, ONS, BoE, BoJ, StatCan, BoC, ABS, RBA, IBGE,
        BCB, INSEE, Destatis, ISTAT, INE). Each linked series carries the published actual / prior / revision and our
        MODEL-BASED expectation (label "Model-based expectation (not consensus)", model_based = true) with its 80%
        interval, plus the surprise z once released. Inferred past release dates (reconstructed from data vintages
        where no official calendar covers a release) are excluded unless include_inferred=true.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}, description: "Start date (local release date); default as_of - 7 days"}
        - {name: to, in: query, schema: {type: string, format: date}, description: "End date; default as_of + 30 days; max range 400 days"}
        - {name: countries, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "ISO2 / EA; comma-separated or repeated"}
        - {name: importance, in: query, schema: {type: integer, minimum: 1, maximum: 3, default: 3}, description: "Maximum tier (1 = high only)"}
        - {name: kind, in: query, schema: {type: string, enum: [data, policy_meeting]}}
        - {name: include_inferred, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2Calendar"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/macro/v2/releases/{release_event_id}:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Release
      summary: One release - actual vs model-based expectation (not consensus), interval, surprise z and surprise history
      parameters:
        - {name: release_event_id, in: path, required: true, schema: {type: string}}
        - {name: history, in: query, schema: {type: integer, default: 24, minimum: 1, maximum: 120}, description: "Past releases per series in the surprise history"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2ReleaseDetail"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/macro/v2/surprise:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Surprise
      summary: Economic surprise indices vs model-based expectations (not consensus)
      description: >
        Citi-style index per country (and GLOBAL) and theme: 100 x weighted mean of signed surprise z over the last
        365 days with exponential decay (half-life 45 days) and tier weights. Surprises are measured against OUR model
        forecasts, not against a consensus survey.
      parameters:
        - {name: countries, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "ISO2 / EA / GLOBAL; default all"}
        - {name: theme, in: query, schema: {type: string, enum: [all, growth, inflation, labor], default: all}}
        - {name: from, in: query, schema: {type: string, format: date}, description: "History start; default as_of - 3 years"}
        - {name: freq, in: query, schema: {type: string, enum: [D, W], default: W}, description: "History sampling (W = Fridays + latest)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2Surprise"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/macro/v2/nowcast/{cc}:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Nowcast
      summary: GDP nowcast (ours, DynamicFactorMQ) vs official benchmarks (Atlanta Fed GDPNow, NY Fed Staff Nowcast)
      parameters:
        - {name: cc, in: path, required: true, schema: {type: string}, description: "US, EA, GB, JP"}
        - {name: quarters, in: query, schema: {type: integer, default: 4, minimum: 1, maximum: 16}, description: "Most recent target quarters"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2Nowcast"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/macro/v2/recession:
    get:
      tags: [macro-v2]
      operationId: getMacroV2Recession
      summary: Recession-risk panel (official and model-based methods side by side, each labelled)
      parameters:
        - {name: countries, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: history_months, in: query, schema: {type: integer, default: 120, minimum: 0, maximum: 600}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MacroV2Recession"}}}}
        "422": {$ref: "#/components/responses/Invalid"}

  # ======================================================================= MACRO V3 (wave 3, macro-w3; added v1.13.0)
