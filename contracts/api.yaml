        - {name: level, in: query, schema: {$ref: "#/components/schemas/PeerGroupLevel"}, description: "Default: level used by scoring"}
        - {name: peer_set_id, in: query, schema: {type: string}, description: "v1.7: use a Model Studio peer set (the security's cluster, or the whole set when the security is not a member); response level = peer_set"}
        - {name: limit, in: query, schema: {type: integer, default: 15, maximum: 50}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PeerComparison"}}}}
  /api/v1/companies/{security_id}/forecast:
    get:
      tags: [company]
      operationId: getCompanyForecast
      parameters: [{$ref: "#/components/parameters/SecurityId"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Forecast"}}}}
