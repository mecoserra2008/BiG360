              weight: {type: [number, "null"]}
        beta: {type: [number, "null"]}
        mean: {type: [number, "null"]}
        sd: {type: [number, "null"], description: "sqrt(a' Sigma a)"}
        bands:
          type: array
          items:
            type: object
            required: [level, lo, hi]
            properties:
              level: {type: integer}
              lo: {type: [number, "null"]}
              hi: {type: [number, "null"]}
              lo_pct: {type: [number, "null"]}
              hi_pct: {type: [number, "null"]}
              q: {type: [number, "null"]}
        realised:
          type: [object, "null"]
          properties:
            date: {type: [string, "null"]}
            value: {type: [number, "null"]}
            band_as_of: {type: [string, "null"]}
            inside_90: {type: [boolean, "null"]}
            inside_95: {type: [boolean, "null"]}
            z: {type: [number, "null"], description: "Today's standardised move of the combination vs the previous session's law"}
        marginal:
          type: [object, "null"]
          description: "Marginal band for this combination only: split-conformal quantile of its own standardised next-session moves over the served history (~125 sessions; n_cal). Narrower than the joint projection; calibrated on a short window, not separately walk-forward validated."
          required: [n_cal, bands]
          properties:
            n_cal: {type: integer}
            window_start: {type: [string, "null"]}
            bands:
              type: array
              items:
                type: object
                required: [level, lo, hi]
                properties:
                  level: {type: integer}
                  lo: {type: [number, "null"]}
                  hi: {type: [number, "null"]}
                  lo_pct: {type: [number, "null"]}
                  hi_pct: {type: [number, "null"]}
                  q_abs_z: {type: [number, "null"]}
        units: {type: string}
        labels: {type: object, additionalProperties: {type: string}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    ConformalCoverageRow:
      type: object
      required: [application, filter, segment_type, segment, horizon, level, n, status]
      properties:
        application: {type: string}
        filter: {type: string}
        segment_type: {type: string}
        segment: {type: string}
        horizon: {type: string}
        level: {type: integer}
        target: {type: [number, "null"]}
        coverage: {type: [number, "null"]}
        gap_pp: {type: [number, "null"]}
        n: {type: integer}
        status: {type: string, enum: [ok, under, over, thin]}
        as_of: {type: [string, "null"]}
        window_start: {type: [string, "null"]}
        window_end: {type: [string, "null"]}
    ConformalCoverage:
      type: object
      required: [as_of, rows, flags, gates, validation_doc, data_status]
      properties:
        as_of: {type: [string, "null"]}
        rows: {type: array, items: {$ref: "#/components/schemas/ConformalCoverageRow"}, description: "Overall / region / group-kind rows of the latest audit per application (incl. *_wf walk-forward)"}
        flags: {type: array, items: {$ref: "#/components/schemas/ConformalCoverageRow"}, description: "Rolling-audit segments under target (overall < -1.5 pp, any segment < -5 pp, n >= 2000)"}
        gates:
          type: array
          items:
            type: object
            required: [application, title, verdict, shown_as, detail]
            properties:
              application: {type: string}
              title: {type: string}
              verdict: {type: string, enum: [pass, pass_coverage, fail, fail_sharpness, mixed]}
              shown_as: {type: string}
              detail: {type: string}
        production: {type: [object, "null"], additionalProperties: true}
        validation_doc: {type: string}
        validation_md: {type: [string, "null"]}
        labels: {type: object, additionalProperties: {type: string}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    # ------------------------------------------------------------ BQL-lite (v1.37.0)
    BqlRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 8000, description: "BQL text, e.g. get(px_last, pe_fwd) for(members('S&P 500') & sector('Tech')) where(roic > 15%) sort(pe_fwd asc) limit(20)"}
        max_rows: {type: integer, minimum: 1, maximum: 100000, default: 5000}
        use_cache: {type: boolean, default: true}
    BqlExportRequest:
      allOf:
        - {$ref: "#/components/schemas/BqlRequest"}
        - type: object
          properties:
            format: {type: string, enum: [csv, xlsx, json], default: csv}
    BqlColumn:
      type: object
      required: [name, dtype, role]
      properties:
        name: {type: string, description: "alias, or the canonical text of the expression (chg_pct(px,1M))"}
        unit: {type: [string, "null"], description: "pct = fraction, pctile = 0..100, price / currency = trading or with(currency) currency, currency_usd, x, score, z, days, count, ratio, rank, decile, shares, date, text, bool"}
        dtype: {type: string, enum: [number, text, bool, date, list]}
        role: {type: string, enum: [key, value, group, date]}
        field: {type: [string, "null"], description: "dictionary mnemonic when the column is a plain field"}
        description: {type: [string, "null"]}
        currency: {type: [string, "null"], description: "monetary columns: the with(currency) code, USD for currency_usd, or local"}
        model_based: {type: boolean}
    BqlDates:
      type: object
      required: [start, end, n]
      properties:
        start: {type: string, format: date}
        end: {type: string, format: date}
        freq: {type: [string, "null"], enum: [D, W, M, Q, null]}
        n: {type: integer}
    BqlResult:
      type: object
      required: [query, mode, grouped, as_of, snapshot_as_of, serving_run_id, universe_size, columns, rows, n_rows, truncated, units, warnings, cached]
      properties:
        query: {type: string, description: "canonical (normalised) query text"}
        mode: {type: string, enum: [cross_section, timeseries]}
        grouped: {type: boolean}
        as_of: {type: string, format: date, description: "knowledge cut-off of the query (with(as_of), default the snapshot as-of date)"}
        snapshot_as_of: {type: string, format: date}
        serving_run_id: {type: string}
        dates: {oneOf: [{$ref: "#/components/schemas/BqlDates"}, {type: "null"}]}
        currency: {type: [string, "null"]}
        fill: {type: string, enum: [prev, none]}
        universe_size: {type: integer}
        columns: {type: array, items: {$ref: "#/components/schemas/BqlColumn"}}
        rows: {type: array, items: {type: array, items: {}}, description: "one array per row in `columns` order"}
        n_rows: {type: integer}
        truncated: {type: boolean}
        units: {type: object, additionalProperties: {type: [string, "null"]}}
        warnings: {type: array, items: {type: string}, description: "approximations (members('S&P 500') = mvp_us), model-based fields, truncation, FX fall-backs"}
        fields: {type: array, items: {type: object, additionalProperties: true}, description: "dictionary entries used (mnemonic, table, unit, group, has_history, model_based, pit)"}
        cached: {type: boolean}
        elapsed_ms: {type: number}
    BqlParamShape:
      type: object
      required: [name, type]
      properties:
        name: {type: string}
        type: {type: string}
    BqlExplain:
      type: object
      required: [query, ast, mode, grouped, as_of, sql, params, columns, universe_sql, universe_size, estimates, warnings]
      properties:
        query: {type: string}
        ast: {type: object, additionalProperties: true}
        mode: {type: string, enum: [cross_section, timeseries]}
        grouped: {type: boolean}
        as_of: {type: string, format: date}
        snapshot_as_of: {type: string, format: date}
        dates: {oneOf: [{$ref: "#/components/schemas/BqlDates"}, {type: "null"}]}
        universe_sql: {type: string}
        universe_params: {type: array, items: {$ref: "#/components/schemas/BqlParamShape"}}
        universe_size: {type: integer}
        sql: {type: string, description: "compiled DuckDB SQL with $pN placeholders"}
        params: {type: array, items: {$ref: "#/components/schemas/BqlParamShape"}}
        columns: {type: array, items: {$ref: "#/components/schemas/BqlColumn"}}
        fields: {type: array, items: {type: object, additionalProperties: true}}
        estimates:
          type: object
          required: [cells, daily_rows, needs_daily_panel]
          properties:
            cells: {type: integer}
            daily_rows: {type: integer}
            needs_daily_panel: {type: boolean}
            daily_from: {type: [string, "null"], format: date}
        warnings: {type: array, items: {type: string}}
    BqlFieldHistory:
      type: object
      required: [kind, frequency]
      properties:
        kind: {type: string, enum: [px, event, period, expr], description: "px = daily bars; event = dated stream; period = knowledge-dated periods (ratios / fundamentals); expr = BQL expression over other fields"}
        table: {type: [string, "null"], description: "serving table or lake:<contract>"}
        frequency: {type: string}
        expr: {type: string}
    BqlField:
      type: object
      required: [mnemonic, description, unit, dtype, group, key, frequency, pit, aliases, static, model_based, curated, has_history]
      properties:
        mnemonic: {type: string}
        description: {type: string}
        unit: {type: string}
        dtype: {type: string, enum: [number, text, bool, date]}
        group: {type: string}
        table: {type: [string, "null"], description: "serving table of the snapshot value (null = history only)"}
        column: {type: [string, "null"]}
        key: {type: string, enum: [security_id, issuer_id]}
        frequency: {type: string}
        pit: {type: string, description: "point-in-time rule"}
        source: {type: string, description: "lake contract table(s)"}
        aliases: {type: array, items: {type: string}}
        static: {type: boolean, description: "identity attribute (current classification)"}
        model_based: {type: boolean}
        curated: {type: boolean}
        has_history: {type: boolean}
        history: {oneOf: [{$ref: "#/components/schemas/BqlFieldHistory"}, {type: "null"}]}
    BqlFieldPage:
      type: object
      required: [total, limit, offset, groups, counts, functions, items]
      properties:
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        groups: {type: array, items: {type: string}}
        counts:
          type: object
          required: [fields, aliases, with_history]
          properties:
            fields: {type: integer}
            aliases: {type: integer}
            with_history: {type: integer}
        functions:
          type: array
          items:
            type: object
            required: [signature, description]
            properties:
              signature: {type: string}
              description: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/BqlField"}}
    BqlResolve:
      type: object
      required: [query, base]
      properties:
        query: {type: string}
        base: {type: string}
        market: {type: [string, "null"], description: "Bloomberg market code (US, GY, LN, JT, ...)"}
        yellow_key: {type: [string, "null"], description: "Equity | Index | Curncy | Comdty | ..."}
        match: {type: [string, "null"], enum: [id, isin, instrument, ticker, ticker+market, null]}
        asset_class: {type: [string, "null"], enum: [Equity, Index, Curncy, Comdty, null]}
        security: {oneOf: [{$ref: "#/components/schemas/SecurityRef"}, {type: "null"}]}
        market_cap_usd: {type: [number, "null"]}
    BqlSaved:
      type: object
      required: [query_id, name, query, kind, tags, created_at, updated_at]
      properties:
        query_id: {type: string}
        name: {type: string}
        description: {type: [string, "null"]}
        query: {type: string}
        kind: {type: string, enum: [query, screen]}
        tags: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_run_at: {type: [string, "null"], format: date-time}
    BqlSavedCreate:
      type: object
      required: [name, query]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        query: {type: string, minLength: 1, maxLength: 8000}
        kind: {type: string, enum: [query, screen], default: query}
        description: {type: [string, "null"], maxLength: 2000}
        tags: {type: array, items: {type: string}, maxItems: 20}
    BqlSavedUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        query: {type: string, minLength: 1, maxLength: 8000}
        kind: {type: string, enum: [query, screen]}
        description: {type: [string, "null"], maxLength: 2000}
        tags: {type: array, items: {type: string}, maxItems: 20}
