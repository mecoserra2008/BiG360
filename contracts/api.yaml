        source_ts: {type: [string, "null"], format: date-time, description: "Source acceptance / publication time UTC"}
        knowledge_date: {type: [string, "null"], format: date}
        first_seen_at: {type: [string, "null"], format: date-time, description: "First seen by the real-time path (PIT knowledge time)"}
    LiveNewsItem:
      type: object
      required: [live_id, origin, item_id, title, issuer_ids, tickers, countries, themes]
      properties:
        live_id: {type: [integer, "null"]}
        origin: {$ref: "#/components/schemas/LiveOrigin"}
        item_id: {type: string, description: "= news_items.item_id"}
        source_id: {type: [string, "null"]}
        category: {type: [string, "null"], description: "central_bank | statistics | news"}
        publisher: {type: [string, "null"]}
        title: {type: [string, "null"]}
        url: {type: [string, "null"]}
        language: {type: [string, "null"]}
        published_at: {type: [string, "null"], format: date-time}
        first_seen_at: {type: [string, "null"], format: date-time}
        issuer_ids: {type: array, items: {type: [string, "null"]}}
        tickers: {type: array, items: {type: string}}
        countries: {type: array, items: {type: string}}
        themes: {type: array, items: {type: string}, description: "events_v2 market theme ids from the headline"}
        story_id: {type: [string, "null"], description: "Live story cluster (48 h window)"}
        story_size: {type: [integer, "null"]}
        sentiment_label: {type: [string, "null"]}
        sentiment_score: {type: [number, "null"], description: "FinBERT P(pos) - P(neg)"}
    LiveEventItem:
      type: object
      required: [live_id, origin, key, kind, themes, countries, issuer_ids]
      properties:
        live_id: {type: [integer, "null"]}
        origin: {$ref: "#/components/schemas/LiveOrigin"}
        key: {type: string, description: "gdelt:a:<url_hash> | gdelt:e:<GLOBALEVENTID> | gdelt:slot:<stamp>"}
        kind: {type: [string, "null"], enum: [article, event, slot, null]}
        title: {type: [string, "null"]}
        url: {type: [string, "null"]}
        domain: {type: [string, "null"]}
        language: {type: [string, "null"]}
        tone: {type: [number, "null"]}
        themes: {type: array, items: {type: string}}
