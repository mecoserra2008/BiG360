        - {name: report, in: query, schema: {type: string, enum: [legacy, disagg, tff, cit], default: legacy}}
        - {name: combined, in: query, schema: {type: boolean, default: false}}
        - {name: metric, in: query, schema: {type: string, enum: [cot_index_3y, cot_index_1y, z_3y, z_1y, net_pct_oi, pct_rank_3y], default: cot_index_3y}}
        - {name: asset_class, in: query, schema: {$ref: "#/components/schemas/PositioningAssetClass"}}
        - {name: major, in: query, schema: {type: [boolean, "null"], default: true}}
        - {name: active, in: query, schema: {type: [boolean, "null"], default: true}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PositioningHeatmap"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/positioning/crowded:
    get:
      tags: [positioning]
      operationId: getPositioningCrowded
      summary: Crowded longs / shorts and price divergences (model-based flags on the headline speculator category)
      parameters:
        - {name: combined, in: query, schema: {type: boolean, default: false}}
        - {name: asset_class, in: query, schema: {$ref: "#/components/schemas/PositioningAssetClass"}}
        - {name: major, in: query, schema: {type: [boolean, "null"]}}
        - {name: limit, in: query, schema: {type: integer, default: 15, minimum: 1, maximum: 100}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PositioningCrowded"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/positioning/markets/{market_code}:
    get:
      tags: [positioning]
      operationId: getPositioningMarket
      summary: One CFTC market - weekly series per trader category, OI, traders, concentration, price overlay, extremes, event study
      parameters:
        - {name: market_code, in: path, required: true, schema: {type: string}, description: "CFTC contract market code (e.g. 067651, 13874A)"}
        - {name: report, in: query, schema: {type: string, enum: [legacy, disagg, tff, cit]}, description: "Default: the market's primary report"}
        - {name: combined, in: query, schema: {type: boolean, default: false}}
        - {$ref: "#/components/parameters/From"}
        - {$ref: "#/components/parameters/To"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PositioningMarketDetail"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/cross-asset/cockpit:
    get:
      tags: [cross-asset]
      operationId: getCrossAssetCockpit
      summary: Cross-asset cockpit - latest signals per asset (trend, momentum, carry, value, curve, vol, IV/RV, CFTC positioning) with z-scores
      parameters:
        - {name: asset_class, in: query, schema: {$ref: "#/components/schemas/CrossAssetClass"}}
        - {name: security_id, in: query, schema: {type: string, maxLength: 60}, description: "Assets linked to this instrument (e.g. IDX:CL=F, IDX:EURUSD=X, IDX:ES=F)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CrossAssetCockpit"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/cross-asset/assets/{asset_id}:
    get:
      tags: [cross-asset]
      operationId: getCrossAssetAsset
      summary: One cross-asset asset - daily signal history (default last 5 years), latest values, carry / value method, CFTC positioning
      parameters:
        - {name: asset_id, in: path, required: true, schema: {type: string}, description: "Cross-asset id (CL, GC, SPX, EURUSD, UST10Y, US_HY, BTC ...)"}
        - {$ref: "#/components/parameters/From"}
        - {$ref: "#/components/parameters/To"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CrossAssetAssetDetail"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/cross-asset/curves:
    get:
      tags: [cross-asset]
      operationId: listCrossAssetCurves
      summary: Futures roots with a term structure (Yahoo), latest shape / roll yield and coverage counts
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CrossAssetCurveList"}}}}
  /api/v1/cross-asset/curves/{root}:
    get:
      tags: [cross-asset]
      operationId: getCrossAssetCurve
      summary: Futures term structure of one root - latest vs ~1m and ~1y ago, contango / backwardation history, contract coverage
      parameters:
        - {name: root, in: path, required: true, schema: {type: string}, description: "Futures root (CL, GC, ES, ZN, 6E, BTC ...)"}
        - {name: from, in: query, schema: {type: string, format: date}, description: "Start of the curve history (default: all stored)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CrossAssetCurve"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/cross-asset/correlation:
    get:
      tags: [cross-asset]
      operationId: getCrossAssetCorrelation
      summary: Correlation regime - eigen-concentration history (60 / 120 days) and the basket correlation matrix now / ~1m / ~1y ago
      parameters:
        - {name: window, in: query, schema: {type: integer, enum: [60, 120], default: 120}}
        - {name: from, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CrossAssetCorrelation"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/cross-asset/risk:
    get:
      tags: [cross-asset]
      operationId: getCrossAssetRisk
      summary: MODEL-BASED risk-on / risk-off composite - latest gauge with components and history
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CrossAssetRisk"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/earnings/calendar:
    get:
      tags: [earnings]
      operationId: getEarningsCalendar
      summary: Earnings (upcoming with date-source label + released with model surprise / reaction) and corporate events in a date range
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}, description: "Default as_of - 3 days"}
        - {name: to, in: query, schema: {type: string, format: date}, description: "Default from + 35 days; range <= 400 days"}
        - {name: universe, in: query, schema: {type: string}, description: "Universe id (mvp_us, mvp_global, eu_broad, full)"}
        - {name: watchlist_id, in: query, schema: {type: string}, description: "Watchlist id, or 'all' for every watchlist member"}
        - {name: security_ids, in: query, schema: {type: string, maxLength: 4000}, description: "Comma-separated security ids (union with the watchlist)"}
        - {$ref: "#/components/parameters/RegionQuery"}
        - {$ref: "#/components/parameters/RegionsQuery"}
        - {name: sector, in: query, schema: {type: string}}
        - {name: types, in: query, schema: {type: string}, description: "Comma list of earnings, dividend, split, corporate (default all)"}
        - {name: date_source, in: query, schema: {type: string}, description: "Comma list of date sources to keep (official_release, official_filing, provider, company_announced, provider_estimate, model_projection)"}
        - {name: limit, in: query, schema: {type: integer, default: 3000, minimum: 1, maximum: 20000}}
        - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}, description: "Paging over the sorted items (days[] always covers the whole range). Added v1.30."}
        - {name: compact, in: query, schema: {type: boolean, default: false}, description: "Drop null fields from items and their SecurityRef (required fields kept) - F30 payload size. Added v1.30."}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EarningsCalendar"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/earnings/season:
    get:
      tags: [earnings]
      operationId: getEarningsSeason
      summary: Earnings-season dashboard (share reported, model surprises - not consensus - and reaction breadth by region / sector)
      parameters:
        - {name: season, in: query, schema: {type: string, pattern: "^\\d{4}Q[1-4]$"}, description: "Calendar quarter of the period end (default: latest season with >= 25% reported)"}
        - {$ref: "#/components/parameters/RegionQuery"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EarningsSeason"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/companies/{security_id}/earnings:
    get:
      tags: [earnings, company]
      operationId: getCompanyEarnings
      summary: Company earnings & events - next date (source label), release history with reactions and model expectation vs actual, corporate events, PEAD
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
        - {name: history, in: query, schema: {type: integer, default: 40, minimum: 1, maximum: 120}, description: "Number of past periods"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EarningsCompany"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/companies/{security_id}/financials:
    get:
      tags: [company]
      operationId: getCompanyFinancials
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
        - {name: statement, in: query, schema: {type: string, enum: [IS, BS, CF, ALL], default: ALL}}
        - {name: period, in: query, schema: {type: string, enum: [FY, Q, H, TTM], default: FY}}
        - {name: currency, in: query, schema: {type: string, enum: [LOCAL, USD], default: LOCAL}}
        - {name: limit, in: query, schema: {type: integer, default: 10, maximum: 40}}
        - {name: as_of, in: query, schema: {type: string, format: date}, description: "Point-in-time view (statements as known on that date)"}
        - {name: common_size, in: query, schema: {type: boolean, default: false}, description: "Divide currency lines by revenue (IS/CF) or total assets (BS); unit becomes pure. Added v1.1."}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Financials"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/companies/{security_id}/ratios:
    get:
      tags: [company]
      operationId: getCompanyRatios
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
        - {name: period, in: query, schema: {type: string, enum: [FY, TTM], default: FY}}
        - {name: limit, in: query, schema: {type: integer, default: 10, maximum: 40}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MetricTable"}}}}
  /api/v1/companies/{security_id}/scores:
