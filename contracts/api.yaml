        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      tags: [theses]
      operationId: deleteThesisJournalEntry
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}, {name: entry_id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/theses/{thesis_id}/reviews:
    get:
      tags: [theses]
      operationId: listThesisReviews
      description: "Review schedule + completed reviews and the accountability snapshots (creation / activation / review / close / manual)."
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisReviewList"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [theses]
      operationId: completeThesisReview
      description: "Complete the pending review (or record an unscheduled one): captures a review snapshot, applies conviction_after, schedules the next review (review_every_days) and writes a journal entry. 422 on a closed thesis."
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisReviewCreate"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisReview"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/theses/{thesis_id}/snapshots:
    post:
      tags: [theses]
      operationId: captureThesisSnapshot
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisSnapshotCreate"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisSnapshot"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/theses/{thesis_id}/status:
    get:
      tags: [theses]
      operationId: getThesisStatus
      description: "Live automatic status (MODEL-BASED rules) with reasons and KPI values on the current snapshot; no writes."
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisStatus"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/theses/{thesis_id}/evaluate:
    post:
      tags: [theses]
      operationId: evaluateThesis
