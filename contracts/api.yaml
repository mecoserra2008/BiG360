        n_articles: {type: [integer, "null"]}
        url: {type: [string, "null"]}
        salience: {type: [number, "null"]}
        published_at: {type: [string, "null"]}
    NewsImpact:
      type: object
      description: "MODEL-BASED impact estimate: the event-study library cell (historical mean CAR of similar labelled attention shocks, window 0..5) that best matches the story's theme / country / sector. Not a forecast."
      required: [model_based, label]
      properties:
        model_based: {type: boolean, const: true}
        label: {type: string}
        theme: {type: [string, "null"]}
