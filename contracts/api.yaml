        data_status: {$ref: "#/components/schemas/DataStatus"}
    # ------------------------------------------------------------ macro v3 (macro-w3; v1.13.0)
    MacroV3Labels:
      type: object
      description: "Method labels: implied paths are approximations from official curves; Taylor rules, expected inflation (ex-US) and tone are model-based"
      additionalProperties: {type: string}
    MacroV3Bank:
      type: object
      required: [bank, name, country, currency, rate_name, inflation_target, inflation_target_text, policy_sources]
      properties:
        bank: {type: string, description: "fed | ecb | boe | boj | snb | boc | rba | riksbank | norges | bcb | banxico | bcch | banrep | bcrp | rbi | bok | pboc"}
        name: {type: string}
        country: {type: string, description: "ISO2 / EA"}
        currency: {type: string}
        rate_name: {type: string}
        inflation_target: {type: [number, "null"], description: "Official target (midpoint), percent; null = no formal target (PBoC)"}
        inflation_target_text: {type: string}
        inflation_target_measure: {type: string}
        inflation_target_url: {type: string}
        meeting_calendar: {type: [string, "null"], description: "Official calendar source id (app.macro.calendar_sources); null = no machine-readable calendar"}
        url: {type: string}
        notes: {type: string}
        decisions_since: {type: string, format: date, description: "Start of the policy-target regime used for decisions / rate cycle"}
        policy_sources: {type: array, items: {type: string}, description: "Official series in priority order + BIS cross-check"}
    MacroV3Corridor:
      type: object
      properties:
        lower: {type: [number, "null"]}
        upper: {type: [number, "null"]}
        deposit: {type: [number, "null"], description: "Deposit facility / IORB"}
        lending: {type: [number, "null"], description: "Lending facility (Fed: ON RRP award rate; PBoC: 5Y LPR)"}
        mro: {type: [number, "null"], description: "ECB main refinancing rate"}
        overnight: {type: [number, "null"], description: "Official overnight market rate (EFFR, EUR STR, SONIA, TONA, CORRA, ...)"}
        bis_rate: {type: [number, "null"], description: "BIS WS_CBPOL cross-check"}
    MacroV3PricedBrief:
      type: object
      required: [label, target_date, implied_rate, change_bp, moves_priced]
      properties:
        label: {type: string, description: "Meeting date (ISO) or horizon (3m, 6m, 12m, 24m)"}
        target_date: {type: string, format: date}
        implied_rate: {type: number, description: "Percent; approximation from official curves"}
        change_bp: {type: number, description: "vs the policy rate in force on the curve date"}
        moves_priced: {type: number, description: "change_bp / step (25bp; PBoC 10bp); negative = cuts"}
        change_1w_bp: {type: [number, "null"]}
        change_1m_bp: {type: [number, "null"]}
    MacroV3PricedSummary:
      type: object
      required: [next_meeting, h12m, direction_12m, as_of]
      properties:
        next_meeting: {anyOf: [{$ref: "#/components/schemas/MacroV3PricedBrief"}, {type: "null"}]}
        h12m: {anyOf: [{$ref: "#/components/schemas/MacroV3PricedBrief"}, {type: "null"}]}
        direction_12m: {type: [string, "null"], enum: [hikes, cuts, on hold, null], description: "12m-ahead implied change >= +half a step = hikes, <= -half a step = cuts"}
        as_of: {type: [string, "null"], format: date, description: "Curve date"}
        status: {type: string, description: "ok | stale | no data | failed | not_available | pending"}
        source: {type: [string, "null"]}
        label: {type: string}
    MacroV3PathPoint:
      type: object
      required: [point_type, label, target_date, implied_rate, change_bp, moves_priced]
      properties:
        point_type: {type: string, enum: [meeting, horizon]}
        label: {type: string}
        target_date: {type: string, format: date}
        implied_rate: {type: number}
        implied_rate_tp_adj: {type: [number, "null"], description: "US: term-premium-adjusted with NY Fed ACM (model-based)"}
        change_bp: {type: number}
        moves_priced: {type: number}
        incremental_bp: {type: [number, "null"], description: "Meeting points: change vs the previous meeting"}
        change_1w_bp: {type: [number, "null"]}
        change_1m_bp: {type: [number, "null"]}
    MacroV3Stance:
      type: object
      required: [date, policy_rate, labels]
      properties:
        date: {type: string, format: date, description: "Month"}
        policy_rate: {type: [number, "null"]}
        cpi_yoy: {type: [number, "null"]}
        core_yoy: {type: [number, "null"]}
        infl_taylor: {type: [number, "null"]}
        infl_taylor_measure: {type: [string, "null"]}
        expected_infl: {type: [number, "null"], description: "Model-based 1y-ahead expected inflation"}
        expected_infl_source: {type: [string, "null"]}
        real_rate_cpi: {type: [number, "null"]}
        real_rate_core: {type: [number, "null"]}
        real_rate_expected: {type: [number, "null"]}
        output_gap: {type: [number, "null"]}
        output_gap_source: {type: [string, "null"]}
        r_star: {type: [number, "null"], description: "Official NY Fed LW (US) / HLW (CA, EA)"}
        r_star_source: {type: [string, "null"]}
        inflation_target: {type: [number, "null"]}
        taylor_1993: {type: [number, "null"], description: "Model-based"}
        taylor_rstar: {type: [number, "null"], description: "Model-based"}
        taylor_balanced: {type: [number, "null"], description: "Model-based"}
        policy_minus_taylor_bp: {type: [number, "null"], description: "policy rate - Taylor (official r* variant, else 1993)"}
        labels: {$ref: "#/components/schemas/MacroV3Labels"}
    MacroV3Tone:
      type: object
      required: [date, doc_type, url, label]
      properties:
        date: {type: string, format: date}
        doc_type: {type: string, enum: [statement, summary_minutes]}
        url: {type: string}
        tone_model: {type: [number, "null"], description: "Model-based: mean(P(hawkish) - P(dovish)) in [-1, 1]"}
        tone_lexicon: {type: [number, "null"], description: "Model-based lexicon score in [-1, 1]"}
        hawkish_share: {type: [number, "null"]}
        dovish_share: {type: [number, "null"]}
        n_sentences: {type: [integer, "null"]}
        vote_text: {type: [string, "null"]}
        dissents: {type: [integer, "null"]}
        model_id: {type: [string, "null"]}
        label: {type: string}
        action: {type: [string, "null"], description: "Decision at that meeting (history only)"}
        change_bp: {type: [number, "null"]}
    MacroV3CentralBankSummary:
      allOf:
        - {$ref: "#/components/schemas/MacroV3Bank"}
        - type: object
          required: [policy_rate, rate_as_of, corridor, last_move, next_meeting, phase, priced, stance, tone]
          properties:
            policy_rate: {type: [number, "null"]}
            rate_as_of: {type: [string, "null"], format: date, description: "Date of the last official observation"}
            rate_source: {type: [string, "null"]}
            corridor: {$ref: "#/components/schemas/MacroV3Corridor"}
            last_move:
              anyOf:
                - type: object
                  required: [decision_date, change_bp, action]
                  properties:
                    decision_date: {type: string, format: date}
                    change_bp: {type: number}
                    action: {type: string, enum: [hike, cut]}
                    rate_after: {type: [number, "null"]}
                - {type: "null"}
            next_meeting:
              anyOf:
                - type: object
                  required: [date]
                  properties:
                    date: {type: string, format: date}
                    scheduled_at: {type: [string, "null"], format: date-time}
                    time_known: {type: boolean}
                    source_id: {type: string}
                - {type: "null"}
            phase: {type: [string, "null"], enum: [hiking, pausing, cutting, null]}
            phase_since: {type: [string, "null"], format: date}
            priced: {$ref: "#/components/schemas/MacroV3PricedSummary"}
            stance: {anyOf: [{$ref: "#/components/schemas/MacroV3Stance"}, {type: "null"}]}
            tone: {anyOf: [{$ref: "#/components/schemas/MacroV3Tone"}, {type: "null"}]}
            tone_trend:
              type: array
              description: "v1.14.0: last 12 scored policy documents, oldest first (model-based; empty when tone is not covered)"
              items:
                type: object
                required: [date, tone_model, tone_lexicon]
                properties:
                  date: {type: string, format: date}
                  tone_model: {type: [number, "null"]}
                  tone_lexicon: {type: [number, "null"]}
                  action: {type: [string, "null"], description: "Decision at that meeting (hike / cut / hold)"}
    MacroV3CentralBanks:
      type: object
      required: [as_of, labels, banks, data_status]
      properties:
        as_of: {type: string, format: date}
        labels: {$ref: "#/components/schemas/MacroV3Labels"}
        banks: {type: array, items: {$ref: "#/components/schemas/MacroV3CentralBankSummary"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    MacroV3ImpliedBank:
      type: object
      required: [bank, name, country, currency, status, as_of, policy_rate, step_bp, source, method, caveats, meetings_resolved, tp_adjusted, summary, points]
      properties:
        bank: {type: string}
        name: {type: string}
        country: {type: string}
        currency: {type: string}
        status: {type: string, enum: [ok, stale, no data, failed, not_available, pending]}
        as_of: {type: [string, "null"], format: date, description: "Latest curve date"}
        policy_rate: {type: [number, "null"]}
        step_bp: {type: number}
        next_meeting: {type: [string, "null"], format: date}
        source: {type: [string, "null"], description: "Official curve source"}
        method: {type: [string, "null"]}
        caveats: {type: array, items: {type: string}}
        meetings_resolved: {type: boolean}
        tp_adjusted: {type: boolean}
        basis_bp: {type: [number, "null"], description: "Stub basis subtracted from forwards"}
        anchor: {type: [string, "null"], enum: [stub_to_next_meeting, first_month, null]}
        summary: {$ref: "#/components/schemas/MacroV3PricedSummary"}
        points: {type: array, items: {$ref: "#/components/schemas/MacroV3PathPoint"}}
    MacroV3ImpliedPaths:
      type: object
      required: [as_of, label, labels, banks, data_status]
      properties:
        as_of: {type: string, format: date}
        label: {type: string}
        labels: {$ref: "#/components/schemas/MacroV3Labels"}
        banks: {type: array, items: {$ref: "#/components/schemas/MacroV3ImpliedBank"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    MacroV3RatePoint:
      type: object
      required: [date, policy_rate]
      properties:
        date: {type: string, format: date}
        observed: {type: [string, "null"], format: date}
        policy_rate: {type: [number, "null"]}
        source: {type: [string, "null"]}
        lower: {type: [number, "null"]}
        upper: {type: [number, "null"]}
        deposit: {type: [number, "null"]}
        lending: {type: [number, "null"]}
        mro: {type: [number, "null"]}
        overnight: {type: [number, "null"]}
        bis_rate: {type: [number, "null"]}
    MacroV3Decision:
      type: object
      required: [decision_date, change_bp, action, date_basis]
      properties:
        decision_date: {type: string, format: date}
        effective_date: {type: [string, "null"], format: date}
        rate_before: {type: [number, "null"]}
        rate_after: {type: [number, "null"]}
        change_bp: {type: number}
        action: {type: string, enum: [hike, cut, hold]}
        scheduled: {type: [boolean, "null"], description: "false = inter-meeting move; null = no calendar for that date"}
        date_basis: {type: string, enum: [official_meeting, effective_date]}
        vote: {type: [string, "null"], description: "Official vote split (BoE voting history; Fed/BoJ statement text)"}
        vote_source: {type: [string, "null"]}
        vote_detail: {type: [object, "null"], additionalProperties: {type: number}, description: "BoE: member -> rate voted for (%)"}
    MacroV3Meeting:
      type: object
      required: [date, source_id]
      properties:
        date: {type: string, format: date}
        scheduled_at: {type: [string, "null"], format: date-time}
        time_known: {type: boolean}
        source_id: {type: string}
        name: {type: [string, "null"]}
        url: {type: [string, "null"]}
        sep: {type: boolean}
    MacroV3CentralBank:
      type: object
      required: [as_of, bank, labels, rates, decisions, meetings, rate_cycle, implied_path, projections, stance, balance_sheet, tone, data_status]
      properties:
        as_of: {type: string, format: date}
        bank: {$ref: "#/components/schemas/MacroV3Bank"}
        labels: {$ref: "#/components/schemas/MacroV3Labels"}
        rates:
          type: object
          required: [latest, history]
          properties:
            latest: {anyOf: [{$ref: "#/components/schemas/MacroV3RatePoint"}, {type: "null"}]}
            history: {type: array, items: {$ref: "#/components/schemas/MacroV3RatePoint"}, description: "Weekly (last business day of each week)"}
        decisions: {type: array, items: {$ref: "#/components/schemas/MacroV3Decision"}, description: "Newest first"}
        meetings:
          type: object
          required: [upcoming, past]
          properties:
            upcoming: {type: array, items: {$ref: "#/components/schemas/MacroV3Meeting"}}
            past: {type: array, items: {$ref: "#/components/schemas/MacroV3Meeting"}, description: "Last 24"}
        rate_cycle:
          type: object
          required: [phase, phase_since, method, segments]
          properties:
            phase: {type: [string, "null"], enum: [hiking, pausing, cutting, null]}
            phase_since: {type: [string, "null"], format: date}
            method: {type: string}
            segments:
              type: array
              items:
                type: object
                required: [start, end, phase]
                properties:
                  start: {type: string, format: date}
                  end: {type: string, format: date}
                  phase: {type: string, enum: [hiking, pausing, cutting]}
        implied_path:
          type: object
          required: [status, as_of, label, source, method, caveats, meetings_resolved, tp_adjusted, summary, points, history, curves]
          properties:
            status: {type: string, enum: [ok, stale, no data, failed, not_available, pending]}
            as_of: {type: [string, "null"], format: date}
            label: {type: string}
            source: {type: [string, "null"]}
            method: {type: [string, "null"]}
            caveats: {type: array, items: {type: string}}
            meetings_resolved: {type: boolean}
            tp_adjusted: {type: boolean}
            policy_rate: {type: [number, "null"]}
            basis_bp: {type: [number, "null"]}
            anchor: {type: [string, "null"]}
            summary: {$ref: "#/components/schemas/MacroV3PricedSummary"}
            points: {type: array, items: {$ref: "#/components/schemas/MacroV3PathPoint"}}
            history:
              type: array
              description: "Horizon points (3m/6m/12m/24m) over implied_history_days"
              items:
                type: object
                required: [label, points]
                properties:
                  label: {type: string}
                  points:
                    type: array
                    items:
                      type: object
                      required: [as_of, implied_rate]
                      properties:
                        as_of: {type: string, format: date}
                        implied_rate: {type: number}
                        implied_rate_tp_adj: {type: [number, "null"]}
                        change_bp: {type: [number, "null"]}
            curves:
              type: array
              description: "Zero / instantaneous forward curves (snapshots latest, 1w, 1m, 3m, 6m, 1y; v1.14.0 added 3m/6m/1y)"
              items:
                type: object
                required: [snapshot, points]
                properties:
                  snapshot: {type: string, enum: [latest, 1w, 1m, 3m, 6m, 1y]}
                  as_of: {type: [string, "null"], format: date}
                  points:
                    type: array
                    items:
                      type: object
                      required: [tenor_years]
                      properties:
                        tenor_years: {type: number}
                        zero_rate: {type: [number, "null"]}
                        forward_rate: {type: [number, "null"]}
        projections:
          type: object
          required: [available]
          properties:
            available: {type: boolean}
            note: {type: string}
            latest_release: {type: [string, "null"], format: date}
            previous_release: {type: [string, "null"], format: date}
            label: {type: string}
            series:
              type: array
              items:
                type: object
                required: [variable, horizon, unit]
                properties:
                  variable: {type: string}
                  horizon: {type: string, description: "YYYY or longer_run"}
                  unit: {type: string}
                  source: {type: string}
                  latest: {type: object, additionalProperties: {type: [number, "null"]}, description: "stat -> value (median, central_low/high, range_low/high; ECB baseline)"}
                  previous: {type: object, additionalProperties: {type: [number, "null"]}}
            vs_market:
              type: array
              items:
                type: object
                required: [year, sep_median, market_meeting, market_implied]
                properties:
                  year: {type: string}
                  sep_median: {type: [number, "null"]}
                  market_meeting: {type: string, format: date}
                  market_implied: {type: number}
                  market_implied_tp_adj: {type: [number, "null"]}
                  market_minus_sep_bp: {type: [number, "null"]}
            vs_market_label: {type: [string, "null"]}
        stance:
          type: object
          required: [latest, history, labels]
          properties:
            latest: {anyOf: [{$ref: "#/components/schemas/MacroV3Stance"}, {type: "null"}]}
            history:
              type: array
              items:
                type: object
                required: [date]
                properties:
                  date: {type: string, format: date}
                  policy_rate: {type: [number, "null"]}
                  cpi_yoy: {type: [number, "null"]}
                  core_yoy: {type: [number, "null"]}
                  real_rate_cpi: {type: [number, "null"]}
                  real_rate_core: {type: [number, "null"]}
                  real_rate_expected: {type: [number, "null"]}
                  output_gap: {type: [number, "null"]}
                  r_star: {type: [number, "null"]}
                  taylor_1993: {type: [number, "null"]}
                  taylor_rstar: {type: [number, "null"]}
                  taylor_balanced: {type: [number, "null"]}
            labels: {$ref: "#/components/schemas/MacroV3Labels"}
        balance_sheet:
          type: object
          required: [available, components]
          properties:
            available: {type: boolean}
            unit: {type: string}
            qt_pace_method: {type: string}
            components:
              type: array
              items:
                type: object
                required: [component, latest, history]
                properties:
                  component: {type: string}
                  currency: {type: [string, "null"]}
                  source: {type: string}
                  latest:
                    type: object
                    required: [date, value_bn]
                    properties:
                      date: {type: string, format: date}
                      value_bn: {type: number}
                      change_13w_bn: {type: [number, "null"]}
                      pace_annualized_bn: {type: [number, "null"]}
                      change_1y_bn: {type: [number, "null"]}
                  history:
                    type: array
                    items:
                      type: object
                      required: [date, value_bn]
                      properties:
                        date: {type: string, format: date}
                        value_bn: {type: number}
        tone:
          type: object
          required: [available, label, history]
          properties:
            available: {type: boolean}
            label: {type: string}
            model_id: {type: [string, "null"]}
            history: {type: array, items: {$ref: "#/components/schemas/MacroV3Tone"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    # ------------------------------------------------------------ macro v4 (macro-w4; v1.12.0)
    MacroV4FactorMeta:
      type: object
      required: [factor_id, label, unit]
      properties:
        factor_id: {type: string}
        label: {type: string}
        unit: {type: string, description: "pp (percentage points; 1.0 = 100bp) | frac (fractional change) | idx100 (100 surprise-index points) | log"}
        per: {type: string, description: "How to read a beta, e.g. 'return per +100bp'"}
        source: {type: string, description: "Official series id / producing table"}
    MacroV4FactorPoint:
      type: object
      required: [date]
      properties:
        date: {type: string, format: date}
        value: {type: [number, "null"]}
        level: {type: [number, "null"]}
    MacroV4FactorSeries:
      type: object
      required: [factor_id, label, unit, source, model_based, last_date, history]
      properties:
        factor_id: {type: string}
        label: {type: string}
        unit: {type: string}
        per: {type: string}
        source: {type: string}
        model_based: {type: boolean}
        last_date: {type: [string, "null"], format: date}
        last_change: {type: [number, "null"]}
        last_level: {type: [number, "null"]}
        history: {type: array, items: {$ref: "#/components/schemas/MacroV4FactorPoint"}}
    MacroV4State:
      type: object
      required: [state_id, state, date, model_based]
      properties:
        state_id: {type: string, description: "cycle_quadrant_US | hmm_regime_GLOBAL | rate_cycle_fed | inflation_regime_US ..."}
        state: {type: [string, "null"]}
        date: {type: [string, "null"], format: date}
        source: {type: [string, "null"]}
        model_based: {type: boolean}
    MacroV4Factors:
      type: object
      required: [frequency, factors, surprise, states, data_status]
      properties:
        frequency: {type: string, enum: [D, W, M]}
        factors: {type: array, items: {$ref: "#/components/schemas/MacroV4FactorSeries"}}
        surprise:
          type: array
          items:
            type: object
            required: [factor_id]
            properties:
              factor_id: {type: string}
              level: {type: [number, "null"]}
              date: {type: [string, "null"], format: date}
        states: {type: array, items: {$ref: "#/components/schemas/MacroV4State"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    MacroV4Beta:
      type: object
      properties:
        beta: {type: [number, "null"], description: "Shrunk beta (securities) / OLS beta (aggregates)"}
        beta_raw: {type: [number, "null"]}
        se: {type: [number, "null"], description: "HAC standard error (posterior after shrinkage)"}
        t_stat: {type: [number, "null"]}
        shrink_weight: {type: [number, "null"]}
        peer_percentile: {type: [number, "null"]}
    MacroV4ExposureItem:
      type: object
      required: [entity_type, entity_id, weighting, name, n_obs, betas]
      properties:
        entity_type: {type: string}
        entity_id: {type: string}
        weighting: {type: string, enum: [cw, ew, none]}
        ticker: {type: [string, "null"]}
        name: {type: string}
        r2: {type: [number, "null"]}
        n_obs: {type: integer}
        scope: {type: [string, "null"], description: "Surprise model: economy of the surprise indices"}
        betas: {type: object, additionalProperties: {$ref: "#/components/schemas/MacroV4Beta"}, description: "factor_id -> beta"}
    MacroV4ExposureHistory:
      type: object
      required: [entity_id, weighting, factor_id, points]
      properties:
        entity_id: {type: string}
        weighting: {type: string}
        factor_id: {type: string}
        points:
          type: array
          items:
            type: object
            required: [date]
            properties:
              date: {type: string, format: date}
              beta: {type: [number, "null"]}
              se: {type: [number, "null"]}
    MacroV4Exposures:
      type: object
      required: [as_of, entity_type, model, factors, total, items, history, method, model_based, data_status]
      properties:
        as_of: {type: [string, "null"], format: date}
        frequency: {type: string, enum: [W], description: "Added v1.15.0: frequency of the regressions - weekly only (156-week window, month-end re-estimation)"}
        frequencies_available: {type: array, items: {type: string, enum: [W]}, description: "Added v1.15.0"}
        entity_type: {type: string}
        model: {type: string, enum: [joint, univariate, surprise]}
        factors: {type: array, items: {$ref: "#/components/schemas/MacroV4FactorMeta"}}
        total: {type: integer}
        items: {type: array, items: {$ref: "#/components/schemas/MacroV4ExposureItem"}}
        history: {type: array, items: {$ref: "#/components/schemas/MacroV4ExposureHistory"}}
        method: {type: object, additionalProperties: true}
        model_based: {type: boolean}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    MacroV4RegimeCell:
      type: object
      required: [n, is_current]
      properties:
        mean: {type: [number, "null"], description: "Mean monthly return (fraction)"}
        median: {type: [number, "null"]}
        ann_mean: {type: [number, "null"]}
        vol: {type: [number, "null"]}
        hit_rate: {type: [number, "null"]}
        t_stat: {type: [number, "null"]}
        n: {type: integer}
        first_month: {type: [string, "null"], format: date}
        last_month: {type: [string, "null"], format: date}
        is_current: {type: boolean}
    MacroV4RegimeItem:
      type: object
      required: [entity_type, entity_id, weighting, name, cells]
      properties:
        entity_type: {type: string}
        entity_id: {type: string}
        weighting: {type: string}
        ticker: {type: [string, "null"]}
        name: {type: string}
        benchmark: {type: [string, "null"]}
        cells: {type: object, additionalProperties: {$ref: "#/components/schemas/MacroV4RegimeCell"}, description: "regime -> statistics"}
    MacroV4RegimePerformance:
      type: object
      required: [regime_type, scope, entity_type, weighting, timing, metric, current_regime, regimes, items, model_based, method, data_status]
      properties:
        regime_type: {type: string, enum: [cycle_quadrant, hmm_regime, rate_cycle, inflation_regime]}
        scope: {type: string}
        entity_type: {type: string}
        weighting: {type: string}
        timing: {type: string, enum: [contemporaneous, next_month]}
        metric: {type: string, enum: [excess, relative]}
        current_regime: {type: [string, "null"]}
        regimes: {type: array, items: {type: string}}
        items: {type: array, items: {$ref: "#/components/schemas/MacroV4RegimeItem"}}
        model_based: {type: boolean}
        method: {type: object, additionalProperties: true}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    MacroV4Shocks:
      type: object
      additionalProperties: false
      description: "Any subset; percent fields are percent changes (10 = +10%), bp fields basis points, surprise fields index points"
      properties:
        rates_2y_bp: {type: number}
        rates_10y_bp: {type: number}
        breakeven_10y_bp: {type: number}
        real_10y_bp: {type: number}
        credit_bp: {type: number}
        usd_pct: {type: number}
        oil_pct: {type: number}
        equity_pct: {type: number}
        growth_surprise: {type: number}
        inflation_surprise: {type: number}
        labor_surprise: {type: number}
    MacroV4ScenarioOptions:
      type: object
      additionalProperties: false
      properties:
        mode: {type: string, enum: [isolated, conditional], default: isolated, description: "isolated: unspecified factors 0; conditional: Gaussian conditional mean given the specified shocks"}
        var_propagation: {type: boolean, default: false, description: "Second-round effects from a monthly VAR (model-based)"}
        var_horizon_months: {type: integer, minimum: 1, maximum: 24, default: 3}
    MacroV4Scenario:
      type: object
      required: [scenario_id, name, shocks, options, preset]
      properties:
        scenario_id: {type: string}
        name: {type: string}
        description: {type: [string, "null"]}
        shocks: {$ref: "#/components/schemas/MacroV4Shocks"}
        options: {$ref: "#/components/schemas/MacroV4ScenarioOptions"}
        preset: {type: boolean}
        created_at: {type: [string, "null"], format: date-time}
        updated_at: {type: [string, "null"], format: date-time}
    MacroV4ScenarioList:
      type: object
      required: [presets, saved, shock_fields]
      properties:
        presets: {type: array, items: {$ref: "#/components/schemas/MacroV4Scenario"}}
        saved: {type: array, items: {$ref: "#/components/schemas/MacroV4Scenario"}}
        shock_fields:
          type: array
          items:
            type: object
            required: [field, label]
            properties:
              field: {type: string}
              label: {type: string}
    MacroV4ScenarioCreate:
      type: object
      required: [name, shocks]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: [string, "null"], maxLength: 2000}
        shocks: {$ref: "#/components/schemas/MacroV4Shocks"}
        options: {$ref: "#/components/schemas/MacroV4ScenarioOptions"}
    MacroV4ScenarioUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: [string, "null"], maxLength: 2000}
        shocks: {$ref: "#/components/schemas/MacroV4Shocks"}
        options: {$ref: "#/components/schemas/MacroV4ScenarioOptions"}
    MacroV4ScenarioRunRequest:
      type: object
      properties:
        scenario_id: {type: [string, "null"], description: "Preset / saved scenario (its shocks and options unless overridden here)"}
        shocks: {$ref: "#/components/schemas/MacroV4Shocks"}
        options: {$ref: "#/components/schemas/MacroV4ScenarioOptions"}
        name: {type: [string, "null"]}
        universe: {type: string, enum: [mvp_us, mvp_global, full], default: full, description: "Securities ranked for winners / losers"}
        region: {type: [string, "null"]}
        weighting: {type: string, enum: [cw, ew], default: cw, description: "Sector / region portfolios shown"}
        top_n: {type: integer, minimum: 1, maximum: 200, default: 20}
        watchlist_id: {type: [string, "null"]}
        security_ids: {type: [array, "null"], items: {type: string}, maxItems: 500}
        sectors: {type: [array, "null"], items: {type: string}, maxItems: 50, description: "Added v1.15.0: restrict winners / losers (and n_securities) to these sector_ids (server-side)"}
        subsectors: {type: [array, "null"], items: {type: string}, maxItems: 200, description: "Added v1.15.0: restrict winners / losers to these subsector_ids"}
    MacroV4FactorValue:
      type: object
      required: [factor_id, value, unit]
      properties:
        factor_id: {type: string}
        value: {type: number}
        unit: {type: string, description: "pp | log"}
    MacroV4Impact:
      type: object
      required: [entity_type, entity_id, weighting, name]
      properties:
        entity_type: {type: string}
        entity_id: {type: string}
        weighting: {type: string}
        ticker: {type: [string, "null"]}
        name: {type: string}
        sector_id: {type: [string, "null"]}
        region: {type: [string, "null"]}
        impact: {type: [number, "null"], description: "Estimated total return (fraction), model-based"}
        impact_lo: {type: [number, "null"], description: "5th percentile (beta estimation uncertainty)"}
        impact_hi: {type: [number, "null"]}
        first_round: {type: [number, "null"], description: "Impact before VAR propagation (macro factors only)"}
        surprise_part: {type: [number, "null"], description: "Part from the surprise-model shocks"}
    MacroV4UniverseImpact:
      type: object
      required: [universe_id, weighting, n]
      properties:
        universe_id: {type: string}
        weighting: {type: string}
        impact: {type: [number, "null"]}
        impact_lo: {type: [number, "null"]}
        impact_hi: {type: [number, "null"]}
        n: {type: integer}
    MacroV4WatchlistImpact:
      type: object
      required: [watchlist_id, name, weighting, n, items]
      properties:
        watchlist_id: {type: string}
        name: {type: string}
        weighting: {type: string}
        impact: {type: [number, "null"]}
        impact_lo: {type: [number, "null"]}
        impact_hi: {type: [number, "null"]}
        n: {type: integer}
        items: {type: array, items: {$ref: "#/components/schemas/MacroV4Impact"}}
    MacroV4VarResult:
      type: object
      required: [lags, n_obs, horizon_months, path]
      properties:
        lags: {type: integer}
        n_obs: {type: integer}
        horizon_months: {type: integer}
        path: {type: array, items: {type: object, additionalProperties: {type: number}}, description: "Cumulative factor moves by month (month 0 = impact)"}
    MacroV4ScenarioResult:
      type: object
      required: [scenario, as_of, model_label, model_based, factor_vector, var, notes, band, universe, sectors, regions, factors, instruments_top, instruments_bottom, winners, losers, n_securities, watchlist, securities, data_status]
      properties:
        scenario:
          type: object
          required: [name, shocks, options]
          properties:
            scenario_id: {type: [string, "null"]}
            name: {type: string}
            preset: {type: boolean}
            shocks: {$ref: "#/components/schemas/MacroV4Shocks"}
            options: {type: object, additionalProperties: true}
        as_of: {type: [string, "null"], format: date}
        model_label: {type: string}
        model_based: {type: boolean}
        factor_vector:
          type: object
          required: [first_round, total]
          properties:
            first_round: {type: array, items: {$ref: "#/components/schemas/MacroV4FactorValue"}}
            total: {type: array, items: {$ref: "#/components/schemas/MacroV4FactorValue"}}
        var: {oneOf: [{$ref: "#/components/schemas/MacroV4VarResult"}, {type: "null"}]}
        notes: {type: array, items: {type: string}}
        band: {type: string}
        universe: {type: array, items: {$ref: "#/components/schemas/MacroV4UniverseImpact"}}
        sectors: {type: array, items: {$ref: "#/components/schemas/MacroV4Impact"}}
        regions: {type: array, items: {$ref: "#/components/schemas/MacroV4Impact"}}
        factors: {type: array, items: {$ref: "#/components/schemas/MacroV4Impact"}}
        instruments_top: {type: array, items: {$ref: "#/components/schemas/MacroV4Impact"}}
        instruments_bottom: {type: array, items: {$ref: "#/components/schemas/MacroV4Impact"}}
        winners: {type: array, items: {$ref: "#/components/schemas/MacroV4Impact"}}
        losers: {type: array, items: {$ref: "#/components/schemas/MacroV4Impact"}}
        n_securities: {type: integer}
        watchlist: {oneOf: [{$ref: "#/components/schemas/MacroV4WatchlistImpact"}, {type: "null"}]}
        securities: {type: array, items: {$ref: "#/components/schemas/MacroV4Impact"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    MacroV4EpisodeSummary:
      type: object
      required: [episode_id, name, start, end, rationale, factor_moves, missing_factors, n_entities, n_realized]
      properties:
        episode_id: {type: string}
        name: {type: string}
        start: {type: string, format: date}
        end: {type: string, format: date}
        rationale: {type: string}
        factor_moves: {type: object, additionalProperties: {type: [number, "null"]}, description: "Official moves: pp; log change for usd / oil / equity"}
        missing_factors: {type: array, items: {type: string}}
        n_entities: {type: integer}
        n_realized: {type: integer}
    MacroV4Episodes:
      type: object
      required: [episodes, model_label, method, data_status]
      properties:
        episodes: {type: array, items: {$ref: "#/components/schemas/MacroV4EpisodeSummary"}}
        model_label: {type: string}
        method: {type: string}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    MacroV4FitStats:
      type: object
      required: [n]
      properties:
        n: {type: integer}
        corr: {type: [number, "null"]}
        mae: {type: [number, "null"]}
        sign_hit_rate: {type: [number, "null"]}
        mean_model: {type: [number, "null"]}
        mean_realized: {type: [number, "null"]}
    MacroV4ReplayRow:
      type: object
      required: [entity_type, entity_id, weighting, name]
      properties:
        entity_type: {type: string}
        entity_id: {type: string}
        weighting: {type: string}
        ticker: {type: [string, "null"]}
        name: {type: string}
        model_implied: {type: [number, "null"]}
        model_implied_macro: {type: [number, "null"]}
        model_lo: {type: [number, "null"]}
        model_hi: {type: [number, "null"]}
        realized: {type: [number, "null"]}
    MacroV4ReplayBlock:
      type: object
      required: [stats, items]
      properties:
        stats: {$ref: "#/components/schemas/MacroV4FitStats"}
        items: {type: array, items: {$ref: "#/components/schemas/MacroV4ReplayRow"}}
    MacroV4EpisodeDetail:
      type: object
      required: [episode, factor_moves, missing_factors, as_of_betas, model_label, model_based, sectors, regions, factors, instruments, securities, data_status]
      properties:
        episode:
          type: object
          required: [episode_id, name, start, end, rationale]
          properties:
            episode_id: {type: string}
            name: {type: string}
            start: {type: string, format: date}
            end: {type: string, format: date}
            rationale: {type: string}
        factor_moves: {type: object, additionalProperties: {type: [number, "null"]}}
        missing_factors: {type: array, items: {type: string}}
        as_of_betas: {type: [string, "null"], format: date}
        model_label: {type: string}
        model_based: {type: boolean}
        sectors: {$ref: "#/components/schemas/MacroV4ReplayBlock"}
        regions: {$ref: "#/components/schemas/MacroV4ReplayBlock"}
        factors: {$ref: "#/components/schemas/MacroV4ReplayBlock"}
        instruments: {$ref: "#/components/schemas/MacroV4ReplayBlock"}
        securities:
          type: object
          required: [stats, winners, losers]
          properties:
            stats: {$ref: "#/components/schemas/MacroV4FitStats"}
            winners: {type: array, items: {$ref: "#/components/schemas/MacroV4ReplayRow"}}
            losers: {type: array, items: {$ref: "#/components/schemas/MacroV4ReplayRow"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    CompanyMacroExposure:
      type: object
      required: [factor_id]
      properties:
        factor_id: {type: string}
        label: {type: string}
        unit: {type: string}
        per: {type: string}
        beta: {type: [number, "null"]}
        beta_raw: {type: [number, "null"]}
        se: {type: [number, "null"]}
        t_stat: {type: [number, "null"]}
        shrink_weight: {type: [number, "null"]}
        peer_percentile: {type: [number, "null"]}
        sector_beta: {type: [number, "null"], description: "Same beta of the company's global cap-weighted sector portfolio"}
    CompanyMacroFit:
      oneOf:
        - type: "null"
        - type: object
          required: [n_obs]
          properties:
            r2: {type: [number, "null"]}
            n_obs: {type: integer}
            scope: {type: [string, "null"]}
    CompanyMacroV4:
      type: object
      required: [security_id, ticker, name, sector_id, region, as_of, exposures, fit, sector_regimes, scenarios, episodes, model_label, model_based, method, data_status]
      properties:
        security_id: {type: string}
        ticker: {type: [string, "null"]}
        name: {type: [string, "null"]}
        sector_id: {type: [string, "null"]}
        region: {type: [string, "null"]}
        as_of: {type: [string, "null"], format: date}
        exposures:
          type: object
          required: [joint, univariate, surprise]
          properties:
            joint: {type: array, items: {$ref: "#/components/schemas/CompanyMacroExposure"}}
            univariate: {type: array, items: {$ref: "#/components/schemas/CompanyMacroExposure"}}
            surprise: {type: array, items: {$ref: "#/components/schemas/CompanyMacroExposure"}}
        fit:
          type: object
          properties:
            joint: {$ref: "#/components/schemas/CompanyMacroFit"}
            univariate: {$ref: "#/components/schemas/CompanyMacroFit"}
            surprise: {$ref: "#/components/schemas/CompanyMacroFit"}
        sector_regimes:
          type: array
          items:
            type: object
            required: [regime_type, scope, cells]
            properties:
              regime_type: {type: string}
              scope: {type: string}
              current_regime: {type: [string, "null"]}
              cells:
                type: array
                items:
                  type: object
                  required: [regime, n, is_current]
                  properties:
                    regime: {type: string}
                    mean: {type: [number, "null"], description: "Mean monthly return of the sector relative to the benchmark"}
                    hit_rate: {type: [number, "null"]}
                    t_stat: {type: [number, "null"]}
                    n: {type: integer}
                    is_current: {type: boolean}
        scenarios:
          type: array
          items:
            type: object
            required: [scenario_id, name, preset]
            properties:
              scenario_id: {type: string}
              name: {type: string}
              preset: {type: boolean}
              impact: {type: [number, "null"]}
              impact_lo: {type: [number, "null"]}
              impact_hi: {type: [number, "null"]}
              sector_impact: {type: [number, "null"]}
        episodes:
          type: array
          items:
            type: object
            required: [episode_id, name, start, end]
            properties:
              episode_id: {type: string}
              name: {type: string}
              start: {type: string, format: date}
              end: {type: string, format: date}
              model_implied: {type: [number, "null"]}
              model_lo: {type: [number, "null"]}
              model_hi: {type: [number, "null"]}
              realized: {type: [number, "null"]}
              sector:
                description: "Added v1.15.0: the company's global sector portfolio (cap-weighted, else equal-weighted) over the same episode"
                oneOf:
                  - type: "null"
                  - type: object
                    required: [entity_id, weighting]
                    properties:
                      entity_id: {type: string}
                      weighting: {type: string}
                      model_implied: {type: [number, "null"]}
                      model_lo: {type: [number, "null"]}
                      model_hi: {type: [number, "null"]}
                      realized: {type: [number, "null"]}
        model_label: {type: string}
        model_based: {type: boolean}
        method: {type: object, additionalProperties: true}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    MacroV4RegimeScopes:
      type: object
      required: [regime_types, data_status]
      properties:
        regime_types:
          type: array
          items:
            type: object
            required: [regime_type, label, default_scope, scopes]
            properties:
              regime_type: {type: string, enum: [cycle_quadrant, hmm_regime, rate_cycle, inflation_regime]}
              label: {type: string}
              default_scope: {type: [string, "null"]}
              scopes:
                type: array
                items:
                  type: object
                  required: [scope, states, model_based, has_performance]
                  properties:
                    scope: {type: string, description: "US | GLOBAL | central-bank id (fed, ecb, boe, boj, pboc, ...)"}
                    states: {type: array, items: {type: string}}
                    current_state: {type: [string, "null"]}
                    first_date: {type: [string, "null"], format: date}
                    last_date: {type: [string, "null"], format: date}
                    source: {type: [string, "null"]}
                    model_based: {type: boolean}
                    has_performance: {type: boolean, description: "regime_performance has rows for this (regime_type, scope)"}
        data_status: {$ref: "#/components/schemas/DataStatus"}

    # ------------------------------------------------------------ events v2 (events-v2, v1.16)
    EventsV2LabelType: {type: string, enum: [country, sector, issuer]}
    EventsV2SecurityLite:
      type: object
      required: [security_id, issuer_id, ticker, name]
      properties:
        security_id: {type: [string, "null"]}
        issuer_id: {type: [string, "null"]}
        ticker: {type: [string, "null"]}
        name: {type: [string, "null"]}
        relevance: {type: number, description: "Story relevance 0..1 (link confidence x sqrt(member share); 1 when named in the headline). Story items only."}
    EventsV2Label:
      type: object
      required: [type, id, name]
      properties:
        type: {$ref: "#/components/schemas/EventsV2LabelType"}
        id: {type: string, description: "ISO2 / GLOBAL | sector id | security_id (issuer_id when no security)"}
        name: {type: string}
        security: {oneOf: [{$ref: "#/components/schemas/EventsV2SecurityLite"}, {type: "null"}]}
    EventsV2Taxonomy:
      type: object
      required: [themes, sectors, countries, data_status]
      properties:
        coverage: {type: object, required: [first_date, last_date, n_days], description: "News coverage of the labelled event aggregates (country, all themes). Added v1.20.0.", properties: {first_date: {type: [string, "null"], format: date}, last_date: {type: [string, "null"], format: date}, n_days: {type: integer}}}
        themes:
          type: array
          items:
            type: object
            required: [id, name, group, sectors]
            properties:
              id: {type: string}
              name: {type: string}
              group: {type: string}
              sectors: {type: array, items: {type: string}, description: "Sectors typically affected (hint)"}
        sectors: {type: array, items: {type: object, required: [id, name], properties: {id: {type: string}, name: {type: string}}}}
        countries: {type: array, items: {type: object, required: [id, name], properties: {id: {type: string}, name: {type: string}}}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    EventsV2MapCountry:
      type: object
      required: [country, name, events, articles, mentions]
      properties:
        country: {type: string, description: "ISO2 or GLOBAL"}
        name: {type: string}
        events: {type: integer, description: "GDELT events (all parsed events, theme-filtered by CAMEO + source-article themes)"}
        articles: {type: integer, description: "Labelled GKG articles"}
        mentions: {type: integer}
        conflict_share: {type: [number, "null"], description: "Share of events with QuadClass 3/4"}
        goldstein: {type: [number, "null"]}
        tone: {type: [number, "null"]}
        attention_z: {type: [number, "null"], description: "Max daily attention z in the window"}
        attention_z_last: {type: [number, "null"]}
        tone_z_min: {type: [number, "null"]}
        intensity: {type: [number, "null"], description: "log1p(events + articles) / max over countries (0..1)"}
    EventsV2Map:
      type: object
      required: [start, end, themes, countries, timeline, data_status]
      properties:
        coverage: {type: object, required: [first_date, last_date, n_days], description: "News coverage of the labelled event aggregates (country, all themes). Added v1.20.0.", properties: {first_date: {type: [string, "null"], format: date}, last_date: {type: [string, "null"], format: date}, n_days: {type: integer}}}
        timeline_freq: {type: string, enum: [day, week], description: "Bucket of timeline[] (added v1.20.0)"}
        start: {type: string, format: date}
        end: {type: string, format: date}
        themes: {type: array, items: {type: string}}
        countries: {type: array, items: {$ref: "#/components/schemas/EventsV2MapCountry"}}
        timeline:
          type: array
          description: "Daily totals over slider_days (sum over country labels)"
          items: {type: object, required: [date, events, articles], properties: {date: {type: string, format: date}, events: {type: integer}, articles: {type: integer}}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    EventsV2Point:
      type: object
      required: [date, events, articles, mentions]
      properties:
        date: {type: string, format: date}
        events: {type: integer}
        articles: {type: integer}
        mentions: {type: integer}
        tone: {type: [number, "null"]}
        goldstein: {type: [number, "null"]}
        attention_z: {type: [number, "null"]}
        tone_z: {type: [number, "null"]}
    EventsV2Timeline:
      type: object
      required: [label, start, end, freq, series, data_status]
      properties:
        label: {$ref: "#/components/schemas/EventsV2Label"}
        start: {type: string, format: date}
        end: {type: string, format: date}
        freq: {type: string, enum: [day, week]}
        series:
          type: array
          items:
            type: object
            required: [theme, theme_name, points]
            properties:
              theme: {type: string, description: "Theme id or 'all'"}
              theme_name: {type: string}
              points: {type: array, items: {$ref: "#/components/schemas/EventsV2Point"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    EventsV2Story:
      type: object
      required: [story_id, title, n_articles, n_sources, n_days, n_events, sources, domains, urls, themes, sectors, countries, securities, salience]
      properties:
        story_id: {type: string, description: "Decimal int64"}
        title: {type: string, description: "Canonical headline (most common member title)"}
        first_ts: {type: [string, "null"], format: date-time}
        last_ts: {type: [string, "null"], format: date-time}
        first_date: {type: [string, "null"], format: date}
        last_date: {type: [string, "null"], format: date}
        n_articles: {type: integer}
        n_sources: {type: integer, description: "Distinct domains (max over the story's days)"}
        n_days: {type: integer}
        n_events: {type: integer, description: "GDELT events coded from the members"}
        sources: {type: array, items: {type: string}, description: "News sources (gdelt_gkg, polygon_news, rss_*, gdelt_doc, ...)"}
        domains: {type: array, items: {type: string}, description: "Top publisher domains"}
        urls: {type: array, items: {type: string}, description: "Up to 3 representative URLs"}
        tone: {type: [number, "null"], description: "Mean GDELT tone"}
        sentiment: {type: [number, "null"], description: "FinBERT / XLM-R P(pos) - P(neg) of the canonical title (-1..1)"}
        sentiment_model: {type: [string, "null"]}
        lang: {type: [string, "null"]}
        themes: {type: array, items: {type: string}}
        sectors: {type: array, items: {type: string}}
        countries: {type: array, items: {type: string}, description: "ISO2 / GLOBAL"}
        securities: {type: array, items: {$ref: "#/components/schemas/EventsV2SecurityLite"}}
        salience: {type: number}
    EventsV2StoryPage:
      type: object
      required: [total, limit, offset, start, end, items, data_status]
      properties:
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        start: {type: string, format: date}
        end: {type: string, format: date}
        items: {type: array, items: {$ref: "#/components/schemas/EventsV2Story"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    EventsV2StoryDetail:
      type: object
      required: [story, sources, timeline, days, languages, members_available, data_status]
      properties:
        story: {$ref: "#/components/schemas/EventsV2Story"}
        sources: {type: array, items: {type: object, required: [domain, articles], properties: {domain: {type: string}, articles: {type: integer}}}}
        timeline: {type: array, items: {type: object, required: [ts, articles], properties: {ts: {type: string, format: date-time}, articles: {type: integer}}}, description: "Members per hour (UTC)"}
        days: {type: array, items: {type: object, required: [date, articles], properties: {date: {type: string, format: date}, articles: {type: integer}}}}
        languages: {type: array, items: {type: object, required: [lang, articles], properties: {lang: {type: string}, articles: {type: integer}}}}
        members_available: {type: boolean, description: "false for singleton / older stories (members pruned after 120-180 d)"}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    EventsV2Shock:
      type: object
      required: [date, label, theme, kind, events, articles]
      properties:
        date: {type: string, format: date}
        label: {$ref: "#/components/schemas/EventsV2Label"}
        theme: {type: string, description: "Theme id or 'all'"}
        kind: {type: string, enum: [attention, tone_drop, tone_jump]}
        attention_z: {type: [number, "null"]}
        tone_z: {type: [number, "null"]}
        tone: {type: [number, "null"]}
        events: {type: integer}
        articles: {type: integer}
    EventsV2Shocks:
      type: object
      required: [start, end, min_z, items, data_status]
      properties:
        start: {type: string, format: date}
        end: {type: string, format: date}
        min_z: {type: number}
        items: {type: array, items: {$ref: "#/components/schemas/EventsV2Shock"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    EventsV2LabelPanel:
      type: object
      required: [label, as_of, series, themes, top_stories, shocks, data_status]
      properties:
        freq: {type: string, enum: [day, week], description: "Bucket of series[] (added v1.20.0)"}
        label: {$ref: "#/components/schemas/EventsV2Label"}
        as_of: {type: string, format: date}
        latest: {oneOf: [{$ref: "#/components/schemas/EventsV2Point"}, {type: "null"}]}
        series: {type: array, items: {$ref: "#/components/schemas/EventsV2Point"}, description: "All themes, daily"}
        themes:
          type: array
          items:
            type: object
            required: [theme, name, articles, events]
            properties:
              theme: {type: string}
              name: {type: string}
              articles: {type: integer}
              events: {type: integer}
              share: {type: [number, "null"]}
        top_stories: {type: array, items: {$ref: "#/components/schemas/EventsV2Story"}}
        shocks: {type: array, items: {$ref: "#/components/schemas/EventsV2Shock"}}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    EventsV2EventDates:
      type: object
      required: [label, theme, kind, min_z, min_gap_days, start, end, method, dates, data_status]
      properties:
        label: {$ref: "#/components/schemas/EventsV2Label"}
        theme: {type: string}
        kind: {type: string, enum: [attention, tone_drop, tone_jump, any]}
        min_z: {type: number}
        min_gap_days: {type: integer}
        start: {type: string, format: date}
        end: {type: string, format: date}
        method: {type: string}
        dates:
          type: array
          items:
            type: object
            required: [date, events, articles]
            properties:
              date: {type: string, format: date}
              attention_z: {type: [number, "null"]}
              tone_z: {type: [number, "null"]}
              events: {type: integer}
              articles: {type: integer}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    # ------------------------------------------------------------ live (real-time R1, v1.17)
    LiveOrigin:
      type: string
      enum: [live, snapshot, app_state]
      description: "live = real-time hot store; snapshot = nightly serving snapshot; app_state = alert_events table"
