        direct: {type: [number, "null"]}
        second_order: {type: [number, "null"]}
        look_through: {type: [number, "null"]}
        n_paths: {type: integer}
        via: {type: array, items: {$ref: "#/components/schemas/SupplyChainVia"}}
        source: {type: string}
    CompanyGeography:
      type: object
      required: [security, as_of, countries, sectors, coverage, labels, data_status]
      properties:
        security: {$ref: "#/components/schemas/SecurityRef"}
        as_of: {type: string, format: date}
        countries: {type: array, items: {$ref: "#/components/schemas/CompanyGeographyCountry"}}
        sectors: {type: array, items: {$ref: "#/components/schemas/CompanyGeographySector"}}
        metrics: {oneOf: [{$ref: "#/components/schemas/SupplyChainMetrics"}, {type: "null"}]}
        coverage: {$ref: "#/components/schemas/SupplyChainCoverage"}
        labels: {$ref: "#/components/schemas/SupplyChainLabels"}
        data_status: {$ref: "#/components/schemas/DataStatus"}
    SupplyChainCountryRiskRow:
      allOf:
        - {$ref: "#/components/schemas/CountryRiskOverlay"}
