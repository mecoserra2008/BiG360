      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StudioPeerSetCreate"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/StudioPeerSet"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
