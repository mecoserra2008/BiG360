  # ======================================================================= THESIS TRACKER (roadmap v2 #8, v1.26.0)
  /api/v1/theses:
    get:
      tags: [theses]
      operationId: listTheses
      description: "Thesis board: all theses (kanban columns idea / active / closed) with filters and a price card (last close of price_id, direction-signed return since inception on closes)."
      parameters:
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ThesisStatusColumn"}}
        - {name: subject_type, in: query, schema: {$ref: "#/components/schemas/ThesisSubjectType"}}
        - {name: direction, in: query, schema: {$ref: "#/components/schemas/ThesisDirection"}}
        - {name: auto_status, in: query, schema: {$ref: "#/components/schemas/ThesisAutoStatus"}}
        - {name: q, in: query, schema: {type: string, maxLength: 80}, description: "Text search in title / subject / thesis text"}
        - {name: tag, in: query, schema: {type: string, maxLength: 40}}
        - {name: min_conviction, in: query, schema: {type: integer, minimum: 1, maximum: 5}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisList"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
    post:
      tags: [theses]
      operationId: createThesis
      description: "Create a thesis. Subject defaults (label, price instrument, currency, benchmark, sector benchmark) are resolved from the serving snapshot; inception = snapshot as_of and its close; a creation snapshot is captured; linked alert rules are generated (alerts.thesis_id) and the automatic status is evaluated (due thesis_* alerts fire)."
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisCreate"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisDetail"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/theses/stats:
    get:
      tags: [theses]
      operationId: getThesisStats
      description: "Hit rates across closed theses (outcome win / loss / flat, direction-signed return, excess vs benchmark captured at close), by direction / conviction / subject type / close reason, plus open-thesis automatic status counts."
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisStats"}}}}
  /api/v1/theses/subject-defaults:
    get:
      tags: [theses]
      operationId: getThesisSubjectDefaults
      description: "Defaults for a new thesis on a subject: label, price instrument, currency, benchmark / sector benchmark, last close, suggested catalysts (upcoming earnings dates with their source label) and KPIs."
      parameters:
        - {name: subject_type, in: query, required: true, schema: {$ref: "#/components/schemas/ThesisSubjectType"}}
        - {name: subject_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 60}, description: "security_id or ticker | sector_id | ISO2 | macro theme ('inflation' or 'US:inflation') | cross-asset asset_id"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisSubjectDefaults"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/theses/{thesis_id}:
    get:
      tags: [theses]
      operationId: getThesis
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisDetail"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [theses]
      operationId: updateThesis
      description: "Edit / move on the board. idea -> active resets inception (date + close) and captures an activation snapshot; -> closed records exit price, close reason, outcome (default from the direction-signed return), a close snapshot with the performance and a post-mortem template when post_mortem_md is empty, and disables the linked alert rules. Linked rules are regenerated (unchanged rules keep their ids) and the status re-evaluated."
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisUpdate"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ThesisDetail"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      tags: [theses]
      operationId: deleteThesis
      description: "Delete the thesis with its journal, reviews, snapshots and linked alert rules (and their events)."
      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/theses/{thesis_id}/journal:
