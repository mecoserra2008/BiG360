      parameters: [{name: thesis_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Markdown document, content: {text/markdown: {schema: {type: string}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  # ======================================================================= SUPPLY CHAIN & REVENUE GEOGRAPHY (roadmap v2 #9, v1.27.0)
  /api/v1/companies/{security_id}/network:
    get:
      tags: [supply-chain, companies]
      operationId: getCompanyNetwork
      summary: Company supply-chain network - disclosed customers / suppliers (depth 1-2) with provenance, plus labelled statistical neighbours
      description: "Nodes = issuers (or unresolved counterparty names) with score / event / country-risk colouring fields; edges = supplier -> customer (disclosed_customer: the supplier disclosed the customer; disclosed_supplier: the customer disclosed the supplier; both) with revenue / purchase shares, confidence and provenance (filing, form, rule, snippet <= 200 chars, knowledge_date), and type statistical (return co-movement, NOT disclosed). Depth 2 expands resolved issuers of depth 1 (max_nodes cap)."
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 2, default: 1}}
        - {name: include_statistical, in: query, schema: {type: boolean, default: true}}
        - {name: statistical_method, in: query, schema: {type: string, enum: [return_corr, partial_corr], default: return_corr}}
        - {name: min_confidence, in: query, schema: {type: number, minimum: 0, maximum: 1, default: 0}}
        - {name: max_nodes, in: query, schema: {type: integer, minimum: 10, maximum: 400, default: 120}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CompanyNetwork"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/companies/{security_id}/geography:
    get:
      tags: [supply-chain, companies]
      operationId: getCompanyGeography
      summary: Company revenue geography - direct, second-order (customers') and look-through country / sector exposure with event and macro overlays per country
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CompanyGeography"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/supply-chain/country-risk:
    get:
      tags: [supply-chain]
      operationId: getSupplyChainCountryRisk
      summary: Model-based country risk overlay (event pressure, escalation probability, hotspot, GPR, recession probability, macro surprises, cycle) for map layers
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SupplyChainCountryRisk"}}}}
  /api/v1/supply-chain/shock:
    post:
      tags: [supply-chain]
      operationId: runSupplyChainShock
      summary: Model-based shock simulation - a company or country revenue shock propagated over disclosed supply-chain links (damped), optional statistical-neighbour and W4 macro channels
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SupplyChainShockRequest"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SupplyChainShockResult"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
