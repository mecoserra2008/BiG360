      parameters:
        - {name: bank, in: path, required: true, schema: {type: string}, description: "fed, ecb, boe, boj, snb, boc, rba, riksbank, norges, bcb, banxico, bcch, banrep, bcrp, rbi, bok, pboc"}
        - {name: history_years, in: query, schema: {type: integer, default: 10, minimum: 1, maximum: 40}}
        - {name: implied_history_days, in: query, schema: {type: integer, default: 365, minimum: 0, maximum: 760}}
