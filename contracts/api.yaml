        markets_open: {type: [integer, "null"], description: "Market sessions of the universe open now"}
        n_securities: {type: [integer, "null"], description: "Securities polled (watchlists, theses, viewed, indices, FX, futures, cockpit)"}
        last_fetch_at: {type: [string, "null"], format: date-time}
        delayed: {type: boolean, description: "Always true: quotes are delayed (0-20 min by exchange)"}
