        robots_checked: {type: [string, "null"]}
        etag: {type: [boolean, "null"]}
        last_modified: {type: [boolean, "null"]}
        last_poll_at: {type: [string, "null"]}
        last_ok_at: {type: [string, "null"]}
        last_error: {type: [string, "null"]}
        consecutive_errors: {type: [integer, "null"]}
        polls: {type: [integer, "null"]}
