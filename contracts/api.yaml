      properties:
        id: {type: string, description: "The id as requested"}
        security_id: {type: string}
        symbol: {type: [string, "null"], description: "Source symbol (Yahoo / Polygon)"}
        price: {type: number}
        change: {type: [number, "null"]}
        change_pct: {type: [number, "null"], description: "Fraction (0.012 = +1.2%)"}
        prev_close: {type: [number, "null"]}
        currency: {type: [string, "null"]}
        market: {type: [string, "null"], description: "Session key: exchange MIC, FX or GLOBEX"}
        market_state: {type: [string, "null"], description: "Source market state (REGULAR, PRE, POST, CLOSED, ...)"}
        market_open: {type: boolean}
        market_reason: {type: [string, "null"], description: "open | closing_print | before_open | after_close | closed_weekend | closed_holiday | daily_break"}
        next_open_at: {type: [string, "null"], format: date-time}
        quote_ts: {type: [string, "null"], format: date-time, description: "Time of the last print at the source"}
        fetched_at: {type: [string, "null"], format: date-time}
        delay_min: {type: [integer, "null"], description: "Stated source delay in minutes"}
        source: {type: [string, "null"], description: "yahoo | polygon"}
        day_high: {type: [number, "null"]}
        day_low: {type: [number, "null"]}
        volume: {type: [number, "null"]}
        stale: {type: boolean}
        delayed: {type: boolean}
    LiveMarketSession:
      type: object
      required: [market, open]
      properties:
        market: {type: string}
        open: {type: boolean}
        in_tail: {type: [boolean, "null"], description: "After the bell, waiting for the delayed closing print"}
        reason: {type: [string, "null"]}
        reason_text: {type: [string, "null"]}
        opens_at: {type: [string, "null"], format: date-time}
        closes_at: {type: [string, "null"], format: date-time}
        n_targets: {type: [integer, "null"]}
        updated_at: {type: [number, "null"]}
        every_s: {type: [number, "null"], description: "Poll cadence while open"}
