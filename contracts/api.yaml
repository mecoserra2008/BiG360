  # ======================================================================= GLOBAL EVENTS v2 (events-v2, v1.16)
  /api/v1/events/v2/taxonomy:
    get:
      tags: [events-v2]
      operationId: getEventsV2Taxonomy
      summary: Market themes (bit order), sectors and countries (ISO2 + GLOBAL) used by the events-v2 labels
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsV2Taxonomy"}}}}
  /api/v1/events/v2/map:
    get:
      tags: [events-v2]
      operationId: getEventsV2Map
      summary: Country intensity / tone for a date window (time slider) with a theme filter, plus the daily totals for the slider
      parameters:
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}, description: "Default: snapshot as_of"}
        - {name: days, in: query, schema: {type: integer, default: 7, minimum: 1, maximum: 2600}, description: "Window length when start is omitted"}
        - {name: theme, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "Theme ids (any-of); default all themes"}
        - {name: slider_days, in: query, schema: {type: integer, default: 90, minimum: 7, maximum: 2600}}
        - {name: slider_freq, in: query, schema: {type: string, enum: [day, week]}, description: "Slider bucket; default week when slider_days > 400. Added v1.20.0."}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsV2Map"}}}}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/v2/timeline:
    get:
      tags: [events-v2]
      operationId: getEventsV2Timeline
      summary: Theme x time series for a country / sector / issuer (all themes + the top themes, or the requested themes)
      parameters:
        - {name: label_type, in: query, required: true, schema: {$ref: "#/components/schemas/EventsV2LabelType"}}
        - {name: label_id, in: query, required: true, schema: {type: string}, description: "ISO2 | GLOBAL | sector id | security_id | issuer_id"}
        - {name: theme, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {name: days, in: query, schema: {type: integer, default: 90, minimum: 1, maximum: 2600}}
        - {name: freq, in: query, schema: {type: string, enum: [day, week], default: day}}
        - {name: top_themes, in: query, schema: {type: integer, default: 6, minimum: 0, maximum: 41}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsV2Timeline"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/v2/stories:
    get:
      tags: [events-v2]
      operationId: getEventsV2Stories
      summary: Story feed (near-duplicate clusters of all news sources) with label / theme / tone / salience filters
      parameters:
        - {name: country, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}, description: "ISO2 or GLOBAL (any-of)"}
        - {name: sector, in: query, schema: {type: string}}
        - {name: security_id, in: query, schema: {type: string}, description: "security_id or issuer_id (stories with relevance >= min_relevance)"}
        - {name: theme, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: tone_min, in: query, schema: {type: number}}
        - {name: tone_max, in: query, schema: {type: number}}
        - {name: min_salience, in: query, schema: {type: number}}
        - {name: min_articles, in: query, schema: {type: integer, minimum: 1}}
        - {name: min_relevance, in: query, schema: {type: number, default: 0.3, minimum: 0, maximum: 1}}
        - {name: q, in: query, schema: {type: string}, description: "Case-insensitive title substring"}
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {name: days, in: query, schema: {type: integer, default: 7, minimum: 1, maximum: 2600}}
        - {name: sort, in: query, schema: {type: string, enum: [salience, recent, articles, tone_neg, tone_pos], default: salience}}
        - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 500}}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsV2StoryPage"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/events/v2/stories/{story_id}:
    get:
