  /api/v1/companies/{security_id}/moat:
    get:
      tags: [company]
      operationId: getCompanyMoat
      parameters: [{$ref: "#/components/parameters/SecurityId"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/MoatDetail"}}}}
  /api/v1/companies/{security_id}/insiders:
    get:
      tags: [company]
      operationId: getCompanyInsiders
      parameters:
        - {$ref: "#/components/parameters/SecurityId"}
        - {name: days, in: query, schema: {type: integer, default: 730}}
        - {name: open_market_only, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CompanyInsiders"}}}}
  /api/v1/companies/{security_id}/sentiment:
    get:
      tags: [company]
      operationId: getCompanySentiment
