      summary: Company event exposure - country weights (geographic revenue / supply chain / home), event pressure score, expected impact of active shocks (model-based)
      parameters:
        - {name: security_id, in: path, required: true, schema: {type: string}}
        - {name: history, in: query, schema: {type: integer, default: 26, minimum: 1, maximum: 104}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/EventsModelsCompany"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}

  # ======================================================================= LIVE (real-time R1)
  /api/v1/live/filings:
    get:
      tags: [live]
