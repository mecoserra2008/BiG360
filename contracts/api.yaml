    AlertRuleType: {type: string, enum: [price_cross, zone_touch, score_change, insider_buy, sentiment_shift, new_filing, model_decile, price_change_pct_1d, studio_drift, macro_release, macro_surprise, regime_change, earnings_upcoming, earnings_surprise, backtest_drift, activist_13d, short_interest_spike, eu_short_position, thesis_kpi, thesis_review, thesis_status, thesis_catalyst, thesis_positioning, thesis_event_shock, price_outside_calibrated_range, conformal_peer_anomaly, watchlist_news, story_velocity], description: "v1.38.0: watchlist_news {tiers?: [1-4] (default 1-3), min_abs_sentiment?: 0..1, languages?, sources?, max_per_day?: 10} (a live news item linked to a target security; one event per alert / security / story) and story_velocity {min_articles?: 5, min_ratio?: 3.0, min_sources?: 2, themes?, countries?} (a burst of articles on one story in 60 min vs its baseline; without a security / watchlist target any matching story fires as security_id news:<story_id>); both evaluated live by the realtime alert consumer. v1.32.0: price_outside_calibrated_range {level?: 80|90|95 (default 95), horizon?: 1|5|10|20 (default 1), side?: up|down|any} (the h-session move ended outside the marginal conformal band emitted h sessions earlier; model-based) and conformal_peer_anomaly {percentile?: fraction in [0.5, 1) (default 0.95), scope?: group|member|any} (peer-group joint-anomaly percentile, or the member's |z_cond| at its trailing-year percentile; descriptive, not a trading signal). v1.26.0: thesis_kpi / thesis_review / thesis_status / thesis_catalyst / thesis_positioning / thesis_event_shock {thesis_id, ...} are generated and managed by the thesis tracker (Alert.thesis_id set; not creatable via POST /alerts, 422) and evaluated by the thesis_eval job. v1.25.0: activist_13d {include_amendments?, include_switch?} (new 13D / 13G -> 13D switch filed on the subject in (prev bday, as_of]), short_interest_spike {min_chg_pct?, min_si_pct?} (FINRA short interest published in (prev bday, as_of] rose >= min_chg_pct), eu_short_position {min_pct?, include_increases?, min_increase_pp?} (new or increased EU / UK net short position published in (prev bday, as_of]). v1.24.0: backtest_drift {strategy_id, strategy_name, schedule, drift_threshold} (paper-strategy drift / decay; events written by the backtest_scheduled job). v1.22.0: earnings_upcoming {days_ahead?, date_sources?} (watchlist / security: earnings expected within days_ahead; source label in the message) and earnings_surprise {threshold_z?, items?} (|model surprise z| >= threshold on a release - model-based, not consensus). studio_drift added v1.7 (Model Studio scheduled-study drift; params {study_id, study_name, schedule, drift_threshold}; events written by the studio_scheduled job); price_change_pct_1d added v1.1 (params {pct, direction: up|down|any}); score_change params accept mode: delta|level (level => {level}). v1.11 (macro-w2) macro rule types, created without security_id / watchlist_id, fire per country (event security_id = macro:<CC>): macro_release {countries?: [CC], series_ids?: [id], max_importance?: 1-3 (default 1)}; macro_surprise {threshold_z?: number (default 2.0, |z| vs model-based expectation, not consensus), countries?, themes?: [growth|inflation|labor], series_ids?, max_importance?: 1-3 (default 3)}; regime_change {kind?: cycle_quadrant|recession_probability|any (default any), countries?, level?: probability in (0,1) (default 0.5), methods?: [macro_recession methods]}"}
