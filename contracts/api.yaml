      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CompanyEvents"}}}}
  /api/v1/companies/{security_id}/technicals:
    get:
      tags: [company]
      operationId: getCompanyTechnicals
      parameters: [{$ref: "#/components/parameters/SecurityId"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Technicals"}}}}
  /api/v1/companies/{security_id}/model:
    get:
      tags: [company]
      operationId: getCompanyModel
      parameters:
