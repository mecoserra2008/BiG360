      type: object
      required: [rules, sources, n_disclosures]
      properties:
        filing_id: {type: [string, "null"]}
        form_type: {type: [string, "null"]}
        snippet: {type: [string, "null"], description: "Sentence / table row around the match (<= 200 chars)"}
