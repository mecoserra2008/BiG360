        level: {type: [string, "null"]}
        window: {type: [string, "null"]}
        match: {type: [string, "null"]}
        n_events: {type: integer}
        mean_car: {type: [number, "null"], description: "Mean cumulative abnormal return over the window, in PERCENT (1.23 = +1.23 %)"}
        ci_low: {type: [number, "null"], description: "95% CI bounds of mean_car, in PERCENT"}
        ci_high: {type: [number, "null"]}
        p_value: {type: [number, "null"]}
        share_negative: {type: [number, "null"], description: "Fraction 0..1"}
        benchmark: {type: [string, "null"]}
        unit: {type: string, enum: [percent], description: "Unit of mean_car / ci_low / ci_high (em_event_studies stores CAR x 100). Added v1.39.0."}
    NewsStoryDetail:
      type: object
      required: [data_status, story, timeline, sources, items, securities, filings, events]
      properties:
        data_status: {$ref: "#/components/schemas/DataStatus"}
        story: {$ref: "#/components/schemas/NewsStory"}
        timeline:
