        filing_id: {type: string, description: "{source_id}:{native key} (= filings_index.filing_id)"}
        source_id: {type: string}
        source_entity_id: {type: [string, "null"], description: "CIK / LEI / TSE code / HK code / DART corp code"}
        issuer_id: {type: [string, "null"]}
        security_id: {type: [string, "null"]}
        ticker: {type: [string, "null"]}
        company: {type: [string, "null"]}
        form_type: {type: [string, "null"]}
        form_class: {type: [string, "null"]}
        title: {type: [string, "null"]}
        items: {type: [array, "null"], items: {type: string}, description: "8-K items (e.g. 2.02) or the title"}
