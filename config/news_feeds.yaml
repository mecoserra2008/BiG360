# Curated live news feeds (roadmap v3 N2). Owner: news-live (app.news_live.feeds). Read by the realtime RSS stream
# (app.realtime.streams.news.RssStream) and GET /api/v1/news/feeds; verified with `python -m app.news_live.verify`
# (results: data/state/news_feeds_verify.json).
#
# Policy: only RSS / Atom endpoints that the publisher offers for consumption. We store the headline, a summary
# snippet (<= 300 chars), the item URL, publisher, time and language - never article text, never article pages.
# Polite polling: conditional GET (ETag / If-Modified-Since), every_s 60-120 s (slower for statistics feeds),
# per-host gap 5 s, exponential back-off on errors, Retry-After honoured.
#
# Per feed: id (rss_*), url, publisher, kind (central_bank | statistics | regulator | exchange | publisher | aggregator),
# tier (1 official, 2 wire / major financial press, 3 other publisher), countries (ISO2 / EA), language, every_s,
# status (ok | rejected | unverified), reason (why rejected / notes), terms (terms / RSS policy page),
# robots (verified: allowed | disallowed | no_robots | unknown), rss_intended, title_filter (regex), parser.
version: 1
defaults: {every_s: 120, tier: 3, language: en, status: unverified, rss_intended: true}

groups:
  # ---------------------------------------------------------------- central banks (tier 1)
  - name: Central banks
    kind: central_bank
    tier: 1
    feeds:
      - {id: rss_fed, url: "https://www.federalreserve.gov/feeds/press_all.xml", publisher: Federal Reserve, countries: [US], terms: "https://www.federalreserve.gov/disclaimer.htm", status: ok, robots: no_robots}
      - {id: rss_fed_speeches, url: "https://www.federalreserve.gov/feeds/speeches.xml", publisher: Federal Reserve, countries: [US], terms: "https://www.federalreserve.gov/disclaimer.htm", status: ok, robots: no_robots}
      - {id: rss_ecb, url: "https://www.ecb.europa.eu/rss/press.html", publisher: ECB, countries: [EA], terms: "https://www.ecb.europa.eu/services/disclaimer/html/index.en.html", status: ok, robots: allowed}
      - {id: rss_boe, url: "https://www.bankofengland.co.uk/rss/news", publisher: Bank of England, countries: [GB], terms: "https://www.bankofengland.co.uk/legal", status: ok, robots: allowed}
      - {id: rss_boj, url: "https://www.boj.or.jp/en/rss/whatsnew.xml", publisher: Bank of Japan, countries: [JP], terms: "https://www.boj.or.jp/en/about/services/kiyaku.htm", status: ok, robots: no_robots}
      - {id: rss_boc, url: "https://www.bankofcanada.ca/content_type/press-releases/feed/", publisher: Bank of Canada, countries: [CA], terms: "https://www.bankofcanada.ca/terms/", status: ok, robots: allowed}
      - {id: rss_rba, url: "https://www.rba.gov.au/rss/rss-cb-media-releases.xml", publisher: Reserve Bank of Australia, countries: [AU], terms: "https://www.rba.gov.au/copyright/", status: ok, robots: allowed}
      - {id: rss_snb, url: "https://www.snb.ch/public/en/rss/pressrel", publisher: Swiss National Bank, countries: [CH], terms: "https://www.snb.ch/en/terms-of-use", status: ok, robots: allowed}
      - {id: rss_riksbank, url: "https://www.riksbank.se/en-gb/rss/press-releases/", publisher: Sveriges Riksbank, countries: [SE], terms: "https://www.riksbank.se/en-gb/about-the-website/", status: ok, robots: allowed}
      - {id: rss_norgesbank, url: "https://www.norges-bank.no/en/rss-feeds/Press-releases---Norges-Bank/", publisher: Norges Bank, countries: [NO], terms: "https://www.norges-bank.no/en/about/terms-of-use/", status: ok, robots: allowed}
      - {id: rss_bcb, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/notasImprensa", publisher: Banco Central do Brasil, countries: [BR], language: pt, terms: "https://www.bcb.gov.br/acessoinformacao/legado?url=https:%2F%2Fwww.bcb.gov.br%2Fpre%2Fnormativos", status: ok, robots: allowed}
      - {id: rss_bcb_news, url: "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/noticias", publisher: Banco Central do Brasil, countries: [BR], language: pt, terms: "https://www.bcb.gov.br/acessoinformacao/legado?url=https:%2F%2Fwww.bcb.gov.br%2Fpre%2Fnormativos", status: ok, robots: allowed}
      - {id: rss_bdp, url: "https://www.bportugal.pt/rss/comunicados", publisher: Banco de Portugal, countries: [PT], language: pt, terms: "https://www.bportugal.pt/page/termos-de-utilizacao", status: rejected, reason: "HTTP 403 from the site firewall for any non-browser client (no reachable RSS endpoint)"}
