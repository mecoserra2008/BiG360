      - {id: rss_cnbc_economy, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258", publisher: CNBC, countries: [US], terms: "https://www.cnbc.com/rss-feeds/", status: rejected, reason: "robots.txt of search.cnbc.com disallows /rs/ for all user agents (we honour robots even for RSS)"}
