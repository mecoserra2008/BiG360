      - {id: rss_eurostat, url: "https://ec.europa.eu/eurostat/api/dissemination/catalogue/rss/en/statistics-update.rss", publisher: Eurostat, countries: [EA], parser: eurostat, terms: "https://ec.europa.eu/eurostat/about-us/policies/copyright", status: ok, robots: allowed}
      - {id: rss_ons, url: "https://www.ons.gov.uk/releasecalendar?rss", publisher: ONS, countries: [GB], terms: "https://www.ons.gov.uk/methodology/geography/licences", status: ok, robots: no_robots}
      - {id: rss_statcan, url: "https://www150.statcan.gc.ca/n1/rss/dai-quo/0-eng.atom", publisher: Statistics Canada, countries: [CA], terms: "https://www.statcan.gc.ca/en/reference/licence", status: ok, robots: allowed}
      - {id: rss_destatis, url: "https://www.destatis.de/SiteGlobals/Functions/RSSFeed/EN/RSSNewsfeed/RSSNewsfeed.xml", publisher: Destatis, countries: [DE], terms: "https://www.destatis.de/EN/Service/Legal-Notice/_node.html", status: rejected, reason: "feed URL 404 and robots.txt disallows /SiteGlobals/ (no allowed RSS endpoint found)"}
      - {id: rss_insee, url: "https://www.insee.fr/en/rss/actualites", publisher: INSEE, countries: [FR], terms: "https://www.insee.fr/en/information/2381863", status: rejected, reason: "HTTP 500 on every RSS endpoint tried (2026-10-22); re-verify later"}
      - {id: rss_ine_pt, url: "https://www.ine.pt/xportal/xmain?xpid=INE&xpgid=ine_rss_destaques", publisher: INE Portugal, countries: [PT], language: pt, terms: "https://www.ine.pt/xportal/xmain?xpid=INE&xpgid=ine_termos", status: rejected, reason: "site in maintenance / RSS returns an HTML page (0 entries); re-verify later"}
