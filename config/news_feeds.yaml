      - {id: rss_bls_empsit, url: "https://www.bls.gov/feed/empsit.rss", publisher: BLS, countries: [US], terms: "https://www.bls.gov/bls/linksite.htm", status: ok, robots: allowed}
      - {id: rss_bls_ppi, url: "https://www.bls.gov/feed/ppi.rss", publisher: BLS, countries: [US], terms: "https://www.bls.gov/bls/linksite.htm", status: ok, robots: allowed}
      - {id: rss_bls_jolts, url: "https://www.bls.gov/feed/jolts.rss", publisher: BLS, countries: [US], every_s: 600, terms: "https://www.bls.gov/bls/linksite.htm", status: ok, robots: allowed}
      - {id: rss_bls_eci, url: "https://www.bls.gov/feed/eci.rss", publisher: BLS, countries: [US], every_s: 600, terms: "https://www.bls.gov/bls/linksite.htm", status: ok, robots: allowed}
